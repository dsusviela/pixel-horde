          G.waveState='clear';G.waveT=0;G.cleanT=0;G.wavePat=null;sfx('wavecomplete');
        }
        else{G.cleanT+=dt;if(G.cleanT>8){G.cleanT=0;enrageStragglers();}}
      }
      break;}
    case 'boss':
      holdArena(dt);
      if(!G.boss||G.boss.dead){G.waveState='clear';G.waveT=0;}
      break;
    case 'clear':
      if(G.waveT>=2.5){if(G.wave>=waveCount())startOutro();else startIntermission();}
      break;
    case 'descent':{
      const D=G.descent;
      if(!D){G.waveState='inter';break;}
      D.t+=dt;
      G.fade=D.t<D.fadeIn?0:D.t<D.hold?(D.t-D.fadeIn)/(D.hold-D.fadeIn):D.t<D.fadeOut?1:Math.max(0,1-(D.t-D.fadeOut)/(D.end-D.fadeOut));
      if(D.t>=D.hold&&!D.flipped){
        D.flipped=true;
        setBiome(D.dir==='down'?'volcano':'surface');
        // regroup on the far side: a cluster at the camera's centre
        const c=G.cam;
        G.players.forEach((p,i)=>{p.x=c.x+(i-1.5)*16;p.y=c.y+((i%2)?10:-10);});
        let left=0;for(const gm of G.gems)left+=gm.v;
        if(left>0){G.xp+=left;sfx('gem');}
        G.crates.length=0;G.gems.length=0;
        for(const p of G.players)if(!p.dead){p.hp=Math.min(p.maxhp,p.hp+p.maxhp*0.25);}
        interLoot(D.dir==='up');
        sfx('crack');
      }
      if(D.t>=D.end){
        G.descent=null;G.fade=0;
        G.waveState='inter';G.waveT=Math.max(0,G.interLen-2.5);
      }
      break;}
    case 'inter':
      if(G.rumbleT>0){
        G.rumbleT-=dt;
        G.shake=Math.max(G.shake,1.5+1.5*Math.abs(Math.sin(G.time*7)));
        if(Math.random()<dt*0.8)sfx('crack');
      }
      for(const p of G.players){
        if(p.dead)continue;
        p.hp=Math.min(p.maxhp,p.hp+p.maxhp*0.25/G.interLen*dt);
      }
      if(G.waveT>=G.interLen)nextWave();
      break;
    case 'outro':
      if(G.waveT>=4.0){G.state='victory';G.overSince=G.time;recordRun('victory');}
      else if(Math.random()<0.5){
        const c=G.cam;
        addParticles(c.x+(Math.random()-0.5)*c.w*0.8,c.y+(Math.random()-0.5)*c.h*0.6,
          ['#ffd23e','#57e86b','#39d5ff','#ff6bd6'][(Math.random()*4)|0],14,120);
      }
      break;
  }
}


// ============================================================
// UPDATE
// ============================================================
function update(dt){
  const pads=pollPads();

  if(G.state==='title'){
    for(const pad of pads){
      // language toggle: BACK/SELECT on a pad, or L on the keyboard. Keyboard
      // Backspace maps to buttons 1 AND 8 — the `continue` keeps that press
      // from also joining via the forgiving join buttons.
      if(pressed(pad,8)||pressed(pad,20)){setLang(LANG==='es'?'en':'es');sfx('select');continue;}
      const jb=joinPressed(pad);
      if(jb>=0){joinPlayer(pad.index,jb);if(G.players.length===1)G.state='modesel';}
    }
    storePadStates(pads);return;
  }
  if(G.state==='modesel'){
    for(const pad of pads){
      const pl=G.players.find(p=>p.padIndex===pad.index);
      if(!pl){const jb=joinPressed(pad);if(jb>=0)joinPlayer(pad.index,jb);continue;}
      const nx=navX(pad);
      if(nx){G.modeSel=clamp(G.modeSel+nx,0,2);sfx('select');}
      // up/down cycles this player's colour, skipping swatches already worn
      const ny=navY(pad);
      if(ny){
        const used=new Set(G.players.filter(q=>q!==pl).map(q=>q.col));
        let c=pl.col;
        for(let i=0;i<PCOLORS.length;i++){c=(c+ny+PCOLORS.length)%PCOLORS.length;if(!used.has(c))break;}
        pl.col=c;
        try{localStorage.setItem('ph_col_'+pad.index,c);}catch(err){}
        sfx('select');
      }
      // BOSS RUSH only: LB/RB (Q/E on the keyboard) picks the starting boss.
      // startRun back-pays the skipped fights' levels, charms, rallies and
      // signature spells so the party arrives as if it had cleared them.
      if(G.modeSel===2){
        const db=(pressed(pad,5)?1:0)-(pressed(pad,4)?1:0);
        if(db){
          G.rushStart=clamp((G.rushStart||1)+db,1,RUSH_WAVES.length);
          try{localStorage.setItem('ph_rushstart',G.rushStart);}catch(err){}
          sfx('select');
        }
      }
      // the button that joined this pad stays ACCEPT here — on a Switch-layout
      // pad that's button 1, which would otherwise read as B/back below
      if(pressed(pad,0)||pressed(pad,pl.joinBtn)){storePadStates(pads);startRun(['classic','endless','rush'][G.modeSel]);return;}
      if(pressed(pad,1)||pressed(pad,8)){G.players=[];G.state='title';}
    }
    storePadStates(pads);return;
  }
  if(G.state==='gameover'||G.state==='victory'){
    for(const pad of pads){
      if(pressed(pad,9)){storePadStates(pads);resetRun();return;}
      if(pressed(pad,8)){storePadStates(pads);G.players=[];G.state='title';return;}
    }
    storePadStates(pads);return;
  }
  if(G.state==='paused'){
    for(const pad of pads)if(pressed(pad,9))G.state='play';
    storePadStates(pads);return;
  }
  if(G.state==='levelup'){
    G.levelupT+=dt;
    for(const pick of G.levelupPicks){
      const pad=pads.find(x=>x.index===pick.p.padIndex);
      if(pick.done)continue;
      pick.openT+=dt;
      // a pad that vanished (dead battery) does not burn its pick — it auto-takes after a grace period
      if(!pad){
        if(G.levelupT>6)takeOffer(pick,true);
        continue;
      }
      const nx=navX(pad);
      if(nx){pick.sel=clamp(pick.sel+nx,0,2);sfx('select');}
      // CLASSIC banks drafts and deals them back to back in the break; play
      // never reads the face buttons (auto-fire), so a reflex press landed on
      // the pre-highlighted card the frame it appeared — the pick was made for
      // the player before they had seen it. A row must be on screen for
      // DRAFT_ARM before a press counts (the edge test still applies too).
      if(pick.openT>=DRAFT_ARM&&confirmPressed(pad)){takeOffer(pick,false);sfx('pickup');}
    }
    // nobody can hold the party hostage: after 12s the highlighted card is taken for them
    if(G.levelupT>12)for(const pick of G.levelupPicks)if(!pick.done)takeOffer(pick,true);
    storePadStates(pads);
    if(G.levelupPicks.every(x=>x.done))finishLevelup();
    return;
  }
  if(G.state==='slot'){
    // full-screen slot moment: the sim pauses like a draft, everyone watches
    const r=G.reel;
    if(!r){G.state='play';storePadStates(pads);return;}
    r.t+=dt;r.tick-=dt;
    if(r.t<1.9&&r.tick<=0){r.tick=0.07;sfx('select');} // reel clatter
    for(const s of [0.9,1.4,1.9])if(r.t>=s&&r.t-dt<s)sfx('pickup');
    if(r.t>=2.15&&!r.paid){r.paid=true;slotPayout(r.tier,r.x,r.y);}
    if(r.paid)for(const pad of pads)if(confirmPressed(pad))r.t=Math.max(r.t,3.3);
    if(r.t>=3.3){G.reel=null;G.state='play';}
    storePadStates(pads);return;
  }

  // ---- playing ----
  for(const pad of pads){
    if(!G.players.some(p=>p.padIndex===pad.index)){
      const jb=joinPressed(pad);
      if(jb>=0)joinPlayer(pad.index,jb);
    }else if(pressed(pad,9)){G.state='paused';storePadStates(pads);return;}
  }

  G.time+=dt;
  if(G.flashT>0)G.flashT-=dt;
  if(G.subFlashT>0)G.subFlashT-=dt;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*14);
  if(G.pflash>0)G.pflash=Math.max(0,G.pflash-dt*2.6);
  if(G.vacuumT>0)G.vacuumT-=dt;

  for(let i=G.timers.length-1;i>=0;i--){
    const t=G.timers[i];
    t.t-=dt;
    if(t.t<=0){G.timers.splice(i,1);try{t.fn();}catch(err){}}
  }

  rebuildGrid();
  const alive=G.players.filter(p=>!p.dead);

  // ---- players ----
  for(const p of G.players){
    if(p.hurtCd>0)p.hurtCd-=dt;
    if(p.invuln>0)p.invuln-=dt;
    if(p.flash>0)p.flash-=dt;
    if(p.shoveT>0)p.shoveT-=dt;
    if(p.dead)continue;

    const pad=pads.find(x=>x.index===p.padIndex);
    let mx=0,my=0;
    if(pad){const s=stick(pad);mx=s.x;my=s.y;}
    // entombed: the stick does nothing until an ally breaks the tomb
    if(p.prison&&!p.prison.dead){mx=0;my=0;}
    // the cave cutscene walks the party itself
    if(G.descent){
      const D=G.descent,l=Math.hypot(D.mouth.x-p.x,D.mouth.y-p.y);
      mx=0;my=0;
      if(D.t<D.walkT&&l>10){mx=(D.mouth.x-p.x)/l;my=(D.mouth.y-p.y)/l;}
    }
    if(mx||my){p.faceX=mx;p.faceY=my;p.anim+=dt*8;
      // the party's heading (smoothed): the spawner leans into it
      G.moveX=lerp(G.moveX||0,mx,Math.min(1,dt*2.5));G.moveY=lerp(G.moveY||0,my,Math.min(1,dt*2.5));}
    let sp=p.speed*p.speedMul;
    const hz=hazardAt(p.x,p.y);
    if(hz==='mud')sp*=0.55;
    if(hz==='acid'&&p.invuln<=0){
      p.acidT+=dt;
      if(p.acidT>0.25){p.acidT=0;p.hp-=3;p.flash=0.1;sfx('hit');addParticles(p.x,p.y,'#8a5cff',3,40);if(p.hp<=0)killPlayer(p);}
    }else p.acidT=0;
    // lava terrain (wave 4): the same 5%-per-0.35s bite as the overlay rivers
    if(hz==='lava'){
      p.lavaT=(p.lavaT||0)+dt;
      if(p.lavaT>0.35){p.lavaT=0;bossHit(p,0.05);addParticles(p.x,p.y,VOLC.lava,2,30);}
    }else p.lavaT=0;
    if(p.dead)continue;
    moveCollide(p,mx*sp*dt,my*sp*dt);
    // a shove in flight: decaying slide, on top of the stick
    if(p.kbT>0){
      p.kbT-=dt;
      moveCollide(p,p.kbx*dt,p.kby*dt);
      const k=Math.max(0,1-dt*6);p.kbx*=k;p.kby*=k;
      if(Math.random()<dt*20)addParticles(p.x,p.y+4,VOLC.burst,1,30);
    }

    // hard leash to camera, then never leave them buried in rock
    const c=G.cam;
    p.x=clamp(p.x,c.x-c.w/2+8,c.x+c.w/2-8);
    p.y=clamp(p.y,c.y-c.h/2+10,c.y+c.h/2-6);
    unstick(p);

    if(p.regen>0)p.hp=Math.min(p.maxhp,p.hp+p.regen*dt);
    G.aimScale=rangeMul();
    for(const id in p.weapons)fireWeapon(p,id,p.weapons[id],dt);
    for(const id in p.relics)fireRelic(p,id,p.relics[id],dt);
    G.aimScale=0;

    queryEnemies(p.x,p.y,44,e=>{
      const rr=e.r+p.r;
      if(!e.air&&dist2(p.x,p.y,e.x,e.y)<rr*rr){
        if(e.type==='bomber'){if(e.fuse<0)e.fuse=0.6;}
        else if(e.type==='burster'){if(e.fuse<0)e.fuse=0.45;} // swell, then pop (see the enemy loop)
        // hugging a boss floors at 12% maxhp per tick for the same reason as
        // the bullet floor: flat touch dmg can't keep up with charm-fed hp.
        // Exception: while a CINDER RING's safe disc is live the boss IS the
        // refuge, so its body must not bite (ringSafeT, see SLAGMAW)
        else if(!e.noTouch&&!(e.boss&&e.def&&e.def===WORLDEATER&&e.phase===4)&&!(e.boss&&e.ai&&e.ai.ringSafeT>0))
          hurtPlayer(p,e.boss?Math.max(e.dmg,p.maxhp*0.12)*BOSS_DMG_MUL*bossFury():e.dmg);
      }
    });
  }

  // ---- revive ----
  for(const dp of G.players){
    if(!dp.dead)continue;
    let helper=null;
    for(const p of G.players){
      if(p.dead)continue;
      if(dist2(p.x,p.y,dp.x,dp.y)<20*20){helper=p;break;}
    }
    if(helper){
      dp.reviveP+=dt/3;
      if(dp.reviveP>=1){
        dp.dead=false;dp.hp=dp.maxhp*0.5;dp.invuln=2;dp.reviveP=0;
        helper.revives++;
        sfx('revive');
        addParticles(dp.x,dp.y,PCOLORS[dp.col],20,80);
        flash('P'+(dp.idx+1)+' IS BACK!');
      }
    }else dp.reviveP=Math.max(0,dp.reviveP-dt*0.7);
  }

  // ---- boss telegraphs / hazards ----
  tickBossFx(dt,alive);
  tickPrisons(dt);

  // the Worldeater blots out the sky: ash drifts down over the arena
  if(G.boss&&!G.boss.dead&&G.boss.def&&G.boss.def.id==='worldeater'&&G.particles.length<650){
    if(Math.random()<dt*26){
      const c=G.cam;
      G.particles.push({x:c.x+(Math.random()-0.5)*c.w,y:c.y-c.h/2-6,
        vx:-6-Math.random()*10,vy:16+Math.random()*22,t:2.6,
        col:Math.random()<0.7?'#3a2f4a':WE_TINTS[G.boss.ai.pal],size:1});
    }
  }

  // ---- enemies ----
  for(const e of G.enemies){
    if(e.dead)continue;
    if(e.flash>0)e.flash-=dt;
    if(e.life>0){e.life-=dt;if(e.life<=0){e.dead=true;addParticles(e.x,e.y,'#d84343',6,60);continue;}}
    let tgt=null,bd=1e9;
    for(const p of alive){
      const d=dist2(e.x,e.y,p.x,p.y);
      if(d<bd){bd=d;tgt=p;}
    }
    const dd=Math.sqrt(bd)||1;
    let vx=tgt?(tgt.x-e.x)/dd:0,vy=tgt?(tgt.y-e.y)/dd:0;
    let sp=e.sp;
    if(hazardAt(e.x,e.y)==='mud')sp*=0.6;
    // chilled: frost relics and frost bosses both slow through this
    if(e.slowT>0){e.slowT-=dt;sp*=e.slow;}else e.slow=1;
    // dazed by a Bizarre Mirage: rooted, wearing a crown of stars, +30% damage
    // taken (applied in damageEnemy). Bosses only carry the vuln window.
    if(e.stunT>0){
      e.stunT-=dt;
      if(!e.boss)sp=0;
      // three stars circling the head, cartoon-concussion style — the mark is
      // worth reading at a glance because everyone's damage keys off it
      if(Math.random()<dt*22){
        const a=G.time*3.2+((Math.random()*3)|0)*TAU/3;
        G.particles.push({x:e.x+Math.cos(a)*(e.r+4),y:e.y-e.r-4+Math.sin(a)*3,
          vx:0,vy:-4,t:0.3,col:'#ffffff',size:1,star:2,
          prism:1+((Math.random()*PRISM.length)|0)});
      }
    }
    if(e.boss&&e.def){
      const a=e.ai,d=e.def;
      if(isCampaign()&&e===G.boss&&e.vulnMul!==0)G.bossVulnT+=dt;
      if(d.tick&&a.mode==='active')d.tick(e,dt,alive);
      if(a.mode!=='transition'&&e.gates.length&&e.hp/e.maxhp<=e.gates[0]&&e.casts>=d.minCasts){
        e.gates.shift();e.phase++;
        a.mode='transition';a.t=2.0;a.cast=null;e.castName=null;e.castP=0;e.frozen=1;
        G.shake=7;sfx('boss');
        G.ebullets=G.ebullets.filter(b=>!b.boss);
        for(const f of G.fx)if(f.boss&&f.kind!=='pool')f.t=Math.min(f.t,0.2);
        flash(e.name+'  PHASE '+e.phase);
      }
      if(a.mode==='transition'){
        a.t-=dt;e.castName=(typeof d.transName==='function'?d.transName(e):d.transName)||'...';e.castP=clamp(1-a.t/2.0,0,1);
        if(a.applied!==e.phase){a.applied=e.phase;d.onPhase(e,e.phase);}
        if(Math.random()<0.6)addParticles(e.x+(Math.random()-0.5)*40,e.y+(Math.random()-0.5)*44,e.barCol,6,110);
        if(a.t<=0){a.mode='active';e.castName=null;e.frozen=0;}
      }else if(a.mode==='intro'){
        a.t-=dt;e.castName=e.name;e.castP=1-a.t/2.5;
        if(a.t<=0){a.mode='active';e.castName=null;}
      }else if(a.cast){
        a.castT-=dt;e.castP=clamp(1-a.castT/a.castLen,0,1);
        if(a.castT<=0){
          const k=a.cast;a.cast=null;e.castName=null;e.frozen=0;e.casts++;
          d.resolve(e,k,alive);
        }
      }else if(alive.length)d.pick(e,dt,alive);
      if(e.frozen)e.ovr=0;
    }
    else if(e.boss&&e.type==='brute'){
      const ai=e.ai;
      ai.t-=dt;ai.sumT-=dt;
      if(ai.mode==='walk'){if(ai.t<=0){ai.mode='windup';ai.t=0.7;ai.tx=tgt?tgt.x:e.x;ai.ty=tgt?tgt.y:e.y;}}
      else if(ai.mode==='windup'){
        sp=0;
        if(ai.t<=0){ai.mode='charge';ai.t=1.0;const an=Math.atan2(ai.ty-e.y,ai.tx-e.x);ai.cvx=Math.cos(an);ai.cvy=Math.sin(an);}
      }else if(ai.mode==='charge'){
        vx=ai.cvx;vy=ai.cvy;sp=170;
        if(ai.t<=0){ai.mode='walk';ai.t=4;explode(e.x,e.y,70,0,undefined,e.dmg*1.2*BOSS_DMG_MUL);}
      }
      if(ai.sumT<=0){ai.sumT=8;for(let i=0;i<4;i++)spawnEnemy('swarm',e.x+(Math.random()*40-20),e.y+(Math.random()*40-20));}
    }
    else if(e.boss){
      const ai=e.ai;
      ai.t-=dt;ai.sumT-=dt;
      if(ai.t<=0&&alive.length){
        ai.t=6;
        const p=alive[(Math.random()*alive.length)|0];
        addParticles(e.x,e.y,'#b06bff',12,70);
        const an=Math.random()*TAU;
        e.x=p.x+Math.cos(an)*110;e.y=p.y+Math.sin(an)*110;
        addParticles(e.x,e.y,'#b06bff',12,70);
      }
      e.shootT-=dt;
      if(e.shootT<=0){
        e.shootT=2.6;
        for(let i=0;i<12;i++){
          const an=i*TAU/12+G.time;
          G.ebullets.push({x:e.x,y:e.y,vx:Math.cos(an)*95,vy:Math.sin(an)*95,r:2.5,dmg:e.dmg*0.7*BOSS_DMG_MUL,life:3,col:'#e77bd0'});
        }
        sfx('spread');
      }
      if(ai.sumT<=0){ai.sumT=10;spawnEnemy('spitter',e.x-20,e.y);spawnEnemy('spitter',e.x+20,e.y);}
      if(dd<90)sp=0;
    }
    else if(e.shed){
      // THE SHEDDER: slow walk → 2.5s telegraph (rings relocate) → 1s in the
      // air (immune, untargetable) → landing = the colour pulse + a burst
      const S=e.shed,P=S.P,W=P.wards;
      if(S.st==='walk'){
        S.t-=dt;
        if(S.t<=0&&tgt&&W){
          S.st='tele';S.t=2.5;
          S.lx=tgt.x+(Math.random()*60-30);S.ly=tgt.y+(Math.random()*60-30);
          pushTel(null,S.lx,S.ly,60,2.5,0,'#c9a4ff',slamWarnSprite,null);
          wardsPlace(P,alive);
          subFlash('IT LEAPS — FIND YOUR COLOUR',2.4);sfx('telegraph');
        }
      }else if(S.st==='tele'){
        sp=0;S.t-=dt;
        if(S.t<=0){S.st='air';S.t=1.0;S.jx=e.x;S.jy=e.y;e.vulnMul=0;e.air=1;}
      }else{
        sp=0;S.t-=dt;
        const pr=clamp(1-S.t/1.0,0,1);
        e.x=S.jx+(S.lx-S.jx)*pr;e.y=S.jy+(S.ly-S.jy)*pr;
        e.hopY=90*Math.sin(Math.PI*pr);
        if(S.t<=0){
          e.hopY=0;e.air=0;e.vulnMul=1;
          S.st='walk';S.t=S.jumpT;
          if(W){
            wardsResolve(P,alive,e.x,e.y);
            for(let i=0;i<P.burst&&W.bursts<P.bursts;i++){
              W.bursts++;
              if(G.enemies.length>=140)break;
              const pt=spawnPoint();if(!pt)continue;
              const c=spawnEnemy('chaser',pt.x,pt.y);
              c.hp*=1.3;c.maxhp=c.hp;c.xp=patXp(P);
            }
          }
        }
      }
    }
    else if(e.jump){
      // hop cycle: walk → telegraphed landing ring → airborne (untargetable,
      // no touch) → small blast on landing. The forgiving cousin of a boss slam.
      const j=e.jump;
      if(j.st==='ground'){
        j.t-=dt;
        // hops ARE the locomotion: leap up to 180px along the line to the
        // target, chaining arcs across the field (the notebook doodle)
        if(j.t<=0&&tgt){
          const hop=Math.min(Math.max(40,dd-14),180);
          j.st='tele';j.t=0.8;
          j.lx=e.x+vx*hop+(Math.random()*24-12);
          j.ly=e.y+vy*hop+(Math.random()*24-12);
          sfx('telegraph');
        }
      }else if(j.st==='tele'){
        sp=0;j.t-=dt;
        if(j.t<=0){j.st='air';j.t=0.6;j.jx=e.x;j.jy=e.y;e.vulnMul=0;e.air=1;}
      }else{
        sp=0;j.t-=dt;
        const pr=clamp(1-j.t/0.6,0,1);
        e.x=j.jx+(j.lx-j.jx)*pr;e.y=j.jy+(j.ly-j.jy)*pr;
        e.hopY=30*Math.sin(Math.PI*pr);
        if(j.t<=0){
          e.hopY=0;e.air=0;e.vulnMul=1;
          j.st='ground';j.t=1.6+Math.random()*1.6;
          explode(e.x,e.y,26,0,undefined,e.dmg);
          G.shake=Math.max(G.shake,2);
        }
      }
    }
    else if(e.type==='spitter'&&e.sniper){
      // STONEFALL sniper: long range, needs line of sight. Behind a boulder
      // it can't shoot and walks to find an angle — that is the cover play.
      e.shootT-=dt;
      if(dd<200)sp=-sp*0.6;
      else if(e.sightOn&&dd<520)sp=0;
      if(e.shootT<=0&&tgt&&e.sightOn&&dd<520&&!(e.stunT>0)){
        e.shootT=1.7;
        G.ebullets.push({x:e.x,y:e.y,vx:vx*230,vy:vy*230,r:3,dmg:e.dmg*2.2,life:2.6,col:'#ff6bd6'});
        addParticles(e.x,e.y,'#ff6bd6',4,60);sfx('shoot');
      }
    }
    else if(e.type==='spitter'){
      if(dd<130)sp=-sp*0.6;
      else if(dd<160)sp=0;
      e.shootT-=dt;
      const range=Math.min(260,G.cam.h*0.46);
      if(e.shootT<=0&&dd<range&&tgt&&!(e.stunT>0)){
        e.shootT=2.2;
        G.ebullets.push({x:e.x,y:e.y,vx:vx*125,vy:vy*125,r:2.5,dmg:e.dmg*1.4,life:2.6,col:'#6fe84a'});
      }
    }
    else if(e.type==='bomber'){
      if(e.fuse>=0){
        sp=0;e.fuse-=dt;
        if(e.fuse<=0){e.dead=true;explode(e.x,e.y,46,15,undefined,22*dmgScale());}
      }else if(dd<30)e.fuse=0.6;
    }
    // ---- volcano fauna ----
    // SMASHER (and the awakened SLAG BEHEMOTH): rush in, plant, and cast a
    // small Molten Slam with the boss's own telegraph, so the read transfers
    else if(e.sm){
      const S=e.sm,big=!!e.behemoth;
      if(S.cd>0)S.cd-=dt;
      if(S.st==='cast'){
        sp=0;S.t-=dt;
        // wind-up: fists up, a hop that peaks as the slam lands
        if(!big){e.spr=smasherCastSprite;e.hopY=10*Math.sin(Math.PI*clamp(1-S.t/1.2,0,1));}
        if(S.t<=0){
          S.st='hunt';S.cd=big?6:2.6;S.tel=null;G.smCasting=Math.max(0,G.smCasting-1);
          if(!big){e.spr=smasherSprite;e.hopY=0;}
          const R=S.r;
          G.fx.push({kind:'boom',x:e.x,y:e.y,r:R,t:0.3,dur:0.3});
          G.shake=Math.max(G.shake,big?5:3);sfx('slam');
          // the rehearsal hits, it does not throw — only Slagmaw's slam shoves
          for(const p of alive)if(dist2(p.x,p.y,e.x,e.y)<R*R)hurtPlayer(p,e.dmg*1.6);
          pushPool(null,e.x,e.y,R*0.5,4,0.04,VOLC.slam,'circle');
        }
      }else if(tgt&&dd<(big?60:40)&&S.cd<=0&&!(e.stunT>0)&&G.smCasting<3){
        S.st='cast';S.t=1.2;S.r=big?70:50;G.smCasting++;
        pushTel(null,e.x,e.y,S.r,1.2,0,VOLC.slam,slamWarnSprite,null);
        S.tel=G.fx[G.fx.length-1];
        sfx('telegraph');
      }else if(!big&&dd>110)sp*=1.4; // the rush: it closes fast, then plants
    }
    // BURSTER: contact lights a short fuse — it swells, then pops (a kill
    // pops it at once, see damageEnemy's kill block)
    else if(e.type==='burster'){
      if(e.fuse>=0){
        sp=0;e.fuse-=dt;
        const k=clamp(1-e.fuse/0.45,0,1);
        e.spr=bursterSwellSprite;e.scale=1+0.5*k;e.hopY=3*Math.sin(G.time*40);
        if(e.fuse<=0){e.dead=true;bursterPop(e);}
      }else if(dd<30)e.fuse=0.45;
    }
    // SLUG (THE SLUG FORGE): marches at the forge, ignoring the party
    else if(e.slug){
      const F=e.slug.e;
      if(F&&!F.dead){const dx=F.x-e.x,dy=F.y-e.y,d=Math.hypot(dx,dy)||1;e.mvx=dx/d;e.mvy=dy/d;}
      else{e.msp=undefined;e.slug=null;e.noTouch=false;}
    }
    // props: the cold forge and the volcanoes never move; a rising vent
    // grows out of the ground over ~2.5s, shedding rock
    else if(e.forge||e.volcano){
      sp=0;
      if(e.rise!=null&&e.rise<1){
        e.rise+=dt/2.5;e.scale=0.3+2.2*Math.min(1,e.rise);
        if(Math.random()<dt*14)addParticles(e.x+(Math.random()-0.5)*20,e.y+8,'#3a3238',2,60);
        if(Math.random()<dt*4)addSparkles(e.x,e.y-10*e.scale,VOLC.slam,2,40);
      }
    }
    // FIRE SLUG: a lava trail behind it (Pyraxis creep's cousin, no slow)
    if(e.fs){
      e.fs.dripT-=dt;
      if(e.fs.dripT<=0){e.fs.dripT=0.2;lavaDrip(e.x,e.y,0.35);}
    }
    if(e.ember){
      e.dripT-=dt;
      if(e.dripT<=0){e.dripT=1.2;pushPool(null,e.x,e.y,12,5,0.04,'#ff7a1a','circle');}
    }

    // wave-pattern marchers (band torrent, polarity lines, the encircle ring)
    // ignore the party and walk their own route
    if(e.msp!=null){vx=e.mvx;vy=e.mvy;sp=e.msp*(e.slowT>0?e.slow:1);}
    if(e.ovr){vx=e.ovx;vy=e.ovy;sp=e.osp;e.ovr=0;}
    else if(e.def)sp=0;
    if(e.dead)continue;
    if(e.boss||e.flow){e.x+=vx*sp*dt;e.y+=vy*sp*dt;} // flow mobs stream through everything
    else if(sp!==0)moveCollide(e,vx*sp*dt,vy*sp*dt);

    const cell=grid.get(gridKey(Math.floor(e.x/GRID),Math.floor(e.y/GRID)));
    if(cell&&cell.length>1&&!e.boss&&!e.flow&&!e.forge&&!e.volcano){
      const o=cell[(Math.random()*cell.length)|0];
      if(o!==e&&!o.dead&&!o.boss){
        const d2=dist2(e.x,e.y,o.x,o.y),rr=e.r+o.r;
        if(d2<rr*rr&&d2>0.01){
          const d=Math.sqrt(d2),push=(rr-d)*0.4;
          e.x+=(e.x-o.x)/d*push;e.y+=(e.y-o.y)/d*push;
        }
      }
    }
  }

  // ---- player bullets ----
  for(const b of G.bullets){
    // ---- homing ----
    // b.home is a turn rate in rad/s, not a snap: a seeker banks toward its
    // mark at a fixed angular speed, so a bolt launched sideways visibly
    // curves back and a bolt that overshoots loops around for another pass.
    // The target is cached and only re-acquired when it dies or goes
    // untargetable (shielded/airborne/burrowed => vulnMul 0) — re-picking the
    // nearest every frame makes a volley snap between bodies and look cheap.
    if(b.home){
      if(!b.tgt||b.tgt.dead||b.tgt.vulnMul===0)b.tgt=nearestEnemy(b.x,b.y,b.homeR||320);
      if(b.tgt){
        const cur=Math.atan2(b.vy,b.vx),sp=Math.hypot(b.vx,b.vy);
        let d=Math.atan2(b.tgt.y-b.y,b.tgt.x-b.x)-cur;
        d=Math.atan2(Math.sin(d),Math.cos(d)); // shortest way round
        const a=cur+clamp(d,-b.home*dt,b.home*dt);
        b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;
      }
    }
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    // a ribbon of recent positions, drawn as a tapering prismatic streak
    if(b.wake){
      b.wake.push(b.x,b.y);
      if(b.wake.length>WAKE_MAX)b.wake.splice(0,b.wake.length-WAKE_MAX);
    }
    if(b.trail&&Math.random()<(b.starTrail?0.25:0.6)&&G.particles.length<850){
      if(b.starTrail) // arcane bolts shed a wake of little prismatic stars
        G.particles.push({x:b.x+(Math.random()*4-2),y:b.y+(Math.random()*4-2),
          vx:-b.vx*0.08,vy:-b.vy*0.08-8,t:0.3+Math.random()*0.25,col:b.trailCol,
          size:1,star:1,drag:3,prism:b.prism?1+((Math.random()*PRISM.length)|0):0});
      else G.particles.push({x:b.x,y:b.y,vx:0,vy:0,t:0.2,col:b.trailCol||'#b3a184',size:1,spark:b.sparkTrail});
    }
    if(b.life<=0){
      // frame quantization can carry a bullet a few px past where its life
      // ran out; a meteor bursts at its mark, so snap back before exploding
      if(b.met){b.x=b.tx;b.y=b.ty;}
      if(b.rocket){explode(b.x,b.y,b.aoe,b.dmg,b.owner);if(b.met)metImpact(b.x,b.y,b.aoe);}
      b.dead=true;continue;
    }
    // ghost bolts pass through rock: a seeker that banks into a pillar mid-turn
    // and dies there reads as broken, not as terrain mattering
    if(!b.ghost&&solidAt(b.x,b.y)){
      if(b.rocket)explode(b.x,b.y,b.aoe,b.dmg,b.owner);
      else addParticles(b.x,b.y,'#8b929c',3,40);
      b.dead=true;continue;
    }
    // a hurled meteor is a lob: it sails OVER the horde and bursts at its
    // mark. Detonating on the first body it grazed made every stone land on
    // the front rank and nothing deeper ever got hit.
    if(b.met)continue;
    let hit=null;
    queryEnemies(b.x,b.y,b.r,e=>{
      if(hit)return;
      const rr=e.r+b.r;
      if(dist2(b.x,b.y,e.x,e.y)<rr*rr)hit=e;
    });
    if(!hit){
      for(const c of G.crates){
        if(c.dead)continue;
        const rr=c.r+b.r;
        if(dist2(b.x,b.y,c.x,c.y)<rr*rr){c.hp-=b.dmg;if(c.hp<=0)breakCrate(c);b.dead=true;break;}
      }
    }
    if(hit){
      // plague motes leave the sickness behind BEFORE they deal their damage:
      // the mote splashes on contact now, and infecting afterwards meant any
      // target the splash killed outright died clean — no burst, no chain,
      // which is the entire card. Bosses shrug it off (their death already
      // pays everything).
      if(b.plague&&!hit.boss)hit.plagued=b.plague;
      if(b.rocket){explode(b.x,b.y,b.aoe,b.dmg,b.owner);if(b.met)metImpact(b.x,b.y,b.aoe);}
      else damageEnemy(hit,b.dmg,b.owner);
      // a volley is many bolts: this fires once per bolt per impact, so it has
      // to stay cheap or a single cast pays for it n times over
      if(b.starHit)starHit(b.x,b.y,3);
      b.dead=true;
    }
  }

  // ---- enemy bullets ----
  for(const b of G.ebullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||solidAt(b.x,b.y)){b.dead=true;continue;}
    for(const p of G.players){
      if(p.dead||p.invuln>0)continue;
      const rr=p.r+b.r;
      // boss bullets floor at 6% maxhp: flat dmg goes stale once charm-stacked
      // hp pools grow, and regen out-heals it into an AFK-able fight
      if(dist2(b.x,b.y,p.x,p.y)<rr*rr){hurtPlayer(p,b.boss?Math.max(b.dmg,p.maxhp*0.06)*BOSS_DMG_MUL*bossFury():b.dmg);b.dead=true;break;}
    }
  }

  // ---- gems / pickups ----
  for(const g of G.gems){
    g.t+=dt;
    if(g.vx){g.x+=g.vx*dt;g.y+=g.vy*dt;g.vx*=0.9;g.vy*=0.9;if(Math.abs(g.vx)+Math.abs(g.vy)<4)g.vx=g.vy=0;}
    if(Math.random()<dt*0.5)addSparkles(g.x,g.y-2,g.v>=4?'#ffd23e':'#8ef0ff',1,14);
    let best=null,bd2=1e9;
    for(const p of G.players){
      if(p.dead)continue;
      const d=dist2(g.x,g.y,p.x,p.y);
      if(d<bd2){bd2=d;best=p;}
    }
    if(best){
      const d=Math.sqrt(bd2);
      if(G.vacuumT>0){
        // vacuum: every gem on the map races in, far ones fastest
        const pull=Math.max(420,d*2.2);
        g.x+=(best.x-g.x)/d*pull*dt;
        g.y+=(best.y-g.y)/d*pull*dt;
        if(Math.random()<dt*8)addSparkles(g.x,g.y,'#8ef0ff',1,30);
      }else if(d<best.magnet){
        const pull=lerp(60,320,1-d/best.magnet);
        g.x+=(best.x-g.x)/d*pull*dt;
        g.y+=(best.y-g.y)/d*pull*dt;
      }
      if(d<8){g.dead=true;G.xp+=g.v;sfx('gem');addSparkles(g.x,g.y,g.v>=4?'#ffe94a':'#bff0ff',4,50);}
    }
  }
  for(const pk of G.pickups){
    pk.t+=dt;
    if(Math.random()<dt*1.2)addSparkles(pk.x,pk.y-3,pk.type==='heart'?'#ff8ba0':'#ffe94a',1,12);
    for(const p of G.players){
      if(p.dead)continue;
      if(dist2(pk.x,pk.y,p.x,p.y)<12*12){
        pk.dead=true;
        if(PARTY_BUFFS.has(pk.type)){
          G.buffTally[pk.type]=(G.buffTally[pk.type]||0)+1;
          for(const q of G.players)applyBuff(q,pk.type);
        }else applyBuff(p,pk.type);
        addSparkles(p.x,p.y-4,'#ffe94a',8,70);break;
      }
    }
  }

  // ---- lucky chest touch: the roll takes over the screen (state 'slot') ----
  if(G.slotChest){
    const s=G.slotChest;
    s.t+=dt;
    if(Math.random()<dt*3)addSparkles(s.x,s.y-4,'#ffd23e',1,20);
    for(const p of G.players){
      if(p.dead)continue;
      if(dist2(s.x,s.y,p.x,p.y)<13*13){
        G.reel={x:s.x,y:s.y,t:0,tick:0,tier:rollSlot(),paid:false};
        G.slotChest=null;G.state='slot';sfx('crate');break;
      }
    }
  }

  // ---- ember brand douse check (PYRAXIS) ----
  for(const f of G.fx){
    if(f.kind==='mark'&&f.mode==='stack'&&!f.fizzled&&f.p&&!f.p.dead){
      for(const q of G.fx){
        if(q.kind!=='safe'||q.t<=0)continue;
        if(dist2(f.p.x,f.p.y,q.x,q.y)<q.r*q.r){f.fizzled=true;addParticles(f.p.x,f.p.y,'#eaffff',18,90);break;}
      }
    }
  }

  // ---- housekeeping ----
  for(const pt of G.particles){
    pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.t-=dt;
    // stars coast to a stop and hang: the bloom is the readable part, not the flight
    if(pt.drag){const f=Math.max(0,1-pt.drag*dt);pt.vx*=f;pt.vy*=f;}
  }
  for(const t of G.texts){t.y+=t.vy*dt;t.t-=dt;}
  G.dpsT=(G.dpsT||0)+dt;
  if(G.dpsT>=0.25){
    G.dpsT-=0.25;
    for(const p of G.players){
      if(!p.dpsLog)continue;
      p.dpsLog.push(p.dpsAcc);p.dpsAcc=0;
      if(p.dpsLog.length>12)p.dpsLog.shift();
      const sum=p.dpsLog.reduce((a,b)=>a+b,0);
      p.dps=sum/(p.dpsLog.length*0.25);
      p.dpsPeak=Math.max(p.dpsPeak,p.dps);
    }
  }
  G.particles=G.particles.filter(p=>p.t>0);
  G.texts=G.texts.filter(t=>t.t>0);
  G.fx=G.fx.filter(f=>f.t>0);
  G.bullets=G.bullets.filter(b=>!b.dead);
  G.ebullets=G.ebullets.filter(b=>!b.dead);
  G.gems=G.gems.filter(g=>!g.dead);
  G.pickups=G.pickups.filter(p=>!p.dead);
  G.enemies=G.enemies.filter(e=>!e.dead);
  G.crates=G.crates.filter(c=>!c.dead);
  // cull litter that is far behind the party (it was never coming back)
  if(G.crates.length>90)G.crates=G.crates.filter(c=>dist2(c.x,c.y,G.cam.x,G.cam.y)<1400*1400);
  if(G.pickups.length>120)G.pickups=G.pickups.filter(p=>dist2(p.x,p.y,G.cam.x,G.cam.y)<1400*1400);
  if(G.boss&&G.boss.dead)G.boss=null;
  if(!G.boss)for(const e of G.enemies)if(e.boss&&!e.dead){G.boss=e;break;}

  // ---- spawning ----
  if(G.mode==='endless'){
    const n=Math.max(1,G.players.length);
    const interval=Math.max(0.14,1.4-G.time*0.004)/(0.6+0.4*n);
    G.spawnT-=dt;
    const maxEnemies=200+Math.min(80,G.time*0.2);
    if(G.spawnT<=0&&G.enemies.length<maxEnemies){
      G.spawnT=interval;
      const pt=spawnPoint();
      if(pt)spawnEnemy(pickEnemyType(),pt.x,pt.y);
    }
    G.surgeT-=dt;
    if(G.surgeT<=0){
      G.surgeT=45;
      flash('SURGE INCOMING!');
      const type=pickEnemyType();
      for(let i=0;i<10+Math.min(25,G.time*0.06);i++){
        const pt=spawnPoint();
        if(pt&&G.enemies.length<maxEnemies+40)spawnEnemy(Math.random()<0.7?type:pickEnemyType(),pt.x,pt.y);
      }
    }
    G.bossT-=dt;
    if(G.bossT<=0){G.bossT=170;if(!G.boss)spawnBoss();}
  }else updateClassicWaves(dt);

  // level-ups never interrupt a boss fight, and never resurrect a finished run.
  // CLASSIC banks them further: no draft mid-wave — xp pools up (the HUD badge
  // counts the banked drafts) and the whole stack is drafted in the wave break,
  // so the fight is never interrupted and the break becomes the payoff.
  const canLevel=G.state==='play'&&!(isCampaign()&&G.waveState==='boss');
  const xpGate=G.mode!=='classic'||G.waveState==='clear'||G.waveState==='inter';
  // back-paid boss pods (a skip start in BOSS RUSH), spent between the levels
  // those same kills owed the party so both run out together
  if(canLevel&&G.podDebt>0&&(G.freeLevels===0||G.freeLevels<=G.podDebt*G.podEvery)){
    G.podDebt--;
    for(const p of G.players)applyBuff(p,'pod');
  }
  else if(canLevel&&G.freeLevels>0){G.freeLevels--;startLevelup(true);}
  else if(canLevel&&xpGate&&G.xp>=xpNeed())startLevelup();

  // banked-draft fanfare: when another level banks mid-wave, the HUD counter
  // pops (G.bankFlash drives the badge scale/burst in the render pass)
  if(G.state==='play'){
    const bk0=bankedLevels().banked;
    if(G.bankSeen==null)G.bankSeen=bk0;
    if(bk0>G.bankSeen){G.bankFlash=0.8;sfx('pickup');}
    G.bankSeen=bk0;
    if(G.bankFlash>0)G.bankFlash-=dt;
  }

  storePadStates(pads);
}

function spawnBoss(){
  const kind=G.bossIdx%2===0?'brute':'warlock';
  G.bossIdx++;
  const pt=spawnPoint();
  if(!pt)return;
  const n=Math.max(1,G.players.length);
  const base=kind==='brute'?850:650;
  const hp=base*(1+G.time*0.008)*((4*n-1)/3); // same roster slope as classic bosses
  const e={
    type:kind,spr:kind==='brute'?tankSprite:spitSprite,x:pt.x,y:pt.y,
    r:kind==='brute'?17:13,hp,maxhp:hp,
    // dmg base 20/12 → 24/15: the balance-model endless probe showed boss
    // pressure sagging against golden-boon max-hp growth; endless bosses stay
    // short-lived by design, so their threat has to live in the hit, not the TTK
    sp:kind==='brute'?30:36,dmg:(kind==='brute'?24:15)*dmgScale(),xp:40,
    flash:0,fuse:-1,shootT:2,orbCd:{},slow:1,boss:true,scale:kind==='brute'?2.4:2.6,
    name:kind==='brute'?'BRUTE KING':'WARLOCK',barCol:'#e33',phase:1,phaseCount:1,huntLv:0,life:-1,
    ai:{t:3,mode:'walk',tx:0,ty:0,sumT:6}
  };
  G.enemies.push(e);G.boss=e;
  sfx('boss');
  flash(kind==='brute'?'!! BRUTE KING !!':'!! WARLOCK !!');
  G.shake=6;
}

// ---------- camera ----------
function updateCamera(dt){
  const aspect=screenC.width/screenC.height||1.7;
  // a boss arena, or a terrain wave that has pinned its field (VOLCANIC
  // PRESSURE): the camera holds, and the leash keeps the party on it
  const A=G.arena||G.camLock;
  if(isCampaign()&&A){
    G.cam.tw=A.w;
    G.cam.w=lerp(G.cam.w,G.cam.tw,Math.min(1,dt*3));
    G.cam.h=G.cam.w/aspect;
    G.cam.x=lerp(G.cam.x,A.x,Math.min(1,dt*2.2));
    G.cam.y=lerp(G.cam.y,A.y,Math.min(1,dt*2.2));
    return;
  }
  // corpses must not hold the camera hostage — track the living, fall back to everyone
  let targets=G.players.filter(p=>!p.dead);
  if(!targets.length)targets=G.players;
  if(!targets.length)return;
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const p of targets){
    if(p.x<minx)minx=p.x;
    if(p.x>maxx)maxx=p.x;
    if(p.y<miny)miny=p.y;
    if(p.y>maxy)maxy=p.y;
  }
  const cx=(minx+maxx)/2,cy=(miny+maxy)/2;
  const needW=Math.max((maxx-minx)+260,((maxy-miny)+200)*aspect,640);
  G.cam.tw=clamp(needW,640,1150);
  G.cam.w=lerp(G.cam.w,G.cam.tw,Math.min(1,dt*3));
  G.cam.h=G.cam.w/aspect;
  G.cam.x=lerp(G.cam.x,cx,Math.min(1,dt*4));
  G.cam.y=lerp(G.cam.y,cy,Math.min(1,dt*4));
}


// ============================================================
// RENDER
// ============================================================
function text(g,str,x,y,size,col,align){
  str=tr(String(str)); // single choke point: every visible string is translated here
  g.font='bold '+size+'px "Courier New",monospace';
  g.fillStyle=col;
  g.textAlign=align||'left';
  g.textBaseline='top';
  g.fillText(str,Math.round(x),Math.round(y));
}
function fmtTime(t){
  const m=Math.floor(t/60),s=Math.floor(t%60);
  return m+':'+(s<10?'0':'')+s;
}
function drawSpriteC(g,spr,x,y,scale){
  const s=scale||1;
  g.drawImage(spr,Math.round(x-spr.width*s/2),Math.round(y-spr.height*s/2),Math.round(spr.width*s),Math.round(spr.height*s));
}
function hexRgb(h){
  const n=parseInt(h.slice(1),16);
  return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255);
}
function stripes(g,x,y,w,h,col,phase){
  g.save();
  g.beginPath();g.rect(x,y,w,h);g.clip();
  g.strokeStyle=col;g.lineWidth=1;
  for(let i=-h;i<w+h;i+=6){
    const o=(phase*8)%6;
    g.beginPath();g.moveTo(x+i+o,y);g.lineTo(x+i+o-h,y+h);g.stroke();
  }
  g.restore();
}
function drawFx(f,W2V,g){
  const pt=W2V(f.x||0,f.y||0),x=pt[0],y=pt[1];
  const k=clamp(f.t/(f.dur||0.3),0,1);
  switch(f.kind){
    case 'tel':{
      const rgb=hexRgb(f.col);
      g.fillStyle='rgba('+rgb+',0.16)';
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
      g.strokeStyle='rgba('+rgb+',0.75)';g.lineWidth=1;
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.stroke();
      const gr=f.r*(1-k);
      g.strokeStyle=k<0.2?'#ffffff':'rgba('+rgb+',1)';g.lineWidth=2;
      g.beginPath();g.arc(x,y,Math.max(1,gr),0,TAU);g.stroke();
      if(f.icon)drawSpriteC(g,f.icon,x,y-26,k<0.25?2:1);
      break;}
    case 'met':{
      const rgb=hexRgb(f.col);
      g.fillStyle='rgba('+rgb+',0.16)';
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
      g.strokeStyle='rgba('+rgb+',0.9)';g.lineWidth=2;
      g.beginPath();g.arc(x,y,Math.max(1,f.r*(1-k)),0,TAU);g.stroke();
      drawSpriteC(g,cinderSprite,x,y-46*k,1+2*k);
      break;}
    case 'pool':{
      const rgb=hexRgb(f.col);
      const fade=f.t<0.6?f.t/0.6:1;
      if(f.shape==='tile'){
        const s=16,tx=Math.round(x/s)*s;
        g.fillStyle='rgba('+rgb+','+(0.30*fade).toFixed(3)+')';
        g.fillRect(x-s/2,y-s/2,s,s);
        g.strokeStyle='rgba('+rgb+','+(0.9*fade).toFixed(3)+')';g.lineWidth=2;
        g.strokeRect(x-s/2+1,y-s/2+1,s-2,s-2);
        stripes(g,x-s/2,y-s/2,s,s,'rgba('+rgb+',0.5)',G.time);
      }else{
        g.fillStyle='rgba('+rgb+','+(0.22*fade).toFixed(3)+')';
        g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
        g.strokeStyle='rgba('+rgb+','+((0.5+0.3*Math.sin(G.time*9))*fade).toFixed(3)+')';g.lineWidth=1;
        g.beginPath();g.arc(x,y,f.r,0,TAU);g.stroke();
      }
      break;}
    case 'safe':{
      const br=f.r*(1+0.06*Math.sin(G.time*5));
      g.strokeStyle='rgba(0,0,0,0.5)';g.lineWidth=5;
      g.beginPath();g.arc(x,y,br,0,TAU);g.stroke();
      g.strokeStyle=f.col;g.lineWidth=3;
      g.beginPath();g.arc(x,y,br,0,TAU);g.stroke();
      g.strokeStyle='rgba(234,255,255,0.4)';g.lineWidth=1;
      g.beginPath();g.arc(x,y,br*0.72,0,TAU);g.stroke();
      g.fillStyle=f.col;
      g.fillRect(x-9,y-1,18,3);g.fillRect(x-1,y-9,3,18);
      for(let i=0;i<6;i++){
        const a=-G.time*1.4+i*TAU/6; // anticlockwise = safe
        g.fillRect(Math.round(x+Math.cos(a)*br)-1,Math.round(y+Math.sin(a)*br)-1,2,2);
      }
      if(f.heal)drawSpriteC(g,frostBrazierSprite,x,y,1);
      break;}
    case 'stack':{
      g.fillStyle='rgba(255,255,255,'+(0.30+0.30*(1-k)).toFixed(3)+')';
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
      g.strokeStyle='#000';g.lineWidth=2;
      g.beginPath();g.arc(x,y,f.r+2,0,TAU);g.stroke();
      g.strokeStyle='#fff';g.lineWidth=2;
      g.beginPath();g.arc(x,y,Math.max(f.r,f.r+40*k),0,TAU);g.stroke();
      for(let i=0;i<4;i++){
        const a=i*TAU/4+G.time*1.5;
        const rr=f.r+40*k;
        g.fillStyle='#fff';
        g.fillRect(Math.round(x+Math.cos(a)*rr)-2,Math.round(y+Math.sin(a)*rr)-2,4,4);
      }
      drawSpriteC(g,stackRuneSprite,x,y,1);
      break;}
    case 'mark':{
      if(f.mode==='spread'){
        const col=f.locked?'#ffffff':'#ff6bd6';
        g.strokeStyle=col;g.lineWidth=f.locked?2:1;
        g.beginPath();g.arc(x,y,f.r,0,TAU);g.stroke();
        if(f.locked&&Math.floor(G.time*10)%2===0){
          g.fillStyle='rgba(255,255,255,0.25)';
          g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
        }
        if(f.p&&!f.p.dead){const q=W2V(f.p.x,f.p.y);drawSpriteC(g,spreadMarkSprite,q[0],q[1]-20,2);}
      }else if(f.mode==='spreadring'){
        g.strokeStyle='#c83cdc';g.lineWidth=1;
        for(let i=0;i<16;i++){
          const a=i*TAU/16;
          g.fillStyle='#c83cdc';
          g.fillRect(Math.round(x+Math.cos(a)*f.r)-1,Math.round(y+Math.sin(a)*f.r)-1,3,3);
        }
        if(f.p&&f.p.arrow){
          const ar=f.p.arrow;
          g.fillStyle='#ff6bd6';
          for(let i=0;i<4;i++)g.fillRect(Math.round(x+ar[0]*(10+i*4))-2,Math.round(y+ar[1]*(10+i*4))-2,4,4);
        }
      }else if(f.mode==='stack'){
        g.fillStyle=f.fizzled?'rgba(160,220,255,0.14)':'rgba(255,255,255,'+(0.28+0.28*(1-k)).toFixed(3)+')';
        g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
        g.strokeStyle='#000';g.lineWidth=2;
        g.beginPath();g.arc(x,y,f.r+2,0,TAU);g.stroke();
        g.strokeStyle=f.fizzled?'#eaffff':'#fff';g.lineWidth=2;
        g.beginPath();g.arc(x,y,f.r,0,TAU);g.stroke();
        for(let i=0;i<8;i++){
          const a=i*TAU/8+G.time*2,rr=f.r*(0.4+0.6*k);
          g.fillStyle='#fff';
          g.fillRect(Math.round(x+Math.cos(a)*rr)-2,Math.round(y+Math.sin(a)*rr)-2,4,4);
        }
        drawSpriteC(g,stackRuneSprite,x,y,1);
      }else{ // brand — red like every burning tile: bright at first so it's
        // seen the moment it lands, deepening to lava red as it closes
        const early=clamp((k-0.5)*2,0,1); // 1 at the start, 0 by half-way
        g.strokeStyle=early>0?'#ffb0a0':(f.col||VOLC.lava);g.lineWidth=early>0?3:2;
        if(early>0){g.fillStyle='rgba(255,120,100,'+(0.10+0.18*early).toFixed(3)+')';g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();}
        g.beginPath();g.arc(x,y,f.r*(0.5+0.5*(1-k)),0,TAU);g.stroke();
        drawSpriteC(g,brandMarkSprite,x,y,1);
      }
      break;}
    case 'rorbit':{
      const o=f.own;
      if(!o)break; // online guest: the caster left before this frame drew
      const q=W2V(o.x,o.y);
      for(let i=0;i<f.n;i++){
        const a=f.ang+i*TAU/f.n,ox=q[0]+Math.cos(a)*f.rad,oy=q[1]+Math.sin(a)*f.rad;
        g.fillStyle=f.col;
        g.save();g.translate(ox,oy);g.rotate(a*2);
        g.fillRect(-4,-1.5,8,3);g.fillRect(-1.5,-4,3,8);
        g.restore();
      }
      break;}
    case 'rbeam':{
      const rgb=hexRgb(f.col);
      g.save();g.translate(x,y);g.rotate(f.a);
      g.fillStyle='rgba('+rgb+',0.22)';
      g.beginPath();g.moveTo(0,0);g.arc(0,0,f.len,-f.half,f.half);g.closePath();g.fill();
      g.fillStyle='rgba(255,255,255,0.75)';g.fillRect(0,-1.5,f.len,3);
      g.restore();
      break;}
    case 'rchase':{
      const rgb=hexRgb(f.col),pl=0.7+0.3*Math.sin(G.time*10);
      g.fillStyle='rgba('+rgb+',0.28)';
      g.beginPath();g.arc(x,y,f.r*pl,0,TAU);g.fill();
      g.strokeStyle=f.col;g.lineWidth=2;
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.stroke();
      break;}
    case 'ward':{ // THE WARDS: a coloured ring that flares into the pulse
      const rgb=hexRgb(f.col),pu=f.pulse||0,fade=f.t<0.3?f.t/0.3:1;
      g.fillStyle='rgba('+rgb+','+((0.10+0.22*pu)*fade).toFixed(3)+')';
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
      g.strokeStyle='rgba('+rgb+','+(0.9*fade).toFixed(3)+')';g.lineWidth=pu>0.7?3:2;
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.stroke();
      g.fillStyle=f.col;
      for(let i=0;i<6;i++){
        const a=-G.time*2+f.seed+i*TAU/6;
        g.fillRect(Math.round(x+Math.cos(a)*f.r)-1,Math.round(y+Math.sin(a)*f.r)-1,2,2);
      }
      // every player's colour, drawn at their feet, so the match is readable
      for(const p of G.players){
        if(p.dead||!p.wardCol)continue;
        const q=W2V(p.x,p.y+6);
        g.strokeStyle=p.wardCol;g.lineWidth=1;
        g.beginPath();g.ellipse(q[0],q[1],8,4,0,0,TAU);g.stroke();
      }
      break;}
    case 'rburn':{
      const rgb=hexRgb(f.col),fade=f.t<0.8?f.t/0.8:1;
      // soft: INFERNAL EVOCATION lays ~25 of these per cast. At full weight
      // (fill + rim + hazard stripes) the river was a solid red carpet that
      // hid every boss telegraph under it — a faint glow is all it needs.
      if(f.soft){
        g.fillStyle='rgba('+rgb+','+(0.09*fade).toFixed(3)+')';
        g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
        g.strokeStyle='rgba('+rgb+','+(0.30*fade).toFixed(3)+')';g.lineWidth=1;
        g.beginPath();g.arc(x,y,f.r*0.8,0,TAU);g.stroke();
        break;
      }
      g.fillStyle='rgba('+rgb+','+(0.20*fade).toFixed(3)+')';
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
      g.strokeStyle='rgba('+rgb+','+(0.75*fade).toFixed(3)+')';g.lineWidth=1;
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.stroke();
      stripes(g,x-f.r,y-f.r,f.r*2,f.r*2,'rgba('+rgb+',0.25)',G.time*0.6);
      break;}
    case 'rvoid':{
      const rgb=hexRgb(f.col);
      g.fillStyle='rgba('+rgb+',0.22)';
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
      g.strokeStyle='rgba('+rgb+',0.9)';g.lineWidth=2;
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.stroke();
      for(let i=0;i<5;i++){
        const a=-G.time*3+i*TAU/5,rr=f.r*(0.25+0.6*((G.time*0.6+i/5)%1));
        g.fillStyle='rgba(255,255,255,0.5)';
        g.fillRect(Math.round(x+Math.cos(a)*rr)-1,Math.round(y+Math.sin(a)*rr)-1,2,2);
      }
      break;}
    case 'rmet':{
      // relic rain (CINDER CROWN / DEADSTAR): used to borrow the boss-meteor
      // telegraph wholesale — same cinderSprite, same shrinking ring — and
      // players dodged their own relic. Anticlockwise pips = friendly, the
      // same idiom as the 'safe' ring; no falling sprite, no boss language.
      const rgb=hexRgb(f.col);
      g.fillStyle='rgba('+rgb+',0.18)';
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
      g.strokeStyle='rgba('+rgb+',0.9)';g.lineWidth=2;
      g.beginPath();g.arc(x,y,Math.max(1,f.r*(1-k)),0,TAU);g.stroke();
      g.fillStyle=f.col;
      for(let i=0;i<4;i++){
        const a=-G.time*4+i*TAU/4; // anticlockwise = safe
        g.fillRect(Math.round(x+Math.cos(a)*f.r)-1,Math.round(y+Math.sin(a)*f.r)-1,2,2);
      }
      break;}
    case 'soulvoid':{ // the maw: a rot-green whirl, souls spiralling inward
      const rgb=hexRgb(f.col);
      g.fillStyle='rgba('+rgb+',0.16)';
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
      g.strokeStyle='rgba('+rgb+',0.85)';g.lineWidth=2;
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.stroke();
      g.strokeStyle='rgba(42,16,48,0.7)';
      g.beginPath();g.arc(x,y,f.r*0.35,0,TAU);g.stroke();
      for(let i=0;i<6;i++){
        const a=G.time*4+i*TAU/6,rr=f.r*(1-((G.time*0.8+i/6)%1));
        g.fillStyle=i%2?'rgba(142,240,160,0.8)':'rgba(255,255,255,0.5)';
        g.fillRect(Math.round(x+Math.cos(a)*rr)-1,Math.round(y+Math.sin(a)*rr)-1,2,2);
      }
      break;}
    case 'lance':{ // lava ray: a glowing line, gone in a blink
      const a1=W2V(f.x1,f.y1),a2=W2V(f.x2,f.y2);
      g.globalAlpha=k;
      // The beam blooms on cast and collapses to a thread. `w` is the caster's
      // REAL hitbox width, so the art can never claim more reach across than
      // the spell has — the old draw bloomed to 26px over a 16px box, which is
      // most of why the ray read as fat no matter how far the hitbox came down.
      const w0=f.w?f.w*(0.55+0.75*k):6;
      const halo=Math.max(2,w0*0.35);
      g.strokeStyle='rgba('+hexRgb(f.col2)+','+(0.40*k).toFixed(3)+')';g.lineWidth=w0+halo;
      g.beginPath();g.moveTo(a1[0],a1[1]);g.lineTo(a2[0],a2[1]);g.stroke();
      g.strokeStyle=f.col2;g.lineWidth=w0;
      g.beginPath();g.moveTo(a1[0],a1[1]);g.lineTo(a2[0],a2[1]);g.stroke();
      g.strokeStyle=f.col;g.lineWidth=Math.max(1,w0*0.5);
      g.beginPath();g.moveTo(a1[0],a1[1]);g.lineTo(a2[0],a2[1]);g.stroke();
      g.strokeStyle='#fff6c8';g.lineWidth=f.w?Math.max(1,w0*0.22):1;
      g.beginPath();g.moveTo(a1[0],a1[1]);g.lineTo(a2[0],a2[1]);g.stroke();
      g.globalAlpha=1;
      break;}
    case 'phantom':{ // the assassin: its victim's silhouette, prismatic and flickering
      if(Math.floor(G.time*14)%4===0)break; // it flickers — it isn't really there
      const sw=f.spr.width*f.scale,sh=f.spr.height*f.scale;
      // one offset afterimage walking the ramp, then the copy itself
      for(let i=1;i>=1;i--){
        g.globalAlpha=0.13;
        g.fillStyle=prismCol(i*2+G.time*7);
        g.fillRect(Math.round(x-sw/2)-i*2,Math.round(y-sh/2),sw,sh);
        g.fillRect(Math.round(x-sw/2)+i*2,Math.round(y-sh/2),sw,sh);
      }
      g.globalAlpha=0.6;
      drawSpriteC(g,f.spr,x,y,f.scale);
      g.globalAlpha=0.3;
      g.fillStyle=prismCol(G.time*9);
      g.fillRect(Math.round(x-sw/2),Math.round(y-sh/2),sw,sh);
      g.globalAlpha=1;
      break;}
    case 'defile':{
      const rgb=hexRgb(f.col);
      g.fillStyle='rgba('+rgb+',0.26)';
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
      g.strokeStyle='rgba('+rgb+',0.9)';g.lineWidth=2;
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.stroke();
      stripes(g,x-f.r,y-f.r,f.r*2,f.r*2,'rgba('+rgb+',0.35)',G.time*0.8);
      break;}
    case 'sweep':{
      const rgb=hexRgb(f.col);
      g.save();g.translate(x,y);g.rotate(f.a);
      g.fillStyle='rgba('+rgb+',0.16)';
      g.beginPath();g.moveTo(0,0);g.arc(0,0,f.len,-f.half,f.half);g.closePath();g.fill();
      g.strokeStyle='rgba('+rgb+',0.85)';g.lineWidth=2;
      g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(-f.half)*f.len,Math.sin(-f.half)*f.len);
      g.moveTo(0,0);g.lineTo(Math.cos(f.half)*f.len,Math.sin(f.half)*f.len);g.stroke();
      g.fillStyle='rgba(255,255,255,'+(0.35+0.25*Math.sin(G.time*12)).toFixed(2)+')';
      g.fillRect(0,-1.5,f.len,3);
      g.restore();
      break;}
    case 'strip':break; // painted view-wide by renderWavePattern
    case 'line':{
      const rgb=hexRgb(f.col),lock=1-k;
      g.save();g.translate(x,y);g.rotate(f.ang);
      g.fillStyle='rgba('+rgb+','+(0.12+0.20*lock).toFixed(3)+')';
      g.fillRect(0,-f.w/2,f.len,f.w);
      g.strokeStyle='rgba('+rgb+',0.9)';g.lineWidth=1;
      g.strokeRect(0.5,-f.w/2+0.5,f.len-1,f.w-1);
      stripes(g,0,-f.w/2,f.len,f.w,'rgba('+rgb+',0.35)',G.time);
      // the bar sliding down the lane is the count-in — it lands with the hit
      g.fillStyle=k<0.2?'#ffffff':'rgba('+rgb+',1)';
      g.fillRect(f.len*lock-2,-f.w/2,4,f.w);
      g.restore();
      break;}
    case 'cone':{
      const rgb=hexRgb(f.col),lock=1-k;
      g.save();g.translate(x,y);g.rotate(f.ang);
      g.fillStyle='rgba('+rgb+','+(0.10+0.22*lock).toFixed(3)+')';
      g.beginPath();g.moveTo(0,0);g.arc(0,0,f.len,-f.half,f.half);g.closePath();g.fill();
      g.strokeStyle='rgba('+rgb+',0.9)';g.lineWidth=2;
      g.beginPath();g.moveTo(0,0);g.arc(0,0,f.len*lock,-f.half,f.half);g.closePath();g.stroke();
      g.restore();
      break;}
    case 'wander':{
      const rgb=hexRgb(f.col);
      g.fillStyle='rgba('+rgb+',0.20)';
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
      g.strokeStyle='rgba('+rgb+',0.9)';g.lineWidth=2;
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.stroke();
      for(let i=0;i<3;i++){
        const a=G.time*4+i*TAU/3,rr=f.r*(0.35+0.25*i);
        g.fillStyle='rgba(255,255,255,0.55)';
        g.fillRect(Math.round(x+Math.cos(a)*rr)-1,Math.round(y+Math.sin(a)*rr)-1,3,3);
      }
      break;}
    case 'edge':{
      const rgb=hexRgb(f.col);
      g.strokeStyle='rgba('+rgb+',0.85)';g.lineWidth=3;
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.stroke();
      g.strokeStyle='rgba('+rgb+',0.30)';g.lineWidth=1;
      g.beginPath();g.arc(x,y,f.r+7,0,TAU);g.stroke();
      for(let i=0;i<24;i++){
        const a=i*TAU/24+G.time*0.3;
        g.fillStyle='rgba('+rgb+',0.7)';
        g.fillRect(Math.round(x+Math.cos(a)*(f.r+4))-1,Math.round(y+Math.sin(a)*(f.r+4))-1,2,2);
      }
      break;}
    case 'pole':{
      const pos=f.sign>0;
      g.fillStyle=pos?'#39d5ff':'#ff6bd6';
      const yy=y-22;
      g.fillRect(Math.round(x-5),Math.round(yy-1),10,3);
      if(pos)g.fillRect(Math.round(x-1),Math.round(yy-5),3,11);
      g.strokeStyle='rgba(0,0,0,0.5)';g.lineWidth=1;
      g.strokeRect(Math.round(x-6),Math.round(yy-6),12,12);
      break;}
    case 'ring':{
      const rgb=hexRgb(f.col||'#ff2d4d');
      g.lineWidth=f.w;
      if(f.gaps>0){
        const seg=TAU/f.gaps;
        for(let i=0;i<f.gaps;i++){
          const a0=f.gapA+i*seg+f.gapW*0.5,a1=f.gapA+(i+1)*seg-f.gapW*0.5;
          g.strokeStyle='rgba('+rgb+',0.55)';
          g.beginPath();g.arc(x,y,Math.max(1,f.r),a0,a1);g.stroke();
        }
        g.strokeStyle='#fff';g.lineWidth=2;
        for(let i=0;i<f.gaps;i++){
          const ga=f.gapA+i*seg;
          g.beginPath();
          g.moveTo(x+Math.cos(ga-f.gapW*0.5)*(f.r-10),y+Math.sin(ga-f.gapW*0.5)*(f.r-10));
          g.lineTo(x+Math.cos(ga-f.gapW*0.5)*(f.r+10),y+Math.sin(ga-f.gapW*0.5)*(f.r+10));
          g.moveTo(x+Math.cos(ga+f.gapW*0.5)*(f.r-10),y+Math.sin(ga+f.gapW*0.5)*(f.r-10));
          g.lineTo(x+Math.cos(ga+f.gapW*0.5)*(f.r+10),y+Math.sin(ga+f.gapW*0.5)*(f.r+10));
          g.stroke();
        }
      }else{
        g.strokeStyle='rgba('+rgb+',0.6)';
        g.beginPath();g.arc(x,y,Math.max(1,f.r),0,TAU);g.stroke();
      }
      break;}
    case 'shadow':{
      const b=f.boss;
      if(!b||b.dead||!G.arena)break;
      g.fillStyle='rgba(4,6,10,0.62)';
      for(const q of G.arena.pillars){
        const poly=umbra(b.x,b.y,q);
        g.beginPath();
        poly.forEach((c,i)=>{const p2=W2V(c[0],c[1]);if(i)g.lineTo(p2[0],p2[1]);else g.moveTo(p2[0],p2[1]);});
        g.closePath();g.fill();
      }
      break;}
    case 'vent':{
      for(let i=0;i<6;i++){
        const a=i*TAU/6,rr=f.r*(1-k);
        g.fillStyle=Math.floor(G.time*12+i)%2?'#ffd85a':'#ff7a1f';
        g.fillRect(Math.round(x+Math.cos(a)*rr)-2,Math.round(y+Math.sin(a)*rr)-2,4,4);
      }
      break;}
    case 'slagwarn':{
      const s=16;
      g.strokeStyle=k<0.3?'#fff':'rgba(255,255,255,0.7)';g.lineWidth=1;
      g.strokeRect(Math.round(x-s/2)+0.5,Math.round(y-s/2)+0.5,s-1,s-1);
      break;}
    case 'boom':{
      // school bursts ring in their own colour (blue mana, plague green...)
      g.strokeStyle='rgba('+(f.col?hexRgb(f.col):'255,182,46')+','+k.toFixed(3)+')';g.lineWidth=2;
      g.beginPath();g.arc(x,y,Math.max(0,f.r*(1-k)),0,TAU);g.stroke();
      break;}
    case 'sbloom':{
      // ILLUSION burst: white light splitting into a rainbow. A hard white
      // flash collapses inward while two prismatic rings race outward and a
      // crown of star points rides the leading edge.
      const e=1-k;                        // 0 -> 1 over the life
      const grow=f.r*(0.28+0.72*Math.sqrt(e));
      g.globalAlpha=k;
      g.fillStyle='rgba(255,255,255,'+(0.45*k*k).toFixed(3)+')';
      g.beginPath();g.arc(x,y,Math.max(1,f.r*0.55*k),0,TAU);g.fill();
      for(let i=0;i<3;i++){
        const rr=grow*(1-i*0.17);
        if(rr<1)continue;
        g.strokeStyle=i===0?'#ffffff':prismCol(i*2+G.time*11+(f.seed||0));
        g.lineWidth=i===0?2:1;
        g.beginPath();g.arc(x,y,rr,0,TAU);g.stroke();
      }
      const pts=f.pts||8;
      for(let i=0;i<pts;i++){
        const a=i*TAU/pts+e*1.6+(f.seed||0);
        const px=Math.round(x+Math.cos(a)*grow),py=Math.round(y+Math.sin(a)*grow);
        g.fillStyle=prismCol(i+G.time*13);
        g.fillRect(px-2,py,5,1);g.fillRect(px,py-2,1,5);
        g.fillStyle='#ffffff';g.fillRect(px,py,1,1);
      }
      g.globalAlpha=1;
      break;}
    case 'sring':{
      // the dream that lingers: a slow prismatic hoop over dazed ground
      const fade=f.t<0.5?f.t/0.5:1;
      g.globalAlpha=fade*0.9;
      g.strokeStyle=prismCol(G.time*6+(f.seed||0));g.lineWidth=1;
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.stroke();
      g.strokeStyle='rgba(255,255,255,0.35)';
      g.beginPath();g.arc(x,y,f.r*0.72,0,TAU);g.stroke();
      for(let i=0;i<6;i++){
        const a=G.time*0.9+i*TAU/6;
        const px=Math.round(x+Math.cos(a)*f.r),py=Math.round(y+Math.sin(a)*f.r);
        g.fillStyle=prismCol(i*2+G.time*9);
        g.fillRect(px-1,py,3,1);g.fillRect(px,py-1,1,3);
      }
      g.globalAlpha=1;
      break;}
    case 'rot':{
      // NECROMANCY's residue: a patch of ground going sour under the aura
      g.globalAlpha=k*0.32;
      g.fillStyle=(Math.floor(f.x+f.y)&1)?'#5a7a3a':'#3a2456';
      g.beginPath();g.arc(x,y,f.r*(0.5+0.5*(1-k)),0,TAU);g.fill();
      g.globalAlpha=1;
      break;}
    case 'nerve':{
      // NECROMANCY's filament: a thin, twitchy line of nerve rather than a
      // beam of light. Many short segments jittering perpendicular to the run
      // re-randomised every frame (skittery), a colour that pulses green into
      // violet along its length, a couple of dead-end branches forking off it,
      // and bright nodes firing at random points like signal down an axon.
      // It was authored deliberately faint and read as nothing at all against
      // a lit floor: the whole cast is one 0.34s flash, so "subtle" here just
      // means "missed". It keeps the twitchy filament shape but now carries a
      // solid bright core and near-opaque strands.
      const a1=W2V(f.x1,f.y1),a2=W2V(f.x2,f.y2);
      const dx=a2[0]-a1[0],dy=a2[1]-a1[1],L=Math.hypot(dx,dy)||1;
      const nx=-dy/L,ny=dx/L;                    // perpendicular
      const segs=Math.max(6,Math.min(20,Math.round(L/9)));
      const run=(amp,alpha,wid,off)=>{
        g.lineWidth=wid;
        g.beginPath();g.moveTo(a1[0],a1[1]);
        for(let i=1;i<=segs;i++){
          const t=i/segs;
          // pinned at both ends, loosest in the middle
          const j=(Math.random()*2-1)*amp*Math.sin(t*Math.PI);
          g.lineTo(a1[0]+dx*t+nx*(j+off),a1[1]+dy*t+ny*(j+off));
        }
        g.strokeStyle=alpha;g.stroke();
      };
      const pulse=0.5+0.5*Math.sin(G.time*17+(f.seed||0));
      const green='rgba(159,232,74,',violet='rgba(192,74,255,';
      // a dark halo first, so the filament separates from a bright floor
      run(5,'rgba(26,10,40,'+(0.55*k).toFixed(3)+')',5,0);
      run(5,(pulse>0.5?violet:green)+(0.55*k).toFixed(3)+')',3,0);
      run(3,(pulse>0.5?green:violet)+(0.95*k).toFixed(3)+')',2,0);
      // the core: near-white, barely jittered, so there is always a hard line
      run(1.5,'rgba(245,225,255,'+(0.92*k).toFixed(3)+')',1,0);
      // two ghost filaments running alongside, so it reads as a bundle
      run(6,'rgba(120,170,70,'+(0.55*k).toFixed(3)+')',1.5,3);
      run(6,'rgba(168,120,255,'+(0.55*k).toFixed(3)+')',1.5,-3);
      // branches: short dead ends forking off at random points
      for(let b=0;b<4;b++){
        const t=0.2+Math.random()*0.6,bl=4+Math.random()*10,sg=(Math.random()<0.5?1:-1);
        const bx=a1[0]+dx*t,by=a1[1]+dy*t;
        g.strokeStyle=(Math.random()<0.5?green:violet)+(0.85*k).toFixed(3)+')';
        g.lineWidth=1.5;g.beginPath();g.moveTo(bx,by);
        g.lineTo(bx+nx*bl*sg+dx/L*(Math.random()*8-4),by+ny*bl*sg+dy/L*(Math.random()*8-4));
        g.stroke();
      }
      // signal nodes firing down the length
      for(let i=0;i<5;i++){
        const t=Math.random(),px=Math.round(a1[0]+dx*t),py=Math.round(a1[1]+dy*t);
        g.fillStyle=Math.random()<0.5?'#d8ffb0':'#e8b8ff';
        g.fillRect(px-2,py-1,5,3);g.fillRect(px-1,py-2,3,5);
      }
      g.lineWidth=1;
      break;}
    case 'scorch':{
      // DESTRUCTION's residue: a dark blast mark that cools from ember-orange
      // to soot, so a meteor barrage visibly chews up the ground it lands on
      const e=1-k;
      g.globalAlpha=k*0.55;
      g.fillStyle=e<0.35?'#5a3320':'#2a2018';
      g.beginPath();g.arc(x,y,f.r*0.8,0,TAU);g.fill();
      if(e<0.5){
        g.strokeStyle='rgba('+hexRgb(e<0.25?'#ffb62e':'#ff5a3d')+','+(0.6*(1-e*2)).toFixed(3)+')';
        g.lineWidth=1;g.beginPath();g.arc(x,y,f.r*0.8,0,TAU);g.stroke();
      }
      g.globalAlpha=1;
      break;}
    case 'constel':{
      // ILLUSION's signature on any multi-hit cast: the points it touched are
      // joined into a constellation that hangs for a beat and fades. `pts` is
      // a flat [x,y,x,y,...] of world coords, so it survives the enemies that
      // made it dying on the same frame. Named `line`, not `pts` — sbloom
      // already uses `pts` for a point COUNT and the two must not collide in
      // the net encoder.
      const P=f.line;
      g.lineWidth=1;
      for(let i=2;i<P.length;i+=2){
        const a=W2V(P[i-2],P[i-1]),b2=W2V(P[i],P[i+1]);
        g.strokeStyle='rgba('+hexRgb(prismCol(i+G.time*9))+','+(0.7*k).toFixed(3)+')';
        g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b2[0],b2[1]);g.stroke();
      }
      for(let i=0;i<P.length;i+=2){
        const a=W2V(P[i],P[i+1]),s=Math.max(1,Math.round(1+k*2));
        g.fillStyle='rgba(255,255,255,'+k.toFixed(3)+')';
        g.fillRect(a[0]-s,a[1],s*2+1,1);g.fillRect(a[0],a[1]-s,1,s*2+1);
      }
      break;}
    case 'mzone':{
      // the floor of the dream: a soft white haze under the sring hoop, with a
      // slow prismatic shimmer crawling across it so the ground looks unreal
      const fade=f.t<0.5?f.t/0.5:1;
      g.globalAlpha=fade;
      g.fillStyle='rgba(255,255,255,0.10)';
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
      for(let i=0;i<3;i++){
        const rr=f.r*(0.35+0.3*i)+Math.sin(G.time*1.8+i*2.1)*3;
        g.strokeStyle='rgba('+hexRgb(prismCol(i*3+G.time*5))+',0.30)';g.lineWidth=1;
        g.beginPath();g.arc(x,y,rr,0,TAU);g.stroke();
      }
      g.globalAlpha=1;
      break;}
    case 'zap':{
      const a1=W2V(f.x1,f.y1),a2=W2V(f.x2,f.y2);
      // a jagged polyline, re-jittered every frame so the bolt crackles
      const segs=f.glow?4:2,pts=[[a1[0],a1[1]]];
      for(let i=1;i<segs;i++){
        const t=i/segs;
        pts.push([a1[0]+(a2[0]-a1[0])*t+(Math.random()*10-5),
                  a1[1]+(a2[1]-a1[1])*t+(Math.random()*10-5)]);
      }
      pts.push([a2[0],a2[1]]);
      const stroke=(col,w)=>{
        g.strokeStyle=col;g.lineWidth=w;
        g.beginPath();g.moveTo(pts[0][0],pts[0][1]);
        for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);
        g.stroke();
      };
      if(f.glow){ // prismatic bolt: coloured halo, coloured body, white core
        stroke('rgba('+hexRgb(f.col)+','+(0.30*k).toFixed(3)+')',6);
        stroke('rgba('+hexRgb(f.col)+','+k.toFixed(3)+')',3);
        stroke('rgba(255,255,255,'+k.toFixed(3)+')',1);
      }else stroke('rgba('+(f.col?hexRgb(f.col):'176,107,255')+','+k.toFixed(3)+')',1.5);
      break;}
    case 'beam':{
      const a1=W2V(f.x1,f.y1),a2=W2V(f.x2,f.y2);
      g.strokeStyle=f.col||'#ff2d4d';g.lineWidth=2;
      g.globalAlpha=k;
      g.beginPath();g.moveTo(a1[0],a1[1]);g.lineTo(a2[0],a2[1]);g.stroke();
      g.globalAlpha=1;
      break;}
    case 'chain':{
      const a1=W2V(f.x1,f.y1),a2=W2V(f.x2,f.y2);
      g.strokeStyle='rgba(255,107,214,'+k.toFixed(3)+')';g.lineWidth=2;
      g.beginPath();g.moveTo(a1[0],a1[1]);g.lineTo(a2[0],a2[1]);g.stroke();
      break;}
  }
}

function render(){
  const c=G.cam;
  const aspect=screenC.width/screenC.height||1.7;
  // the exact camera window in world units — this is what reaches the screen,
  // and it tracks cam.w continuously so the zoom glides
  const w=Math.max(320,c.w),h=w/aspect;
  // the low-res buffer still snaps to a 16px step so the raster grid only
  // reallocates occasionally (re-rasterizing every frame shimmers); the blit
  // below crops the exact fractional window out of it, making the step invisible
  const vw=Math.ceil((w+8)/16)*16,vh=Math.ceil((h+8)/16)*16;
  if(view.width!==vw||view.height!==vh){view.width=vw;view.height=vh;}
  ctx.imageSmoothingEnabled=false;

  let shx=0,shy=0;
  if(G.shake>0.2){shx=(Math.random()-0.5)*G.shake;shy=(Math.random()-0.5)*G.shake;}
  const ox=Math.round(c.x+shx-vw/2),oy=Math.round(c.y+shy-vh/2);
  const W2V=(x,y)=>[Math.round(x-ox),Math.round(y-oy)];
  const sx=c.x+shx-w/2-ox,sy=c.y+shy-h/2-oy;          // fractional window origin inside the buffer
  const W2U=(x,y)=>[x-(c.x+shx-w/2),y-(c.y+shy-h/2)]; // world -> UI window coords (native res pass)

  ctx.fillStyle=(BIOME_PAL[G.biome]||BIOME_PAL.surface).clear;ctx.fillRect(0,0,vw,vh);
  const c0x=Math.floor(ox/CHPX),c1x=Math.floor((ox+vw)/CHPX);
  const c0y=Math.floor(oy/CHPX),c1y=Math.floor((oy+vh)/CHPX);
  for(let cy=c0y;cy<=c1y;cy++)for(let cx=c0x;cx<=c1x;cx++){
    ctx.drawImage(chunkCanvas(cx,cy),cx*CHPX-ox,cy*CHPX-oy);
    if(G.state!=='title'&&G.state!=='modesel')ensureChunkEntities(cx,cy);
  }
  // embers drift up through the volcano interior
  if(G.biome==='volcano'&&G.state==='play'&&G.particles.length<900&&Math.random()<0.6){
    G.particles.push({x:ox+Math.random()*vw,y:oy+vh+4,vx:(Math.random()-0.5)*8,vy:-14-Math.random()*20,
      t:1.6+Math.random()*1.2,col:Math.random()<0.5?VOLC.slam:VOLC.burst,size:1});
  }

  if(G.state==='title'||G.state==='modesel'){
    blit(sx,sy,w,h);
    uiBegin(w,h);
    renderTitle(w,h,G.state==='modesel');
    if(G.state==='modesel')renderModeSelect(w,h);
    renderPadRoster(w,h);
    renderSoundHint(w,h);
    uiEnd();
    return;
  }

  // green creep (ground)
  if(G.creep){
    for(const k of G.creep){
      const pr=k.split(','),tx=+pr[0],ty=+pr[1];
      const px=tx*TILE-ox,py=ty*TILE-oy;
      if(px<-20||py<-20||px>vw+20||py>vh+20)continue;
      ctx.drawImage(creepTileSprite,px,py,TILE,TILE);
      stripes(ctx,px,py,TILE,TILE,'rgba(63,224,90,0.35)',G.time);
    }
  }
  // devoured floor (ground) — the Worldeater's permanent void band
  if(G.voidTiles){
    for(const k of G.voidTiles){
      const pr=k.split(','),tx=+pr[0],ty=+pr[1];
      const px=tx*TILE-ox,py=ty*TILE-oy;
      if(px<-20||py<-20||px>vw+20||py>vh+20)continue;
      ctx.drawImage(voidTileSprite,px,py,TILE,TILE);
      stripes(ctx,px,py,TILE,TILE,'rgba(138,92,255,0.30)',G.time);
    }
  }
  // lava rivers (ground) — VOLCANIC PRESSURE and Slagmaw's cracked cauldron
  if(G.lava){
    for(const k of G.lava){
      const pr=k.split(','),tx=+pr[0],ty=+pr[1];
      const px=tx*TILE-ox,py=ty*TILE-oy;
      if(px<-20||py<-20||px>vw+20||py>vh+20)continue;
      ctx.drawImage(lavaTileSprite,px,py,TILE,TILE);
      stripes(ctx,px,py,TILE,TILE,'rgba(255,210,62,0.30)',G.time*1.5);
    }
  }
  // arena floor + border
  if(G.arena){
    const a=G.arena,p0=W2V(a.x-a.w/2,a.y-a.h/2);
    ctx.strokeStyle=G.bossTint;ctx.lineWidth=2;
    ctx.globalAlpha=0.5+0.2*Math.sin(G.time*3);
    ctx.strokeRect(p0[0],p0[1],a.w,a.h);
    ctx.globalAlpha=1;
    for(const q of a.pillars){const t=W2V(q.x,q.y);drawSpriteC(ctx,arenaTorchSprite,t[0],t[1]-16,1);}
  }
  // ground telegraphs must be UNDER everything the player looks at — and
  // the player's own ground spells (lava rivers, rot, dream zones) go under
  // the BOSS's, so a hazard warning is never buried beneath friendly fire
  for(const f of G.fx)if(f.ground&&f.own)drawFx(f,W2V,ctx);
  for(const f of G.fx)if(f.ground&&!f.own)drawFx(f,W2V,ctx);

  for(const g of G.gems){
    const q=W2V(g.x,g.y);
    if(q[0]<-8||q[1]<-8||q[0]>vw+8||q[1]>vh+8)continue;
    drawSpriteC(ctx,g.v>=4?bigGemSprite:gemSprite,q[0],q[1]+Math.sin(g.t*4)*1.5);
  }
  for(const pk of G.pickups){
    const q=W2V(pk.x,pk.y);
    if(q[0]<-12||q[1]<-12||q[0]>vw+12||q[1]>vh+12)continue;
    const bob=Math.sin(pk.t*3)*2;
    if(pk.type==='heart')drawSpriteC(ctx,heartSprite,q[0],q[1]+bob);
    else{
      ctx.fillStyle=pk.type==='pod'?'rgba(87,232,107,0.18)':'rgba(255,255,255,0.12)';
      ctx.beginPath();ctx.arc(q[0],q[1]+bob,pk.type==='pod'?10:7,0,TAU);ctx.fill();
      drawSpriteC(ctx,buffIcons[pk.type]||buffIcons.speed,q[0],q[1]+bob);
    }
  }
  for(const cr of G.crates){
    const q=W2V(cr.x,cr.y);
    if(q[0]<-12||q[1]<-12||q[0]>vw+12||q[1]>vh+12)continue;
    drawSpriteC(ctx,crateSprite,q[0],q[1]);
  }
  for(const p of G.players){
    if(!p.dead)continue;
    const q=W2V(p.x,p.y);
    ctx.globalAlpha=0.8;drawSpriteC(ctx,corpseSprite,q[0],q[1]);ctx.globalAlpha=1;
    if(p.reviveP>0){
      ctx.strokeStyle='#57e86b';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(q[0],q[1],11,-Math.PI/2,-Math.PI/2+p.reviveP*TAU);ctx.stroke();
    }else{
      ctx.strokeStyle='rgba(255,255,255,'+(0.25+0.2*Math.sin(G.time*4))+')';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(q[0],q[1],11,0,TAU);ctx.stroke();
    }
  }
  renderWavePattern(ctx,W2V,vw,vh);
  for(const e of G.enemies){
    const q=W2V(e.x,e.y),x=q[0],y=q[1];
    if(x<-60||y<-60||x>vw+60||y>vh+60)continue;
    const s=e.scale||1;
    const hopY=e.hopY||0;
    const yy=y-((e.spr.height*s)/2-e.r)-hopY;
    if(e.polCol){
      ctx.globalAlpha=0.35;ctx.fillStyle=e.polCol;
      ctx.beginPath();ctx.arc(x,y,e.r+3,0,TAU);ctx.fill();
      ctx.globalAlpha=1;
    }
    if(hopY>1){
      ctx.globalAlpha=0.3;ctx.fillStyle='#000';
      ctx.beginPath();ctx.ellipse(x,y,e.r,e.r*0.5,0,0,TAU);ctx.fill();
      ctx.globalAlpha=1;
    }
    if(e.flash>0&&!e.boss){
      ctx.globalAlpha=0.6;drawSpriteC(ctx,e.spr,x,yy,s);ctx.globalAlpha=1;
      ctx.fillStyle='rgba(255,255,255,0.7)';
      ctx.fillRect(Math.round(x-e.r),Math.round(y-e.r),e.r*2,e.r*2);
    }else{
      drawSpriteC(ctx,e.spr,x,yy,s);
      // a boss is on screen for a minute — never paint over its art, just rim-flash it
      if(e.flash>0){
        ctx.strokeStyle='rgba(255,255,255,0.75)';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(x,y,e.r+3,0,TAU);ctx.stroke();
      }
    }
    if(e.elite)drawSpriteC(ctx,eliteMarkSprite,x,y-e.r-8,1);
    if(e.hunted)drawSpriteC(ctx,huntMarkSprite,x,y-e.r-12,1);
    if(e.type==='bomber'&&e.fuse>=0&&Math.floor(e.fuse*10)%2===0){
      ctx.fillStyle='#ff3c3c';ctx.fillRect(x-5,y-12,10,10);
    }
    // a swelling burster glows: a gold halo that grows with the fuse
    if(e.type==='burster'&&e.fuse>=0){
      const k=clamp(1-e.fuse/0.45,0,1);
      ctx.fillStyle='rgba(255,210,62,'+(0.15+0.25*k).toFixed(3)+')';
      ctx.beginPath();ctx.arc(x,y-4,10+22*k,0,TAU);ctx.fill();
    }
    if(e.def&&e.def.draw)e.def.draw(ctx,x,y,e);
  }
  for(const p of G.players){
    if(p.dead)continue;
    const q=W2V(p.x,p.y),x=q[0],y=q[1];
    if(p.invuln>0&&Math.floor(G.time*10)%2===0)continue;
    const bobY=(p.anim%1)<0.5?0:-1;
    if(p.flash>0){ctx.fillStyle='rgba(255,80,80,0.6)';ctx.fillRect(x-6,y-8+bobY,12,14);}
    drawSpriteC(ctx,playerSprites[p.col],x,y-2+bobY);
    const fw=p.weapons.flame;
    if(fw){
      ctx.strokeStyle=(fw.evo?'rgba(255,210,62,':'rgba(255,90,61,')+(0.25+0.1*Math.sin(G.time*6))+')';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(x,y,flameRad(fw),0,TAU);ctx.stroke();
    }
    const ow=p.weapons.orbit;
    if(ow){
      const g=orbitGeom(ow),n=g.n,rad=g.rad;
      for(let i=0;i<n;i++){
        const a=(ow.ang||0)+i*TAU/n;
        const gx=Math.round(x+Math.cos(a)*rad),gy=Math.round(y+Math.sin(a)*rad);
        ctx.fillStyle=ow.evo?'#ffd23e':'#4cc2ff';
        ctx.fillRect(gx-1,gy-2,2,4);ctx.fillRect(gx-2,gy-1,4,2);
        ctx.fillStyle=ow.evo?'#fff6c8':'#d8f8ff';ctx.fillRect(gx,gy-1,1,2);
      }
    }
    // school aura ring: rot-green for Decaying Presence, matching its real
    // hitbox. CONSTANT FLAME used to own a ring here too; it is an aimed fan
    // now and its sparks are ordinary bullets.
    // DEATH TOUCH shares this ring (dtRad): a necromancer holding the passive
    // without the spell still gets the level-1 disc drawn, in grave violet;
    // with both, the one rot ring simply gains violet motes on its rim.
    for(const aid of ['decay']){
      const aw=p.weapons[aid];
      const dt=!!p.pas.dtouch;
      if(!aw&&!dt)continue;
      const rad=aw?auraRad(aid,Math.min(aw.lv,6)+(aw.evo?2:0)):dtRad(p);
      const rot=aid==='decay';
      if(!aw){ // passive only: a thin violet rim, no rot fill
        ctx.strokeStyle='rgba(192,74,255,'+(0.30+0.14*Math.sin(G.time*5))+')';
        ctx.lineWidth=1;
        ctx.beginPath();ctx.arc(x,y,rad,0,TAU);ctx.stroke();
        for(let i=0;i<4;i++){
          const a=G.time*1.1+i*TAU/4;
          ctx.fillStyle=i&1?'#c04aff':'#8a5cff';
          ctx.fillRect(Math.round(x+Math.cos(a)*rad)-1,Math.round(y+Math.sin(a)*rad)-1,2,2);
        }
        continue;
      }
      // a breathing double rim, not a hairline: this is a hitbox you stand in
      ctx.strokeStyle=(rot?'rgba(159,232,74,':'rgba(255,182,46,')+(0.30+0.14*Math.sin(G.time*5))+')';
      ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(x,y,rad,0,TAU);ctx.stroke();
      ctx.strokeStyle=(rot?'rgba(90,122,58,':'rgba(255,90,61,')+(0.22+0.1*Math.sin(G.time*5+1.6))+')';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(x,y,rad-3,0,TAU);ctx.stroke();
      // motes riding the rim, turning one way for fire and the other for rot
      for(let i=0;i<8;i++){
        const a=(rot?-G.time*1.1:G.time*1.6)+i*TAU/8;
        ctx.fillStyle=rot?(i&1?'#9fe84a':(dt?'#c04aff':'#5a7a3a')):(i&1?'#ffd23e':'#ff5a3d');
        ctx.fillRect(Math.round(x+Math.cos(a)*rad)-1,Math.round(y+Math.sin(a)*rad)-1,2,2);
      }
      // Ambient fill, emitted per FRAME (like the Knowledge Aura ring below):
      // the cast tick is far too slow a heartbeat to keep a standing field
      // looking occupied, and these motes are cosmetic — no damage rides them.
      if(Math.random()<0.3&&G.particles.length<760){
        const a=Math.random()*TAU,rr=rad*Math.sqrt(Math.random());
        G.particles.push({x:p.x+Math.cos(a)*rr,y:p.y+Math.sin(a)*rr,
          vx:(Math.random()*2-1)*(rot?6:14),vy:rot?-14-Math.random()*14:-24-Math.random()*18,
          t:0.7+Math.random()*0.6,drag:1.4,size:1+(Math.random()<0.3?1:0),
          col:rot?(Math.random()<0.5?'#9fe84a':(Math.random()<0.5?'#5a7a3a':'#c04aff'))
                 :(Math.random()<0.3?'#fff6c8':(Math.random()<0.5?'#ff5a3d':'#ffb62e'))});
      }
    }
    // Knowledge Aura: a big, deliberately visible blue ring of insight —
    // allies standing inside share the caster's haste
    if(p.pas.ka){
      // one quiet dashed ring, four rim stars: the aura has to stay legible
      // (its radius is gameplay) without owning an 80px disc of the screen —
      // with a full party inside it the old two-ring/eight-glyph version was
      // most of what the eye saw
      ctx.setLineDash([3,5]);
      ctx.globalAlpha=0.5;
      ctx.strokeStyle=prismCol(G.time*4);
      ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(x,y,KA_RADIUS-3,G.time*0.7,G.time*0.7+TAU);ctx.stroke();
      ctx.globalAlpha=1;
      ctx.setLineDash([]);
      for(let i=0;i<4;i++){
        const a=G.time*0.5+i*TAU/4;
        const gx=Math.round(x+Math.cos(a)*KA_RADIUS),gy=Math.round(y+Math.sin(a)*KA_RADIUS);
        ctx.fillStyle=prismCol(i+G.time*6);
        ctx.fillRect(gx-2,gy,5,1);ctx.fillRect(gx,gy-2,1,5);
        ctx.fillStyle='#fff';ctx.fillRect(gx,gy,1,1);
      }
      if(Math.random()<0.04){
        const a=Math.random()*TAU;
        addStars(p.x+Math.cos(a)*KA_RADIUS,p.y+Math.sin(a)*KA_RADIUS,'#ffffff',1,14,true);
      }
    }
    // Mirror Friends: translucent blue ghosts of the player, mirroring the
    // bob — they cast from these spots, so the echo reads as theirs
    if(p.pas.mirror){
      const spots=p.pas.mirror>=4?[[-13,-5],[13,-5]]:[[-13,-5]];
      spots.forEach((s,i)=>{
        const mx=x+s[0],my=y-2+s[1]+((p.anim%1)<0.5?0:-1);
        // fainter than the caster, one prismatic wash over the sprite — the
        // old chromatic-split rects behind each ghost read as two MORE bodies
        // in an already crowded school
        ctx.globalAlpha=(i?0.22:0.35)+0.09*Math.sin(G.time*3+i*2);
        drawSpriteC(ctx,playerSprites[p.col],mx,my);
        ctx.globalAlpha=0.12;
        ctx.fillStyle=prismCol(G.time*7+i*3);
        ctx.fillRect(mx-4,my-7,8,14);
        ctx.globalAlpha=1;
        if(Math.random()<0.04)addStars(p.x+s[0],p.y+s[1]-4,'#ffffff',1,18,true);
      });
    }
  }
  // ribbons first, so every bolt draws on top of every tail
  for(const b of G.bullets){
    const w=b.wake;
    if(!w||w.length<4)continue;
    // a tapering prismatic streak: three passes, widest and faintest first,
    // the same halo/body/core idiom the `zap` glow uses (there is no additive
    // blending in this renderer, so overlap is what sells brightness)
    const n=w.length/2;
    for(let pass=0;pass<3;pass++){
      ctx.lineWidth=[2,1,1][pass];
      ctx.lineCap='round';
      for(let i=1;i<n;i++){
        const f=i/n; // 0 at the oldest sample, 1 at the bolt
        const a=f*f*[0.16,0.34,0.7][pass];
        if(a<0.02)continue;
        ctx.strokeStyle=pass===2?'rgba(255,255,255,'+a.toFixed(3)+')'
          :'rgba('+hexRgb(b.prism?prismCol(b.prism+i*0.7+G.time*11):(b.trailCol||b.col))+','+a.toFixed(3)+')';
        const p0=W2V(w[(i-1)*2],w[(i-1)*2+1]),p1=W2V(w[i*2],w[i*2+1]);
        ctx.beginPath();ctx.moveTo(p0[0],p0[1]);ctx.lineTo(p1[0],p1[1]);ctx.stroke();
      }
    }
    ctx.lineWidth=1;
  }
  for(const b of G.bullets){
    const q=W2V(b.x,b.y);
    if(b.met){
      // a hurled stone: dark rock core in a bleed of fire. Deliberately NOT
      // the ground-ring + falling-cinder language — that telegraph now
      // belongs to boss meteors alone.
      const r=b.r;
      ctx.fillStyle=b.col;
      ctx.fillRect(Math.round(q[0]-r-1),Math.round(q[1]-1),r*2+2,2);
      ctx.fillRect(Math.round(q[0]-1),Math.round(q[1]-r-1),2,r*2+2);
      ctx.fillStyle='#7a4a30';
      ctx.fillRect(Math.round(q[0]-1),Math.round(q[1]-1),3,3);
      ctx.fillStyle='#fff2c0';
      ctx.fillRect(Math.round(q[0]),Math.round(q[1]),1,1);
    }else if(b.star){
      // a seeking star, not a pellet: prismatic arms that breathe, a faint
      // halo ring, diagonals a frame apart so the whole volley shimmers.
      // Kept TIGHT on purpose — at r*2+2 arms and a 3x3 core these read as
      // fireballs rather than starlight, and a full volley swallowed the
      // screen. The arms are the silhouette; the glow is the wake behind them.
      const r=b.r,arm=r+1,col=prismCol((b.prism||1)+G.time*15);
      ctx.strokeStyle='rgba('+hexRgb(col)+',0.22)';
      ctx.beginPath();ctx.arc(q[0],q[1],r+1,0,TAU);ctx.stroke();
      ctx.fillStyle=col;
      ctx.fillRect(q[0]-arm,q[1],arm*2+1,1);
      ctx.fillRect(q[0],q[1]-arm,1,arm*2+1);
      if(Math.floor(G.time*14+q[0])&1){
        const d=Math.max(1,r-1);
        ctx.fillRect(q[0]-d,q[1]-d,1,1);ctx.fillRect(q[0]+d,q[1]-d,1,1);
        ctx.fillRect(q[0]-d,q[1]+d,1,1);ctx.fillRect(q[0]+d,q[1]+d,1,1);
      }
      ctx.fillStyle='#ffffff';
      ctx.fillRect(q[0],q[1],1,1);
    }else if(b.glow){
      // spell bolts are light, not pellets: a coloured cross that bleeds past
      // the hitbox, a white-hot core, and (illusion) a hue that walks the ramp
      const r=b.r;
      ctx.fillStyle=b.prism?prismCol(b.prism+G.time*15):b.col;
      ctx.fillRect(Math.round(q[0]-r-1),Math.round(q[1]-r),r*2+2,r*2);
      ctx.fillRect(Math.round(q[0]-r),Math.round(q[1]-r-1),r*2,r*2+2);
      ctx.fillStyle='#ffffff';
      ctx.fillRect(Math.round(q[0]-r+1),Math.round(q[1]-r+1),Math.max(1,r*2-2),Math.max(1,r*2-2));
    }else{
      ctx.fillStyle=b.col;
      ctx.fillRect(Math.round(q[0]-b.r),Math.round(q[1]-b.r),b.r*2,b.r*2);
    }
  }
  for(const b of G.ebullets){
    const q=W2V(b.x,b.y);
    ctx.fillStyle=b.col;
    ctx.beginPath();ctx.arc(q[0],q[1],b.r,0,TAU);ctx.fill();
  }
  for(const f of G.fx)if(!f.ground)drawFx(f,W2V,ctx);
  for(const pt of G.particles){
    const q=W2V(pt.x,pt.y);
    ctx.fillStyle=pt.prism?prismCol(pt.prism+G.time*13):pt.col;
    if(pt.star){
      // a real twinkle: the arms breathe with the mote's life, and the eight-
      // point stars add diagonals a frame apart so the whole field shimmers
      const a=Math.min(3,1+Math.round(pt.t*3.2)),bx=q[0],by=q[1];
      ctx.fillRect(bx-a,by,a*2+1,1);ctx.fillRect(bx,by-a,1,a*2+1);
      if(pt.star>1&&(Math.floor(G.time*16+bx)&1)){
        const d=Math.max(1,a-1);
        ctx.fillRect(bx-d,by-d,1,1);ctx.fillRect(bx+d,by-d,1,1);
        ctx.fillRect(bx-d,by+d,1,1);ctx.fillRect(bx+d,by+d,1,1);
      }
      ctx.fillStyle='#ffffff';ctx.fillRect(bx,by,1,1);
    }else if(pt.spark){
      if(pt.t>0.15||Math.floor(pt.t*20)%2===0){
        ctx.fillRect(q[0]-1,q[1],3,1);ctx.fillRect(q[0],q[1]-1,1,3);
      }
    }else ctx.fillRect(q[0],q[1],pt.size,pt.size);
  }
  // off-screen hunted-straggler arrows so a wave can never hide from you
  // (clamped to the blitted window, not the larger buffer, so they stay visible)
