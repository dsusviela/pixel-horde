      if(!echo)addText(tgt.x,tgt.y-16,'THE MAW OPENS','#8ef0a0');
      break;}
  }
  return true;
}

// ---------- signature spell casting ----------
// relics exist to break bosses, so they aim at the boss whenever one is in
// range instead of at whatever add wandered closest
function relicTarget(p,range){
  const b=G.boss;
  if(b&&!b.dead&&b.vulnMul!==0&&dist2(p.x,p.y,b.x,b.y)<range*range)return b;
  return nearestEnemy(p.x,p.y,range);
}
// A run through the whole roster would end with two dozen spells casting at
// once — unreadable, and a frame-rate problem with four players. The party
// carries the six most recent signatures; the oldest fades when a new one is
// claimed, so every kill still changes how the next fight plays.
const RELIC_CAP=6;
function applyAura(p,d){
  if(d.dmg)p.dmgMul+=d.dmg;
  if(d.speed)p.speedMul=Math.min(1.9,p.speedMul+d.speed);
  if(d.maxhp){p.maxhp+=d.maxhp;p.hp+=d.maxhp;}
  if(d.regen)p.regen+=d.regen;
  if(d.magnet)p.magnet+=d.magnet;
}
function grantRelic(id){
  const d=RELICS[id];
  if(!d||G.relics.indexOf(id)>=0)return;
  G.relics.push(id);
  for(const p of G.players){
    p.relics[id]={t:1.0};
    addSparkles(p.x,p.y-4,d.col,26,80);
    if(d.fx==='aura')applyAura(p,d);
  }
  flash(d.name+' CLAIMED');
  subFlash(d.desc,3);
  sfx('levelup');
  // auras are permanent stat gifts — they never occupy a casting slot
  const held=G.relics.filter(r=>RELICS[r].fx!=='aura');
  while(held.length>RELIC_CAP){
    const old=held.shift();
    G.relics.splice(G.relics.indexOf(old),1);
    for(const p of G.players)delete p.relics[old];
    subFlash(RELICS[old].name+' FADES',2.5);
  }
}
function grantLevels(n){G.freeLevels+=n;}
// Twenty-four signature spells share nine casting primitives. A relic is data
// — which primitive, how hard, what colour — so a new boss costs one table
// entry, and every spell reads consistently on screen.
//   nova   burst at the target, optional burning ground and knockback
//   bolt   one or more projectiles
//   rain   a stagger of falling impacts
//   zone   a lingering field, optionally pulling
//   orbit  blades circling the caster
//   beam   a sweeping beam from the caster
//   chase  a hazard that hunts on its own
//   chain  lightning that arcs between foes
//   aura   a permanent stat gift, applied once on pickup (never casts)
function fireRelic(p,id,r,dt){
  const d=RELICS[id];
  if(!d||d.fx==='aura')return;
  r.t-=dt;
  if(r.t>0)return;
  const pw=relicPow(p);
  const t=relicTarget(p,d.range||280);
  if(!t){r.t=0.25;return;} // nothing in reach: re-check shortly, don't burn the cooldown
  r.t=d.cd;
  switch(d.fx){
    case 'nova':{
      const R=d.r;
      G.fx.push({kind:'boom',x:t.x,y:t.y,r:R,t:0.3,dur:0.3});
      addParticles(t.x,t.y,d.col,22,140);
      queryEnemies(t.x,t.y,R,e=>{
        if(dist2(t.x,t.y,e.x,e.y)>=(R+e.r)*(R+e.r))return;
        damageEnemy(e,d.dmg*pw,p);
        // knockback only shoves the rank and file; bosses are rooted by their
        // own scripts and dragging them would desync every telegraph
        if(d.knock&&!e.boss&&!e.dead){
          const a=Math.atan2(e.y-t.y,e.x-t.x);
          e.x+=Math.cos(a)*d.knock;e.y+=Math.sin(a)*d.knock;
        }
        if(d.chill&&!e.dead){e.slow=d.chill.mul;e.slowT=d.chill.dur;}
      });
      // same-signature burns pool on top of each other when a relic fires at a
      // rooted boss — tag them so the ground burns once, not once per cast
      if(d.burn)G.fx.push({kind:'rburn',ground:1,own:p,x:t.x,y:t.y,r:d.burn.r,dps:d.burn.dps*pw,
        tag:id+p.idx,tick:0,t:d.burn.dur,dur:d.burn.dur,col:d.col});
      G.shake=Math.max(G.shake,3);sfx(d.sfx||'slam');
      break;}
    case 'bolt':{
      const a=Math.atan2(t.y-p.y,t.x-p.x);
      d.shots.forEach((sh,i)=>{
        const an=a+(sh.off||0)+(d.spread?(i-(d.shots.length-1)/2)*d.spread:0);
        G.bullets.push({x:p.x,y:p.y,vx:Math.cos(an)*sh.spd,vy:Math.sin(an)*sh.spd,
          r:sh.r||3,dmg:sh.dmg*pw,life:sh.life||2.4,owner:p,col:sh.col||d.col,
          rocket:!!sh.aoe,aoe:sh.aoe||0,trail:true,trailCol:sh.col||d.col,sparkTrail:true});
      });
      sfx(d.sfx||'rocket');
      break;}
    case 'rain':{
      sfx(d.sfx||'cinder');
      for(let i=0;i<d.n;i++)after(i*d.gap,()=>{
        if(p.dead)return;
        const tg=relicTarget(p,(d.range||280)+60)||t;
        G.fx.push({kind:'rmet',ground:1,own:p,
          x:tg.x+(Math.random()*2-1)*d.spread,y:tg.y+(Math.random()*2-1)*d.spread,
          r:d.r,dmg:d.dmg*pw,t:0.55,dur:0.55,col:d.col});
      });
      break;}
    case 'zone':
      G.fx.push({kind:'rvoid',ground:1,own:p,x:t.x,y:t.y,r:d.r,dps:d.dps*pw,pull:d.pull||0,
        tick:0,t:d.dur,dur:d.dur,col:d.col});
      sfx(d.sfx||'gazeopen');
      break;
    case 'orbit':
      G.fx.push({kind:'rorbit',own:p,n:d.n,rad:d.rad,dmg:d.dmg*pw,ang:Math.random()*TAU,
        spin:d.spin||3,t:d.dur,dur:d.dur,col:d.col});
      sfx(d.sfx||'spread');
      break;
    case 'beam':
      G.fx.push({kind:'rbeam',ground:1,own:p,a:Math.atan2(t.y-p.y,t.x-p.x),spd:d.spin||1.4,
        len:d.len,half:d.half||0.16,dps:d.dps*pw,tick:0,t:d.dur,dur:d.dur,col:d.col});
      sfx(d.sfx||'zap');
      break;
    case 'chase':
      G.fx.push({kind:'rchase',own:p,x:p.x,y:p.y,r:d.r,dps:d.dps*pw,spd:d.spd||70,
        tick:0,t:d.dur,dur:d.dur,col:d.col,spr:d.spr||null});
      sfx(d.sfx||'vent');
      break;
    case 'chain':{
      let cur=t,px=p.x,py=p.y;
      const hit=new Set();
      for(let i=0;i<d.jumps&&cur;i++){
        G.fx.push({kind:'zap',x1:px,y1:py,x2:cur.x,y2:cur.y,t:0.14,dur:0.14});
        addSparkles(cur.x,cur.y,d.col,3,50);
        damageEnemy(cur,d.dmg*pw,p);
        hit.add(cur);px=cur.x;py=cur.y;
        let next=null,bd=(d.jump||150)**2;
        queryEnemies(px,py,d.jump||150,e=>{
          if(hit.has(e)||e.dead||e.vulnMul===0)return;
          const dd=dist2(px,py,e.x,e.y);
          if(dd<bd){bd=dd;next=e;}
        });
        cur=next;
      }
      sfx(d.sfx||'zap');
      break;}
  }
}

// ---------- level up ----------
function buildOffers(p){
  // the first draft of a school run IS the school choice — one card per path
  if(schoolsOn()&&!p.school)return SCHOOL_IDS.map(id=>({kind:'school',id}));
  const pool=[];
  if(schoolsOn()){
    // hard lock: your school's spells plus Magic Missile, nothing else.
    // The ultimate joins the pool only after the party's first boss kill.
    const sc=SCHOOLS[p.school];
    const ids=['blaster',...sc.actives];
    if(G.bossKills>0)ids.push(sc.ult);
    for(const id of ids){
      const w=p.weapons[id];
      if(!w)pool.push({kind:'new',id});
      else if(w.lv<WEAPONS[id].max)pool.push({kind:'up',id});
      else if(!w.evo&&!WEAPONS[id].ult)pool.push({kind:'evo',id});
    }
    // passives are multipliers on a kit — a crit chance or a burn bonus on
    // one lv1 spell is a dead pick, and drafting them early made the school
    // feel sluggish. They join the board once two school spells are owned.
    const owned=sc.actives.filter(id=>p.weapons[id]).length;
    if(owned>=2)for(const pid of sc.passives){
      if((p.pas[pid]||0)<PASSIVES[pid].ranks)pool.push({kind:'pas',id:pid});
    }
  }else for(const id of WEAPON_IDS){
    const w=p.weapons[id];
    if(!w)pool.push({kind:'new',id});
    else if(w.lv<WEAPONS[id].max)pool.push({kind:'up',id});
    else if(!w.evo)pool.push({kind:'evo',id});
  }
  shuffle(pool);
  // an evolution is the jackpot purchase — when one is eligible it must be
  // on the board, not lost to the shuffle
  const ei=pool.findIndex(o=>o.kind==='evo');
  if(ei>2)pool.unshift(pool.splice(ei,1)[0]);
  const offers=pool.slice(0,3);
  // exhausted pool: golden boons, not heal filler — late income keeps buying
  // real power (a dead picker gets max hp, healing a corpse is wasted)
  const gold=[{kind:'gdmg'},p.dead?{kind:'gmhp'}:{kind:'gheal'},{kind:'gspd'}];
  while(offers.length<3)offers.push(gold[offers.length%3]);
  return offers;
}
// seconds a card row must be visible before a confirm press is accepted
const DRAFT_ARM=0.45;
function startLevelup(free){
  if(G.state!=='play')return;
  const living=G.players.filter(p=>!p.dead);
  if(!living.length){G.xp=Math.min(G.xp,xpNeed()-1);return;}
  G.levelupFree=!!free;
  // a boss kill levels the whole party, dead included: they're about to be
  // rallied back at the intermission and must not permanently miss their pick
  const bossKill=free||(isCampaign()&&G.waveState==='clear'&&isBossWave(G.wave));
  const pickers=bossKill?G.players:living;
  G.state='levelup';
  G.levelupT=0;
  G.levelupPicks=pickers.map(p=>({p,offers:buildOffers(p),sel:1,done:false,openT:0}));
  sfx('levelup');
}
function applyOffer(p,o){
  if(o.kind==='school'){
    p.school=o.id;
    const sc=SCHOOLS[o.id];
    flash('P'+(p.idx+1)+' WALKS THE '+sc.name);
    addSparkles(p.x,p.y-4,sc.col,26,90);
    sfx('levelup');
    return 'chain'; // the school card grants a pick of its spells, same pause
  }
  if(o.kind==='pas'){
    p.pas[o.id]=(p.pas[o.id]||0)+1;
    const pd=PASSIVES[o.id];
    addText(p.x,p.y-12,pd.name+(p.pas[o.id]>1?' '+['I','II','III','IV'][p.pas[o.id]-1]:''),pd.col);
    addSparkles(p.x,p.y-4,pd.col,14,70);
    return;
  }
  if(o.kind==='new'){
    p.weapons[o.id]={lv:1,t:0,ang:Math.random()*TAU};
    if(WEAPONS[o.id].ult){
      flash(WEAPONS[o.id].name+' CLAIMED');
      addSparkles(p.x,p.y-4,'#ffd23e',24,80);
    }
  }
  else if(o.kind==='up')p.weapons[o.id].lv++;
  else if(o.kind==='evo'){
    p.weapons[o.id].evo=true;
    addSparkles(p.x,p.y,'#ffd23e',24,70);
    flash(WEAPONS[o.id].evoName+' AWAKENS');
  }
  else if(o.kind==='gdmg')p.dmgMul+=0.12;
  else if(o.kind==='gspd')p.speedMul=Math.min(1.9,p.speedMul+0.08);
  else if(o.kind==='gmhp'){p.maxhp+=40;p.hp+=40;}
  else if(o.kind==='gheal')p.hp=p.maxhp;
}
// One draft pick may chain: taking a school card swaps that row's cards for
// the school's starter spells (the pick pauses like a level-up — owner rule:
// no choice is ever made while the game runs). forced (timeout / lost pad)
// resolves the chain immediately with a random starter.
function takeOffer(pick,forced){
  const res=applyOffer(pick.p,pick.offers[pick.sel]);
  if(res==='chain'){
    const first=shuffle(SCHOOLS[pick.p.school].first.slice());
    pick.offers=first.slice(0,3).map(id=>({kind:'new',id}));
    pick.sel=1;
    pick.openT=0; // new cards: re-arm the confirm grace
    if(forced){
      pick.done=true;
      applyOffer(pick.p,pick.offers[(Math.random()*pick.offers.length)|0]);
    }
  }else pick.done=true;
}
function finishLevelup(){
  // granted levels (the rush draft and its post-boss payouts) cost no xp
  if(!G.levelupFree)G.xp-=xpNeed();
  G.levelupFree=false;
  G.level++;
  G.levelupPicks=null;
  if(G.state==='levelup')G.state=G.players.every(p=>p.dead)?'gameover':'play';
}

// ---------- buffs ----------
// the five stat charms are party-wide: one pickup buffs every player (dead
// ones included — they keep pace for their revive), so nobody races for them.
// Hearts and the weapon pod stay personal.
const PARTY_BUFFS=new Set(['speed','regen','maxhp','damage','magnet']);
function applyBuff(p,type){
  switch(type){
    case 'speed':p.speedMul=Math.min(1.9,p.speedMul+0.09);addText(p.x,p.y-12,'+SPEED','#ffe94a');break;
    case 'regen':p.regen+=0.6;addText(p.x,p.y-12,'+REGEN','#57e86b');break;
    case 'maxhp':p.maxhp+=20;p.hp=Math.min(p.maxhp,p.hp+20);addText(p.x,p.y-12,'+MAX HP','#ff4d6d');break;
    case 'damage':p.dmgMul+=0.1;addText(p.x,p.y-12,'+DAMAGE','#ff8b3d');break;
    case 'magnet':p.magnet+=16;addText(p.x,p.y-12,'+MAGNET','#b06bff');break;
    case 'heart':p.hp=Math.min(p.maxhp,p.hp+35);addText(p.x,p.y-12,'+35 HP','#ff4d6d');sfx('heart');return;
    // map-wide gem suction for a few seconds — one pickup, whole party's gems
    case 'vacuum':G.vacuumT=3.5;flash('VACUUM!');addText(p.x,p.y-12,'VACUUM','#39d5ff');addSparkles(p.x,p.y,'#8ef0ff',18,90);sfx('douse');return;
    // an arcane mote stolen from ARCANOMAGUS before it could drink it back
    case 'spark':p.dmgMul+=0.06;addText(p.x,p.y-12,'+ARCANE','#c9a4ff');addSparkles(p.x,p.y,'#c9a4ff',12,70);sfx('levelup');return;
    case 'pod':{
      // school runs: the pod deals from your own school's deck (plus Magic
      // Missile). Evolutions stay draft-only jackpots.
      if(schoolsOn()){
        const ids=p.school?['blaster',...SCHOOLS[p.school].actives]:['blaster'];
        const smiss=ids.filter(id=>!p.weapons[id]);
        if(smiss.length){
          const id=smiss[(Math.random()*smiss.length)|0];
          p.weapons[id]={lv:1,t:0,ang:Math.random()*TAU};
          addText(p.x,p.y-12,'+'+WEAPONS[id].name,WEAPONS[id].col);
        }else{
          const owned=ids.filter(id=>p.weapons[id]&&p.weapons[id].lv<WEAPONS[id].max);
          if(owned.length){
            const id=owned[(Math.random()*owned.length)|0];
            p.weapons[id].lv++;
            addText(p.x,p.y-12,WEAPONS[id].name+' UP!',WEAPONS[id].col);
          }else{p.dmgMul+=0.15;addText(p.x,p.y-12,'+DAMAGE','#ff8b3d');}
        }
        sfx('levelup');return;
      }
      const missing=WEAPON_IDS.filter(id=>!p.weapons[id]);
      if(Object.keys(p.weapons).length<4&&missing.length){
        const id=missing[(Math.random()*missing.length)|0];
        p.weapons[id]={lv:1,t:0,ang:Math.random()*TAU};
        addText(p.x,p.y-12,'+'+WEAPONS[id].name,WEAPONS[id].col);
      }else{
        const owned=Object.keys(p.weapons).filter(id=>p.weapons[id].lv<WEAPONS[id].max);
        const evolvable=Object.keys(p.weapons).filter(id=>!p.weapons[id].evo);
        if(owned.length){const id=owned[(Math.random()*owned.length)|0];p.weapons[id].lv++;addText(p.x,p.y-12,WEAPONS[id].name+' UP!',WEAPONS[id].col);}
        else if(evolvable.length){
          const id=evolvable[(Math.random()*evolvable.length)|0];
          p.weapons[id].evo=true;
          addText(p.x,p.y-12,WEAPONS[id].evoName,'#ffd23e');
          addSparkles(p.x,p.y,'#ffd23e',24,70);
        }
        else{p.dmgMul+=0.15;addText(p.x,p.y-12,'+DAMAGE','#ff8b3d');}
      }
      sfx('levelup');return;}
  }
  sfx('pickup');
}
// VOLCANIC PRESSURE vents are terrain too: every chunk the party reaches
// gets its own (deterministic per chunk), already risen, so walking away
// from the first ring never walks away from the lesson
function ensureVentChunk(cx,cy){
  G.ventChunks=G.ventChunks||new Set();
  const k=cx+','+cy;
  if(G.ventChunks.has(k))return;
  G.ventChunks.add(k);
  const rng=makeRng((cx*83492791)^(cy*29435393)^7);
  const want=rng()<0.35?2:1; // most chunks get one vent, a third get two
  let made=0;
  for(let tries=0;tries<14&&made<want;tries++){
    const tx=cx*CHUNK+2+((rng()*(CHUNK-4))|0),ty=cy*CHUNK+2+((rng()*(CHUNK-4))|0);
    if(tileAt(tx,ty)!==T_GRASS)continue;
    const x=tx*TILE+8,y=ty*TILE+8;
    let near=false;
    for(const p of G.players)if(dist2(p.x,p.y,x,y)<90*90){near=true;break;}
    for(const o of G.enemies)if(o.volcano&&!o.dead&&dist2(o.x,o.y,x,y)<150*150){near=true;break;}
    if(near)continue;
    const e=spawnVent(x,y);e.rise=1;e.scale=2.5;made++;
    const P=G.wavePat;
    if(P&&P.pr)P.pr.vols.push(e);else if(G.preVolc)G.preVolc.push(e);
  }
}
function ensureChunkEntities(cx,cy){
  const k=cx+','+cy;
  if(G.terrain==='pressure')ensureVentChunk(cx,cy);
  if(G.spawnedChunks.has(k))return;
  G.spawnedChunks.add(k);
  if(G.spawnedChunks.size>2000)G.spawnedChunks.clear();
  const rng=makeRng((cx*73856093)^(cy*19349663)^99);
  let crates=0,buffs=0;
  for(let ty=0;ty<CHUNK;ty++)for(let tx=0;tx<CHUNK;tx++){
    const wx=cx*CHUNK+tx,wy=cy*CHUNK+ty;
    if(wx*wx+wy*wy<100)continue;
    if(tileAt(wx,wy)!==T_GRASS)continue;
    const r=rng();
    // a bigger party sweeps the map faster (wider camera = more chunks/min),
    // and each loose charm buffs everyone — scale the odds down with roster
    // size like breakCrate does, so exploration charm income stays flat
    const bw=0.0035/(0.7+0.3*Math.max(1,G.players.length));
    if(r<0.010&&crates<3){crates++;G.crates.push({x:wx*TILE+8,y:wy*TILE+8,r:7,hp:12,dead:false});}
    else if(r<0.010+bw&&buffs<1){
      buffs++;
      const types=['speed','regen','maxhp','damage','magnet'];
      G.pickups.push({x:wx*TILE+8,y:wy*TILE+8,type:types[(rng()*types.length)|0],t:0});
    }
  }
}

// ---------- arena ----------
function openArena(){
  const alive=G.players.filter(p=>!p.dead),n=Math.max(1,G.players.length);
  let cx=0,cy=0;
  if(alive.length){for(const p of alive){cx+=p.x;cy+=p.y;}cx/=alive.length;cy/=alive.length;}
  else if(G.players.length){cx=G.players[0].x;cy=G.players[0].y;}
  const aspect=screenC.width/screenC.height||1.7;
  const w=clamp(700+40*n,640,900),h=w/aspect;
  G.arena={x:cx,y:cy,w,h,pillars:[]};
  carveArena();
}
function carveArena(){
  const a=G.arena,dirty=new Set();
  const set=(tx,ty,v)=>{
    if(tileAt(tx,ty)===v)return;
    G.tileOverride.set(tx+','+ty,v);
    dirty.add(Math.floor(tx/CHUNK)+','+Math.floor(ty/CHUNK));
  };
  const t0x=Math.floor((a.x-a.w/2)/TILE),t1x=Math.floor((a.x+a.w/2)/TILE);
  const t0y=Math.floor((a.y-a.h/2)/TILE),t1y=Math.floor((a.y+a.h/2)/TILE);
  for(let ty=t0y;ty<=t1y;ty++)for(let tx=t0x;tx<=t1x;tx++)set(tx,ty,T_GRASS);
  const cx=Math.floor(a.x/TILE),cy=Math.floor(a.y/TILE);
  const ox=Math.max(4,Math.round(a.w/TILE/5)),oy=Math.max(3,Math.round(a.h/TILE/5));
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(s=>{
    const px=cx+s[0]*ox,py=cy+s[1]*oy;
    for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++)set(px+dx,py+dy,T_ROCK);
    a.pillars.push({x:(px+1)*TILE,y:(py+1)*TILE,hw:TILE,hh:TILE});
  });
  for(const k of dirty)chunkCanvases.delete(k);
}
function closeArena(){
  G.arena=null;G.creep=null;G.voidTiles=null;G.lava=null;G.camLock=null;G.pressureF=null;
  setTerrain(null);G.ventChunks=null;
  G.tileOverride.clear();
  chunkCanvases.clear();
}
// ---- lava rivers (VOLCANIC PRESSURE wave, Slagmaw phase 3) ----
// G.lava is a Set of "tx,ty" like creep/void: an overlay, never a tile edit.
// Damage on stand only — no slow, so crossing is a cost and never a wall.
function lavaTick(dt,alive,P){
  const o=P||G;
  o.lavaTickT=(o.lavaTickT||0)-dt;
  if(o.lavaTickT>0||!G.lava)return;
  o.lavaTickT=0.35;
  for(const p of alive){
    if(G.lava.has(Math.floor(p.x/TILE)+','+Math.floor(p.y/TILE))){
      bossHit(p,0.05);addParticles(p.x,p.y,VOLC.lava,2,30);
    }
  }
}
// an erratic river from (x,y) toward a screen edge, 2 tiles wide, with 1-2
// two-tile gaps that are never right at the source. Returns the keys written
// so the owner can erase and re-carve. `bounds` = {x,y,w,h} in world px.
function carveRiver(x,y,dir,bounds,opt){
  opt=opt||{};
  if(!G.lava)G.lava=new Set();
  const keys=[];
  const alive=G.players.filter(p=>!p.dead);
  const vert=dir==='n'||dir==='s';
  const step=dir==='n'||dir==='w'?-1:1;
  let tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);
  const t0x=Math.floor((bounds.x-bounds.w/2)/TILE),t1x=Math.floor((bounds.x+bounds.w/2)/TILE);
  const t0y=Math.floor((bounds.y-bounds.h/2)/TILE),t1y=Math.floor((bounds.y+bounds.h/2)/TILE);
  const path=[],jit=opt.jitter??0.35,W=opt.width||2;
  for(let i=0;i<80;i++){
    if(vert)ty+=step;else tx+=step;
    if(Math.random()<jit){if(vert)tx+=Math.random()<0.5?-1:1;else ty+=Math.random()<0.5?-1:1;}
    if(tx<t0x||tx>t1x||ty<t0y||ty>t1y)break;
    path.push([tx,ty]);
  }
  const ng=path.length>12?(Math.random()<0.5?1:2):1;
  const gaps=new Set();
  for(let tries=0;tries<30&&gaps.size<ng;tries++){
    const gi=4+((Math.random()*(path.length-6))|0);
    let ok=true;
    for(const g of gaps)if(Math.abs(g-gi)<4)ok=false;
    if(ok){gaps.add(gi);gaps.add(gi+1);}
  }
  path.forEach((pt,i)=>{
    if(gaps.has(i))return;
    const cells=[];
    for(let w=0;w<W;w++)cells.push(vert?[pt[0]+w-(W>>1),pt[1]]:[pt[0],pt[1]+w-(W>>1)]);
    for(const c of cells){
      if(solidAt(c[0]*TILE+8,c[1]*TILE+8))continue;
      let near=false;
      for(const p of alive)if(dist2(p.x,p.y,c[0]*TILE+8,c[1]*TILE+8)<24*24){near=true;break;}
      if(near)continue;
      const k=c[0]+','+c[1];
      G.lava.add(k);keys.push(k);
    }
  });
  if(!opt.quiet){sfx('crack');G.shake=Math.max(G.shake,3);}
  return keys;
}
// a burning footprint: the tile under (x,y) joins G.lava (the same square,
// animated overlay the rivers use — the CREEP's language, in red), and with
// probability `spread` one neighbour catches too, so a trail widens a little
// behind whatever left it. Capped so a long wave can't tile the world.
const LAVA_TRAIL_CAP=700; // rivers (P3) share the set, ~250 of these
function lavaDrip(x,y,spread){
  if(!G.lava)G.lava=new Set();
  if(G.lava.size>=LAVA_TRAIL_CAP)return;
  const tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);
  G.lava.add(tx+','+ty);
  if(spread&&Math.random()<spread){
    const d=[[1,0],[-1,0],[0,1],[0,-1]][(Math.random()*4)|0];
    G.lava.add((tx+d[0])+','+(ty+d[1]));
  }
}
function eraseRiver(keys){
  if(!G.lava||!keys)return;
  for(const k of keys)G.lava.delete(k);
}
function holdArena(dt){
  const b=G.boss,a=G.arena;
  if(!b||b.dead||!a)return;
  b.x=clamp(b.x,a.x-a.w/2+26,a.x+a.w/2-26);
  b.y=clamp(b.y,a.y-a.h/2+26,a.y+a.h/2-26);
}

// ---------- boss fx vocabulary ----------

}
function pushSafe(e,x,y,r,life,col,heal){

function pushRing(e,x,y,opt){

function pushMark(e,p,opt){

function pushMet(e,x,y,r,dur,pct,pool){

}
function pushShadow(e,dur,pct){

}
function ringVolley(e,n,col,spd,off){
  for(let i=0;i<n;i++){
    const a=(off||0)+i*TAU/n;
    G.ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:3,dmg:e.dmg*0.45,life:3.0,col:col||'#ffb62e',boss:1});

// CINDER RING done honestly (Ragnaros' Magma Blast rule: the boss is the safe
// place, standing off is what gets punished). Bullets are BORN on the rim of
// the safe disc and fly outward faster than a player walks, so inside the
// disc is genuinely clear and outside cannot be strolled away from.
function cinderRingAt(src,R,spd,n,col,off,dmg){
  for(let i=0;i<n;i++){
    const a=(off||0)+i*TAU/n;
    G.ebullets.push({x:src.x+Math.cos(a)*R,y:src.y+Math.sin(a)*R,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:3,
      dmg:dmg!=null?dmg:(src.dmg||10)*0.45,life:2.4,col:col||VOLC.burst,boss:src.boss?1:0});
  }
}
function bossCast(e,key,name,dur){
  e.ai.cast=key;e.ai.castT=dur;e.ai.castLen=dur;e.castName=name;e.castP=0;e.frozen=1;sfx('telegraph');
}
function bossWalk(e,tx,ty,sp){
  const d=Math.hypot(tx-e.x,ty-e.y)||1;
  e.ovr=1;e.ovx=(tx-e.x)/d;e.ovy=(ty-e.y)/d;e.osp=sp;
}
function clearPools(x,y,r){
  let n=0;
  for(const f of G.fx){
    if((f.kind==='pool')&&dist2(f.x,f.y,x,y)<r*r){f.t=Math.min(f.t,0.15);n++;}
  }
  if(G.creep){
    const t0x=Math.floor((x-r)/TILE),t1x=Math.floor((x+r)/TILE);
    const t0y=Math.floor((y-r)/TILE),t1y=Math.floor((y+r)/TILE);
    for(let ty=t0y;ty<=t1y;ty++)for(let tx=t0x;tx<=t1x;tx++){
      const cx=tx*TILE+8,cy=ty*TILE+8;
      if(dist2(cx,cy,x,y)<r*r)G.creep.delete(tx+','+ty);
    }
  }
  // (lava rivers are terrain: a safe disc does NOT erase them)
  return n;
}

// tick every boss telegraph/hazard; runs even while the boss is mid-transition or dead
function tickBossFx(dt,alive){
  for(const f of G.fx){
    if(f.t<=0)continue;
    switch(f.kind){
      case 'tel':
        f.t-=dt;
        if(f.t<=0){
          G.fx.push({kind:'boom',x:f.x,y:f.y,r:f.r,t:0.3,dur:0.3});
          G.shake=Math.max(G.shake,5);sfx('slam');
          for(const p of alive)if(dist2(p.x,p.y,f.x,f.y)<f.r*f.r)bossHit(p,f.pct);
          if(f.pool)pushPool(f.boss,f.x,f.y,f.pool.r,f.pool.life,f.pool.pct,f.pool.col||f.col,f.pool.shape);
        }
        break;
      case 'met':
        f.t-=dt;
        if(f.t<=0){
          G.fx.push({kind:'boom',x:f.x,y:f.y,r:f.r,t:0.25,dur:0.25});
          addParticles(f.x,f.y,'#ffb62e',10,90);sfx('emberpop');
          for(const p of alive)if(dist2(p.x,p.y,f.x,f.y)<f.r*f.r)bossHit(p,f.pct);
          if(f.pool)pushPool(f.boss,f.x,f.y,f.pool.r,f.pool.life,f.pool.pct,f.pool.col||'#ff7a1f',f.pool.shape);
          if(f.rock){
            // the boulder stays: a 2x2 of rock that blocks bodies and sight
            const tx=Math.floor(f.x/TILE),ty=Math.floor(f.y/TILE);
            for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++)patSetTile(tx+dx,ty+dy,T_ROCK);
            for(const p of G.players)unstick(p);
            for(const e of G.enemies)if(!e.dead)unstick(e);
            addParticles(f.x+TILE,f.y+TILE,'#c9b48a',16,110);
            G.shake=Math.max(G.shake,6);sfx('crack');
          }
        }
        break;
      case 'pool':
        f.t-=dt;f.tick-=dt;
        if(f.tick<=0){
          f.tick=0.35;
          for(const p of alive)if(dist2(p.x,p.y,f.x,f.y)<f.r*f.r)bossHit(p,f.pct);
        }
        break;
      case 'safe':
        f.t-=dt;f.tick=(f.tick||0)-dt;
        if(f.tick<=0){
          f.tick=0.3;
          if(f.heal){
            for(const p of alive)if(dist2(p.x,p.y,f.x,f.y)<f.r*f.r)p.hp=Math.min(p.maxhp,p.hp+f.heal*0.3);
          }
          clearPools(f.x,f.y,f.r);
        }
        break;
      case 'ring':{
        f.t-=dt;
        const trav=f.spd*(f.dur-f.t);
        f.r=f.dir<0?Math.max(0,f.rmax-trav):trav;
        for(const p of alive){
          if(p.invuln>0||f.hit.has(p.idx))continue;
          const dx=p.x-f.x,dy=p.y-f.y,d=Math.hypot(dx,dy);
          if(Math.abs(d-f.r)>f.w*0.5+p.r)continue;
          if(f.gaps>0){
            const seg=TAU/f.gaps;
            let an=Math.atan2(dy,dx)-f.gapA;
            an-=Math.round(an/seg)*seg;
            if(Math.abs(an)<f.gapW*0.5)continue;
          }
          f.hit.add(p.idx);bossHit(p,f.pct);
        }
        break;}
      case 'mark':{
        f.t-=dt;
        const p=f.p;
        if(!p||p.dead){f.t=Math.min(f.t,0);break;}
        if(f.mode==='spread'){
          if(!f.locked&&f.t<=f.lockAt){f.locked=true;f.x=p.x;f.y=p.y;sfx('brandlock');}
          if(!f.locked){f.x=p.x;f.y=p.y;}
        }else{f.x=p.x;f.y=p.y;}
        if(f.t<=0&&!f.resolved){
          f.resolved=true;
          if(f.onPop)f.onPop(f);
        }
        break;}
      case 'shadow':{
        f.t-=dt;f.tick-=dt;
        if(f.tick<=0){
          f.tick=0.3;
          const b=f.boss;
          if(b&&!b.dead){
            for(const p of alive){
              if(losClear(b.x,b.y,p.x,p.y)){
                bossHit(p,f.pct);
                G.fx.push({kind:'beam',x1:b.x,y1:b.y,x2:p.x,y2:p.y,t:0.16,dur:0.16,col:b.barCol||'#ff2d4d'});
              }else addParticles(p.x,p.y,'#ffffff',3,30);
            }
          }
        }
        break;}
      // ---- shared raid mechanics (see SHARED RAID MECHANICS) ----
      case 'sweep':
        f.t-=dt;f.tick-=dt;
        f.a=f.a0+f.spd*(f.dur-f.t);
        if(f.tick<=0){
          f.tick=0.2;
          for(const p of alive){
            const dx=p.x-f.x,dy=p.y-f.y,d=Math.hypot(dx,dy);
            if(d>f.len||d<10)continue;
            let an=Math.atan2(dy,dx)-f.a;
            an=Math.atan2(Math.sin(an),Math.cos(an));
            if(Math.abs(an)<f.half){bossHit(p,f.pct);addParticles(p.x,p.y,f.col,4,50);}
          }
        }
        break;
      case 'strip':
        f.t-=dt;
        if(f.t<=0){
          const v=f.axis==='v';
          const inside=o=>Math.abs((v?o.x:o.y)-f.coord)<f.w*0.5;
          for(const p of alive)if(inside(p))bossHit(p,f.pct);
          if(f.mobs)for(const e of G.enemies)if(!e.dead&&!e.boss&&inside(e))damageEnemy(e,e.hp*2+50,null);
          const c=G.cam,n=10;
          for(let i=0;i<n;i++){
            const u=(v?c.y-c.h/2:c.x-c.w/2)+(v?c.h:c.w)*i/n;
            addParticles(v?f.coord:u,v?u:f.coord,f.col,5,70);
          }
          G.shake=Math.max(G.shake,5);sfx('slam');
        }
        break;
      case 'line':
        f.t-=dt;
        if(f.t<=0){
          const c=Math.cos(-f.ang),sn=Math.sin(-f.ang);
          for(const p of alive){
            const dx=p.x-f.x,dy=p.y-f.y;
            const lx=dx*c-dy*sn,ly=dx*sn+dy*c;
            if(lx>-8&&lx<f.len&&Math.abs(ly)<f.w*0.5)bossHit(p,f.pct);
          }
          // the dance floor kills the horde too — the drip IS the harvest
          if(f.mobs)for(const e of G.enemies){
            if(e.dead||e.boss)continue;
            const dx=e.x-f.x,dy=e.y-f.y;
            const lx=dx*c-dy*sn,ly=dx*sn+dy*c;
            if(lx>-8&&lx<f.len&&Math.abs(ly)<f.w*0.5)damageEnemy(e,e.hp*2+50,null);
          }
          for(let i=0;i<8;i++)
            addParticles(f.x+Math.cos(f.ang)*f.len*i/8,f.y+Math.sin(f.ang)*f.len*i/8,f.col,5,70);
          if(f.pool)pushPool(f.boss,f.x+Math.cos(f.ang)*f.len*0.5,f.y+Math.sin(f.ang)*f.len*0.5,
            f.pool.r||f.w*0.6,f.pool.life||6,f.pool.pct||0.05,f.pool.col||f.col,'circle');
          G.shake=Math.max(G.shake,5);sfx('slam');
        }
        break;
      case 'cone':
        f.t-=dt;
        if(f.t<=0){
          for(const p of alive){
            const dx=p.x-f.x,dy=p.y-f.y,d=Math.hypot(dx,dy);
            if(d>f.len)continue;
            let an=Math.atan2(dy,dx)-f.ang;
            an=Math.atan2(Math.sin(an),Math.cos(an));
            if(Math.abs(an)<f.half)bossHit(p,f.pct);
          }
          for(let i=0;i<10;i++){

      case 'mzone':{ // bizarre mirage: the dream lingers, gnawing and re-dazing

        if(!tg){
          let bd=1e9;
          for(const e of G.enemies){
            if(e.dead||e.vulnMul===0)continue;
            const dd2=dist2(e.x,e.y,f.x,f.y);
            if(dd2<bd){bd=dd2;tg=e;}

        if(tg){
          const dd=Math.hypot(tg.x-f.x,tg.y-f.y)||1;

        if(f.tick<=0){

            if(dist2(f.x,f.y,e.x,e.y)>=(f.r+e.r)*(f.r+e.r))return;
            // the copy strikes with a share of its victim's own strength, so
            // it self-scales with the wave; capped against bosses
            const bonus=Math.min(f.dmg*0.5,(e.dmg||0)*0.4);
            damageEnemy(e,f.dmg*0.5+bonus,f.own);
          });
        }
        break;}
      case 'soulvoid':{ // vacuuming souls: pull, eat, and pay the party in hp
        f.t-=dt;f.tick-=dt;
        for(const e of G.enemies){
          if(e.dead||e.boss)continue;
          const dx=f.x-e.x,dy=f.y-e.y,dd=Math.hypot(dx,dy)||1;
          if(dd<f.r*2.0){e.x+=dx/dd*f.pull*dt;e.y+=dy/dd*f.pull*dt;}
        }
        if(f.tick<=0){
          f.tick=0.3;
          queryEnemies(f.x,f.y,f.r,e=>{
            if(dist2(f.x,f.y,e.x,e.y)>=(f.r+e.r)*(f.r+e.r))return;
            damageEnemy(e,f.dps*0.3,f.own);
            if(e.dead&&f.healed<20){

              addSparkles(f.x,f.y,'#8ef0a0',3,70);
            }
          });
          addSparkles(f.x,f.y,'#8ef0a0',2,50);
        }

        if(Math.random()<dt*30){
          const a=Math.random()*TAU,rr=f.r*(0.8+Math.random()*0.7);
          G.particles.push({x:f.x+Math.cos(a)*rr,y:f.y+Math.sin(a)*rr,
            vx:-Math.cos(a)*90,vy:-Math.sin(a)*90,t:0.7,
            col:Math.random()<0.5?'#8ef0a0':'#c9a4ff',size:1,spark:true});
        }
        // the maw closes on a detonation: the ultimate needs a punchline
        if(f.t<=0&&!f.closed){
          f.closed=1;
          G.fx.push({kind:'boom',col:'#8ef0a0',x:f.x,y:f.y,r:f.r*1.3,t:0.35,dur:0.35});
          addParticles(f.x,f.y,'#8ef0a0',26,150);

            if(dist2(f.x,f.y,e.x,e.y)<(f.r*1.3+e.r)*(f.r*1.3+e.r))damageEnemy(e,f.burst,f.own);
          });
          G.shake=Math.max(G.shake,5);sfx('boom');
        }
        break;}
      default: f.t-=dt;
    }
  }
}

// THE FOUR RAID BOSSES
// All mechanic damage is a fraction of maxhp via bossHit().
// ============================================================
function spawnSlagPup(x,y){
  const e=spawnEnemy('swarm',x,y);
  e.spr=slagPupSprite;e.r=4;e.hp=16*hpScale();e.maxhp=e.hp;
  e.sp=58+Math.random()*10;e.dmg=addDmg(7);e.xp=2;e.life=26;
  return e;
}
// Slag offering (Ragnaros' Sons of Flame): crawls from the arena edge straight
// to the rooted furnace, ignoring players entirely — stand in its path and let
// your weapons intercept it, or it feeds the boss.
// v2: a SWARM of them — many, small and soft, pouring in as a clump from one
// edge — so the intercept is a carpet to mow, not three fat bodies to chase.
// Each one heals a sliver (OFFER_HEAL); the clump's total matches the old
// three-offering feed.
const OFFER_HEAL=0.010;
const SHARD_FURY=0.05,SHARD_FURY_CAP=0.75; // P3 shards: +5% boss damage each, capped // ×11 bodies ≈ 11% per fully-missed wave of them
// a swarm from EVERY direction: the bodies are dealt around the whole arena
// rim, spaced along each edge, so the intercept is a sweep of the perimeter
// rather than a clump to stand in front of
function spawnSlagOfferings(k,shard){
  const A=G.arena;if(!A)return [];
  const out=[],per=Math.max(1,Math.ceil(k/4));
  for(let i=0;i<k;i++){
    const side=i%4,j=Math.floor(i/4),t=(j+0.5+(Math.random()-0.5)*0.6)/per; // 0..1 along the edge
    let x,y;
    if(side===0){x=A.x-A.w/2+20;y=A.y-A.h/2+60+t*(A.h-120);}
    else if(side===1){x=A.x+A.w/2-20;y=A.y-A.h/2+60+t*(A.h-120);}
    else if(side===2){x=A.x-A.w/2+60+t*(A.w-120);y=A.y-A.h/2+20;}
    else{x=A.x-A.w/2+60+t*(A.w-120);y=A.y+A.h/2-20;}
    const e=spawnEnemy('swarm',x,y);
    e.spr=slagPupSprite;e.r=3.5;e.scale=0.9;e.hp=11*hpScale();e.maxhp=e.hp;
    e.sp=26+Math.random()*12;e.dmg=0;e.xp=1;e.noTouch=true;e.offering=true;e.life=40;
    if(shard){e.shard=true;e.sp+=10;e.hp*=1.3;e.maxhp=e.hp;e.scale=1.05;}
    addParticles(x,y,shard?VOLC.lava:'#ffd85a',4,70);
    out.push(e);
  }
  return out;
}
const spawnSlagOffering=()=>spawnSlagOfferings(1)[0]||null;
// A boss self-heal written as % of maxhp was tuned when maxhp meant roughly
// d.dur seconds of party dps. Under rush pacing maxhp means rushTTK() seconds,
// so the same pct would heal several times the fight-time it was designed to
// cost — Geminox's siphon regen alone out-healed the whole party. Rescale so
// a heal always costs the seconds it originally cost.
function bossHeal(e,pct){
  // heals are authored as % of max hp against each fight's original ~dur-second
  // pool. Both campaign modes now run fights to a longer target TTK on much
  // bigger pools, so an unscaled drain would out-race the party (Geminox's
  // pylons healed 3× the hp over a 3× longer fight). Scale the % down by
  // designed-dur / target-TTK, exactly as rush always did.
  const ttk=G.mode==='rush'?rushTTK(G.wave)
    :G.mode==='classic'?CLASSIC_TTK[clamp(Math.round(G.wave/5)-1,0,3)]:0;
  const mul=ttk&&e.def?clamp((e.def.dur||100)/ttk,0,1):1;
  e.hp=Math.min(e.maxhp,e.hp+e.maxhp*pct*mul);
}
function armSlam(e,dur,r){
  bossCast(e,'slam','MOLTEN SLAM',dur);
  e.ai.slamR=r;
  pushTel(e,e.x,e.y,r,dur,0.22,'#ff7a1f',slamWarnSprite,null);
  e.ai.telRef=G.fx[G.fx.length-1];
  e.ai.telRef.pct=0; // the boss resolves the hit itself so the safe disc reads correctly
}
function armRing(e,dur,r,dir){
  bossCast(e,'ring',dir<0?'INWARD RING':'CINDER RING',dur);
  e.ai.ringR=r;e.ai.ringDir=dir;
  // the safe disc means it: the boss's body stops biting while it is up
  if(dir>0){pushSafe(e,e.x,e.y,r,dur+0.9,'#eaffff',0);e.ai.ringSafeT=dur+1.0;}
  else inwardTell(e.x,e.y,r,dur); // the tell: a quick harmless ring OUT, then the wall comes IN
  sfx('cinder');
}

// P3 rivers: 2 (3 at 3+ players) erratic strips from the cauldron's centre to
// the arena edges. \`one\` re-carves a single river instead of the whole set.
function slagRivers(e,one){
  const A=G.arena;if(!A)return;
  const a=e.ai,dirs=['n','s','e','w'];
  if(one&&a.rivers.length){
    const r=a.rivers[(Math.random()*a.rivers.length)|0];
    eraseRiver(r.keys);
    r.dir=dirs[(Math.random()*4)|0];
    r.keys=carveRiver(A.x,A.y,r.dir,A,{width:RIVER_W,jitter:0.45});
  }else{
    for(const r of a.rivers)eraseRiver(r.keys);
    a.rivers=[];
    const n=G.players.length>=3?3:2;
    const pick=shuffle(dirs.slice()).slice(0,n);
    pick.forEach((d,i)=>a.rivers.push({dir:d,keys:carveRiver(A.x,A.y,d,A,{quiet:i>0,width:RIVER_W,jitter:0.45})}));
  }
  subFlash('THE FLOOR CRACKS — LAVA RIVERS',2.0);
}
// where should the boss stand so the slam's shove throws \`t\` into lava?
// Score every approach angle by the lava tiles along the ray BEHIND the
// player (opposite the boss); fall back to a straight approach.
function slagPositionForSlam(e,t){
  const A=G.arena;
  let best=null,bs=0;
  for(let i=0;i<12;i++){
    const an=i*TAU/12,dx=Math.cos(an),dy=Math.sin(an);
    let s=0;
    if(G.lava)for(let k=1;k<=5;k++){
      const tx=Math.floor((t.x-dx*k*TILE)/TILE),ty=Math.floor((t.y-dy*k*TILE)/TILE);
      if(G.lava.has(tx+','+ty))s+=6-k;
    }
    const px=t.x+dx*62,py=t.y+dy*62;
    if(A&&(px<A.x-A.w/2+24||px>A.x+A.w/2-24||py<A.y-A.h/2+24||py>A.y+A.h/2-24))continue;
    if(solidAt(px,py))continue;
    s-=Math.hypot(px-e.x,py-e.y)*0.004; // tie-break: the nearer stance
    if(!best||s>bs){bs=s;best={x:px,y:py};}
  }
  return best||{x:t.x,y:t.y};
}

function gxMark(alive,castLen){
  const c=G.cam,reach=castLen*85*0.85,minD=Math.max(45,reach*0.55);
  let best=null,bestS=-1;
  for(let i=0;i<32;i++){
    const x=c.x+(Math.random()-0.5)*(c.w-140),y=c.y+(Math.random()-0.5)*(c.h-120);
    if(solidAt(x,y)||solidAt(x-24,y)||solidAt(x+24,y)||solidAt(x,y-24)||solidAt(x,y+24))continue;
    let far=0,ok=true;
    for(const p of alive){const d=Math.hypot(x-p.x,y-p.y);if(d>reach){ok=false;break;}if(d>far)far=d;}
    if(ok&&far>=minD&&far>bestS){bestS=far;best={x,y};}
  }
  return best||{x:c.x,y:c.y};
}

function nearPillar(x,y,d){

// A baited charge (Sludgefist) grinds a pillar to rubble: the rock tiles open
// up, so line-of-sight mechanics lose a hiding spot for the rest of the fight.
function shatterPillar(q){
  const A=G.arena;if(!A)return;
  const px=Math.round(q.x/TILE)-1,py=Math.round(q.y/TILE)-1;
  const dirty=new Set();
  for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){
    G.tileOverride.set((px+dx)+','+(py+dy),T_GRASS);
    dirty.add(Math.floor((px+dx)/CHUNK)+','+Math.floor((py+dy)/CHUNK));
  }
  for(const k of dirty)chunkCanvases.delete(k);
  const i=A.pillars.indexOf(q);
  if(i>=0)A.pillars.splice(i,1);
  addParticles(q.x,q.y,'#8b929c',26,140);
  addParticles(q.x,q.y,'#ffd23e',12,100);
}


// ---------------- WAVE 20 : THE WORLDEATER ----------------
function weSetPhase(e,ph){
  const i=clamp(ph,1,4)-1;
  e.spr=worldeaterSpr[i];
  e.barCol=WE_TINTS[i];
  G.bossTint=WE_TINTS[i];
  e.ai.pal=i;
}
// the WORLDEATER eats the arena: each phase gate permanently consumes the
// outermost `depth`-tile band into void. Deliberately NOT G.creep — creep is
// Pyraxis's, gets cleared by safes/meltdown and applies a mud slow; the void
// is forever, uncleansable, and does not slow (a slow would stack with the
// maw pull past what a player can out-run). Depth 6 on the smallest arena
// still leaves a ~448×176px safe interior; pillars and the P4 heart ring
// both sit well inside it.
function weDevourEdge(depth){
  const A=G.arena;if(!A)return;
  G.voidTiles=G.voidTiles||new Set();
  const t0x=Math.floor((A.x-A.w/2)/TILE),t1x=Math.floor((A.x+A.w/2)/TILE);
  const t0y=Math.floor((A.y-A.h/2)/TILE),t1y=Math.floor((A.y+A.h/2)/TILE);
  for(let ty=t0y;ty<=t1y;ty++)for(let tx=t0x;tx<=t1x;tx++){
    const d=Math.min(tx-t0x,t1x-tx,ty-t0y,t1y-ty);
    if(d<depth)G.voidTiles.add(tx+','+ty);
  }
}
// COLLAPSING MAW: it inhales — every player is dragged toward the boss while
// a ring collapses inward with a few safe gaps. Pull 68 < player speed 85:
// the pull can be fought radially but not out-sprinted, so the intended play
// is rotating INTO a gap, not racing outward. Movement-based by design —
// spells auto-target, so the players' only lever is where they stand.
function armMaw(e,gaps,opt){
  opt=opt||{};
  const dur=opt.dur||2.6,rmax=opt.rmax||300;
  bossCast(e,'maw','COLLAPSING MAW',dur);
  e.ai.mawPull=dur;e.ai.mawSpd=opt.pull||68;
  pushRing(e,e.x,e.y,{rmax,spd:rmax/dur,dir:-1,gaps,gapW:1.0,pct:0.14,w:12,dur,t:dur,col:'#8a5cff'});
  sfx('gazeopen');subFlash('COLLAPSING MAW — ESCAPE THROUGH A GAP',dur);
}
function armLeap(e,alive,cast,r,rmax,gaps){
  const t=alive[(Math.random()*alive.length)|0];
  if(!t)return;

// ============================================================
// SHARED RAID MECHANICS
// The expanded BOSS RUSH roster adapts twenty classic MMO raid encounters.
// Rather than hand-rolling every fight, they compose these primitives, which
// extend the boss fx vocabulary above:
//   pushSweep   rotating beam        (an eye that never stops turning)
//   pushLine    telegraphed lane     (landslides, cleaves, breath lanes)
//   pushCone    telegraphed cone     (dragon breath)
//   pushWander  roaming hazard       (doomfire trails, twisters)
//   pushEdge    crumbling arena rim  (a platform eating itself)
//   pushPole    polarity charge      (opposite charges must not touch)
//   spawnAdd    generic minion       (whelps, channelers, tentacles)
//   prisonPlayer / shieldBoss / knockPlayer / tickShield
// Every one of them damages through bossHit(), so party-size scaling and the
// hurt throttle behave exactly as they do for the original four bosses.
// ============================================================
function pushSweep(e,x,y,opt){
  G.fx.push(Object.assign({kind:'sweep',ground:1,boss:e||null,x,y,a:0,a0:0,spd:0.7,len:300,
    half:0.18,pct:0.10,tick:0,t:6,dur:6,col:'#ff2d4d'},opt||{}));
}
function pushLine(e,x,y,ang,opt){
  G.fx.push(Object.assign({kind:'line',ground:1,boss:e||null,x,y,ang,len:340,w:44,
    pct:0.20,t:1.6,dur:1.6,col:'#ffb62e',pool:null},opt||{}));
}
function pushCone(e,x,y,ang,opt){
  G.fx.push(Object.assign({kind:'cone',ground:1,boss:e||null,x,y,ang,half:0.5,len:220,
    pct:0.26,t:1.8,dur:1.8,col:'#ff7a1f',pool:null},opt||{}));
}
function pushWander(e,x,y,opt){
  const an=Math.random()*TAU;
  G.fx.push(Object.assign({kind:'wander',ground:1,boss:e||null,x,y,vx:Math.cos(an),vy:Math.sin(an),
    r:26,spd:52,chase:0,pct:0.14,tick:0,t:12,dur:12,col:'#ff5a3d'},opt||{}));
}
function pushEdge(e,x,y,opt){
  G.fx.push(Object.assign({kind:'edge',ground:1,boss:e||null,x,y,r:320,r0:320,r1:150,
    pct:0.07,tick:0,t:30,dur:30,col:'#8a5cff'},opt||{}));
}
function pushPole(e,p,sign,dur){
  G.fx.push({kind:'pole',boss:e||null,p,sign,x:p.x,y:p.y,t:dur,dur});
  p.pole=sign;
}
// a knockback has to respect rock, so it walks out in short collided steps
// a SHOVE you can see: the player slides `dist` px over ~0.28s (decaying),
// through collision, instead of knockPlayer's one-frame step. Slagmaw's slam
// and the bursters throw with this; the boss is the big one.
function shovePlayer(p,ang,dist){
  const T=0.28;
  p.kbx=Math.cos(ang)*dist/T*2.0;p.kby=Math.sin(ang)*dist/T*2.0;p.kbT=T; // ×2.0 with the decay integrates to ~dist
  p.shoveT=0.35;
  addText(p.x,p.y-18,'SHOVED',VOLC.burst);
  addSparkles(p.x,p.y-6,VOLC.burst,6,60);sfx('slam');
}
function knockPlayer(p,ang,dist){
  const step=4,n=Math.max(1,Math.round(dist/step));
  for(let i=0;i<n;i++)moveCollide(p,Math.cos(ang)*step,Math.sin(ang)*step);
  addParticles(p.x,p.y,'#eaffff',6,60);
}
function spawnAdd(o){
  const hp=(o.hp||120)*hpScale();
  const e={type:o.type||'add',def:o.def||null,spr:o.spr,x:o.x,y:o.y,r:o.r||6,
    hp,maxhp:hp,sp:o.sp||0,dmg:addDmg(o.dmg||0),xp:o.xp||4,
    flash:0,fuse:-1,shootT:o.shootT===undefined?999:o.shootT,orbCd:{},slow:1,boss:false,
    noTouch:!!o.noTouch,huntLv:0,hunted:false,life:o.life===undefined?-1:o.life,
    scale:o.scale||1,barCol:o.barCol||null};
  if(o.extra)Object.assign(e,o.extra);
  G.enemies.push(e);
  addParticles(o.x,o.y,o.col||'#d84343',10,80);
  return e;
}
// a shielded boss takes nothing until its channelers are down — the raid has
// to break off and kill adds instead of tunnelling the health bar
function shieldBoss(e,adds,msg){
  e.vulnMul=0;e.shieldAdds=adds;
  flash(msg||'SHIELDED!');
  subFlash('KILL THE CHANNELERS',3);
  sfx('telegraph');
}
function tickShield(e){
  if(!e.shieldAdds)return;
  e.shieldAdds=e.shieldAdds.filter(a=>!a.dead);
  if(e.shieldAdds.length)return;
  e.shieldAdds=null;e.vulnMul=1;
  flash('THE WARD BREAKS');sfx('crack');G.shake=Math.max(G.shake,6);
  addParticles(e.x,e.y,e.barCol||'#eaffff',30,150);
}
// an entombed player cannot move or be healed out — someone has to break the
// tomb, which is why it is a real entity with real hit points
function prisonPlayer(src,p,hp,spr,col){
  if(p.dead||p.prison)return null;
  const pr=spawnAdd({type:'prison',spr,x:p.x,y:p.y,r:9,hp:hp||200,noTouch:true,xp:5,
    col:col||'#7fd8ff',def:PRISON_DEF,extra:{prisoner:p,life:16,tickT:1}});
  p.prison=pr;
  addText(p.x,p.y-16,'ENTOMBED!','#7fd8ff');
  sfx('telegraph');
  return pr;
}
const PRISON_DEF={draw(g,x,y,e){
  const pl=0.5+0.5*Math.sin(G.time*6);
  g.strokeStyle='rgba(234,255,255,'+(0.4+0.3*pl).toFixed(2)+')';g.lineWidth=2;
  g.strokeRect(Math.round(x-9),Math.round(y-11),18,20);
  g.fillStyle='#0b1620';g.fillRect(Math.round(x-8),Math.round(y+9),16,2);
  g.fillStyle='rgba(127,216,255,0.18)';g.fillRect(Math.round(x-8),Math.round(y-10),16,18);
}};
function tickPrisons(dt){
  for(const p of G.players){
    const pr=p.prison;
    if(!pr)continue;
    if(pr.dead||p.dead){
      p.prison=null;
      if(!pr.dead){pr.dead=true;}
      if(!p.dead){addParticles(p.x,p.y,'#eaffff',20,110);sfx('douse');addText(p.x,p.y-16,'FREED!','#57e86b');}
      continue;
    }
    if(pr.carry){p.x=pr.x;p.y=pr.y;}else{pr.x=p.x;pr.y=p.y;}
    pr.tickT-=dt;
    if(pr.tickT<=0){pr.tickT=1;bossHit(p,0.035);}
  }
}

const CLASSIC_BOSSES=[SLAGMAW,GEMINOX,PYRAXIS,WORLDEATER];
// BOSS RUSH order: the roster climbs from single-mechanic checks to the full
// raid encounters, with the original four as the tier capstones.
const RUSH_ROSTER=[
  SLAUGHTERHULK,ROTGRUB,STONEFATHER,EMBERWYRM,VOLTHARN,
  SLAGMAW,
  HIVELORD,GEARWRIGHT,ARCANOMAGUS,TALLYMAN,RIMEFANG,
  GEMINOX,
  UNBLINKING,DOOMBRINGER,EARTHBREAKER,WYRMTIDE,PRISMWARDEN,
  PYRAXIS,
  STARCALLER,FROSTLICH,WARDENOFASH,PALEKING,BLADEDANCER,
  WORLDEATER];
RUSH_ROSTER.forEach((d,i)=>RUSH_WAVES.push({boss:i,dur:d.dur||100}));
const bossRoster=()=>G.mode==='rush'?RUSH_ROSTER:CLASSIC_BOSSES;

function spawnClassicBoss(i){
  const d=bossRoster()[i],a=G.arena,n=Math.max(1,G.players.length);
  // (4n-1)/3: solo 1x, duo 2.33x, trio 3.67x, 4p 5x — deliberately steeper
  // than the ~linear party DPS, because a full couch party also revives, soaks
  // mechanics in parallel and never all dies to one slam. The level term
  // catches over-leveled parties — weapons grow every level-up but boss hp
  // otherwise wouldn't. ~wave+2 is the expected level on pace.
  // the rush hands out levels far faster than classic waves do, and player
  // power outruns the roster's own hp curve — this keeps late fights from
  // melting in twenty seconds while the opening ones drag
  const rushMul=G.mode==='rush'?1+0.10*(G.wave-1):1;
  // hpClassic: the classic campaign prices these four off measured median
  // party dps × CLASSIC_TTK (tools/balance-model.mjs solve); rush keeps the
  // roster hp column — its own measured floor does the adapting there
  const baseHp=(G.mode==='classic'&&d.hpClassic)||d.hp;
  let hp=baseHp*rushMul*((4*n-1)/3)*(1+0.06*Math.max(0,G.level-(2+effWave())));
  // BOSS RUSH pacing: the previous kill measured what the party actually
  // deals; the next boss gets the hp that output — grown by the payout it
  // just banked — needs rushTTK() seconds to chew through. Measured dps
  // already contains the whole roster, so no party multiplier here. The
  // formula above survives as a floor: sandbagging one fight cannot
  // trivialize the next.
  // ttkMul: bosses whose own mechanics stretch the clock (Geminox spends the
  // fight healing through pylons and phase gates) get a smaller pool so the
  // wall-clock fight still lands inside the target band
  if(G.mode==='rush'&&G.lastBossDPS>0)
    hp=Math.max(hp,G.lastBossDPS*rushGrowth(G.wave)*rushTTK(G.wave)*(d.ttkMul||1));
  // classic bosses: priced off the party's FRESH saturated wave-clearing read
  // (G.waveDPS, measured the wave before this fight) — not off the previous
  // boss's fight, whose burst-y TTK made pricing chain-unstable (a 35s lucky
  // boss-1 kill over-priced Geminox into a stall; a slow one melted it).
  // CLASSIC_RHO = measured bossDPS/waveDPS per boss (probe, 2026-08-26,
  // geomean of solo+4p): focus fire and the nearestEnemy boss bias beat
  // travel/overkill losses by different margins per fight length.
  if(G.mode==='classic'&&G.waveDPS>0)
    hp=Math.max(hp,CLASSIC_RHO[i]*G.waveDPS*CLASSIC_TTK[i]*(d.ttkMul||1));
  G.bossDmgAcc=0;G.bossVulnT=0;
  // the roster's dmg column reads as % of the party's max hp: flat damage was
  // obsolete within a few bosses of charm/rally hp growth, and the 12%/6%
  // floors it fell back on erased each boss's identity. bossHit() mechanics
  // were always percentages; now touch and bullets speak the same language.
  const avgMax=G.players.reduce((s,p)=>s+p.maxhp,0)/n;
  const e={
    type:'cboss'+i,def:d,spr:d.spr,x:a?a.x:0,y:a?a.y-a.h*0.22:0,r:d.r,
    hp,maxhp:hp,sp:d.sp,dmg:(d.dmg/100)*avgMax,xp:d.xp,vulnMul:1,
    flash:0,fuse:-1,shootT:2,orbCd:{},slow:1,boss:true,scale:d.scale,
    name:d.name,barCol:d.barCol,phase:1,phaseCount:d.phaseCount,gates:d.gates.slice(),
    castName:null,castP:0,frozen:0,casts:0,huntLv:0,life:-1,ai:d.aiInit()
  };
  if(d===WORLDEATER)weSetPhase(e,1);
  G.enemies.push(e);G.boss=e;G.bossTint=d.barCol;
  sfx('boss');G.shake=8;
  if(d===WORLDEATER){
    // the letterboxed reveal replaces the generic name flash
    G.weSince=G.time;
    sfx('wehorn');setSlow(0.5);G.shake=12;
  }else flash('!! '+d.name+' !!');
  return e;
}

// ============================================================
// WAVE PATTERNS — notebook choreography v1
// Five spawn patterns that give each trash wave an identity. Each is a small
// state machine ticked from the wave machine's 'fight' state; the mobs it
// spawns are ordinary enemies (they count in the on-screen total and must die
// or despawn before the wave clears). Marching mobs carry mvx/mvy/msp, which
// the enemy loop reads in place of player-seeking.
// ============================================================
const jumperSprite=makeSprite([
'..CCC..',
'.CWCWC.',
'.CCCCC.',
'C.CCC.C',
'C.....C'
],{C:'#4ac8d8',W:'#10202a'});
const PATTERN_NAMES={band:'THE BAND',polarity:'POLARITY',swarm:'THE SWARM',jumpers:'JUMPERS',encircle:'THE ENCIRCLE',
  creep:'THE CREEP',dance:'THE DANCE',stonefall:'STONEFALL',collapse:'THE COLLAPSE',wards:'THE WARDS',
  lavamix:'THE LAVA MIX',slugforge:'THE SLUG FORGE',pressure:'VOLCANIC PRESSURE'};
// share of the normal spawn drip a pattern wave keeps — the pattern brings the rest
// terrain waves (v2): the floor is the choreography and the drip is the
// harvest, so they keep most of it — except the creep, whose spores ARE the wave
const PATTERN_QUOTA={band:0.75,polarity:0.65,swarm:0.6,jumpers:0.75,encircle:0.45,
  creep:0.5,dance:0.7,stonefall:0.6,collapse:0.8,wards:0.6,
  lavamix:1.0,slugforge:0.45,pressure:0.8};
// ---- the number spine ----
// Density: counts scale with the party's MEASURED clearing output (G.waveDPS)
// against the output the base counts were tuned at, so every pattern keeps
// its engagement time while the body count climbs — struggling to kill 20 at
// wave 2 and mowing 200 at wave 16 is the progression fantasy, by design.
const REF_DPS=55; // solo wave-2 clearing output baseline (calibrated by sim)
function dpsFactor(){
  const n=Math.max(1,G.players.length);
  const ref=REF_DPS*(0.55+0.45*n);
  return G.waveDPS>0?clamp(G.waveDPS/ref,1,14):1;
}
// XP: budgets are authored in LEVELS (lv:{b,x} on the wave table) and priced
// here at the party's current position, so party size and schedule deficits
// are absorbed by construction.
function lvGems(k,from){
  let L=from!=null?from:G.level+bankedLevels().banked,s=0;
  for(let i=0;i<k;i++)s+=xpNeed(L+i);
  return s;
}
function mixAvgXp(def){
  const m=def.mix||{chaser:1};let s=0,w=0;
  for(const k in m){s+=m[k]*ETYPES[k].xp;w+=m[k];}
  return s/Math.max(0.001,w);
}
// integer gem draw whose expected value spreads the pattern's pool over its
// planned spawn count
function patXp(P){
  if(!P.planned||P.xpPool<=0)return 0;
  const v=P.xpPool/P.planned,f=Math.floor(v);
  return f+(Math.random()<v-f?1:0);
}
function initWavePattern(id,def){
  const d=def.dur,n=Math.max(1,G.players.length),F=dpsFactor();
  const P={id,ei:0,events:[],capBonus:20,F};
  const lv=def.lv||{b:1,x:0};
  const L0=G.level+bankedLevels().banked;
  // base budget minus what the thinned drip already pays with natural mob xp;
  // the execution bonus rides only on earnable pattern kills
  const base=Math.max(0,lvGems(lv.b,L0)-Math.round(G.waveQuota*mixAvgXp(def)));
  const bonus=lvGems(lv.x,L0+lv.b);
  if(id==='band'){
    P.events=[0.12*d,0.45*d,0.75*d];P.capBonus=Math.round(80*Math.min(F,5));
    P.int=Math.max(0.010,0.03/F);
    P.lanes=n; // one torrent per player: a party faces a braid of lanes
    P.planned=Math.round(3*5.0/P.int*1.2*n);
    P.xpPool=base+bonus; // escaped mobs forfeit their share — that IS the skill axis
  }else if(id==='polarity'){
    P.events=[0.15*d];P.capBonus=Math.round(60*Math.min(F,5));
    P.window=d*0.6;
    // influx per second scales with LIVE camera-edge height at spawn time;
    // this rate is per 90px of edge, both sides combined
    P.rate0=Math.min(1.3*F,520/P.window);
    P.planned=Math.round(P.rate0*(G.cam.h/90)*P.window*1.2);
    P.xpPool=base+bonus;
  }else if(id==='swarm'){
    P.events=[0.15*d,0.45*d,0.72*d];P.capBonus=Math.round(170*Math.min(F,6));
    P.burst=Math.round((26+14*n)*F);
    P.trickle=(1.2+2.5*(F-1))*(0.7+0.3*n); // gentle at wave 2, a carpet once output is measured
    // planned counts every xp draw: chaff 1 each, husks 3 each (~1/8 of spawns)
    P.planned=Math.round((3*P.burst+P.trickle*0.7*d)*1.25);
    P.xpPool=base+bonus;
  }else if(id==='jumpers'){
    P.events=[0.12*d,0.40*d,0.66*d];
    P.pack=Math.ceil((2+n)*Math.sqrt(F));
    P.planned=3*P.pack;
    P.xpPool=base+bonus;
  }else if(id==='encircle'){
    P.events=[0.10*d];P.capBonus=Math.round(100*Math.min(F,3));
    P.xpPool=base;   // the wall pays the base level
    P.champXp=bonus; // the champion carries the whole execution jackpot
  }else if(id==='creep'){
    // Pyraxis rehearsal: spores seed a spreading floor; kill them to purge it
    P.events=[0.10*d,0.40*d,0.66*d];
    P.spores=2+2*n;P.sporeList=[];
    P.planned=3*P.spores;
    P.xpPool=base+bonus; // every gem sits on a spore
  }else if(id==='dance'){
    // Rotgrub rehearsal: four lanes erupt in order; the floor kills the drip
    P.events=[0.12*d];P.capBonus=Math.round(60*Math.min(F,4));
    P.planned=0;P.xpPool=0; // no pattern bodies: the drip is the harvest
  }else if(id==='stonefall'){
    // Stonefather rehearsal: boulders fall and become cover; a sniper needs LoS
    P.events=[0.12*d,0.38*d,0.62*d];
    P.rocks=3+2*n;P.snipers=[];P.perDrop=1+Math.floor(n/2);
    P.planned=3*P.perDrop;
    P.xpPool=base+bonus; // the three snipers carry it
  }else if(id==='collapse'){
    // Worldeater rehearsal: the void eats the field inward; every bite
    // brings a burst from the live edge
    P.events=[0.10*d];P.capBonus=Math.round(80*Math.min(F,5));
    P.bites=5;P.burst=Math.round((6+3*n)*Math.min(F,4));
    P.planned=P.bites*P.burst;
    P.xpPool=base+bonus;
  }else if(id==='wards'){
    // Prismwarden rehearsal: stand in your colour when the pulse lands
    // v2: an unkillable beast sheds XP when hit and leaps; its landing is
    // the pulse. Your colour ring is the only refuge.
    P.events=[0.10*d];P.capBonus=Math.round(60*Math.min(F,4));
    P.burst=Math.round((2+n)*Math.min(F,4));
    P.bursts=Math.max(1,Math.floor(d*0.8/9))*P.burst;
    // the pool is split over the chasers AND the ~2 orbs/s a party at the
    // measured DPS sheds off the beast — so orbs stay gem-sized
    P.planned=P.bursts+Math.round(d*0.8*2);
    P.xpPool=base+bonus;
  }else if(id==='lavamix'){
    // Slagmaw rehearsal 1: the drip itself carries the three volcano mobs;
    // any budget the thinned natural xp doesn't cover rides on the drip
    P.events=[0.08*d];P.capBonus=Math.round(50*Math.min(F,4)); // the mix needs bodies on screen to be read
    P.planned=G.waveQuota;P.xpPool=base;P.dripXp=1;P.seen={};
  }else if(id==='slugforge'){
    // Slagmaw rehearsal 2 (the offerings): slug columns march to a forge;
    // every one that arrives is xp the party only gets 40% of back
    // columns end by ~63% so the behemoth gets a real window before it sinks
    // swarm-paced (think wave 15's carpet): a fast, soft flood from every edge
    P.events=[0.05*d,0.08*d,0.22*d,0.36*d];P.capBonus=Math.round(170*Math.min(F,6));
    P.window=d*0.42; // columns done by ~50%: the behemoth gets the back half
    P.rate0=Math.min(1.8*F,640/P.window);
    P.planned=Math.round(P.rate0*(G.cam.h/90)*P.window*1.2);
    P.xpPool=base+bonus;
    P.forge={e:null,heat:0,fedXp:0,st:'idle',heatMax:Math.max(6,Math.round(P.planned*0.45)),orbs:0};
  }else if(id==='pressure'){
    // Slagmaw rehearsal 3 (the rings and the cracked floor): vents fire the
    // honest cinder ring and the inward ring; lava rivers cut the screen
    P.events=[0.06*d];P.capBonus=Math.round(110*Math.min(F,4));
    P.planned=G.waveQuota;P.xpPool=base+bonus;P.dripXp=1; // a thick drip, each body worth little
  }
  return P;
}
// a terrain wave's "arena": the camera window FROZEN at the event, so the
// floor never slides under the party (band tracks the live camera on purpose)
function patField(){
  const c=G.cam,aspect=screenC.width/screenC.height||1.7;
  const w=Math.max(320,c.w),h=w/aspect;
  return {x:c.x,y:c.y,w,h};
}
// pattern-owned tile edits (stonefall boulders); closeArena() sweeps them
function patSetTile(tx,ty,v){
  if(tileAt(tx,ty)===v)return;
  G.tileOverride.set(tx+','+ty,v);
  chunkCanvases.delete(Math.floor(tx/CHUNK)+','+Math.floor(ty/CHUNK));
}
function tickWavePattern(dt,maxAlive){
  const P=G.wavePat;if(!P)return;
  const alive=G.players.filter(p=>!p.dead);
  const room=()=>G.enemies.length<maxAlive+40;
  if(P.ei<P.events.length&&G.waveT>=P.events[P.ei]
     &&!(P.id==='band'&&P.bands)&&!(P.id==='polarity'&&P.pol)){
    P.ei++;
    if(P.id==='band')bandArm(P);
    else if(P.id==='polarity')polarityFire(P,alive);
    else if(P.id==='swarm')swarmBurst(P,room);
    else if(P.id==='jumpers')jumperPack(P,alive,room);
    else if(P.id==='encircle')encircleStart(P,alive);
    else if(P.id==='creep')creepSeed(P,alive,room);
    else if(P.id==='dance')danceStart(P);
    else if(P.id==='stonefall')stonefallDrop(P,alive,room);
    else if(P.id==='collapse')collapseStart(P);
    else if(P.id==='wards')wardsStart(P,alive);
    else if(P.id==='lavamix')lavamixStart(P);
    else if(P.id==='slugforge')slugforgeEvent(P,alive);
    else if(P.id==='pressure')pressureStart(P,alive);
  }
  // the VS carpet: swarm waves also trickle continuously between bursts
  if(P.id==='swarm'&&P.ei>0&&G.waveT<waveDef(G.wave).dur*0.85){
    P.tAcc=(P.tAcc||0)+dt*P.trickle;
    while(P.tAcc>=1){P.tAcc--;if(!room())break;swarmSpawnOne(P);}
  }
  if(P.bands)bandTick(P,dt,room);
  if(P.pol)polarityTick(P,dt);
  if(P.circ)encircleTick(P,dt,alive);
  if(P.id==='creep')creepTick(P,dt,alive);
  if(P.dance)danceTick(P,dt);
  if(P.id==='stonefall')stonefallTick(P,dt,alive);
  if(P.col)collapseTick(P,dt,alive,room);
  if(P.wards)wardsTick(P,dt,alive,room);
  if(P.forge)slugforgeTick(P,dt,alive);
  if(P.pr)pressureTick(P,dt,alive);
  // the floor bites without a boss to bite for it: creep and void DoT live in
  // Pyraxis/Worldeater AI, so a terrain wave ticks its own
  if(!G.boss&&(G.creep||G.voidTiles)){
    P.floorTick=(P.floorTick||0)-dt;
    if(P.floorTick<=0){
      P.floorTick=0.35;
      for(const p of alive){
        const k=Math.floor(p.x/TILE)+','+Math.floor(p.y/TILE);
        if(G.creep&&G.creep.has(k))bossHit(p,0.04);
        if(G.voidTiles&&G.voidTiles.has(k)){bossHit(p,0.05);addParticles(p.x,p.y,'#8a5cff',2,30);}
      }
    }
  }
  if(!G.boss&&G.lava)lavaTick(dt,alive,P);
}
// ================= TERRAIN WAVES (v2) =================
// Each one rehearses a boss floor with the boss's own primitives, so the
// language transfers 1:1. The rule that fixed v1: the intended play must be
// the only HP-safe play AND the fastest xp — never a suggestion.
const sporeSprite=makeSprite([
'...GGG...','..GYYYG..','.GYWYYYG.','GYYYYYYYG','GYYYGYYYG','GYYYYYYYG','.GYYYYYG.','..GGGGG..','..S.S.S..'],
{G:'#3fe05a',Y:'#8fd06a',W:'#eaffd0',S:'#1a3a1c'});
// 6) THE CREEP — spores wander and seed Pyraxis creep around themselves
// (mud slow + DoT). Killing a spore purges ITS patch; the gems are on the
// spores, so hunting them is the farm.
function creepSeed(P,alive,room){
  G.creep=G.creep||new Set();
  for(let i=0;i<P.spores;i++){
    if(!room())break;
    const pt=spawnPoint();if(!pt)continue;
    const e=spawnEnemy('tank',pt.x,pt.y);
    e.spr=sporeSprite;e.scale=1.6;e.r=7;e.sp=16;
    e.hp*=1.6*Math.max(1,P.F*0.5);e.maxhp=e.hp;e.dmg=6*dmgScale();
    e.xp=patXp(P)+patXp(P)+patXp(P);
    e.spore={patch:new Set(),seedT:0.8,turnT:0};
    // a slow wander into the field, not a hunt
    const an=Math.atan2(G.cam.y-pt.y,G.cam.x-pt.x);
    e.msp=16;e.mvx=Math.cos(an);e.mvy=Math.sin(an);
    P.sporeList.push(e);
  }
  if(P.ei===1){flash(PATTERN_NAMES.creep+'!');subFlash('KILL THE SPORES — THEY EAT THE FLOOR',3.2);}
  else flash('MORE SPORES!');
  sfx('telegraph');
}
function creepTick(P,dt,alive){
  if(!G.creep)return;
  const cap=320+90*G.players.length;
  for(const e of P.sporeList){
    const sp=e.spore;
    if(e.dead){
      for(const k of sp.patch)G.creep.delete(k);
      if(sp.patch.size){addParticles(e.x,e.y,'#3fe05a',14,90);addText(e.x,e.y-10,'PURGED','#c8ffd2');}
      sp.patch.clear();continue;
    }
    sp.turnT-=dt;
    if(sp.turnT<=0){sp.turnT=1.5+Math.random()*2;const an=Math.random()*TAU;e.mvx=Math.cos(an);e.mvy=Math.sin(an);}
    // drift back toward the party if it wanders off-screen
    const c=G.cam;
    if(Math.abs(e.x-c.x)>c.w*0.55||Math.abs(e.y-c.y)>c.h*0.55){const an=Math.atan2(c.y-e.y,c.x-e.x);e.mvx=Math.cos(an);e.mvy=Math.sin(an);}
    sp.seedT-=dt;
    if(sp.seedT<=0&&G.creep.size<cap){
      sp.seedT=0.45;
      const tx=Math.floor(e.x/TILE),ty=Math.floor(e.y/TILE),k=tx+','+ty;
      if(!G.creep.has(k)){G.creep.add(k);sp.patch.add(k);}
      // the patch grows from its own edge, Pyraxis-style
      const keys=Array.from(sp.patch);
      for(let i=0;i<4&&keys.length;i++){
        const pr=keys[(Math.random()*keys.length)|0].split(','),d=[[1,0],[-1,0],[0,1],[0,-1]][(Math.random()*4)|0];
        const nk=(+pr[0]+d[0])+','+(+pr[1]+d[1]);
        if(!G.creep.has(nk)&&G.creep.size<cap){G.creep.add(nk);sp.patch.add(nk);}
      }
    }
  }
  P.sporeList=P.sporeList.filter(e=>!e.dead);
  // all spores down and nothing left to purge: the floor heals
  if(!P.sporeList.length&&P.ei>=P.events.length&&G.creep.size===0)G.creep=null;

// Touch it and it bites and shoves you back in; every bite brings a burst.
// The void is the SCREEN's edge, not a place in the world: it follows the
// camera, so the playable area is literally the middle of what you can see

function collapseBite(P,room){

function collapseTick(P,dt,alive,room){

// an orb pops off for every `per` damage, flung 80-200px outward: the loot

function shedOnDamage(e,dmg){

function wardsPlace(P,alive){

  const R=46;
  cols.forEach((col,i)=>{
    let x,y,ok=false;

      // is near the orb skirt, not across the map

  let n=0;
  while(S.chunks>0&&e.hp/e.maxhp<=S.next){
    S.chunks--;S.next-=1/8;
    // cumulative against the pool, so a small pool still pays on later
    // chunks instead of rounding to nothing eight times
    const target=Math.round(S.pool*(8-S.chunks)/8),due=target-S.paid;
    S.paid=target;
    if(due<=0)continue;

    for(let i=0;i<orbs;i++){

      n++;

function encircleStart(P,alive){

  for(const p of alive)far=Math.max(far,Math.hypot(p.x-cx,p.y-cy));

    ch.hp=Math.max(500,(G.waveDPS||120)*6);ch.maxhp=ch.hp;
    ch.dmg*=1.3;ch.xp=P.champXp;ch.champ=1;

  }
  C.pulseT-=dt;
  if(C.lungeT>0)C.lungeT-=dt;
  if(C.pulseT<=0&&C.R>C.Rmin){
    C.pulseT=4.5;C.lungeT=0.9;
    C.R=Math.max(C.Rmin,C.R-C.step);
    G.shake=Math.max(G.shake,5);sfx('slam');
  }
  if(C.R<=C.Rmin)C.minT+=dt;
  let alive_circ=0;
  for(const e of G.enemies){
    if(!e.circ||e.dead)continue;
    alive_circ++;
    const sx=C.cx+Math.cos(e.circAng)*C.R,sy=C.cy+Math.sin(e.circAng)*C.R;
    const d=Math.hypot(sx-e.x,sy-e.y)||1;
    e.mvx=(sx-e.x)/d;e.mvy=(sy-e.y)/d;
    // during the lunge the whole wall dashes to its new slot as one motion
    e.msp=clamp(d*2.2,C.lungeT>0?34:12,80);
  }
  const any=alive_circ>0;
  let out=alive.length>0;
  for(const p of alive)if(dist2(p.x,p.y,C.cx,C.cy)<(C.R+40)*(C.R+40)){out=false;break;}
  C.outT=out?C.outT+dt:0;
  // escaping only breaks the ring if a breach exists (a wall mob died) —
  // kiting around inside an intact wall must not dissolve the pattern
  if(!any||(C.outT>1.5&&alive_circ<C.N)){
    // survivors hunt on foot but dissolve if they never arrive — a broken
    // 60-mob wall must not become a ten-minute mop-up
    for(const e of G.enemies)if(e.circ){e.circ=0;e.msp=undefined;e.life=14;}
    if(any){flash('THE RING BREAKS!');sfx('zap');}
    P.circ=null;
  }
}
// ---------- lucky chest ----------
// A pseudo-random pickup with a VS-chest-style edge pointer. The visible
// machine is identical for every party; the HIDDEN weights shift with
// schedule deficit (the lv budget table IS the schedule) and spawning is
// gated on engagement — it quietly tops up a struggling-but-fighting party
// and never pays AFK. Prizes are XP only: the reward feeds the banked
// counter, it never bypasses the draft.
function schedLevel(){
  let s=1;
  for(let w=1;w<G.wave;w++){
    const d=waveDef(w);
    if(d.lv)s+=d.lv.b;else if(d.boss!==undefined)s+=2;
  }
  return s;
}
function slotDeficit(){return clamp(schedLevel()-(G.level+bankedLevels().banked),0,4);}
function tickSlotChest(dt){
  if(G.mode!=='classic'||G.slotChest||G.reel)return;
  const def=waveDef(G.wave);
  if(def.boss!==undefined||G.waveT<def.dur*0.2||G.waveT>def.dur*0.8)return;
  const engaged=G.killsWave>0.25*Math.max(1,G.waveSpawned);
  const p=0.012+(engaged?0.05*slotDeficit()/4:0); // per second
  if(Math.random()>=dt*p)return;
  const alive=G.players.filter(q=>!q.dead);
  if(!alive.length)return;
  let cx=0,cy=0;
  for(const q of alive){cx+=q.x;cy+=q.y;}
  cx/=alive.length;cy/=alive.length;
  const an=Math.random()*TAU,dd=240+Math.random()*80;
  const x=cx+Math.cos(an)*dd,y=cy+Math.sin(an)*dd;
  if(solidAt(x,y))return;
  G.slotChest={x,y,t:0};
  sfx('crate');
}
function rollSlot(){
  const k=slotDeficit()/4;
  let wJack=0.10+0.20*k;
  const wNice=0.35+0.10*k;
  if(G.lastJack)wJack=0; // no back-to-back jackpots: streaks get screenshotted
  const r=Math.random();
  const tier=r<wJack?2:(r<wJack+wNice?1:0);
  G.lastJack=tier===2;
  return tier;
}
function slotPayout(tier,x,y){
  const total=Math.round(xpNeed()*[0.35,0.8,1.6][tier]);
  const n=8+tier*6,per=Math.max(1,Math.round(total/n));
  for(let i=0;i<n;i++){
    const an=Math.random()*TAU,rr=6+Math.random()*26;
    G.gems.push({x:x+Math.cos(an)*rr,y:y+Math.sin(an)*rr,v:per,t:0});
  }
  flash(tier===2?'JACKPOT!':(tier===1?'LUCKY!':'A FEW GEMS...'));
  sfx(tier===2?'levelup':'pickup');
  addParticles(x,y,'#ffd23e',10+tier*14,120);
}

// world-space pattern visuals, drawn under the enemies
function renderWavePattern(ctx,W2V,vw,vh){
  const P=G.wavePat;
  // the cave mouth the party walks into (and out of)
  if(G.descent){
    const q=W2V(G.descent.mouth.x,G.descent.mouth.y);
    drawSpriteC(ctx,caveMouthSprite,q[0],q[1],2);
  }
  // the forge's heat bar: steel going red as the slugs feed it
  if(P&&P.forge&&P.forge.e&&!P.forge.e.dead&&(P.forge.st==='idle'||P.forge.st==='waking')){
    const Fg=P.forge,q=W2V(Fg.e.x,Fg.e.y),w=56,h=5,k=clamp(Fg.heat/Fg.heatMax,0,1);
    // the glow under it is the heat: grey steel → red-hot
    if(k>0.02){
      const pl=0.8+0.2*Math.sin(G.time*6);
      ctx.fillStyle='rgba(255,'+Math.round(120-90*k)+',40,'+(0.10+0.35*k*pl).toFixed(3)+')';
      ctx.beginPath();ctx.arc(q[0],q[1]+2,18+26*k,0,TAU);ctx.fill();
    }
    ctx.fillStyle='#000';ctx.fillRect(q[0]-w/2-1,q[1]+23,w+2,h+2);
    ctx.fillStyle='#3a3a44';ctx.fillRect(q[0]-w/2,q[1]+24,w,h);
    ctx.fillStyle=k<0.33?'#ff7a1f':(k<0.66?'#ff5a2a':VOLC.lava);ctx.fillRect(q[0]-w/2,q[1]+24,Math.round(w*k),h);
    // tick marks so a quarter-full bar reads as progress, not noise
    ctx.fillStyle='rgba(0,0,0,0.5)';for(let i=1;i<4;i++)ctx.fillRect(q[0]-w/2+Math.round(w*i/4),q[1]+24,1,h);
  }
  // dance strips: infinite along their axis, painted across the whole view;
  // the count-in bar rides from one screen edge to the other and lands with
  // the hit
  for(const f of G.fx){
    if(f.kind!=='strip')continue;
    const rgb=hexRgb(f.col),k=Math.max(0,f.t/f.dur),lock=1-k;
    ctx.save();
    if(f.axis==='v'){
      const xA=W2V(f.coord-f.w/2,0)[0],xB=W2V(f.coord+f.w/2,0)[0];
      ctx.fillStyle='rgba('+rgb+','+(0.12+0.20*lock).toFixed(3)+')';ctx.fillRect(xA,0,xB-xA,vh);
      ctx.strokeStyle='rgba('+rgb+',0.9)';ctx.lineWidth=1;ctx.strokeRect(xA+0.5,0.5,xB-xA-1,vh-1);
      stripes(ctx,xA,0,xB-xA,vh,'rgba('+rgb+',0.35)',G.time);
      ctx.fillStyle=k<0.2?'#ffffff':'rgba('+rgb+',1)';ctx.fillRect(xA,vh*lock-2,xB-xA,4);
    }else{
      const yA=W2V(0,f.coord-f.w/2)[1],yB=W2V(0,f.coord+f.w/2)[1];
      ctx.fillStyle='rgba('+rgb+','+(0.12+0.20*lock).toFixed(3)+')';ctx.fillRect(0,yA,vw,yB-yA);
      ctx.strokeStyle='rgba('+rgb+',0.9)';ctx.lineWidth=1;ctx.strokeRect(0.5,yA+0.5,vw-1,yB-yA-1);
      stripes(ctx,0,yA,vw,yB-yA,'rgba('+rgb+',0.35)',G.time);
      ctx.fillStyle=k<0.2?'#ffffff':'rgba('+rgb+',1)';ctx.fillRect(vw*lock-2,yA,4,yB-yA);
    }
    ctx.restore();
  }
  if(P&&P.bands)for(const b of P.bands){
    // the lane is infinite: paint it across the whole view at its world
    // lateral coordinate; the alert sign hugs the screen edge it pours from
    const warn=b.warnT>0,pl=0.5+0.5*Math.sin(G.time*(warn?6+10*(1-b.warnT/2.5):12));
    ctx.fillStyle='#ff5a3d';ctx.strokeStyle='#ff5a3d';ctx.lineWidth=1;
    if(b.dx){
      const yA=W2V(0,b.coord-b.half)[1],yB=W2V(0,b.coord+b.half)[1];
      ctx.globalAlpha=warn?0.10+0.10*pl:0.14;
      ctx.fillRect(0,yA,vw,yB-yA);
      ctx.globalAlpha=warn?0.5+0.4*pl:0.8;
      ctx.setLineDash([6,6]);
      ctx.beginPath();ctx.moveTo(0,yA);ctx.lineTo(vw,yA);ctx.moveTo(0,yB);ctx.lineTo(vw,yB);ctx.stroke();
    }else{
      const xA=W2V(b.coord-b.half,0)[0],xB=W2V(b.coord+b.half,0)[0];
      ctx.globalAlpha=warn?0.10+0.10*pl:0.14;
      ctx.fillRect(xA,0,xB-xA,vh);
      ctx.globalAlpha=warn?0.5+0.4*pl:0.8;
      ctx.setLineDash([6,6]);
      ctx.beginPath();ctx.moveTo(xA,0);ctx.lineTo(xA,vh);ctx.moveTo(xB,0);ctx.lineTo(xB,vh);ctx.stroke();
    }
    ctx.setLineDash([]);ctx.globalAlpha=1;
    // alert sign anchored to the incoming screen edge, at the lane's height,
    // shaking harder as the alarm accelerates
    const jit=warn?(1-b.warnT/2.5)*3:1;
    let ix,iy;
    if(b.dx){ix=b.dx>0?14:vw-14;iy=clamp(W2V(0,b.coord)[1],16,vh-16);}
    else{iy=b.dy>0?16:vh-16;ix=clamp(W2V(b.coord,0)[0],14,vw-14);}
    const jx=ix+(Math.random()-0.5)*jit,jy=iy+(Math.random()-0.5)*jit;
    ctx.fillStyle=pl>0.5||!warn?'#ffe94a':'#ff5a3d';
    ctx.beginPath();ctx.moveTo(jx,jy-9);ctx.lineTo(jx+8,jy+6);ctx.lineTo(jx-8,jy+6);ctx.closePath();ctx.fill();
    ctx.fillStyle='#1a0f08';ctx.fillRect(Math.round(jx)-1,jy-5,2,6);ctx.fillRect(Math.round(jx)-1,jy+3,2,2);
  }
  // THE COLLAPSE: the void is the screen's own margin
  if(P&&P.col&&P.col.inset>0){
    const C=P.col,f=patField(),cq=W2V(f.x,f.y);
    const hw=f.w*(0.5-C.inset),hh=f.h*(0.5-C.inset);
    const x0=Math.round(cq[0]-hw),x1=Math.round(cq[0]+hw),y0=Math.round(cq[1]-hh),y1=Math.round(cq[1]+hh);
    ctx.fillStyle='rgba(7,4,15,0.72)';
    ctx.fillRect(0,0,vw,y0);ctx.fillRect(0,y1,vw,vh-y1);
    ctx.fillRect(0,y0,x0,y1-y0);ctx.fillRect(x1,y0,vw-x1,y1-y0);
    stripes(ctx,0,0,vw,y0,'rgba(138,92,255,0.18)',G.time);
    stripes(ctx,0,y1,vw,vh-y1,'rgba(138,92,255,0.18)',G.time);
    stripes(ctx,0,y0,x0,y1-y0,'rgba(138,92,255,0.18)',G.time);
    stripes(ctx,x1,y0,vw-x1,y1-y0,'rgba(138,92,255,0.18)',G.time);
    const pl=0.6+0.4*Math.sin(G.time*5);
    ctx.strokeStyle='rgba(138,92,255,'+pl.toFixed(2)+')';ctx.lineWidth=2;
    ctx.strokeRect(x0+1,y0+1,x1-x0-2,y1-y0-2);
    // the next bite, dashed, so the shrink is read before it lands
    if(C.bite<P.bites){
      const k=1-Math.max(0,C.t)/5,ni=Math.min(C.max,C.inset+C.step);
      const nhw=f.w*(0.5-ni),nhh=f.h*(0.5-ni);
      ctx.globalAlpha=0.25+0.5*k;ctx.setLineDash([5,5]);ctx.lineWidth=1;
      ctx.strokeRect(Math.round(cq[0]-nhw),Math.round(cq[1]-nhh),Math.round(nhw*2),Math.round(nhh*2));
      ctx.setLineDash([]);ctx.globalAlpha=1;
    }
  }
  // (the encircle draws nothing: the wall of bodies IS the circle)
  // jumper landing telegraphs
  for(const e of G.enemies){
    if(e.dead||!e.jump)continue;
    const j=e.jump;
    if(j.st!=='tele'&&j.st!=='air')continue;
    const q=W2V(j.lx,j.ly),pr=j.st==='air'?1:1-j.t/0.8;
    ctx.globalAlpha=0.5;
    ctx.strokeStyle='#ff5a3d';ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(q[0],q[1],26,0,TAU);ctx.stroke();
    ctx.globalAlpha=0.25;
    ctx.fillStyle='#ff5a3d';
    ctx.beginPath();ctx.arc(q[0],q[1],26*clamp(pr,0,1),0,TAU);ctx.fill();
    ctx.globalAlpha=1;
  }
}

// ---------- wave machine ----------
function nextWave(){
  G.wave++;
  const def=waveDef(G.wave);
  G.waveState='pre';G.waveT=0;G.cleanT=0;G.waveSpawned=0;G.wavePulses=[];
  G.wavePat=null;
  G.mobDmgAcc=0;G.fightT=0;G.killsWave=0;G.slotChest=null;G.reel=null;
  if(def.boss!==undefined)G.waveQuota=0;
  else{
    const n=Math.max(1,G.players.length);
    G.waveQuota=Math.round(def.n*(0.65+0.35*n));
    // a pattern wave thins the base drip and drops the generic SURGE pulses:
    // the pattern IS the choreography
    if(G.mode==='classic'&&def.pattern){
      G.waveQuota=Math.max(6,Math.round(G.waveQuota*PATTERN_QUOTA[def.pattern]));
      G.wavePat=initWavePattern(def.pattern,def);
    }
    G.waveSpawnGap=(def.dur*0.72)/G.waveQuota;
    G.waveSpawnT=0;
    G.wavePulses=G.wavePat?[]:[0.35,0.70];
  }
  sfx(def.boss!==undefined?'boss':'wavestart');
  G.shake=def.boss!==undefined?6:2;
}
// There is no pathfinding, so a straggler can wedge behind rock forever and hang the wave.
// Escalate: faster, then faster again, then drag it to the party, then dissolve it.
function enrageStragglers(){
  let n=0;
  for(const e of G.enemies){
    if(e.boss||e.shed)continue;
    if(e.circ)continue; // a ring in formation is choreography, not a straggler
    if(e.forge||e.behemoth||e.slug||e.volcano)continue; // the Slagmaw arc's props and marchers
    e.huntLv=(e.huntLv||0)+1;e.hunted=true;e.slow=1;
    if(e.huntLv===1)e.sp*=1.7;
    else if(e.huntLv===2)e.sp*=1.25;
    else if(e.huntLv===3){
      const pt=spawnPoint();
      if(pt){e.x=pt.x;e.y=pt.y;addParticles(e.x,e.y,'#ff3c3c',10,80);}
    }else{
      e.dead=true;
      addParticles(e.x,e.y,'#ff3c3c',10,80);
      dropLoot(e);
      continue;
    }
    addParticles(e.x,e.y,'#ff3c3c',8,60);
    n++;
  }
  if(n){flash('HUNTING THE LAST OF THEM');sfx('zap');}
}
// ---- the cave cutscene: down into the volcano after wave 1, back out after
// Slagmaw. Runs inside the intermission window: the stick is taken over,
// the party walks to a cave mouth, the screen fades, the ground palette
// flips, and the break's loot lands on the far side.
function startCaveWalk(dir){
  const c=G.cam,A=G.arena;
  const side=dir==='down'?1:-1;
  // down: the mouth is off to the right of the camera; up: off the arena's edge
  const mouth={x:(A?A.x:c.x)+side*Math.min(c.w*0.42,(A?A.w:c.w)*0.42),y:A?A.y:c.y};
  G.descent={dir,t:0,walkT:3.4,fadeIn:3.4,hold:4.4,fadeOut:5.2,end:6.2,mouth,flipped:false};
  G.waveState='descent';G.waveT=0;
  // nothing is left behind: every gem on the floor is vacuumed in during the
  // walk (and whatever is still in flight is banked at the blackout)
  G.vacuumT=Math.max(G.vacuumT,4.4);
  flash(dir==='down'?'INTO THE MOUNTAIN':'BACK TO THE SURFACE');
  sfx('telegraph');
}
function interLoot(boss){
  const c=G.cam,alive=Math.max(1,G.players.filter(p=>!p.dead).length);
  for(let i=0;i<alive;i++)G.pickups.push({x:c.x+(Math.random()*90-45),y:c.y+(Math.random()*60-30),type:'heart',t:0});
  G.crates.push({x:c.x+(Math.random()*70-35),y:c.y+(Math.random()*50-25),r:7,hp:12,dead:false});
  if(G.wave%3===0||boss||G.mode==='rush'){
    const t=['speed','regen','maxhp','damage','magnet'];
    const n=G.mode==='rush'?RUSH_CHARMS:(boss?Math.min(2,alive):1);
    for(let i=0;i<n;i++)
      G.pickups.push({x:c.x+(Math.random()*120-60),y:c.y+(Math.random()*80-40),type:t[i%5],t:0});
  }
}
function startIntermission(){
  const boss=isBossWave(G.wave);
  G.waveState='inter';G.waveT=0;G.interLen=G.mode==='rush'?9:(boss?12:8);
  G.wavePat=null;
  const cave=G.mode==='classic'&&(G.wave===1||G.wave===5);
  if(cave)startCaveWalk(G.wave===1?'down':'up');
  closeArena();
  G.crates=G.crates.filter(c=>dist2(c.x,c.y,G.cam.x,G.cam.y)<900*900);
  // hearts, a crate and (every 3rd wave / boss / rush) party-wide charms —
  // see interLoot; the cave walk pays them out on the far side instead
  if(!cave)interLoot(boss);
  // the break before VOLCANIC PRESSURE is the eruption: the ground shakes and
  // the vents rise where the party stands, so the wave opens on top of them
  const nd=G.wave<waveCount()?waveDef(G.wave+1):null;
  if(G.mode==='classic'&&nd&&nd.pattern==='pressure')volcanoesRise();
  if(boss){
    for(const p of G.players){
      if(p.dead){
        p.dead=false;p.hp=p.maxhp*0.6;p.invuln=3;p.reviveP=0;
        addParticles(p.x,p.y,PCOLORS[p.col],24,90);
      }
      p.maxhp+=20;p.hp=p.maxhp;
    }
    flash('THE PARTY RALLIES');
  }
  sfx('levelup');
}
function startOutro(){
  G.waveState='outro';G.waveT=0;
  G.wavePat=null;
  closeArena();
  G.ebullets.length=0;G.enemies.length=0;G.fx=G.fx.filter(f=>!f.boss);
  G.shake=10;sfx('victory');flash('THE HORDE IS BROKEN');
}
function updateClassicWaves(dt){
  G.waveT+=dt;
  const def=waveDef(G.wave),n=Math.max(1,G.players.length);
  const maxAlive=Math.round((26+G.wave*3)*(0.65+0.35*n))+(G.wavePat?G.wavePat.capBonus:0);
  switch(G.waveState){
    case 'pre':
      if(G.waveT>=2.0){
        G.waveT=0;
        if(def.boss!==undefined){openArena();spawnClassicBoss(def.boss);G.waveState='boss';}
        else G.waveState='fight';
      }
      break;
    case 'fight':{
      if(G.enemies.length>=8)G.fightT+=dt; // saturated time — see damageEnemy
      if(G.wavePat)tickWavePattern(dt,maxAlive);
      tickSlotChest(dt);
      if(G.waveSpawned<G.waveQuota&&G.enemies.length<maxAlive){
        G.waveSpawnT-=dt;
        if(G.waveSpawnT<=0){
          G.waveSpawnT=G.waveSpawnGap;
          const pt=spawnPoint();
          if(pt){
            const e=spawnEnemy(pickEnemyType(),pt.x,pt.y,Math.random()<def.elite?2.6:1);G.waveSpawned++;
            // drip-carried patterns (lava mix, pressure) ride their budget on the drip
            if(G.wavePat&&G.wavePat.dripXp)e.xp+=patXp(G.wavePat);
            // the lava mix names each new mob the first time it shows
            if(G.wavePat&&G.wavePat.seen&&LAVAMIX_CALL[e.type]&&!G.wavePat.seen[e.type]){
              G.wavePat.seen[e.type]=1;subFlash(LAVAMIX_CALL[e.type],3.0);
            }
          }
        }
      }
      if(G.wavePulses.length&&G.waveSpawned/Math.max(1,G.waveQuota)>=G.wavePulses[0]){
        G.wavePulses.shift();
        flash('SURGE!');sfx('boss');
        const burst=Math.min(G.waveQuota-G.waveSpawned,Math.round(G.waveQuota*0.18)),type=pickEnemyType();
        for(let i=0;i<burst;i++){
          const pt=spawnPoint();
          if(pt&&G.enemies.length<maxAlive+30){spawnEnemy(Math.random()<0.7?type:pickEnemyType(),pt.x,pt.y,1);G.waveSpawned++;}
        }
      }
      if(G.waveSpawned>=G.waveQuota){
        if(G.enemies.length===0){
          // bank the measured clearing output for next wave's density pricing
          const d=G.mobDmgAcc/Math.max(4,G.fightT);
          if(d>0)G.waveDPS=G.waveDPS?G.waveDPS*0.5+d*0.5:d;
