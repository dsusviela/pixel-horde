  if(isCampaign()&&G.waveState==='fight'){
    for(const e of G.enemies){
      if(!e.hunted)continue;
      const q=W2V(e.x,e.y);
      if(q[0]>=sx&&q[1]>=sy&&q[0]<=sx+w&&q[1]<=sy+h)continue;
      const ax=clamp(q[0],sx+6,sx+w-6),ay=clamp(q[1],sy+6,sy+h-6);
      ctx.fillStyle='#ff3c3c';ctx.fillRect(Math.round(ax)-2,Math.round(ay)-2,4,4);
    }
  }
  // lucky chest, its VS-style edge pointer, and the slot reel
  if(G.slotChest){
    const s=G.slotChest,q=W2V(s.x,s.y);
    const bob=Math.round(Math.sin(s.t*4)*1.5),pl=0.6+0.4*Math.sin(s.t*6);
    ctx.fillStyle='rgba(255,210,62,'+(0.25*pl).toFixed(3)+')';
    ctx.beginPath();ctx.arc(q[0],q[1]-2+bob,10+2*pl,0,TAU);ctx.fill();
    drawSpriteC(ctx,crateSprite,q[0],q[1]+bob);
    ctx.fillStyle='#ffd23e';
    ctx.fillRect(q[0]-1,q[1]-12+bob,3,3);ctx.fillRect(q[0]+1,q[1]-9+bob,1,2);ctx.fillRect(q[0],q[1]-6+bob,1,1);
    if(q[0]<sx+8||q[1]<sy+8||q[0]>sx+w-8||q[1]>sy+h-8){
      const ax=clamp(q[0],sx+10,sx+w-10),ay=clamp(q[1],sy+10,sy+h-10);
      const an=Math.atan2(q[1]-ay,q[0]-ax);
      ctx.save();ctx.translate(ax,ay);ctx.rotate(an);
      ctx.fillStyle=pl>0.8?'#fff2c0':'#ffd23e';
      ctx.beginPath();ctx.moveTo(7,0);ctx.lineTo(-4,-5);ctx.lineTo(-4,5);ctx.closePath();ctx.fill();
      ctx.restore();
    }
  }
  // the cave walk's blackout sits over the world, under the HUD
  if(G.fade>0){ctx.fillStyle='rgba(0,0,0,'+Math.min(1,G.fade).toFixed(3)+')';ctx.fillRect(0,0,vw,vh);}
  blit(sx,sy,w,h);

  // UI pass: window-space coordinates (the exact blitted rect), drawn straight
  // onto the screen canvas at native resolution — text rendered into the
  // low-res buffer and upscaled is unreadable.
  uiBegin(w,h);
  renderPrismFlash(w,h);
  renderWeMood(w,h);
  for(const p of G.players){
    if(!p.dead)continue;
    const q=W2U(p.x,p.y);
    text(sctx,'P'+(p.idx+1),q[0],q[1]-16,7,PCOLORS[p.col],'center');
  }
  for(const t of G.texts){
    const q=W2U(t.x,t.y);
    sctx.globalAlpha=Math.min(1,t.t*2);
    let sz=t.size||7;
    if(t.big){
      // a punch-in on arrival, then settle
      const age=t.dur-t.t;
      if(age<0.12)sz*=1+0.6*(1-age/0.12);
      sctx.font='bold '+sz+'px "Courier New",monospace';sctx.textAlign='center';sctx.textBaseline='top';
      sctx.lineWidth=t.big>1?3:2;sctx.strokeStyle=t.big>1?'#7a1a08':'#2a1408';sctx.lineJoin='round';
      sctx.strokeText(t.str,Math.round(q[0]),Math.round(q[1]));
    }
    text(sctx,t.str,q[0],q[1],sz,t.col,'center');
    sctx.globalAlpha=1;
  }
  renderHUD(w,h);
  if(G.state==='levelup')renderLevelup(w,h);
  if(G.state==='slot')renderSlot(w,h);
  if(G.state==='paused'){
    sctx.fillStyle='rgba(0,0,0,0.5)';sctx.fillRect(0,0,w,h);
    text(sctx,'PAUSED',w/2,h/2-10,20,'#fff','center');
    text(sctx,'PRESS START OR ESC TO RESUME',w/2,h/2+14,8,'#b3a184','center');
  }
  if(G.state==='gameover')renderGameover(w,h);
  if(G.state==='victory')renderVictory(w,h);
  uiEnd();
}
// crop the exact (fractional) camera window out of the stepped buffer and
// stretch it to the screen — this is what makes the zoom continuous
function blit(sx,sy,sw,sh){
  sctx.setTransform(1,0,0,1,0,0);
  sctx.imageSmoothingEnabled=false;
  sctx.drawImage(view,sx,sy,sw,sh,0,0,screenC.width,screenC.height);
}
// Scale the screen context so view-space coordinates land in the same place
// the blitted world does; anything vector (text, bars, boxes) then rasterizes
// at full device resolution instead of view resolution.
function uiBegin(vw,vh){
  sctx.save();
  sctx.setTransform(screenC.width/vw,0,0,screenC.height/vh,0,0);
  sctx.imageSmoothingEnabled=false; // sprites drawn in the UI keep their pixel look
}
function uiEnd(){
  sctx.restore();
}


// ---------- HUD ----------
// The prismatic wash: the screen-level punctuation for spells that deserve one.
// A white bloom over the whole frame plus a few wide prismatic bands sweeping
// across it — the pixel-art stand-in for a bloom pass, since this renderer has
// no additive blending and no shaders. Kept under 22% alpha at full strength so
// it reads as light, never as a whiteout you have to play through.
function renderPrismFlash(vw,vh){
  if(G.pflash<=0.01)return;
  const ctx=sctx,a=G.pflash*G.pflash;
  if(G.pflashCol){
    ctx.fillStyle='rgba('+hexRgb(G.pflashCol)+','+(0.20*a).toFixed(3)+')';
    ctx.fillRect(0,0,vw,vh);
    return;
  }
  ctx.fillStyle='rgba(255,255,255,'+(0.16*a).toFixed(3)+')';
  ctx.fillRect(0,0,vw,vh);
  const band=Math.max(3,vh/7);
  for(let i=0;i<6;i++){
    const y=((G.time*40+i*band*1.7)%(vh+band*2))-band;
    ctx.fillStyle='rgba('+hexRgb(prismCol(i+G.time*4))+','+(0.07*a).toFixed(3)+')';
    ctx.fillRect(0,y,vw,band);
  }
}
// Worldeater atmosphere: a closing dark vignette for the whole fight, a
// letterboxed reveal during the intro, and a red pulse once the enrage clock
// is running. Drawn under the HUD so the readable UI stays clean.
function renderWeMood(vw,vh){
  const b=G.boss;
  if(!b||b.dead||!b.def||b.def.id!=='worldeater')return;
  const ctx=sctx;
  const a=b.ai,k=vw/680;
  const ramp=clamp((G.time-(G.weSince||0))/2.5,0,1);
  const rg=ctx.createRadialGradient(vw/2,vh/2,Math.min(vw,vh)*0.32,vw/2,vh/2,Math.max(vw,vh)*0.62);
  rg.addColorStop(0,'rgba(10,6,20,0)');
  rg.addColorStop(1,'rgba(10,6,20,'+(0.36*ramp).toFixed(3)+')');
  ctx.fillStyle=rg;ctx.fillRect(0,0,vw,vh);
  if(b.phase===4&&a.enrageT<=10){
    const pl=0.5+0.5*Math.sin(G.time*9);
    ctx.fillStyle='rgba(255,30,60,'+(0.05+0.07*pl).toFixed(3)+')';
    ctx.fillRect(0,0,vw,vh);
  }
  if(a.mode==='intro'){
    const p=clamp(1-a.t/2.5,0,1);
    const bh=vh*0.11*Math.min(1,p*3);
    ctx.fillStyle='rgba(0,0,0,0.85)';
    ctx.fillRect(0,0,vw,bh);ctx.fillRect(0,vh-bh,vw,bh);
    ctx.globalAlpha=Math.min(1,p*1.6);
    text(ctx,'THE WORLDEATER',vw/2+2,vh*0.17+2,Math.max(5,Math.round(22*k)),'#1a0f22','center');
    text(ctx,'THE WORLDEATER',vw/2,vh*0.17,Math.max(5,Math.round(22*k)),'#ffb62e','center');
    text(ctx,'THE LAST WALL BETWEEN THE WORLD AND NOTHING',vw/2,vh*0.17+26*k,Math.max(5,Math.round(8*k)),'#b3a184','center');
    ctx.globalAlpha=1;
  }
}
function renderHUD(vw,vh){
  const ctx=sctx; // UI draws on the native-res screen canvas (see uiBegin)
  const k=vw/680; // keep the HUD a constant size on screen as the camera zooms
  const F=s=>Math.max(5,Math.round(s*k));
  for(let i=0;i<G.players.length;i++){
    const p=G.players[i];
    const x=5*k,y=(5+i*17)*k;
    ctx.fillStyle='rgba(26,15,8,0.55)';
    ctx.fillRect(x-1,y-1,104*k,15*k);
    ctx.fillStyle=PCOLORS[p.col];
    ctx.fillRect(x,y,4*k,13*k);
    text(ctx,'P'+(p.idx+1),x+7*k,y+k,F(7),PCOLORS[p.col]);
    if(p.dead)text(ctx,'DOWN',x+24*k,y+k,F(7),'#ff4d6d');
    else{
      ctx.fillStyle='#3a1218';ctx.fillRect(x+24*k,y+2*k,44*k,4*k);
      ctx.fillStyle='#ff4d6d';ctx.fillRect(x+24*k,y+2*k,Math.max(0,44*k*p.hp/p.maxhp),4*k);
    }
    text(ctx,p.kills+'k',x+24*k,y+7*k,F(6),'#b3a184');
    // live DPS (3s window) — the bigger the share of the party's peak, the
    // hotter the colour; peak underneath

// Card text has to live inside its box. The UI font is Courier New bold —
// monospace, advance 0.6em — so a width is just chars*0.6*size and we can fit
// text without touching measureText. Names shrink to one line; descriptions
// wrap, then shrink, then finally ellipsise. Wrap the TRANSLATED string: `tr`
// keys off whole strings, so wrapping first would hand it fragments.
const uiTextW=(str,size)=>str.length*size*0.6;
function wrapText(str,maxW,size){
  const words=String(str).split(' '),lines=[];
  let cur='';
  for(const w of words){
    const t=cur?cur+' '+w:w;
    if(!cur||uiTextW(t,size)<=maxW)cur=t;
    else{lines.push(cur);cur=w;}
  }
  if(cur)lines.push(cur);
  return lines;
}
// wrap at `size`, dropping a point at a time until it fits `maxLines`; if even
// the floor cannot hold it, cut the last line rather than spill out of the card
function fitText(str,maxW,size,maxLines,minSize){
  let s=size,lines=wrapText(str,maxW,s);
  while(lines.length>maxLines&&s>minSize)lines=wrapText(str,maxW,--s);
  if(lines.length>maxLines){
    lines=lines.slice(0,maxLines);
    const last=lines[maxLines-1];
    const room=Math.max(1,Math.floor(maxW/(s*0.6))-1);
    lines[maxLines-1]=(last.length>room?last.slice(0,room):last)+'…';
  }
  return {lines,size:s};
}

function renderLevelup(vw,vh){

function runGrade(){

    text(ctx,'WIPED ON BOSS '+G.wave+' / '+waveCount()+'    '+G.bossKills+' DOWN    '+G.kills+' KILLS',vw/2,vh*0.14+30*k,F(9),'#fff','center');
  else if(G.mode==='classic')
    text(ctx,'WIPED ON WAVE '+G.wave+' / 20    '+G.bossKills+'/4 BOSSES    '+G.kills+' KILLS',vw/2,vh*0.14+30*k,F(9),'#fff','center');
  else
    text(ctx,'SURVIVED  '+fmtTime(G.overSince)+'    LEVEL '+G.level+'    '+G.kills+' KILLS',vw/2,vh*0.14+30*k,F(9),'#fff','center');
  const y0=vh*0.14+52*k;
  G.players.forEach((p,i)=>{
    const y=y0+i*16*k;
    ctx.fillStyle=PCOLORS[p.col];ctx.fillRect(vw/2-110*k,y+k,5*k,10*k);
    text(ctx,'P'+(p.idx+1),vw/2-100*k,y,F(8),PCOLORS[p.col]);
    text(ctx,p.kills+' kills',vw/2-60*k,y,F(8),'#fff');
    text(ctx,p.revives+' revives',vw/2+10*k,y,F(8),'#57e86b');
    text(ctx,Object.keys(p.weapons).length+' weapons',vw/2+75*k,y,F(8),'#b3a184');
  });
  renderBuffSummary(vw/2-110*k,y0+G.players.length*16*k+10*k,k,F);
  if(Math.floor(performance.now()/400)%2===0)
    text(ctx,'(START/ESC) RUN IT BACK     (BACK/BACKSPACE) TITLE',vw/2,vh*0.8,F(10),'#ffe94a','center');
}
// Live controller roster: every failure mode of "my pad doesn't work" used to be
// invisible. Now the menus show exactly what the browser sees, per pad.
function renderPadRoster(vw,vh){
  const ctx=sctx,k=vw/680,F=s=>Math.max(5,Math.round(s*k));
  const pads=pollPads(),x=vw-6*k;
  let y=6*k,anyNonStd=false,realPads=0;
  text(ctx,'CONTROLLERS',x,y,F(7),'#b3a184','right');y+=9*k;
  for(const p of pads){
    let label;
    if(p.index===KB_INDEX)label='KEYBOARD';
    else{
      realPads++;label='PAD '+(p.index+1);
      if(p.mapping!=='standard'){label+=' !';anyNonStd=true;}
    }
    const pl=G.players.find(q=>q.padIndex===p.index);
    const st=pl?('JOINED AS P'+(pl.idx+1)):(p.index===KB_INDEX?'SPACE TO JOIN':'(A) TO JOIN');
    text(ctx,label+' — '+st,x,y,F(6),pl?PCOLORS[pl.col]:'rgba(255,255,255,0.6)','right');
    y+=8*k;
    // live readout while a button/stick is held on an unjoined pad: shows the
    // raw indices the browser reports, so a scrambled pad debugs itself
    // (index jargon, deliberately untranslated)
    if(!pl&&p.index!==KB_INDEX){
      const act=[];
      for(let i=0;i<p.buttons.length;i++)if(p.buttons[i]&&p.buttons[i].pressed)act.push('B'+i);
      for(let i=0;i<p.axes.length;i++)if(Math.abs(p.axes[i])>0.45)act.push('AX'+i);
      if(act.length){text(ctx,'SEES: '+act.slice(0,6).join(' '),x,y,F(6),'#57e86b','right');y+=8*k;}
    }
  }
  if(!realPads){text(ctx,'NO GAMEPADS SEEN — PRESS A BUTTON ON EACH PAD',x,y,F(6),'#ff9040','right');y+=8*k;}
  // localhost is a secure context, a plain-http LAN/tailnet IP is not — and
  // browsers increasingly hide the Gamepad API on insecure pages
  if(!realPads&&!window.isSecureContext){
    text(ctx,'PAGE IS PLAIN HTTP — THIS BROWSER MAY HIDE GAMEPADS',x,y,F(6),'#ff4d6d','right');y+=8*k;
    text(ctx,'SERVE OVER HTTPS OR OPEN THE FILE LOCALLY',x,y,F(6),'#ff4d6d','right');y+=8*k;
  }
  if(anyNonStd)text(ctx,'! ODD MAPPING — IF (A) FAILS, TRY ANY BUTTON',x,y,F(6),'#ff9040','right');
}
// Browsers only start audio after a mouse/keyboard gesture — a controllers-only
// couch session is silent until someone clicks once. Say so instead of hiding it.
function renderSoundHint(vw,vh){
  if(audioLive())return;
  const ctx=sctx,k=vw/680,F=s=>Math.max(5,Math.round(s*k));

  text(ctx,'SOUND IS OFF — CLICK THE PAGE OR TAP ANY KEY ONCE',5*k,vh-11*k,F(6),on?'#ff9040':'rgba(255,144,64,0.55)');
}

    text(ctx,'PRESS (A) OR SPACE TO START',vw/2,vh*0.86,F(11),'#57e86b','center');
  text(ctx,LANG==='es'?'IDIOMA: ESPAÑOL — (BACK) O TECLA L PARA CAMBIAR':'LANGUAGE: ENGLISH — (BACK) OR L KEY TO SWITCH',
    vw/2,vh*0.80,F(7),'#b3a184','center');
  text(ctx,'controllers: press any button so the browser detects them — no pad? play on the keyboard',vw/2,vh*0.93,F(6),'rgba(255,255,255,0.35)','center');
}
function renderModeSelect(vw,vh){
  const ctx=sctx; // UI draws on the native-res screen canvas (see uiBegin)
  const k=vw/680,F=s=>Math.max(5,Math.round(s*k));
  ctx.fillStyle='rgba(12,7,18,0.72)';ctx.fillRect(0,0,vw,vh);
  text(ctx,'CHOOSE YOUR QUEST',vw/2,vh*0.16,F(16),'#ffe94a','center');
  const defs=[
    {icon:classicIcon,name:'CLASSIC',sub:'20 WAVES / 4 BOSSES',col:'#ffd23e',
     lines:['a finite raid','boss every 5 waves','breathers between waves','clear wave 20 to WIN']},
    {icon:endlessIcon,name:'ENDLESS',sub:'SURVIVE FOREVER',col:'#39d5ff',
     lines:['the original horde','ramps with the clock','bosses every ~3 min','no win, only time']},
    {icon:rushIcon,name:'BOSS RUSH',sub:'24 BOSSES, BACK TO BACK',col:'#ff4d6d',
     lines:['every raid boss, back to back','no trash, no farming','each kill drops its spell','pure mechanics check']}];
  // three cards now, so they get narrower rather than wider than the screen
  const cw=Math.min(132*k,(vw-40*k-2*14*k)/defs.length),ch=86*k,gap=14*k,y=vh*0.34;
  defs.forEach((d,i)=>{
    const x=vw/2-(cw*defs.length+gap*(defs.length-1))/2+i*(cw+gap),sel=G.modeSel===i;
    ctx.fillStyle=sel?'rgba(255,233,74,0.14)':'rgba(255,255,255,0.05)';
    ctx.fillRect(x,y,cw,ch);
    ctx.strokeStyle=sel?d.col:'#333c46';ctx.lineWidth=sel?2:1;
    ctx.strokeRect(x+0.5,y+0.5,cw-1,ch-1);
    drawSpriteC(ctx,d.icon,x+cw/2,y+16*k,2*k);
    text(ctx,d.name,x+cw/2,y+30*k,F(11),d.col,'center');
    text(ctx,d.sub,x+cw/2,y+43*k,F(6),'#b3a184','center');
    d.lines.forEach((l,j)=>text(ctx,'- '+l,x+8*k,y+54*k+j*8*k,F(6),'#d8c9a3'));
    if(sel&&Math.floor(performance.now()/300)%2===0)text(ctx,'>',x-9*k,y+ch/2-6*k,F(12),d.col,'center');
  });
  // BOSS RUSH: the starting-boss picker sits under the cards
  if(G.modeSel===2){
    const S=clamp(G.rushStart||1,1,RUSH_WAVES.length),bd=RUSH_ROSTER[S-1],yb=y+ch+10*k;
    text(ctx,'START AT BOSS  < '+S+'/'+RUSH_WAVES.length+' — '+bd.name+' >',vw/2,yb,F(8),S>1?'#ff4d6d':'#d8c9a3','center');
    text(ctx,S>1?'GEARED AS IF THE FIRST '+(S-1)+' WERE ALREADY DOWN':'LB/RB OR Q/E: START DEEPER IN THE ROSTER',
      vw/2,yb+11*k,F(6),'#b3a184','center');
  }
  // the party, wearing their chosen colours
  const t=performance.now()/1000,n=G.players.length;
  G.players.forEach((p,i)=>{
    const x=vw/2-(n-1)*24*k+i*48*k,py=vh*0.68+Math.sin(t*2+i)*2*k;
    drawSpriteC(ctx,playerSprites[p.col],x,py,2*k);
    text(ctx,'P'+(p.idx+1),x,py+14*k,F(7),PCOLORS[p.col],'center');
  });
  text(ctx,'LEFT/RIGHT: choose   UP/DOWN: your color   (A)/SPACE: start   (B)/BACKSPACE: back',vw/2,vh*0.80,F(7),'#b3a184','center');
  text(ctx,'FRIENDS: PRESS (A) TO DROP IN  ('+G.players.length+'/4)',vw/2,vh*0.87,F(7),'#57e86b','center');
}

// ---------- main loop ----------
let last=performance.now();
let slowT=0; // brief slow-motion for big moments (phase breaks, boss deaths)
function setSlow(t){slowT=Math.max(slowT,t);}
// dev frame-pacing overlay, open the game with ?perf — real jank (GC pauses,
// raster, vsync misses) only exists in-browser; headless probes can't see it
const PERF_HUD=/[?&]perf/.test(location.search);
const perfS={hist:new Float32Array(120),i:0,longs:[]};
function drawPerfHud(raw,up,rd){
  const s=perfS;
  s.hist[s.i%120]=raw;s.i++;
  const t=performance.now();
  if(raw>20)s.longs.push(t);
  while(s.longs.length&&t-s.longs[0]>5000)s.longs.shift();
  const n=Math.min(120,s.i);
  let sum=0,worst=0;
  for(let i=0;i<n;i++){sum+=s.hist[i];if(s.hist[i]>worst)worst=s.hist[i];}
  const g=screenC.getContext('2d');
  g.save();g.setTransform(1,0,0,1,0,0);
  g.fillStyle='rgba(0,0,0,0.55)';g.fillRect(4,4,196,66);
  g.font='10px monospace';
  g.fillStyle='#8f8';
  g.fillText((1000/(sum/n)).toFixed(0)+' fps   avg '+(sum/n).toFixed(1)+'ms',10,16);
  g.fillStyle=worst>25?'#f66':'#cc8';
  g.fillText('worst '+worst.toFixed(1)+'ms   >20ms: '+s.longs.length+' in 5s',10,28);
  g.fillStyle='#8cf';
  g.fillText('sim '+up.toFixed(1)+'ms  draw '+rd.toFixed(1)+'ms',10,40);
  g.fillText('e:'+G.enemies.length+' b:'+G.bullets.length+' pt:'+G.particles.length+' fx:'+G.fx.length,10,52);
  // 2-second sparkline, 1px per frame, 20ms = full bar
  g.fillStyle='#6d6';
  for(let i=0;i<n;i++){
    const v=s.hist[(s.i-n+i+120)%120],h=Math.min(12,v*0.6);
    if(v>20)g.fillStyle='#f66';
    g.fillRect(10+i,64-h,1,h);
    if(v>20)g.fillStyle='#6d6';
  }
  g.restore();
}
function frame(now){
  const rawMs=now-last;
  let dt=Math.min(0.033,rawMs/1000);
  last=now;
  if(slowT>0){slowT-=dt;dt*=0.30;}
  // online guests never simulate: net.js patches G from host snapshots (inert when NET is off)
  if(typeof NET!=='undefined'&&NET.guestFrame&&NET.guestFrame(dt)){render();requestAnimationFrame(frame);return;}
  const t0=PERF_HUD?performance.now():0;
  update(dt);
  if(G.state!=='title'&&G.state!=='modesel')updateCamera(dt);
  const t1=PERF_HUD?performance.now():0;
  render();
  if(PERF_HUD)drawPerfHud(rawMs,t1-t0,performance.now()-t1);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

</script>
