const CLASSIC_BOSSES=[SLAGMAW,GEMINOX,PYRAXIS,WORLDEATER];

function spawnClassicBoss(i){
  const d=CLASSIC_BOSSES[i],a=G.arena,n=Math.max(1,G.players.length);
  // (4n-1)/3: solo 1x, duo 2.33x, trio 3.67x, 4p 5x — deliberately steeper
  // than the ~linear party DPS, because a full couch party also revives, soaks
  // mechanics in parallel and never all dies to one slam. The level term
  // catches over-leveled parties — weapons grow every level-up but boss hp
  // otherwise wouldn't. ~wave+2 is the expected level on pace.
  const hp=d.hp*((4*n-1)/3)*(1+0.06*Math.max(0,G.level-(2+G.wave)));
  const e={
    type:'cboss'+i,def:d,spr:d.spr,x:a?a.x:0,y:a?a.y-a.h*0.22:0,r:d.r,
    hp,maxhp:hp,sp:d.sp,dmg:d.dmg*dmgScale(),xp:d.xp,vulnMul:1,
    flash:0,fuse:-1,shootT:2,orbCd:{},slow:1,boss:true,scale:d.scale,
    name:d.name,barCol:d.barCol,phase:1,phaseCount:d.phaseCount,gates:d.gates.slice(),
    castName:null,castP:0,frozen:0,casts:0,huntLv:0,life:-1,ai:d.aiInit()
  };
  if(d===WORLDEATER)weSetPhase(e,1);
  G.enemies.push(e);G.boss=e;G.bossTint=d.barCol;
  sfx('boss');G.shake=8;
  if(d===WORLDEATER){
    // the letterboxed reveal replaces the generic name flash
    G.weSince=G.time;
    sfx('wehorn');setSlow(0.5);G.shake=12;
  }else flash('!! '+d.name+' !!');
  return e;
}

// ---------- wave machine ----------
function nextWave(){
  G.wave++;
  const def=waveDef(G.wave);
  G.waveState='pre';G.waveT=0;G.cleanT=0;G.waveSpawned=0;G.wavePulses=[];
  if(def.boss!==undefined)G.waveQuota=0;
  else{
    const n=Math.max(1,G.players.length);
    G.waveQuota=Math.round(def.n*(0.65+0.35*n));
    G.waveSpawnGap=(def.dur*0.72)/G.waveQuota;
    G.waveSpawnT=0;
    G.wavePulses=[0.35,0.70];
  }
  sfx(def.boss!==undefined?'boss':'wavestart');
  G.shake=def.boss!==undefined?6:2;
}
// There is no pathfinding, so a straggler can wedge behind rock forever and hang the wave.
// Escalate: faster, then faster again, then drag it to the party, then dissolve it.
function enrageStragglers(){
  let n=0;
  for(const e of G.enemies){
    if(e.boss)continue;
    e.huntLv=(e.huntLv||0)+1;e.hunted=true;e.slow=1;
    if(e.huntLv===1)e.sp*=1.7;
    else if(e.huntLv===2)e.sp*=1.25;
    else if(e.huntLv===3){
      const pt=spawnPoint();
      if(pt){e.x=pt.x;e.y=pt.y;addParticles(e.x,e.y,'#ff3c3c',10,80);}
    }else{
      e.dead=true;
      addParticles(e.x,e.y,'#ff3c3c',10,80);
      dropLoot(e);
      continue;
    }
    addParticles(e.x,e.y,'#ff3c3c',8,60);
    n++;
  }
  if(n){flash('HUNTING THE LAST OF THEM');sfx('zap');}
}
function startIntermission(){
  const boss=isBossWave(G.wave);
  G.waveState='inter';G.waveT=0;G.interLen=boss?12:8;
  closeArena();
  G.crates=G.crates.filter(c=>dist2(c.x,c.y,G.cam.x,G.cam.y)<900*900);
  const c=G.cam,alive=Math.max(1,G.players.filter(p=>!p.dead).length);
  for(let i=0;i<alive;i++)G.pickups.push({x:c.x+(Math.random()*90-45),y:c.y+(Math.random()*60-30),type:'heart',t:0});
  G.crates.push({x:c.x+(Math.random()*70-35),y:c.y+(Math.random()*50-25),r:7,hp:12,dead:false});
  if(G.wave%3===0||boss){
    const t=['speed','regen','maxhp','damage','magnet'];
    // party-wide charms: flat count, never one per player (see dropLoot)
    for(let i=0;i<(boss?Math.min(2,alive):1);i++)
      G.pickups.push({x:c.x+(Math.random()*80-40),y:c.y+(Math.random()*60-30),type:t[(Math.random()*5)|0],t:0});
  }
  if(boss){
    for(const p of G.players){
      if(p.dead){
        p.dead=false;p.hp=p.maxhp*0.6;p.invuln=3;p.reviveP=0;
        addParticles(p.x,p.y,PCOLORS[p.col],24,90);
      }
      p.maxhp+=20;p.hp=p.maxhp;
    }
    flash('THE PARTY RALLIES');
  }
  sfx('levelup');
}
function startOutro(){
  G.waveState='outro';G.waveT=0;
  closeArena();
  G.ebullets.length=0;G.enemies.length=0;G.fx=G.fx.filter(f=>!f.boss);
  G.shake=10;sfx('victory');flash('THE HORDE IS BROKEN');
}
function updateClassicWaves(dt){
  G.waveT+=dt;
  const def=waveDef(G.wave),n=Math.max(1,G.players.length);
  const maxAlive=Math.round((26+G.wave*3)*(0.65+0.35*n));
  switch(G.waveState){
    case 'pre':
      if(G.waveT>=2.0){
        G.waveT=0;
        if(def.boss!==undefined){openArena();spawnClassicBoss(def.boss);G.waveState='boss';}
        else G.waveState='fight';
      }
      break;
    case 'fight':{
      if(G.waveSpawned<G.waveQuota&&G.enemies.length<maxAlive){
        G.waveSpawnT-=dt;
        if(G.waveSpawnT<=0){
          G.waveSpawnT=G.waveSpawnGap;
          const pt=spawnPoint();
          if(pt){spawnEnemy(pickEnemyType(),pt.x,pt.y,Math.random()<def.elite?2.6:1);G.waveSpawned++;}
        }
      }
      if(G.wavePulses.length&&G.waveSpawned/Math.max(1,G.waveQuota)>=G.wavePulses[0]){
        G.wavePulses.shift();
        flash('SURGE!');sfx('boss');
        const burst=Math.min(G.waveQuota-G.waveSpawned,Math.round(G.waveQuota*0.18)),type=pickEnemyType();
        for(let i=0;i<burst;i++){
          const pt=spawnPoint();
          if(pt&&G.enemies.length<maxAlive+30){spawnEnemy(Math.random()<0.7?type:pickEnemyType(),pt.x,pt.y,1);G.waveSpawned++;}
        }
      }
      if(G.waveSpawned>=G.waveQuota){
        if(G.enemies.length===0){G.waveState='clear';G.waveT=0;G.cleanT=0;sfx('wavecomplete');}
        else{G.cleanT+=dt;if(G.cleanT>8){G.cleanT=0;enrageStragglers();}}
      }
      break;}
    case 'boss':
      holdArena(dt);
      if(!G.boss||G.boss.dead){G.waveState='clear';G.waveT=0;}
      break;
    case 'clear':
      if(G.waveT>=2.5){if(G.wave>=20)startOutro();else startIntermission();}
      break;
    case 'inter':
      for(const p of G.players){
        if(p.dead)continue;
        p.hp=Math.min(p.maxhp,p.hp+p.maxhp*0.25/G.interLen*dt);
      }
      if(G.waveT>=G.interLen)nextWave();
      break;
    case 'outro':
      if(G.waveT>=4.0){G.state='victory';G.overSince=G.time;recordRun('victory');}
      else if(Math.random()<0.5){
        const c=G.cam;
        addParticles(c.x+(Math.random()-0.5)*c.w*0.8,c.y+(Math.random()-0.5)*c.h*0.6,
          ['#ffd23e','#57e86b','#39d5ff','#ff6bd6'][(Math.random()*4)|0],14,120);
      }
      break;
  }
}


// ============================================================
// UPDATE
// ============================================================
function update(dt){
  const pads=pollPads();

  if(G.state==='title'){
    for(const pad of pads){
      // language toggle: BACK/SELECT on a pad, or L on the keyboard. Keyboard
      // Backspace maps to buttons 1 AND 8 — the `continue` keeps that press
      // from also joining via the forgiving join buttons.
      if(pressed(pad,8)||pressed(pad,20)){setLang(LANG==='es'?'en':'es');sfx('select');continue;}
      const jb=joinPressed(pad);
      if(jb>=0){joinPlayer(pad.index,jb);if(G.players.length===1)G.state='modesel';}
    }
    storePadStates(pads);return;
  }
  if(G.state==='modesel'){
    for(const pad of pads){
      const pl=G.players.find(p=>p.padIndex===pad.index);
      if(!pl){const jb=joinPressed(pad);if(jb>=0)joinPlayer(pad.index,jb);continue;}
      const nx=navX(pad);
      if(nx){G.modeSel=clamp(G.modeSel+nx,0,1);sfx('select');}
      // up/down cycles this player's colour, skipping swatches already worn
      const ny=navY(pad);
      if(ny){
        const used=new Set(G.players.filter(q=>q!==pl).map(q=>q.col));
        let c=pl.col;
        for(let i=0;i<PCOLORS.length;i++){c=(c+ny+PCOLORS.length)%PCOLORS.length;if(!used.has(c))break;}
        pl.col=c;
        try{localStorage.setItem('ph_col_'+pad.index,c);}catch(err){}
        sfx('select');
      }
      // the button that joined this pad stays ACCEPT here — on a Switch-layout
      // pad that's button 1, which would otherwise read as B/back below
      if(pressed(pad,0)||pressed(pad,pl.joinBtn)){storePadStates(pads);startRun(G.modeSel===0?'classic':'endless');return;}
      if(pressed(pad,1)||pressed(pad,8)){G.players=[];G.state='title';}
    }
    storePadStates(pads);return;
  }
  if(G.state==='gameover'||G.state==='victory'){
    for(const pad of pads){
      if(pressed(pad,9)){storePadStates(pads);resetRun();return;}
      if(pressed(pad,8)){storePadStates(pads);G.players=[];G.state='title';return;}
    }
    storePadStates(pads);return;
  }
  if(G.state==='paused'){
    for(const pad of pads)if(pressed(pad,9))G.state='play';
    storePadStates(pads);return;
  }
  if(G.state==='levelup'){
    G.levelupT+=dt;
    for(const pick of G.levelupPicks){
      const pad=pads.find(x=>x.index===pick.p.padIndex);
      if(pick.done)continue;
      // a pad that vanished (dead battery) does not burn its pick — it auto-takes after a grace period
      if(!pad){
        if(G.levelupT>6){pick.done=true;applyOffer(pick.p,pick.offers[pick.sel]);}
        continue;
      }
      const nx=navX(pad);
      if(nx){pick.sel=clamp(pick.sel+nx,0,2);sfx('select');}
      if(confirmPressed(pad)){pick.done=true;applyOffer(pick.p,pick.offers[pick.sel]);sfx('pickup');}
    }
    // nobody can hold the party hostage: after 12s the highlighted card is taken for them
    if(G.levelupT>12)for(const pick of G.levelupPicks)if(!pick.done){pick.done=true;applyOffer(pick.p,pick.offers[pick.sel]);}
    storePadStates(pads);
    if(G.levelupPicks.every(x=>x.done))finishLevelup();
    return;
  }

  // ---- playing ----
  for(const pad of pads){
    if(!G.players.some(p=>p.padIndex===pad.index)){
      const jb=joinPressed(pad);
      if(jb>=0)joinPlayer(pad.index,jb);
    }else if(pressed(pad,9)){G.state='paused';storePadStates(pads);return;}
  }

  G.time+=dt;
  if(G.flashT>0)G.flashT-=dt;
  if(G.subFlashT>0)G.subFlashT-=dt;
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*14);

  for(let i=G.timers.length-1;i>=0;i--){
    const t=G.timers[i];
    t.t-=dt;
    if(t.t<=0){G.timers.splice(i,1);try{t.fn();}catch(err){}}
  }

  rebuildGrid();
  const alive=G.players.filter(p=>!p.dead);

  // ---- players ----
  for(const p of G.players){
    if(p.hurtCd>0)p.hurtCd-=dt;
    if(p.invuln>0)p.invuln-=dt;
    if(p.flash>0)p.flash-=dt;
    if(p.dead)continue;

    const pad=pads.find(x=>x.index===p.padIndex);
    let mx=0,my=0;
    if(pad){const s=stick(pad);mx=s.x;my=s.y;}
    if(mx||my){p.faceX=mx;p.faceY=my;p.anim+=dt*8;}
    let sp=p.speed*p.speedMul;
    const hz=hazardAt(p.x,p.y);
    if(hz==='mud')sp*=0.55;
    if(hz==='acid'&&p.invuln<=0){
      p.acidT+=dt;
      if(p.acidT>0.25){p.acidT=0;p.hp-=3;p.flash=0.1;sfx('hit');addParticles(p.x,p.y,'#8a5cff',3,40);if(p.hp<=0)killPlayer(p);}
    }else p.acidT=0;
    if(p.dead)continue;
    moveCollide(p,mx*sp*dt,my*sp*dt);

    // hard leash to camera, then never leave them buried in rock
    const c=G.cam;
    p.x=clamp(p.x,c.x-c.w/2+8,c.x+c.w/2-8);
    p.y=clamp(p.y,c.y-c.h/2+10,c.y+c.h/2-6);
    unstick(p);

    if(p.regen>0)p.hp=Math.min(p.maxhp,p.hp+p.regen*dt);
    for(const id in p.weapons)fireWeapon(p,id,p.weapons[id],dt);

    queryEnemies(p.x,p.y,44,e=>{
      const rr=e.r+p.r;
      if(dist2(p.x,p.y,e.x,e.y)<rr*rr){
        if(e.type==='bomber'){if(e.fuse<0)e.fuse=0.6;}
        // hugging a boss floors at 12% maxhp per tick for the same reason as
        // the bullet floor: flat touch dmg can't keep up with charm-fed hp
        else if(!e.noTouch&&!(e.boss&&e.def&&e.def===WORLDEATER&&e.phase===4))
          hurtPlayer(p,e.boss?Math.max(e.dmg,p.maxhp*0.12):e.dmg);
      }
    });
  }

  // ---- revive ----
  for(const dp of G.players){
    if(!dp.dead)continue;
    let helper=null;
    for(const p of G.players){
      if(p.dead)continue;
      if(dist2(p.x,p.y,dp.x,dp.y)<20*20){helper=p;break;}
    }
    if(helper){
      dp.reviveP+=dt/3;
      if(dp.reviveP>=1){
        dp.dead=false;dp.hp=dp.maxhp*0.5;dp.invuln=2;dp.reviveP=0;
        helper.revives++;
        sfx('revive');
        addParticles(dp.x,dp.y,PCOLORS[dp.col],20,80);
        flash('P'+(dp.idx+1)+' IS BACK!');
      }
    }else dp.reviveP=Math.max(0,dp.reviveP-dt*0.7);
  }

  // ---- boss telegraphs / hazards ----
  tickBossFx(dt,alive);

  // the Worldeater blots out the sky: ash drifts down over the arena
  if(G.boss&&!G.boss.dead&&G.boss.def&&G.boss.def.id==='worldeater'&&G.particles.length<650){
    if(Math.random()<dt*26){
      const c=G.cam;
      G.particles.push({x:c.x+(Math.random()-0.5)*c.w,y:c.y-c.h/2-6,
        vx:-6-Math.random()*10,vy:16+Math.random()*22,t:2.6,
        col:Math.random()<0.7?'#3a2f4a':WE_TINTS[G.boss.ai.pal],size:1});
    }
  }

  // ---- enemies ----
  for(const e of G.enemies){
    if(e.dead)continue;
    if(e.flash>0)e.flash-=dt;
    if(e.life>0){e.life-=dt;if(e.life<=0){e.dead=true;addParticles(e.x,e.y,'#d84343',6,60);continue;}}
    let tgt=null,bd=1e9;
    for(const p of alive){
      const d=dist2(e.x,e.y,p.x,p.y);
      if(d<bd){bd=d;tgt=p;}
    }
    const dd=Math.sqrt(bd)||1;
    let vx=tgt?(tgt.x-e.x)/dd:0,vy=tgt?(tgt.y-e.y)/dd:0;
    let sp=e.sp;
    if(hazardAt(e.x,e.y)==='mud')sp*=0.6;

    if(e.boss&&e.def){
      const a=e.ai,d=e.def;
      if(d.tick&&a.mode==='active')d.tick(e,dt,alive);
      if(a.mode!=='transition'&&e.gates.length&&e.hp/e.maxhp<=e.gates[0]&&e.casts>=d.minCasts){
        e.gates.shift();e.phase++;
        a.mode='transition';a.t=2.0;a.cast=null;e.castName=null;e.castP=0;e.frozen=1;
        G.shake=7;sfx('boss');
        G.ebullets=G.ebullets.filter(b=>!b.boss);
        for(const f of G.fx)if(f.boss&&f.kind!=='pool')f.t=Math.min(f.t,0.2);
        flash(e.name+'  PHASE '+e.phase);
      }
      if(a.mode==='transition'){
        a.t-=dt;e.castName=d.transName||'...';e.castP=clamp(1-a.t/2.0,0,1);
        if(a.applied!==e.phase){a.applied=e.phase;d.onPhase(e,e.phase);}
        if(Math.random()<0.6)addParticles(e.x+(Math.random()-0.5)*40,e.y+(Math.random()-0.5)*44,e.barCol,6,110);
        if(a.t<=0){a.mode='active';e.castName=null;e.frozen=0;}
      }else if(a.mode==='intro'){
        a.t-=dt;e.castName=e.name;e.castP=1-a.t/2.5;
        if(a.t<=0){a.mode='active';e.castName=null;}
      }else if(a.cast){
        a.castT-=dt;e.castP=clamp(1-a.castT/a.castLen,0,1);
        if(a.castT<=0){
          const k=a.cast;a.cast=null;e.castName=null;e.frozen=0;e.casts++;
          d.resolve(e,k,alive);
        }
      }else if(alive.length)d.pick(e,dt,alive);
      if(e.frozen)e.ovr=0;
    }
    else if(e.boss&&e.type==='brute'){
      const ai=e.ai;
      ai.t-=dt;ai.sumT-=dt;
      if(ai.mode==='walk'){if(ai.t<=0){ai.mode='windup';ai.t=0.7;ai.tx=tgt?tgt.x:e.x;ai.ty=tgt?tgt.y:e.y;}}
      else if(ai.mode==='windup'){
        sp=0;
        if(ai.t<=0){ai.mode='charge';ai.t=1.0;const an=Math.atan2(ai.ty-e.y,ai.tx-e.x);ai.cvx=Math.cos(an);ai.cvy=Math.sin(an);}
      }else if(ai.mode==='charge'){
        vx=ai.cvx;vy=ai.cvy;sp=170;
        if(ai.t<=0){ai.mode='walk';ai.t=4;explode(e.x,e.y,70,0,undefined,e.dmg*1.2);}
      }
      if(ai.sumT<=0){ai.sumT=8;for(let i=0;i<4;i++)spawnEnemy('swarm',e.x+(Math.random()*40-20),e.y+(Math.random()*40-20));}
    }
    else if(e.boss){
      const ai=e.ai;
      ai.t-=dt;ai.sumT-=dt;
      if(ai.t<=0&&alive.length){
        ai.t=6;
        const p=alive[(Math.random()*alive.length)|0];
        addParticles(e.x,e.y,'#b06bff',12,70);
        const an=Math.random()*TAU;
        e.x=p.x+Math.cos(an)*110;e.y=p.y+Math.sin(an)*110;
        addParticles(e.x,e.y,'#b06bff',12,70);
      }
      e.shootT-=dt;
      if(e.shootT<=0){
        e.shootT=2.6;
        for(let i=0;i<12;i++){
          const an=i*TAU/12+G.time;
          G.ebullets.push({x:e.x,y:e.y,vx:Math.cos(an)*95,vy:Math.sin(an)*95,r:2.5,dmg:e.dmg*0.7,life:3,col:'#e77bd0'});
        }
        sfx('spread');
      }
      if(ai.sumT<=0){ai.sumT=10;spawnEnemy('spitter',e.x-20,e.y);spawnEnemy('spitter',e.x+20,e.y);}
      if(dd<90)sp=0;
    }
    else if(e.type==='spitter'){
      if(dd<130)sp=-sp*0.6;
      else if(dd<160)sp=0;
      e.shootT-=dt;
      const range=Math.min(260,G.cam.h*0.46);
      if(e.shootT<=0&&dd<range&&tgt){
        e.shootT=2.2;
        G.ebullets.push({x:e.x,y:e.y,vx:vx*125,vy:vy*125,r:2.5,dmg:e.dmg*1.4,life:2.6,col:'#6fe84a'});
      }
    }
    else if(e.type==='bomber'){
      if(e.fuse>=0){
        sp=0;e.fuse-=dt;
        if(e.fuse<=0){e.dead=true;explode(e.x,e.y,46,15,undefined,22*dmgScale());}
      }else if(dd<30)e.fuse=0.6;
    }
    if(e.ember){
      e.dripT-=dt;
      if(e.dripT<=0){e.dripT=1.2;pushPool(null,e.x,e.y,12,5,0.04,'#ff7a1a','circle');}
    }

    if(e.ovr){vx=e.ovx;vy=e.ovy;sp=e.osp;e.ovr=0;}
    else if(e.def)sp=0;
    if(e.dead)continue;
    if(e.boss){e.x+=vx*sp*dt;e.y+=vy*sp*dt;}
    else if(sp!==0)moveCollide(e,vx*sp*dt,vy*sp*dt);

    const cell=grid.get(gridKey(Math.floor(e.x/GRID),Math.floor(e.y/GRID)));
    if(cell&&cell.length>1&&!e.boss){
      const o=cell[(Math.random()*cell.length)|0];
      if(o!==e&&!o.dead&&!o.boss){
        const d2=dist2(e.x,e.y,o.x,o.y),rr=e.r+o.r;
        if(d2<rr*rr&&d2>0.01){
          const d=Math.sqrt(d2),push=(rr-d)*0.4;
          e.x+=(e.x-o.x)/d*push;e.y+=(e.y-o.y)/d*push;
        }
      }
    }
  }

  // ---- player bullets ----
  for(const b of G.bullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.trail&&Math.random()<0.6&&G.particles.length<850)
      G.particles.push({x:b.x,y:b.y,vx:0,vy:0,t:0.2,col:b.trailCol||'#b3a184',size:1,spark:b.sparkTrail});
    if(b.life<=0){if(b.rocket)explode(b.x,b.y,b.aoe,b.dmg,b.owner);b.dead=true;continue;}
    if(solidAt(b.x,b.y)){
      if(b.rocket)explode(b.x,b.y,b.aoe,b.dmg,b.owner);
      else addParticles(b.x,b.y,'#8b929c',3,40);
      b.dead=true;continue;
    }
    let hit=null;
    queryEnemies(b.x,b.y,b.r,e=>{
      if(hit)return;
      const rr=e.r+b.r;
      if(dist2(b.x,b.y,e.x,e.y)<rr*rr)hit=e;
    });
    if(!hit){
      for(const c of G.crates){
        if(c.dead)continue;
        const rr=c.r+b.r;
        if(dist2(b.x,b.y,c.x,c.y)<rr*rr){c.hp-=b.dmg;if(c.hp<=0)breakCrate(c);b.dead=true;break;}
      }
    }
    if(hit){
      if(b.rocket)explode(b.x,b.y,b.aoe,b.dmg,b.owner);
      else damageEnemy(hit,b.dmg,b.owner);
      b.dead=true;
    }
  }

  // ---- enemy bullets ----
  for(const b of G.ebullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||solidAt(b.x,b.y)){b.dead=true;continue;}
    for(const p of G.players){
      if(p.dead||p.invuln>0)continue;
      const rr=p.r+b.r;
      // boss bullets floor at 6% maxhp: flat dmg goes stale once charm-stacked
      // hp pools grow, and regen out-heals it into an AFK-able fight
      if(dist2(b.x,b.y,p.x,p.y)<rr*rr){hurtPlayer(p,b.boss?Math.max(b.dmg,p.maxhp*0.06):b.dmg);b.dead=true;break;}
    }
  }

  // ---- gems / pickups ----
  for(const g of G.gems){
    g.t+=dt;
    if(Math.random()<dt*0.5)addSparkles(g.x,g.y-2,g.v>=4?'#ffd23e':'#8ef0ff',1,14);
    let best=null,bd2=1e9;
    for(const p of G.players){
      if(p.dead)continue;
      const d=dist2(g.x,g.y,p.x,p.y);
      if(d<bd2){bd2=d;best=p;}
    }
    if(best){
      const d=Math.sqrt(bd2);
      if(d<best.magnet){
        const pull=lerp(60,320,1-d/best.magnet);
        g.x+=(best.x-g.x)/d*pull*dt;
        g.y+=(best.y-g.y)/d*pull*dt;
      }
      if(d<8){g.dead=true;G.xp+=g.v;sfx('gem');addSparkles(g.x,g.y,g.v>=4?'#ffe94a':'#bff0ff',4,50);}
    }
  }
  for(const pk of G.pickups){
    pk.t+=dt;
    if(Math.random()<dt*1.2)addSparkles(pk.x,pk.y-3,pk.type==='heart'?'#ff8ba0':'#ffe94a',1,12);
    for(const p of G.players){
      if(p.dead)continue;
      if(dist2(pk.x,pk.y,p.x,p.y)<12*12){
        pk.dead=true;
        if(PARTY_BUFFS.has(pk.type)){
          G.buffTally[pk.type]=(G.buffTally[pk.type]||0)+1;
          for(const q of G.players)applyBuff(q,pk.type);
        }else applyBuff(p,pk.type);
        addSparkles(p.x,p.y-4,'#ffe94a',8,70);break;
      }
    }
  }

  // ---- ember brand douse check (PYRAXIS) ----
  for(const f of G.fx){
    if(f.kind==='mark'&&f.mode==='stack'&&!f.fizzled&&f.p&&!f.p.dead){
      for(const q of G.fx){
        if(q.kind!=='safe'||q.t<=0)continue;
        if(dist2(f.p.x,f.p.y,q.x,q.y)<q.r*q.r){f.fizzled=true;addParticles(f.p.x,f.p.y,'#eaffff',18,90);break;}
      }
    }
  }

  // ---- housekeeping ----
  for(const pt of G.particles){pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.t-=dt;}
  for(const t of G.texts){t.y+=t.vy*dt;t.t-=dt;}
  G.particles=G.particles.filter(p=>p.t>0);
  G.texts=G.texts.filter(t=>t.t>0);
  G.fx=G.fx.filter(f=>f.t>0);
  G.bullets=G.bullets.filter(b=>!b.dead);
  G.ebullets=G.ebullets.filter(b=>!b.dead);
  G.gems=G.gems.filter(g=>!g.dead);
  G.pickups=G.pickups.filter(p=>!p.dead);
  G.enemies=G.enemies.filter(e=>!e.dead);
  G.crates=G.crates.filter(c=>!c.dead);
  // cull litter that is far behind the party (it was never coming back)
  if(G.crates.length>90)G.crates=G.crates.filter(c=>dist2(c.x,c.y,G.cam.x,G.cam.y)<1400*1400);
  if(G.pickups.length>120)G.pickups=G.pickups.filter(p=>dist2(p.x,p.y,G.cam.x,G.cam.y)<1400*1400);
  if(G.boss&&G.boss.dead)G.boss=null;
  if(!G.boss)for(const e of G.enemies)if(e.boss&&!e.dead){G.boss=e;break;}

  // ---- spawning ----
  if(G.mode==='endless'){
    const n=Math.max(1,G.players.length);
    const interval=Math.max(0.14,1.4-G.time*0.004)/(0.6+0.4*n);
    G.spawnT-=dt;
    const maxEnemies=200+Math.min(80,G.time*0.2);
    if(G.spawnT<=0&&G.enemies.length<maxEnemies){
      G.spawnT=interval;
      const pt=spawnPoint();
      if(pt)spawnEnemy(pickEnemyType(),pt.x,pt.y);
    }
    G.surgeT-=dt;
    if(G.surgeT<=0){
      G.surgeT=45;
      flash('SURGE INCOMING!');
      const type=pickEnemyType();
      for(let i=0;i<10+Math.min(25,G.time*0.06);i++){
        const pt=spawnPoint();
        if(pt&&G.enemies.length<maxEnemies+40)spawnEnemy(Math.random()<0.7?type:pickEnemyType(),pt.x,pt.y);
      }
    }
    G.bossT-=dt;
    if(G.bossT<=0){G.bossT=170;if(!G.boss)spawnBoss();}
  }else updateClassicWaves(dt);

  // level-ups never interrupt a boss fight, and never resurrect a finished run
  if(G.state==='play'&&G.xp>=xpNeed()&&!(G.mode==='classic'&&G.waveState==='boss'))startLevelup();

  storePadStates(pads);
}

function spawnBoss(){
  const kind=G.bossIdx%2===0?'brute':'warlock';
  G.bossIdx++;
  const pt=spawnPoint();
  if(!pt)return;
  const n=Math.max(1,G.players.length);
  const base=kind==='brute'?850:650;
  const hp=base*(1+G.time*0.008)*((4*n-1)/3); // same roster slope as classic bosses
  const e={
    type:kind,spr:kind==='brute'?tankSprite:spitSprite,x:pt.x,y:pt.y,
    r:kind==='brute'?17:13,hp,maxhp:hp,
    sp:kind==='brute'?30:36,dmg:(kind==='brute'?20:12)*dmgScale(),xp:40,
    flash:0,fuse:-1,shootT:2,orbCd:{},slow:1,boss:true,scale:kind==='brute'?2.4:2.6,
    name:kind==='brute'?'BRUTE KING':'WARLOCK',barCol:'#e33',phase:1,phaseCount:1,huntLv:0,life:-1,
    ai:{t:3,mode:'walk',tx:0,ty:0,sumT:6}
  };
  G.enemies.push(e);G.boss=e;
  sfx('boss');
  flash(kind==='brute'?'!! BRUTE KING !!':'!! WARLOCK !!');
  G.shake=6;
}

// ---------- camera ----------
function updateCamera(dt){
  const aspect=screenC.width/screenC.height||1.7;
  if(G.mode==='classic'&&G.arena){
    G.cam.tw=G.arena.w;
    G.cam.w=lerp(G.cam.w,G.cam.tw,Math.min(1,dt*3));
    G.cam.h=G.cam.w/aspect;
    G.cam.x=lerp(G.cam.x,G.arena.x,Math.min(1,dt*2.2));
    G.cam.y=lerp(G.cam.y,G.arena.y,Math.min(1,dt*2.2));
    return;
  }
  // corpses must not hold the camera hostage — track the living, fall back to everyone
  let targets=G.players.filter(p=>!p.dead);
  if(!targets.length)targets=G.players;
  if(!targets.length)return;
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  for(const p of targets){
    if(p.x<minx)minx=p.x;
    if(p.x>maxx)maxx=p.x;
    if(p.y<miny)miny=p.y;
    if(p.y>maxy)maxy=p.y;
  }
  const cx=(minx+maxx)/2,cy=(miny+maxy)/2;
  const needW=Math.max((maxx-minx)+260,((maxy-miny)+200)*aspect,640);
  G.cam.tw=clamp(needW,640,1150);
  G.cam.w=lerp(G.cam.w,G.cam.tw,Math.min(1,dt*3));
  G.cam.h=G.cam.w/aspect;
  G.cam.x=lerp(G.cam.x,cx,Math.min(1,dt*4));
  G.cam.y=lerp(G.cam.y,cy,Math.min(1,dt*4));
}


// ============================================================
// RENDER
// ============================================================
function text(g,str,x,y,size,col,align){
  str=tr(String(str)); // single choke point: every visible string is translated here
  g.font='bold '+size+'px "Courier New",monospace';
  g.fillStyle=col;
  g.textAlign=align||'left';
  g.textBaseline='top';
  g.fillText(str,Math.round(x),Math.round(y));
}
function fmtTime(t){
  const m=Math.floor(t/60),s=Math.floor(t%60);
  return m+':'+(s<10?'0':'')+s;
}
function drawSpriteC(g,spr,x,y,scale){
  const s=scale||1;
  g.drawImage(spr,Math.round(x-spr.width*s/2),Math.round(y-spr.height*s/2),Math.round(spr.width*s),Math.round(spr.height*s));
}
function hexRgb(h){
  const n=parseInt(h.slice(1),16);
  return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255);
}
function stripes(g,x,y,w,h,col,phase){
  g.save();
  g.beginPath();g.rect(x,y,w,h);g.clip();
  g.strokeStyle=col;g.lineWidth=1;
  for(let i=-h;i<w+h;i+=6){
    const o=(phase*8)%6;
    g.beginPath();g.moveTo(x+i+o,y);g.lineTo(x+i+o-h,y+h);g.stroke();
  }
  g.restore();
}
function drawFx(f,W2V,g){
  const pt=W2V(f.x||0,f.y||0),x=pt[0],y=pt[1];
  const k=clamp(f.t/(f.dur||0.3),0,1);
  switch(f.kind){
    case 'tel':{
      const rgb=hexRgb(f.col);
      g.fillStyle='rgba('+rgb+',0.16)';
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
      g.strokeStyle='rgba('+rgb+',0.75)';g.lineWidth=1;
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.stroke();
      const gr=f.r*(1-k);
      g.strokeStyle=k<0.2?'#ffffff':'rgba('+rgb+',1)';g.lineWidth=2;
      g.beginPath();g.arc(x,y,Math.max(1,gr),0,TAU);g.stroke();
      if(f.icon)drawSpriteC(g,f.icon,x,y-26,k<0.25?2:1);
      break;}
    case 'met':{
      const rgb=hexRgb(f.col);
      g.fillStyle='rgba('+rgb+',0.16)';
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
      g.strokeStyle='rgba('+rgb+',0.9)';g.lineWidth=2;
      g.beginPath();g.arc(x,y,Math.max(1,f.r*(1-k)),0,TAU);g.stroke();
      drawSpriteC(g,cinderSprite,x,y-46*k,1+2*k);
      break;}
    case 'pool':{
      const rgb=hexRgb(f.col);
      const fade=f.t<0.6?f.t/0.6:1;
      if(f.shape==='tile'){
        const s=16,tx=Math.round(x/s)*s;
        g.fillStyle='rgba('+rgb+','+(0.30*fade).toFixed(3)+')';
        g.fillRect(x-s/2,y-s/2,s,s);
        g.strokeStyle='rgba('+rgb+','+(0.9*fade).toFixed(3)+')';g.lineWidth=2;
        g.strokeRect(x-s/2+1,y-s/2+1,s-2,s-2);
        stripes(g,x-s/2,y-s/2,s,s,'rgba('+rgb+',0.5)',G.time);
      }else{
        g.fillStyle='rgba('+rgb+','+(0.22*fade).toFixed(3)+')';
        g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
        g.strokeStyle='rgba('+rgb+','+((0.5+0.3*Math.sin(G.time*9))*fade).toFixed(3)+')';g.lineWidth=1;
        g.beginPath();g.arc(x,y,f.r,0,TAU);g.stroke();
      }
      break;}
    case 'safe':{
      const br=f.r*(1+0.06*Math.sin(G.time*5));
      g.strokeStyle='rgba(0,0,0,0.5)';g.lineWidth=5;
      g.beginPath();g.arc(x,y,br,0,TAU);g.stroke();
      g.strokeStyle=f.col;g.lineWidth=3;
      g.beginPath();g.arc(x,y,br,0,TAU);g.stroke();
      g.strokeStyle='rgba(234,255,255,0.4)';g.lineWidth=1;
      g.beginPath();g.arc(x,y,br*0.72,0,TAU);g.stroke();
      g.fillStyle=f.col;
      g.fillRect(x-9,y-1,18,3);g.fillRect(x-1,y-9,3,18);
      for(let i=0;i<6;i++){
        const a=-G.time*1.4+i*TAU/6; // anticlockwise = safe
        g.fillRect(Math.round(x+Math.cos(a)*br)-1,Math.round(y+Math.sin(a)*br)-1,2,2);
      }
      if(f.heal)drawSpriteC(g,frostBrazierSprite,x,y,1);
      break;}
    case 'stack':{
      g.fillStyle='rgba(255,255,255,'+(0.30+0.30*(1-k)).toFixed(3)+')';
      g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
      g.strokeStyle='#000';g.lineWidth=2;
      g.beginPath();g.arc(x,y,f.r+2,0,TAU);g.stroke();
      g.strokeStyle='#fff';g.lineWidth=2;
      g.beginPath();g.arc(x,y,Math.max(f.r,f.r+40*k),0,TAU);g.stroke();
      for(let i=0;i<4;i++){
        const a=i*TAU/4+G.time*1.5;
        const rr=f.r+40*k;
        g.fillStyle='#fff';
        g.fillRect(Math.round(x+Math.cos(a)*rr)-2,Math.round(y+Math.sin(a)*rr)-2,4,4);
      }
      drawSpriteC(g,stackRuneSprite,x,y,1);
      break;}
    case 'mark':{
      if(f.mode==='spread'){
        const col=f.locked?'#ffffff':'#ff6bd6';
        g.strokeStyle=col;g.lineWidth=f.locked?2:1;
        g.beginPath();g.arc(x,y,f.r,0,TAU);g.stroke();
        if(f.locked&&Math.floor(G.time*10)%2===0){
          g.fillStyle='rgba(255,255,255,0.25)';
          g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
        }
        if(f.p&&!f.p.dead){const q=W2V(f.p.x,f.p.y);drawSpriteC(g,spreadMarkSprite,q[0],q[1]-20,2);}
      }else if(f.mode==='spreadring'){
        g.strokeStyle='#c83cdc';g.lineWidth=1;
        for(let i=0;i<16;i++){
          const a=i*TAU/16;
          g.fillStyle='#c83cdc';
          g.fillRect(Math.round(x+Math.cos(a)*f.r)-1,Math.round(y+Math.sin(a)*f.r)-1,3,3);
        }
        if(f.p&&f.p.arrow){
          const ar=f.p.arrow;
          g.fillStyle='#ff6bd6';
          for(let i=0;i<4;i++)g.fillRect(Math.round(x+ar[0]*(10+i*4))-2,Math.round(y+ar[1]*(10+i*4))-2,4,4);
        }
      }else if(f.mode==='stack'){
        g.fillStyle=f.fizzled?'rgba(160,220,255,0.14)':'rgba(255,255,255,'+(0.28+0.28*(1-k)).toFixed(3)+')';
        g.beginPath();g.arc(x,y,f.r,0,TAU);g.fill();
        g.strokeStyle='#000';g.lineWidth=2;
        g.beginPath();g.arc(x,y,f.r+2,0,TAU);g.stroke();
        g.strokeStyle=f.fizzled?'#eaffff':'#fff';g.lineWidth=2;
        g.beginPath();g.arc(x,y,f.r,0,TAU);g.stroke();
        for(let i=0;i<8;i++){
          const a=i*TAU/8+G.time*2,rr=f.r*(0.4+0.6*k);
          g.fillStyle='#fff';
          g.fillRect(Math.round(x+Math.cos(a)*rr)-2,Math.round(y+Math.sin(a)*rr)-2,4,4);
        }
        drawSpriteC(g,stackRuneSprite,x,y,1);
      }else{ // brand
        g.strokeStyle='#6fd8ff';g.lineWidth=2;
        g.beginPath();g.arc(x,y,f.r*(0.5+0.5*(1-k)),0,TAU);g.stroke();
        drawSpriteC(g,brandMarkSprite,x,y,1);
      }
      break;}
    case 'ring':{
      const rgb=hexRgb(f.col||'#ff2d4d');
      g.lineWidth=f.w;
      if(f.gaps>0){
        const seg=TAU/f.gaps;
        for(let i=0;i<f.gaps;i++){
          const a0=f.gapA+i*seg+f.gapW*0.5,a1=f.gapA+(i+1)*seg-f.gapW*0.5;
          g.strokeStyle='rgba('+rgb+',0.55)';
          g.beginPath();g.arc(x,y,Math.max(1,f.r),a0,a1);g.stroke();
        }
        g.strokeStyle='#fff';g.lineWidth=2;
        for(let i=0;i<f.gaps;i++){
          const ga=f.gapA+i*seg;
          g.beginPath();
          g.moveTo(x+Math.cos(ga-f.gapW*0.5)*(f.r-10),y+Math.sin(ga-f.gapW*0.5)*(f.r-10));
          g.lineTo(x+Math.cos(ga-f.gapW*0.5)*(f.r+10),y+Math.sin(ga-f.gapW*0.5)*(f.r+10));
          g.moveTo(x+Math.cos(ga+f.gapW*0.5)*(f.r-10),y+Math.sin(ga+f.gapW*0.5)*(f.r-10));
          g.lineTo(x+Math.cos(ga+f.gapW*0.5)*(f.r+10),y+Math.sin(ga+f.gapW*0.5)*(f.r+10));
          g.stroke();
        }
      }else{
        g.strokeStyle='rgba('+rgb+',0.6)';
        g.beginPath();g.arc(x,y,Math.max(1,f.r),0,TAU);g.stroke();
      }
      break;}
    case 'shadow':{
      const b=f.boss;
      if(!b||b.dead||!G.arena)break;
      g.fillStyle='rgba(4,6,10,0.62)';
      for(const q of G.arena.pillars){
        const poly=umbra(b.x,b.y,q);
        g.beginPath();
        poly.forEach((c,i)=>{const p2=W2V(c[0],c[1]);if(i)g.lineTo(p2[0],p2[1]);else g.moveTo(p2[0],p2[1]);});
        g.closePath();g.fill();
      }
      break;}
    case 'vent':{
      for(let i=0;i<6;i++){
        const a=i*TAU/6,rr=f.r*(1-k);
        g.fillStyle=Math.floor(G.time*12+i)%2?'#ffd85a':'#ff7a1f';
        g.fillRect(Math.round(x+Math.cos(a)*rr)-2,Math.round(y+Math.sin(a)*rr)-2,4,4);
      }
      break;}
    case 'slagwarn':{
      const s=16;
      g.strokeStyle=k<0.3?'#fff':'rgba(255,255,255,0.7)';g.lineWidth=1;
      g.strokeRect(Math.round(x-s/2)+0.5,Math.round(y-s/2)+0.5,s-1,s-1);
      if(f.t<=0.02&&!f.spawned){f.spawned=1;}
      break;}
    case 'boom':{
      g.strokeStyle='rgba(255,182,46,'+k.toFixed(3)+')';g.lineWidth=2;
      g.beginPath();g.arc(x,y,Math.max(0,f.r*(1-k)),0,TAU);g.stroke();
      break;}
    case 'zap':{
      const a1=W2V(f.x1,f.y1),a2=W2V(f.x2,f.y2);
      g.strokeStyle='rgba(176,107,255,'+k.toFixed(3)+')';g.lineWidth=1.5;
      g.beginPath();g.moveTo(a1[0],a1[1]);
      g.lineTo((a1[0]+a2[0])/2+(Math.random()*8-4),(a1[1]+a2[1])/2+(Math.random()*8-4));
      g.lineTo(a2[0],a2[1]);g.stroke();
      break;}
    case 'beam':{
      const a1=W2V(f.x1,f.y1),a2=W2V(f.x2,f.y2);
      g.strokeStyle=f.col||'#ff2d4d';g.lineWidth=2;
      g.globalAlpha=k;
      g.beginPath();g.moveTo(a1[0],a1[1]);g.lineTo(a2[0],a2[1]);g.stroke();
      g.globalAlpha=1;
      break;}
    case 'chain':{
      const a1=W2V(f.x1,f.y1),a2=W2V(f.x2,f.y2);
      g.strokeStyle='rgba(255,107,214,'+k.toFixed(3)+')';g.lineWidth=2;
      g.beginPath();g.moveTo(a1[0],a1[1]);g.lineTo(a2[0],a2[1]);g.stroke();
      break;}
  }
}

function render(){
  const c=G.cam;
  const aspect=screenC.width/screenC.height||1.7;
  // the exact camera window in world units — this is what reaches the screen,
  // and it tracks cam.w continuously so the zoom glides
  const w=Math.max(320,c.w),h=w/aspect;
  // the low-res buffer still snaps to a 16px step so the raster grid only
  // reallocates occasionally (re-rasterizing every frame shimmers); the blit
  // below crops the exact fractional window out of it, making the step invisible
  const vw=Math.ceil((w+8)/16)*16,vh=Math.ceil((h+8)/16)*16;
  if(view.width!==vw||view.height!==vh){view.width=vw;view.height=vh;}
  ctx.imageSmoothingEnabled=false;

  let shx=0,shy=0;
  if(G.shake>0.2){shx=(Math.random()-0.5)*G.shake;shy=(Math.random()-0.5)*G.shake;}
  const ox=Math.round(c.x+shx-vw/2),oy=Math.round(c.y+shy-vh/2);
  const W2V=(x,y)=>[Math.round(x-ox),Math.round(y-oy)];
  const sx=c.x+shx-w/2-ox,sy=c.y+shy-h/2-oy;          // fractional window origin inside the buffer
  const W2U=(x,y)=>[x-(c.x+shx-w/2),y-(c.y+shy-h/2)]; // world -> UI window coords (native res pass)

  ctx.fillStyle='#1c2618';ctx.fillRect(0,0,vw,vh);
  const c0x=Math.floor(ox/CHPX),c1x=Math.floor((ox+vw)/CHPX);
  const c0y=Math.floor(oy/CHPX),c1y=Math.floor((oy+vh)/CHPX);
  for(let cy=c0y;cy<=c1y;cy++)for(let cx=c0x;cx<=c1x;cx++){
    ctx.drawImage(chunkCanvas(cx,cy),cx*CHPX-ox,cy*CHPX-oy);
    if(G.state!=='title'&&G.state!=='modesel')ensureChunkEntities(cx,cy);
  }

  if(G.state==='title'||G.state==='modesel'){
    blit(sx,sy,w,h);
    uiBegin(w,h);
    renderTitle(w,h,G.state==='modesel');
    if(G.state==='modesel')renderModeSelect(w,h);
    renderPadRoster(w,h);
    renderSoundHint(w,h);
    uiEnd();
    return;
  }

  // green creep (ground)
  if(G.creep){
    for(const k of G.creep){
      const pr=k.split(','),tx=+pr[0],ty=+pr[1];
      const px=tx*TILE-ox,py=ty*TILE-oy;
      if(px<-20||py<-20||px>vw+20||py>vh+20)continue;
      ctx.drawImage(creepTileSprite,px,py,TILE,TILE);
      stripes(ctx,px,py,TILE,TILE,'rgba(63,224,90,0.35)',G.time);
    }
  }
  // arena floor + border
  if(G.arena){
    const a=G.arena,p0=W2V(a.x-a.w/2,a.y-a.h/2);
    ctx.strokeStyle=G.bossTint;ctx.lineWidth=2;
    ctx.globalAlpha=0.5+0.2*Math.sin(G.time*3);
    ctx.strokeRect(p0[0],p0[1],a.w,a.h);
    ctx.globalAlpha=1;
    for(const q of a.pillars){const t=W2V(q.x,q.y);drawSpriteC(ctx,arenaTorchSprite,t[0],t[1]-16,1);}
  }
  // ground telegraphs must be UNDER everything the player looks at
  for(const f of G.fx)if(f.ground)drawFx(f,W2V,ctx);

  for(const g of G.gems){
    const q=W2V(g.x,g.y);
    if(q[0]<-8||q[1]<-8||q[0]>vw+8||q[1]>vh+8)continue;
    drawSpriteC(ctx,g.v>=4?bigGemSprite:gemSprite,q[0],q[1]+Math.sin(g.t*4)*1.5);
  }
  for(const pk of G.pickups){
    const q=W2V(pk.x,pk.y);
    if(q[0]<-12||q[1]<-12||q[0]>vw+12||q[1]>vh+12)continue;
    const bob=Math.sin(pk.t*3)*2;
    if(pk.type==='heart')drawSpriteC(ctx,heartSprite,q[0],q[1]+bob);
    else{
      ctx.fillStyle=pk.type==='pod'?'rgba(87,232,107,0.18)':'rgba(255,255,255,0.12)';
      ctx.beginPath();ctx.arc(q[0],q[1]+bob,pk.type==='pod'?10:7,0,TAU);ctx.fill();
      drawSpriteC(ctx,buffIcons[pk.type]||buffIcons.speed,q[0],q[1]+bob);
    }
  }
  for(const cr of G.crates){
    const q=W2V(cr.x,cr.y);
    if(q[0]<-12||q[1]<-12||q[0]>vw+12||q[1]>vh+12)continue;
    drawSpriteC(ctx,crateSprite,q[0],q[1]);
  }
  for(const p of G.players){
    if(!p.dead)continue;
    const q=W2V(p.x,p.y);
    ctx.globalAlpha=0.8;drawSpriteC(ctx,corpseSprite,q[0],q[1]);ctx.globalAlpha=1;
    if(p.reviveP>0){
      ctx.strokeStyle='#57e86b';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(q[0],q[1],11,-Math.PI/2,-Math.PI/2+p.reviveP*TAU);ctx.stroke();
    }else{
      ctx.strokeStyle='rgba(255,255,255,'+(0.25+0.2*Math.sin(G.time*4))+')';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(q[0],q[1],11,0,TAU);ctx.stroke();
    }
  }
  for(const e of G.enemies){
    const q=W2V(e.x,e.y),x=q[0],y=q[1];
    if(x<-60||y<-60||x>vw+60||y>vh+60)continue;
    const s=e.scale||1;
    const yy=y-((e.spr.height*s)/2-e.r);
    if(e.flash>0&&!e.boss){
      ctx.globalAlpha=0.6;drawSpriteC(ctx,e.spr,x,yy,s);ctx.globalAlpha=1;
      ctx.fillStyle='rgba(255,255,255,0.7)';
      ctx.fillRect(Math.round(x-e.r),Math.round(y-e.r),e.r*2,e.r*2);
    }else{
      drawSpriteC(ctx,e.spr,x,yy,s);
      // a boss is on screen for a minute — never paint over its art, just rim-flash it
      if(e.flash>0){
        ctx.strokeStyle='rgba(255,255,255,0.75)';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(x,y,e.r+3,0,TAU);ctx.stroke();
      }
    }
    if(e.elite)drawSpriteC(ctx,eliteMarkSprite,x,y-e.r-8,1);
    if(e.hunted)drawSpriteC(ctx,huntMarkSprite,x,y-e.r-12,1);
    if(e.type==='bomber'&&e.fuse>=0&&Math.floor(e.fuse*10)%2===0){
      ctx.fillStyle='#ff3c3c';ctx.fillRect(x-5,y-12,10,10);
    }
    if(e.def&&e.def.draw)e.def.draw(ctx,x,y,e);
  }
  for(const p of G.players){
    if(p.dead)continue;
    const q=W2V(p.x,p.y),x=q[0],y=q[1];
    if(p.invuln>0&&Math.floor(G.time*10)%2===0)continue;
    const bobY=(p.anim%1)<0.5?0:-1;
    if(p.flash>0){ctx.fillStyle='rgba(255,80,80,0.6)';ctx.fillRect(x-6,y-8+bobY,12,14);}
    drawSpriteC(ctx,playerSprites[p.col],x,y-2+bobY);
    const fw=p.weapons.flame;
    if(fw){
      ctx.strokeStyle='rgba(255,90,61,'+(0.25+0.1*Math.sin(G.time*6))+')';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(x,y,28+fw.lv*5,0,TAU);ctx.stroke();
    }
    const ow=p.weapons.orbit;
    if(ow){
      const n=1+ow.lv,rad=30+ow.lv*2;
      for(let i=0;i<n;i++){
        const a=(ow.ang||0)+i*TAU/n;
        const gx=Math.round(x+Math.cos(a)*rad),gy=Math.round(y+Math.sin(a)*rad);
        ctx.fillStyle='#4cc2ff';
        ctx.fillRect(gx-1,gy-2,2,4);ctx.fillRect(gx-2,gy-1,4,2);
        ctx.fillStyle='#d8f8ff';ctx.fillRect(gx,gy-1,1,2);
      }
    }
  }
  for(const b of G.bullets){
    const q=W2V(b.x,b.y);
    ctx.fillStyle=b.col;
    ctx.fillRect(Math.round(q[0]-b.r),Math.round(q[1]-b.r),b.r*2,b.r*2);
  }
  for(const b of G.ebullets){
    const q=W2V(b.x,b.y);
    ctx.fillStyle=b.col;
    ctx.beginPath();ctx.arc(q[0],q[1],b.r,0,TAU);ctx.fill();
  }
  for(const f of G.fx)if(!f.ground)drawFx(f,W2V,ctx);
  for(const pt of G.particles){
    const q=W2V(pt.x,pt.y);
    ctx.fillStyle=pt.col;
    if(pt.spark){
      if(pt.t>0.15||Math.floor(pt.t*20)%2===0){
        ctx.fillRect(q[0]-1,q[1],3,1);ctx.fillRect(q[0],q[1]-1,1,3);
      }
    }else ctx.fillRect(q[0],q[1],pt.size,pt.size);
  }
  // off-screen hunted-straggler arrows so a wave can never hide from you
  // (clamped to the blitted window, not the larger buffer, so they stay visible)
  if(G.mode==='classic'&&G.waveState==='fight'){
    for(const e of G.enemies){
      if(!e.hunted)continue;
      const q=W2V(e.x,e.y);
      if(q[0]>=sx&&q[1]>=sy&&q[0]<=sx+w&&q[1]<=sy+h)continue;
      const ax=clamp(q[0],sx+6,sx+w-6),ay=clamp(q[1],sy+6,sy+h-6);
      ctx.fillStyle='#ff3c3c';ctx.fillRect(Math.round(ax)-2,Math.round(ay)-2,4,4);
    }
  }

  blit(sx,sy,w,h);

  // UI pass: window-space coordinates (the exact blitted rect), drawn straight
  // onto the screen canvas at native resolution — text rendered into the
  // low-res buffer and upscaled is unreadable.
  uiBegin(w,h);
  renderWeMood(w,h);
  for(const p of G.players){
    if(!p.dead)continue;
    const q=W2U(p.x,p.y);
    text(sctx,'P'+(p.idx+1),q[0],q[1]-16,7,PCOLORS[p.col],'center');
  }
  for(const t of G.texts){
    const q=W2U(t.x,t.y);
    sctx.globalAlpha=Math.min(1,t.t*2);
    text(sctx,t.str,q[0],q[1],7,t.col,'center');
    sctx.globalAlpha=1;
  }
  renderHUD(w,h);
  if(G.state==='levelup')renderLevelup(w,h);
  if(G.state==='paused'){
    sctx.fillStyle='rgba(0,0,0,0.5)';sctx.fillRect(0,0,w,h);
    text(sctx,'PAUSED',w/2,h/2-10,20,'#fff','center');
    text(sctx,'PRESS START OR ESC TO RESUME',w/2,h/2+14,8,'#b3a184','center');
  }
  if(G.state==='gameover')renderGameover(w,h);
  if(G.state==='victory')renderVictory(w,h);
  uiEnd();
}
// crop the exact (fractional) camera window out of the stepped buffer and
// stretch it to the screen — this is what makes the zoom continuous
function blit(sx,sy,sw,sh){
  sctx.setTransform(1,0,0,1,0,0);
  sctx.imageSmoothingEnabled=false;
  sctx.drawImage(view,sx,sy,sw,sh,0,0,screenC.width,screenC.height);
}
// Scale the screen context so view-space coordinates land in the same place
// the blitted world does; anything vector (text, bars, boxes) then rasterizes
// at full device resolution instead of view resolution.
function uiBegin(vw,vh){
  sctx.save();
  sctx.setTransform(screenC.width/vw,0,0,screenC.height/vh,0,0);
  sctx.imageSmoothingEnabled=false; // sprites drawn in the UI keep their pixel look
}
function uiEnd(){
  sctx.restore();
}


// ---------- HUD ----------
// Worldeater atmosphere: a closing dark vignette for the whole fight, a
// letterboxed reveal during the intro, and a red pulse once the enrage clock
// is running. Drawn under the HUD so the readable UI stays clean.
function renderWeMood(vw,vh){
  const b=G.boss;
  if(!b||b.dead||!b.def||b.def.id!=='worldeater')return;
  const ctx=sctx;
  const a=b.ai,k=vw/680;
  const ramp=clamp((G.time-(G.weSince||0))/2.5,0,1);
  const rg=ctx.createRadialGradient(vw/2,vh/2,Math.min(vw,vh)*0.32,vw/2,vh/2,Math.max(vw,vh)*0.62);
  rg.addColorStop(0,'rgba(10,6,20,0)');
  rg.addColorStop(1,'rgba(10,6,20,'+(0.36*ramp).toFixed(3)+')');
  ctx.fillStyle=rg;ctx.fillRect(0,0,vw,vh);
  if(b.phase===4&&a.enrageT<=10){
    const pl=0.5+0.5*Math.sin(G.time*9);
    ctx.fillStyle='rgba(255,30,60,'+(0.05+0.07*pl).toFixed(3)+')';
    ctx.fillRect(0,0,vw,vh);
  }
  if(a.mode==='intro'){
    const p=clamp(1-a.t/2.5,0,1);
    const bh=vh*0.11*Math.min(1,p*3);
    ctx.fillStyle='rgba(0,0,0,0.85)';
    ctx.fillRect(0,0,vw,bh);ctx.fillRect(0,vh-bh,vw,bh);
    ctx.globalAlpha=Math.min(1,p*1.6);
    text(ctx,'THE WORLDEATER',vw/2+2,vh*0.17+2,Math.max(5,Math.round(22*k)),'#1a0f22','center');
    text(ctx,'THE WORLDEATER',vw/2,vh*0.17,Math.max(5,Math.round(22*k)),'#ffb62e','center');
    text(ctx,'THE LAST WALL BETWEEN THE WORLD AND NOTHING',vw/2,vh*0.17+26*k,Math.max(5,Math.round(8*k)),'#b3a184','center');
    ctx.globalAlpha=1;
  }
}
function renderHUD(vw,vh){
  const ctx=sctx; // UI draws on the native-res screen canvas (see uiBegin)
  const k=vw/680; // keep the HUD a constant size on screen as the camera zooms
  const F=s=>Math.max(5,Math.round(s*k));
  for(let i=0;i<G.players.length;i++){
    const p=G.players[i];
    const x=5*k,y=(5+i*17)*k;
    ctx.fillStyle='rgba(26,15,8,0.55)';
    ctx.fillRect(x-1,y-1,72*k,15*k);
    ctx.fillStyle=PCOLORS[p.col];
    ctx.fillRect(x,y,4*k,13*k);
    text(ctx,'P'+(p.idx+1),x+7*k,y+k,F(7),PCOLORS[p.col]);
    if(p.dead)text(ctx,'DOWN',x+24*k,y+k,F(7),'#ff4d6d');
    else{
      ctx.fillStyle='#3a1218';ctx.fillRect(x+24*k,y+2*k,44*k,4*k);
      ctx.fillStyle='#ff4d6d';ctx.fillRect(x+24*k,y+2*k,Math.max(0,44*k*p.hp/p.maxhp),4*k);
    }
    text(ctx,p.kills+'k',x+24*k,y+7*k,F(6),'#b3a184');
    let wi=0;
    for(const id in p.weapons){
      ctx.fillStyle=WEAPONS[id].col;
      ctx.fillRect(x+(42+wi*5)*k,y+8*k,3*k,3*k);
      wi++;
    }
  }
  ctx.fillStyle='rgba(26,15,8,0.55)';
  if(G.mode==='classic'){
    ctx.fillRect(vw/2-52*k,3*k,104*k,13*k);
    text(ctx,'WAVE '+G.wave+'/20',vw/2-48*k,5*k,F(9),isBossWave(G.wave)?'#e33':'#ffe94a');
    text(ctx,fmtTime(G.time),vw/2+48*k,5*k,F(9),'#fff','right');
    if(G.waveState==='fight')text(ctx,((G.waveQuota-G.waveSpawned)+G.enemies.length)+' LEFT',vw/2,17*k,F(6),'#b3a184','center');
    else if(G.waveState==='inter')text(ctx,'NEXT WAVE IN '+Math.ceil(G.interLen-G.waveT),vw/2,17*k,F(7),'#57e86b','center');
  }else{
    ctx.fillRect(vw/2-24*k,3*k,48*k,13*k);
    text(ctx,fmtTime(G.time),vw/2,5*k,F(10),'#fff','center');
  }
  const bw=Math.min(300*k,vw*0.4),by=(G.mode==='classic'?26:19)*k;
  ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(vw/2-bw/2-1,by,bw+2,6*k);
  ctx.fillStyle='#2a1b42';ctx.fillRect(vw/2-bw/2,by+k,bw,4*k);
  ctx.fillStyle='#a76bff';ctx.fillRect(vw/2-bw/2,by+k,bw*clamp(G.xp/xpNeed(),0,1),4*k);
  text(ctx,'LV '+G.level,vw/2+bw/2+5*k,by-k,F(7),'#c9a4ff');

  // wave banner
  if(G.mode==='classic'&&(G.waveState==='pre'||G.waveState==='clear')){
    const boss=isBossWave(G.wave);
    const slide=clamp(G.waveT/0.35,0,1);
    const y=vh*(0.30-0.08*slide);
    if(G.waveState==='pre'){
      drawSpriteC(ctx,bannerSkullSprite,vw/2,y-18*k,2*k);
      text(ctx,'WAVE '+G.wave+' / 20',vw/2,y,F(18),boss?'#e33':'#ffe94a','center');
      if(boss)text(ctx,CLASSIC_BOSSES[waveDef(G.wave).boss].name+' AWAKENS',vw/2,y+20*k,F(10),'#e33','center');
    }else{
      text(ctx,'WAVE '+G.wave+' CLEAR',vw/2,y,F(18),'#ffd23e','center');
    }
  }

  if(G.boss&&!G.boss.dead){
    const b=G.boss,bbw=Math.min(360*k,vw*0.55),x0=vw/2-bbw/2;
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(x0-1,vh-18*k,bbw+2,12*k);
    ctx.fillStyle='#4d1220';ctx.fillRect(x0,vh-17*k,bbw,7*k);
    ctx.fillStyle=b.barCol||'#e33';ctx.fillRect(x0,vh-17*k,bbw*clamp(b.hp/b.maxhp,0,1),7*k);
    if(b.gates)for(const g of b.gates){ctx.fillStyle='#fff';ctx.fillRect(Math.round(x0+bbw*g),vh-17*k,1,7*k);}
    text(ctx,b.name||'BOSS',vw/2,vh-30*k,F(8),b.barCol||'#e33','center');
    for(let i=0;i<(b.phaseCount||1);i++){
      ctx.fillStyle=i<b.phase?(b.barCol||'#e33'):'#3a2028';
      ctx.fillRect(x0+bbw+6*k+i*6*k,vh-16*k,4*k,5*k);
    }
    if(b.castName){
      const cw=90*k,cx=vw/2-cw/2;
      ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(cx-1,vh-44*k,cw+2,9*k);
      ctx.fillStyle='#2a1d3a';ctx.fillRect(cx,vh-43*k,cw,7*k);
      ctx.fillStyle='#ffe94a';ctx.fillRect(cx,vh-43*k,cw*clamp(b.castP,0,1),7*k);
      // label above the bar: on-bar text is unreadable against both the fill and the empty track
      text(ctx,b.castName,vw/2+1,vh-53*k+1,F(7),'#000','center');
      text(ctx,b.castName,vw/2,vh-53*k,F(7),'#ffe94a','center');
      if(b.skullIcon)drawSpriteC(ctx,weSkullIcon,cx-9*k,vh-40*k,k);
    }
  }
  if(G.flashT>0&&G.flashMsg){
    ctx.globalAlpha=Math.min(1,G.flashT);
    text(ctx,G.flashMsg,vw/2,vh*0.25,F(12),'#ffe94a','center');
    ctx.globalAlpha=1;
  }
  if(G.subFlashT>0&&G.subFlash){
    ctx.globalAlpha=Math.min(1,G.subFlashT);
    text(ctx,G.subFlash,vw/2,vh*0.34,F(9),'#57e86b','center');
    ctx.globalAlpha=1;
  }
  if(G.players.length<4)text(ctx,'FRIENDS: PRESS (A) TO DROP IN',vw-6*k,vh-11*k,F(6),'rgba(255,255,255,0.4)','right');
  renderSoundHint(vw,vh);
}
function renderLevelup(vw,vh){
  const ctx=sctx; // UI draws on the native-res screen canvas (see uiBegin)
  const k=vw/680,F=s=>Math.max(5,Math.round(s*k));
  ctx.fillStyle='rgba(12,7,18,0.80)';ctx.fillRect(0,0,vw,vh);
  text(ctx,'LEVEL UP!  CHOOSE A BOON',vw/2,10*k,F(13),'#ffe94a','center');
  const rows=G.levelupPicks.length;
  const rowH=Math.min(58*k,(vh-50*k)/rows);
  const cardW=Math.min(150*k,(vw-90*k)/3);
  G.levelupPicks.forEach((pick,ri)=>{
    const y=34*k+ri*rowH;
    const p=pick.p;
    text(ctx,'P'+(p.idx+1),12*k,y+rowH/2-8*k,F(10),PCOLORS[p.col]);
    if(p.dead)text(ctx,'DOWN',12*k,y+rowH/2+4*k,F(6),'#ff4d6d');
    pick.offers.forEach((o,ci)=>{
      const x=34*k+ci*(cardW+8*k);
      const selected=pick.sel===ci;
      ctx.fillStyle=selected?'rgba(255,233,74,0.14)':'rgba(255,255,255,0.05)';
      ctx.fillRect(x,y,cardW,rowH-8*k);
      ctx.strokeStyle=pick.done?(selected?'#57e86b':'#333'):(selected?PCOLORS[p.col]:'#333c46');
      ctx.lineWidth=selected?2:1;
      ctx.strokeRect(x+0.5,y+0.5,cardW-1,rowH-8*k-1);
      let name,desc,col;
      if(o.kind==='heal'){name='POULTICE';desc='heal 60 hp';col='#ff4d6d';}
      else if(o.kind==='mhp'){name='VITALITY';desc='+25 max hp';col='#ff4d6d';}
      else{
        const wd=WEAPONS[o.id];col=wd.col;
        if(o.kind==='new'){name='NEW: '+wd.name;desc=wd.desc;}
        else{name=wd.name+' LV'+(p.weapons[o.id].lv+1);desc='upgrade!';}
      }
      ctx.fillStyle=col;ctx.fillRect(x+5*k,y+6*k,6*k,6*k);
      text(ctx,name,x+15*k,y+5*k,F(7),col);
      text(ctx,desc,x+15*k,y+15*k,F(6),'#b3a184');
      if(pick.done&&selected)text(ctx,'OK!',x+cardW-22*k,y+5*k,F(7),'#57e86b');
    });
  });
  text(ctx,'D-PAD/STICK/WASD: choose   (A)/SPACE or any button: confirm',vw/2,vh-14*k,F(7),'#b3a184','center');
}
function runGrade(){
  let s=100-G.deaths*7-Math.max(0,(G.overSince-1000))/24;
  if(s>=95)return{letter:'S',col:'#ffd23e'};
  if(s>=85)return{letter:'A',col:'#57e86b'};
  if(s>=70)return{letter:'B',col:'#39d5ff'};
  if(s>=55)return{letter:'C',col:'#d8c9a3'};
  return{letter:'D',col:'#b3a184'};
}
// End-screen charm accounting: how many of each party-wide charm the run
// banked and what they add up to per player, so the post-game math is visible.
const BUFF_SUMMARY=[

  ['regen','+REGEN',n=>'+'+(n*0.6).toFixed(1)+'/s','#57e86b'],
  ['maxhp','+MAX HP',n=>'+'+(n*20),'#ff4d6d'],

  ['magnet','+MAGNET',n=>'+'+(n*16),'#b06bff']

function renderBuffSummary(x,y,k,F){
  const ctx=sctx;
  text(ctx,'PARTY CHARMS',x,y,F(7),'#b3a184');
  BUFF_SUMMARY.forEach((b,i)=>{
    const[type,label,fx,col]=b,n=G.buffTally[type]||0;
    const ry=y+11*k+i*10*k;
    drawSpriteC(ctx,buffIcons[type],x+5*k,ry+4*k,k);
    text(ctx,label,x+13*k,ry,F(7),n?col:'#5a5248');
    text(ctx,'x'+n,x+62*k,ry,F(7),n?'#fff':'#5a5248');
    if(n)text(ctx,fx(n),x+82*k,ry,F(7),'#d8c9a3');

}

// Live controller roster: every failure mode of "my pad doesn't work" used to be
// invisible. Now the menus show exactly what the browser sees, per pad.
function renderPadRoster(vw,vh){
  const ctx=sctx,k=vw/680,F=s=>Math.max(5,Math.round(s*k));
  const pads=pollPads(),x=vw-6*k;
  let y=6*k,anyNonStd=false,realPads=0;
  text(ctx,'CONTROLLERS',x,y,F(7),'#b3a184','right');y+=9*k;
  for(const p of pads){
    let label;
    if(p.index===KB_INDEX)label='KEYBOARD';
    else{
      realPads++;label='PAD '+(p.index+1);
      if(p.mapping!=='standard'){label+=' !';anyNonStd=true;}
    }
    const pl=G.players.find(q=>q.padIndex===p.index);
    const st=pl?('JOINED AS P'+(pl.idx+1)):(p.index===KB_INDEX?'SPACE TO JOIN':'(A) TO JOIN');
    text(ctx,label+' — '+st,x,y,F(6),pl?PCOLORS[pl.col]:'rgba(255,255,255,0.6)','right');
    y+=8*k;
    // live readout while a button/stick is held on an unjoined pad: shows the
    // raw indices the browser reports, so a scrambled pad debugs itself
    // (index jargon, deliberately untranslated)
    if(!pl&&p.index!==KB_INDEX){
      const act=[];
      for(let i=0;i<p.buttons.length;i++)if(p.buttons[i]&&p.buttons[i].pressed)act.push('B'+i);
      for(let i=0;i<p.axes.length;i++)if(Math.abs(p.axes[i])>0.45)act.push('AX'+i);
      if(act.length){text(ctx,'SEES: '+act.slice(0,6).join(' '),x,y,F(6),'#57e86b','right');y+=8*k;}
    }
  }
  if(!realPads){text(ctx,'NO GAMEPADS SEEN — PRESS A BUTTON ON EACH PAD',x,y,F(6),'#ff9040','right');y+=8*k;}
  // localhost is a secure context, a plain-http LAN/tailnet IP is not — and
  // browsers increasingly hide the Gamepad API on insecure pages
  if(!realPads&&!window.isSecureContext){
    text(ctx,'PAGE IS PLAIN HTTP — THIS BROWSER MAY HIDE GAMEPADS',x,y,F(6),'#ff4d6d','right');y+=8*k;
    text(ctx,'SERVE OVER HTTPS OR OPEN THE FILE LOCALLY',x,y,F(6),'#ff4d6d','right');y+=8*k;
  }
  if(anyNonStd)text(ctx,'! ODD MAPPING — IF (A) FAILS, TRY ANY BUTTON',x,y,F(6),'#ff9040','right');
}

  text(ctx,'CHOOSE YOUR QUEST',vw/2,vh*0.16,F(16),'#ffe94a','center');
  const cw=132*k,ch=86*k,gap=18*k,y=vh*0.34;
  const defs=[
    {icon:classicIcon,name:'CLASSIC',sub:'20 WAVES / 4 BOSSES',col:'#ffd23e',
     lines:['a finite raid','boss every 5 waves','breathers between waves','clear wave 20 to WIN']},
    {icon:endlessIcon,name:'ENDLESS',sub:'SURVIVE FOREVER',col:'#39d5ff',
     lines:['the original horde','ramps with the clock','bosses every ~3 min','no win, only time']}];
  defs.forEach((d,i)=>{
    const x=vw/2-(cw*2+gap)/2+i*(cw+gap),sel=G.modeSel===i;
    ctx.fillStyle=sel?'rgba(255,233,74,0.14)':'rgba(255,255,255,0.05)';
    ctx.fillRect(x,y,cw,ch);
    ctx.strokeStyle=sel?d.col:'#333c46';ctx.lineWidth=sel?2:1;
    ctx.strokeRect(x+0.5,y+0.5,cw-1,ch-1);
    drawSpriteC(ctx,d.icon,x+cw/2,y+16*k,2*k);
    text(ctx,d.name,x+cw/2,y+30*k,F(11),d.col,'center');
    text(ctx,d.sub,x+cw/2,y+43*k,F(6),'#b3a184','center');
    d.lines.forEach((l,j)=>text(ctx,'- '+l,x+8*k,y+54*k+j*8*k,F(6),'#d8c9a3'));
    if(sel&&Math.floor(performance.now()/300)%2===0)text(ctx,'>',x-9*k,y+ch/2-6*k,F(12),d.col,'center');
  });
  // the party, wearing their chosen colours
  const t=performance.now()/1000,n=G.players.length;
  G.players.forEach((p,i)=>{
    const x=vw/2-(n-1)*24*k+i*48*k,py=vh*0.68+Math.sin(t*2+i)*2*k;
    drawSpriteC(ctx,playerSprites[p.col],x,py,2*k);
    text(ctx,'P'+(p.idx+1),x,py+14*k,F(7),PCOLORS[p.col],'center');
  });
  text(ctx,'LEFT/RIGHT: choose   UP/DOWN: your color   (A)/SPACE: start   (B)/BACKSPACE: back',vw/2,vh*0.80,F(7),'#b3a184','center');
  text(ctx,'FRIENDS: PRESS (A) TO DROP IN  ('+G.players.length+'/4)',vw/2,vh*0.87,F(7),'#57e86b','center');
}

// ---------- main loop ----------
let last=performance.now();
let slowT=0; // brief slow-motion for big moments (phase breaks, boss deaths)
function setSlow(t){slowT=Math.max(slowT,t);}
function frame(now){
  let dt=Math.min(0.033,(now-last)/1000);
  last=now;
  if(slowT>0){slowT-=dt;dt*=0.30;}
  update(dt);
  if(G.state!=='title'&&G.state!=='modesel')updateCamera(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

</script>
</body>
