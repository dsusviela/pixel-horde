// ---------- helpers ----------
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const TAU=Math.PI*2;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=a[i];a[i]=a[j];a[j]=t;}return a;}

function h2(x,y,s){
  let n=(x|0)*374761393+(y|0)*668265263+(s|0)*974634551;
  n=(n^(n>>>13))*1274126177; n=(n^(n>>>16))>>>0;
  return n/4294967296;
}
function smooth(t){return t*t*(3-2*t);}
function vnoise(x,y,s){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const a=h2(xi,yi,s),b=h2(xi+1,yi,s),c=h2(xi,yi+1,s),d=h2(xi+1,yi+1,s);
  const u=smooth(xf),v=smooth(yf);
  return lerp(lerp(a,b,u),lerp(c,d,u),v);
}
function makeRng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}

function makeSprite(rows,pal){
  const w=rows[0].length,h=rows.length;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<rows[y].length;x++){
    const ch=rows[y][x];
    if(ch==='.'||ch===' ')continue;
    g.fillStyle=pal[ch]||'#f0f';
    g.fillRect(x,y,1,1);
  }
  return c;
}

// ---------- audio ----------
let AC=null,masterGain=null,comp=null;
const sfxLast={};
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    comp=AC.createDynamicsCompressor();
    comp.threshold.value=-18;comp.ratio.value=12;comp.attack.value=0.003;comp.release.value=0.25;
    masterGain=AC.createGain();masterGain.gain.value=0.32;
    masterGain.connect(comp);comp.connect(AC.destination);
  }catch(e){}
}
function unlockAudio(){initAudio();if(AC&&AC.state==='suspended')AC.resume();if(AC)musGo();}
// gamepad presses are NOT a user-activation gesture in Chrome — grab any real gesture too
addEventListener('pointerdown',unlockAudio);
addEventListener('pointerup',unlockAudio);
addEventListener('touchstart',unlockAudio);
addEventListener('keydown',unlockAudio);
addEventListener('click',unlockAudio);
function audioLive(){return !!AC&&AC.state==='running';}
let noiseBuf=null;
function getNoise(){
  if(!noiseBuf){
    noiseBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*0.5),AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  return noiseBuf;
}
let voices=0;
function voiceOk(){return voices<26;}
function beep(freq,dur,type,slide,vol){
  if(!AC||!voiceOk())return;
  voices++;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';
  const t=AC.currentTime;
  o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),t+dur);
  g.gain.setValueAtTime(vol||0.15,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(masterGain);
  o.onended=()=>{voices--;};
  o.start(t);o.stop(t+dur+0.02);
}
function noiseHit(dur,vol,freq){
  if(!AC||!voiceOk())return;
  voices++;

// ---------- music ----------
// A tiny lookahead sequencer, synthesized like the sfx — no audio files. A
// director reads game state every tick and picks the track: menu bells, one
// combat theme per classic act (drums drop to a breather between waves), an
// omen heartbeat in the intermission before a boss, a theme per raid boss
// that climbs with its phases, and an endless groove that gains tempo and
// layers as the run gets old. Stage changes are played up: tracks crossfade,
// boss themes slam in, and a phase gate fires a drum-fill break before the
// faster section restarts from the downbeat.
const MUS={timer:null,cur:'',gain:null,next:0,step:0,ph:0,att:0.5};
const MUS_RIFF=[0,0,3,0,5,3,2,0]; // worldeater phrygian riff, semitones above root
function musNote(freq,t,dur,type,vol,slide){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(MUS.gain);
  o.start(t);o.stop(t+dur+0.05);
}
function musThump(t,vol){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(150,t);
  o.frequency.exponentialRampToValueAtTime(42,t+0.14);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  o.connect(g);g.connect(MUS.gain);
  o.start(t);o.stop(t+0.2);
}
function musHiss(t,vol,hz){
  const s=AC.createBufferSource();s.buffer=getNoise();s.loop=true;
  const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hz||3000;
  const g=AC.createGain();
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
  s.connect(f);f.connect(g);g.connect(MUS.gain);
  s.start(t);s.stop(t+0.12);
}
const semiF=(root,s)=>root*Math.pow(2,s/12);
// one identity per classic act: key, tempo and riff all darken as the
// crusade goes on. Holes in the patterns are rests.
const ACT_MUS=[
 {bpm:104,root:110,  kick:[0,8],      hat:[4,12],      // act 1: A minor march
  bass:[0,,0,,3,,,0,0,,5,,3,,2,],
  lead:[12,,15,,17,,15,12,10,,12,,15,,,]},
 {bpm:116,root:98,   kick:[0,6,8],    hat:[4,12],      // act 2: G dorian drive
  bass:[0,,0,3,0,,5,,0,,0,3,7,,5,3],
  lead:[12,,10,,12,15,,12,17,,15,,12,,10,]},
 {bpm:126,root:87.31,kick:[0,4,8,12], hat:[2,6,10,14], // act 3: F phrygian menace
  bass:[0,1,0,,0,1,3,,0,1,0,,5,,3,1],
  lead:[12,,13,,12,,10,,8,,7,,8,10,12,13]},
 {bpm:136,root:82.41,kick:[0,4,8,10,12],hat:[2,6,10,14], // act 4: E phrygian dominant
  bass:[0,,1,,4,,1,0,0,,1,,8,,7,4],
  lead:[12,13,16,,13,,12,,16,,17,16,13,12,,]}];
function actStep(t){
  const a=clamp(((G.wave-1)/5)|0,0,3),c=ACT_MUS[a];
  const w=clamp((G.wave-1)%5,0,3); // wave within the act = intensity 0..3
  const s=MUS.step%16,dur=60/c.bpm/4;
  if(G.waveState!=='fight'){
    // breather between waves: the act's lead becomes a slow soft arp
    if(s===0)musNote(c.root/2,t,dur*16,'sine',0.05);
    if(s%4===0){const n=c.lead[s];if(n!=null)musNote(semiF(c.root,n),t,dur*6,'triangle',0.03);}
    return dur;
  }
  if(c.kick.indexOf(s)>=0)musThump(t,s===0?0.30:0.22);
  if(w>=1&&c.hat.indexOf(s)>=0)musHiss(t,0.05,6000);
  const b=c.bass[s];
  if(b!=null){
    const f=semiF(c.root,b);
    musNote(f,t,dur*1.8,'sawtooth',0.05);
    if(w>=3)musNote(f*1.4983,t,dur*1.6,'sawtooth',0.024); // grim fifth
  }
  if(w>=2){const l=c.lead[s];if(l!=null)musNote(semiF(c.root*2,l),t,dur*1.9,'square',0.028);}
  if(s===0)musNote(c.root/2,t,dur*16,'sine',0.045); // sub drone, one per bar
  return dur;
}
// the intermission before a boss wave: a heartbeat that will not slow down,
// a flatted-second rub, and clock ticks once the banner is close
function omenStep(t){
  const s=MUS.step%16,dur=0.24;
  const k=G.waveState==='pre'?1:clamp(G.waveT/Math.max(1,G.interLen),0,1);
  if(s===0)musThump(t,0.26+0.10*k);
  if(s===3)musThump(t,0.16+0.08*k);
  if(s===0)musNote(55,t,dur*16,'sine',0.05+0.04*k);
  if(s===8)musNote(semiF(55,1),t,dur*10,'sine',0.02+0.03*k);
  if(k>0.55&&s%2===1)musHiss(t,0.02+0.05*k,7000);
  if(s===12&&k>0.75)musNote(110,t,dur*4,'sawtooth',0.03,110);
  return dur;
}
// Slagmaw: a foundry — stomp on every beat, anvil clangs, low powerchords
function slagmawStep(t){
  const ph=G.boss.phase,s=MUS.step%16,dur=60/(ph===1?88:104)/4,root=55;
  if(s%4===0)musThump(t,s===0?0.34:0.26);
  if(ph>=2&&(s===2||s===10))musThump(t,0.18); // gallop once the forge lights
  if(s===4||s===12){musHiss(t,0.09,2400);musNote(1244,t,0.05,'square',0.03);} // anvil
  const R=[0,,,,0,,3,,0,,,,2,,3,],n=R[s];
  if(n!=null){
    const f=semiF(root,n);
    musNote(f,t,dur*3.2,'sawtooth',0.06);
    musNote(f*2,t,dur*2.8,'sawtooth',0.025);
    if(ph>=2)musNote(f*1.4983,t,dur*3,'sawtooth',0.03);
  }
  if(ph>=2&&s%8===6)musNote(semiF(root*4,3),t,dur*1.5,'square',0.03); // ember spark

}
// Geminox: twins — one melody sung by two detuned voices, the second always
// one step behind the first, tightening every phase
function geminoxStep(t){
  const ph=G.boss.phase,s=MUS.step%16,dur=60/[100,114,130][ph-1]/4,root=73.42;
  if(s===0||s===8||(ph>=2&&(s===6||s===14)))musThump(t,s===0?0.28:0.20);
  if(ph>=2&&s%2===1)musHiss(t,0.035,8000); // crystal shimmer
  const M=[0,2,3,7,8,7,3,2];
  if(s%2===0){
    const i=(s/2)%8;
    musNote(semiF(root*2,M[i]),t,dur*1.8,'sawtooth',0.038);
    musNote(semiF(root*2,M[(i+7)%8])*1.006,t,dur*1.8,'sawtooth',ph>=2?0.03:0.016);
  }
  if(ph>=3&&s%4===0)musNote(root,t,dur*3.5,'sawtooth',0.05); // bass joins for the split
  return dur;

// Pyraxis: fire — relentless tremolo 16ths with a flame lick climbing out of
// every other bar, gallop and a high ostinato as the tide rises
function pyraxisStep(t){
  const ph=G.boss.phase,s=MUS.step%16,dur=60/[112,130,148][ph-1]/4,root=65.41;
  if(s%4===0)musThump(t,s===0?0.30:0.22);
  if(ph>=2&&s%4===2)musThump(t,0.15);
  if(s%2===1)musHiss(t,ph===3?0.06:0.035,5000);
  const R=[0,0,1,1,0,0,3,3,0,0,1,1,5,5,3,3];
  musNote(semiF(root,R[s]),t,dur*0.9,'sawtooth',s%2?0.03:0.05);
  if(((MUS.step/16)|0)%2===1&&s>=12)musNote(semiF(root*2,[7,8,10,12][s-12]),t,dur*1.6,'square',0.035);
  if(ph>=3&&s%2===0)musNote(semiF(root*4,s%4===0?1:0),t,dur*0.8,'square',0.02);
  return dur;
}
// Worldeater: the original doom theme — 8th notes, each phase raises the
// tempo and adds a layer, the enrage doubles the drums
function worldeaterStep(t){
  const b=G.boss,ph=b.phase,enr=ph===4&&b.ai.enrageT<=10;
  const dur=60/(enr?164:[92,104,118,140][ph-1])/2,s=MUS.step%8;
  const root=ph===4?110:55;
  if(s===0||s===4||(ph>=3&&(s===2||s===6))||enr)musThump(t,s===0?0.30:0.22);
  if(ph>=2&&s===4)musHiss(t,0.10,1600);
  if(ph>=3&&s%2===1)musHiss(t,0.035,5000);
  const f0=semiF(root,MUS_RIFF[s]+(ph===4&&s===6?1:0));
  musNote(f0,t,dur*0.92,'sawtooth',0.055);
  if(ph>=2&&s===0)musNote(55,t,dur*8,'sine',0.06);
  if(ph>=3)musNote(f0*1.4983,t,dur*0.85,'sawtooth',0.028);
  if(ph===4&&s===6)musNote(semiF(root*2,1),t,dur*1.6,'square',0.04);
  return dur;
}
// endless: a groove over a cycling Am-Am-C-G progression; every 75 seconds
// survived buys another notch of tempo and one more layer
function endlessStep(t){
  const tier=Math.min(5,(G.time/75)|0);
  const dur=60/(106+7*tier)/4,s=MUS.step%16,bar=(MUS.step/16)|0;
  const root=semiF(110,[0,0,3,-2][bar%4]);
  if(s===0||s===8||(tier>=2&&(s===6||s===14)))musThump(t,s===0?0.28:0.20);
  if(tier>=1&&(s===4||s===12))musHiss(t,0.06,6000);
  if(tier>=3&&s%2===1)musHiss(t,0.03,8000);
  const R=[0,,0,,7,,5,,0,,3,,5,,7,],n=R[s];
  if(n!=null){
    const f=semiF(root,n);
    musNote(f,t,dur*1.8,'sawtooth',0.05);
    if(tier>=4)musNote(f*1.4983,t,dur*1.5,'sawtooth',0.022);
  }
  if(tier>=2){const L=[12,,10,,12,,15,,17,,15,,12,,10,],l=L[s];
    if(l!=null)musNote(semiF(root*2,l),t,dur*1.9,'square',0.026);}
  if(s===0)musNote(root/2,t,dur*16,'sine',0.045);

function menuStep(t){
  const s=MUS.step%16,dur=0.22;

  if(s%2===0)musNote(semiF(220,[0,3,7,10,12,10,7,3][(s/2)%8]),t,dur*3.5,'triangle',0.022);
  if(s===0&&((MUS.step/16)|0)%4===2)musNote(110*1.4983,t,dur*12,'sine',0.03);

const MUS_TRACKS={menu:menuStep,omen:omenStep,act:actStep,endless:endlessStep,

const MUS_BOSS_IDS=['slagmaw','geminox','pyraxis','worldeater'];
function musDesired(){
  if(G.state==='title'||G.state==='modesel')return 'menu';
  if(G.state==='gameover'||G.state==='victory')return '';
  const b=G.boss;
  if(b&&!b.dead&&b.def&&MUS_TRACKS[b.def.id])return b.def.id;
  if(G.mode==='endless')return 'endless';
  if(G.wave>=20)return ''; // the Worldeater has fallen — silence under the fanfare
  if((G.waveState==='inter'&&isBossWave(G.wave+1))||(G.waveState==='pre'&&isBossWave(G.wave)))return 'omen';
  return 'act';
}
function musTick(){
  if(!audioLive())return;
  const want=musDesired();
  if(want!==MUS.cur){
    if(MUS.gain){
      const g=MUS.gain;
      g.gain.setTargetAtTime(0.0001,AC.currentTime,0.22);
      setTimeout(()=>{try{g.disconnect();}catch(e){}},1600);
      MUS.gain=null;
    }
    MUS.cur=want;
    if(want){
      MUS.gain=AC.createGain();
      MUS.gain.gain.setValueAtTime(0.0001,AC.currentTime);
      MUS.gain.connect(masterGain);
      MUS.next=AC.currentTime+0.12;MUS.step=0;
      MUS.ph=G.boss?G.boss.phase:0;
      // boss themes slam in, everything else breathes in
      MUS.att=MUS_BOSS_IDS.indexOf(want)>=0?0.15:(want==='menu'||want==='omen'?1.1:0.5);
    }
  }
  if(!MUS.cur||!MUS.gain)return;
  const duck=G.state==='paused'?0.22:G.state==='levelup'?0.5:1;
  MUS.gain.gain.setTargetAtTime(duck,AC.currentTime,duck<1?0.2:MUS.att);
  // phase gate drama: a drum-fill break and a riser, then the faster section
  // restarts from the downbeat
  const b=G.boss;
  if(MUS_BOSS_IDS.indexOf(MUS.cur)>=0&&b&&b.phase!==MUS.ph){
    MUS.ph=b.phase;
    const t0=Math.max(MUS.next,AC.currentTime+0.02);
    for(let i=0;i<4;i++){musHiss(t0+i*0.09,0.10+0.03*i,3000);musThump(t0+i*0.09,0.16+0.04*i);}
    musNote(55,t0,0.45,'sawtooth',0.07,440);
    MUS.next=t0+0.42;MUS.step=0;
  }
  const stepFn=MUS_TRACKS[MUS.cur];
  while(MUS.next<AC.currentTime+0.30){MUS.next+=stepFn(MUS.next);MUS.step++;}
}
function musGo(){if(!MUS.timer)MUS.timer=setInterval(musTick,80);}
function musStop(){ // hard cut — the Worldeater's fall owns the silence
  if(MUS.gain){
    const g=MUS.gain;
    g.gain.setTargetAtTime(0.0001,AC.currentTime,0.08);
    setTimeout(()=>{try{g.disconnect();}catch(e){}},800);
    MUS.gain=null;
  }
  MUS.cur='';
}

function tr(s){
  if(LANG!=='es')return s;
  if(!/[A-Za-z]/.test(s))return s;
  const hit=ES[s];
  if(hit!==undefined)return hit;
  for(const r of ES_RX){const m=r[0].exec(s);if(m)return r[1](m);}
  return s;
}

// ---------- input ----------
const padState={};
addEventListener('gamepaddisconnected',e=>{delete padState[e.gamepad.index];});
addEventListener('gamepadconnected',e=>{delete padState[e.gamepad.index];unlockAudio();});
// the keyboard pretends to be one more gamepad, so a solo player needs no
// controller — every screen that reads pads (join, menus, level-up, play)
// works with it unchanged
const KB_INDEX='kb';
const KB_MAP={
  KeyW:[12],ArrowUp:[12], KeyS:[13],ArrowDown:[13],
  KeyA:[14],ArrowLeft:[14], KeyD:[15],ArrowRight:[15],
  Space:[0],Enter:[0],
  Backspace:[1,8],
  Escape:[9],KeyP:[9],
  KeyL:[20] // synthetic button: language toggle on the title screen
};
const kbDown={};
addEventListener('keydown',e=>{
  if(!KB_MAP[e.code])return;
  kbDown[e.code]=true;
  e.preventDefault();
});
addEventListener('keyup',e=>{if(KB_MAP[e.code])delete kbDown[e.code];});
addEventListener('blur',()=>{for(const k in kbDown)delete kbDown[k];});
function keyboardPad(){
  const buttons=[];
  for(let i=0;i<21;i++)buttons.push({pressed:false});
  for(const code in kbDown)for(const b of KB_MAP[code])buttons[b].pressed=true;
  return {index:KB_INDEX,connected:true,buttons,axes:[0,0]};
}
function pollPads(){
  // some browsers throw a SecurityError here on insecure (plain-http) origins
  // instead of returning an empty list — never let that kill the game loop
  let pads=[];
  try{pads=navigator.getGamepads?navigator.getGamepads():[];}catch(e){}
  const out=[];
  for(const p of pads){if(p&&p.connected)out.push(p);}
  out.push(keyboardPad());
  return out;
}
function padPrev(i){return padState[i]||(padState[i]={buttons:[],ax:0,ay:0});}
function pressed(p,b){
  const prev=padPrev(p.index);
  const now=!!(p.buttons[b]&&p.buttons[b].pressed);
  return now&&!prev.buttons[b];
}
// joining must be forgiving: pads with a non-"standard" mapping can report the
// physical A anywhere, so any face button or START gets an unjoined pad in
// joining must be forgiving: off-brand pads (D-input mode, scrambled HID maps)
// can report the physical A at any index at all, so ANY button gets an
// unjoined pad in — except the d-pad (12-15, that's navigation), BACK (8, the
// title-screen language toggle) and the synthetic language key (20). Returns
// the button that joined so menus keep treating it as ACCEPT (on Switch-layout
// pads the physical A is button 1), or -1.
function joinPressed(p){
  for(let b=0;b<p.buttons.length;b++){
    if(b===8||(b>=12&&b<=15)||b===20)continue;
    if(pressed(p,b))return b;
  }
  return -1;
}
// single-action screens (level-up confirm) go further: ANY button confirms,
// except the d-pad (12-15, that's navigation) and START (9, pause muscle
// memory / Esc on the keyboard) — a scrambled pad can report the physical A
// anywhere at all, even where HOME usually lives
function confirmPressed(p){
  for(let b=0;b<p.buttons.length;b++){
    if((b>=12&&b<=15)||b===9)continue;
    if(pressed(p,b))return true;
  }
  return false;
}
function navX(p){
  const prev=padPrev(p.index);
  let x=0;
  if(p.buttons[14]&&p.buttons[14].pressed)x=-1;
  else if(p.buttons[15]&&p.buttons[15].pressed)x=1;
  else if(p.axes[0]<-0.5)x=-1;
  else if(p.axes[0]>0.5)x=1;
  return (x!==0&&x!==prev.ax)?x:0;
}
function navY(p){
  const prev=padPrev(p.index);
  let y=0;
  if(p.buttons[12]&&p.buttons[12].pressed)y=-1;
  else if(p.buttons[13]&&p.buttons[13].pressed)y=1;
  else if(p.axes[1]<-0.5)y=-1;
  else if(p.axes[1]>0.5)y=1;
  return (y!==0&&y!==prev.ay)?y:0;
}
function storePadStates(pads){
  for(const p of pads){
    const st=padPrev(p.index);
    st.buttons=p.buttons.map(b=>b.pressed);
    let x=0,y=0;
    if(p.buttons[14]&&p.buttons[14].pressed)x=-1;
    else if(p.buttons[15]&&p.buttons[15].pressed)x=1;
    else if(p.axes[0]<-0.5)x=-1;
    else if(p.axes[0]>0.5)x=1;
    if(p.buttons[12]&&p.buttons[12].pressed)y=-1;
    else if(p.buttons[13]&&p.buttons[13].pressed)y=1;
    else if(p.axes[1]<-0.5)y=-1;
    else if(p.axes[1]>0.5)y=1;
    st.ax=x;st.ay=y;
  }
}
function stick(p){
  let x=p.axes[0]||0,y=p.axes[1]||0;
  if(p.buttons[14]&&p.buttons[14].pressed)x=-1;
  if(p.buttons[15]&&p.buttons[15].pressed)x=1;
  if(p.buttons[12]&&p.buttons[12].pressed)y=-1;
  if(p.buttons[13]&&p.buttons[13].pressed)y=1;
  const m=Math.hypot(x,y);
  if(m<0.25)return {x:0,y:0};
  const s=Math.min(1,(m-0.25)/0.7)/m;
  return {x:x*s,y:y*s};
}

// ---------- terrain ----------
const TILE=16,CHUNK=16,CHPX=TILE*CHUNK;
const T_GRASS=0,T_ROCK=1,T_MUD=2,T_ACID=3;
function tileType(tx,ty){
  if(tx*tx+ty*ty<64)return T_GRASS;
  if(vnoise(tx*0.34,ty*0.34,11)>0.775)return T_ROCK;
  if(vnoise(tx*0.13,ty*0.13,22)>0.73)return T_MUD;
  if(vnoise(tx*0.2,ty*0.2,33)>0.815)return T_ACID;
  return T_GRASS;
}
const tileCache=new Map();
function tileAt(tx,ty){
  const k=tx+','+ty;
  const ov=G.tileOverride.get(k);
  if(ov!==undefined)return ov;
  let t=tileCache.get(k);
  if(t===undefined){t=tileType(tx,ty);tileCache.set(k,t);if(tileCache.size>60000)tileCache.clear();}
  return t;
}
function solidAt(x,y){return tileAt(Math.floor(x/TILE),Math.floor(y/TILE))===T_ROCK;}
function hazardAt(x,y){
  const tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);
  if(G.creep&&G.creep.has(tx+','+ty))return 'mud';
  const t=tileAt(tx,ty);
  return t===T_MUD?'mud':(t===T_ACID?'acid':null);
}
const chunkCanvases=new Map();
function chunkCanvas(cx,cy){
  const k=cx+','+cy;
  let c=chunkCanvases.get(k);
  if(c)return c;
  c=document.createElement('canvas');c.width=CHPX;c.height=CHPX;
  const g=c.getContext('2d');
  for(let ty=0;ty<CHUNK;ty++)for(let tx=0;tx<CHUNK;tx++){
    const wx=cx*CHUNK+tx,wy=cy*CHUNK+ty;
    const t=tileAt(wx,wy);
    const px=tx*TILE,py=ty*TILE;
    const h=h2(wx,wy,7);
    if(t===T_GRASS||t===T_ROCK){
      g.fillStyle=h<0.33?'#233a1e':(h<0.66?'#27401f':'#2b4622');
      g.fillRect(px,py,TILE,TILE);
      if(h2(wx,wy,8)<0.18){g.fillStyle='#3a5628';g.fillRect(px+((h*13)|0)%12+2,py+((h*29)|0)%12+2,2,1);}
      if(h2(wx,wy,9)<0.05){g.fillStyle='#4a6a34';g.fillRect(px+7,py+8,1,2);g.fillRect(px+6,py+7,3,1);}
      if(t===T_GRASS){
        const fh=h2(wx,wy,12);
        if(fh<0.030){
          const fx=px+3+((h*17)|0)%9,fy=py+3+((h*31)|0)%9;
          g.fillStyle=fh<0.010?'#c07bff':(fh<0.020?'#ff6bd6':'#ffd23e');
          g.fillRect(fx-1,fy,1,1);g.fillRect(fx+1,fy,1,1);g.fillRect(fx,fy-1,1,1);g.fillRect(fx,fy+1,1,1);
          g.fillStyle='#fff2c0';g.fillRect(fx,fy,1,1);
        }else if(fh>0.988){
          const mx=px+4+((h*23)|0)%7,my=py+5+((h*41)|0)%7;
          g.fillStyle='#e8e0cc';g.fillRect(mx,my+1,1,2);
          g.fillStyle='#d8452e';g.fillRect(mx-1,my,3,1);
          g.fillStyle='#fff';g.fillRect(mx,my,1,1);
        }
      }
    }
    if(t===T_ROCK){
      g.fillStyle='#3a352b';g.fillRect(px+1,py+2,14,13);
      g.fillStyle='#5f584a';g.fillRect(px+2,py+1,12,12);
      g.fillStyle='#776f5e';g.fillRect(px+3,py+2,10,4);
      g.fillStyle='#2b2720';g.fillRect(px+3,py+12,10,2);
      if(h<0.5){g.fillStyle='#8a8272';g.fillRect(px+4,py+3,3,2);}
      if(h>0.62){g.fillStyle='#4a6a32';g.fillRect(px+3,py+2,4,1);g.fillRect(px+9,py+3,3,1);}
    }else if(t===T_MUD){
      g.fillStyle='#453626';g.fillRect(px,py,TILE,TILE);
      g.fillStyle='#52412c';g.fillRect(px+1,py+1,TILE-2,TILE-2);
      if(h<0.4){g.fillStyle='#382c1e';g.fillRect(px+3,py+4,4,3);}
      if(h>0.6){g.fillStyle='#382c1e';g.fillRect(px+9,py+9,4,3);}
    }else if(t===T_ACID){
      g.fillStyle='#241539';g.fillRect(px,py,TILE,TILE);
      g.fillStyle='#332052';g.fillRect(px+1,py+1,TILE-2,TILE-2);
      g.fillStyle='#8a5cff';
      if(h<0.5){g.fillRect(px+4,py+5,2,2);g.fillRect(px+10,py+9,2,2);}
      else {g.fillRect(px+8,py+3,2,2);g.fillRect(px+3,py+10,2,2);}
      if(h2(wx,wy,15)<0.25){g.fillStyle='#c9a4ff';g.fillRect(px+6+((h*19)|0)%6,py+6+((h*37)|0)%6,1,1);}
    }
  }
  chunkCanvases.set(k,c);
  if(chunkCanvases.size>140){
    const first=chunkCanvases.keys().next().value;
    if(first!==k)chunkCanvases.delete(first);
  }
  return c;
}
function moveCollide(o,dx,dy){
  const r=o.r;
  let nx=o.x+dx;
  if(dx!==0){
    const edge=nx+Math.sign(dx)*r;
    const tx=Math.floor(edge/TILE);
    const ty0=Math.floor((o.y-r*0.7)/TILE),ty1=Math.floor((o.y+r*0.7)/TILE);
    let blocked=false;
    for(let ty=ty0;ty<=ty1;ty++)if(tileAt(tx,ty)===T_ROCK){blocked=true;break;}
    if(blocked)nx=dx>0?tx*TILE-r-0.01:(tx+1)*TILE+r+0.01;
  }
  o.x=nx;
  let ny=o.y+dy;
  if(dy!==0){
    const edge=ny+Math.sign(dy)*r;
    const ty=Math.floor(edge/TILE);
    const tx0=Math.floor((o.x-r*0.7)/TILE),tx1=Math.floor((o.x+r*0.7)/TILE);
    let blocked=false;
    for(let tx=tx0;tx<=tx1;tx++)if(tileAt(tx,ty)===T_ROCK){blocked=true;break;}
    if(blocked)ny=dy>0?ty*TILE-r-0.01:(ty+1)*TILE+r+0.01;
  }
  o.y=ny;
}
// never leave an entity buried inside rock (the leash can shove them in)
function unstick(o){
  if(!solidAt(o.x,o.y))return;
  const bx=Math.floor(o.x/TILE),by=Math.floor(o.y/TILE);
  let bd=1e9,nx=o.x,ny=o.y;
  for(let ty=by-3;ty<=by+3;ty++)for(let tx=bx-3;tx<=bx+3;tx++){
    if(tileAt(tx,ty)===T_ROCK)continue;
    const cx=tx*TILE+TILE/2,cy=ty*TILE+TILE/2,d=dist2(o.x,o.y,cx,cy);
    if(d<bd){bd=d;nx=cx;ny=cy;}
  }
  o.x=nx;o.y=ny;
}
function losClear(x0,y0,x1,y1){
  const dx=x1-x0,dy=y1-y0,d=Math.hypot(dx,dy)||1,st=Math.ceil(d/6);
  for(let i=1;i<st;i++){const t=i/st;if(solidAt(x0+dx*t,y0+dy*t))return false;}
  return true;
}
function umbra(bx,by,q){
  const cs=[[q.x-q.hw,q.y-q.hh],[q.x+q.hw,q.y-q.hh],[q.x+q.hw,q.y+q.hh],[q.x-q.hw,q.y+q.hh]];
  const base=Math.atan2(q.y-by,q.x-bx);let lo=1e9,hi=-1e9,lc=cs[0],hc=cs[0];
  for(const c of cs){
    let d=Math.atan2(c[1]-by,c[0]-bx)-base;d=Math.atan2(Math.sin(d),Math.cos(d));
    if(d<lo){lo=d;lc=c;}
    if(d>hi){hi=d;hc=c;}
  }
  const L=900,a1=base+lo,a2=base+hi;
  return [lc,hc,[hc[0]+Math.cos(a2)*L,hc[1]+Math.sin(a2)*L],[lc[0]+Math.cos(a1)*L,lc[1]+Math.sin(a1)*L]];
}

function xpNeed(){
  // 0.6+0.4n runs slightly ahead of the wave-quota slope (0.65+0.35n): big
  // parties also bank extra gems from crates, elites and boss levels, so the
  // need has to outpace the quota or 4p out-levels solo by wave 10
  const n=Math.max(1,G.players.length);
  if(G.mode==='classic')return Math.floor((8+G.level*9)*(0.6+0.4*n));
  return Math.floor((6+G.level*4)*(0.6+0.4*n));
}
function hpScale(){
  if(G.mode==='classic')return 1+(G.wave-1)*0.55+(G.level-1)*0.10;
  return 1+G.time*0.012+(G.level-1)*0.06;
}
function dmgScale(){
  if(G.mode==='classic')return 1+G.wave*0.09;
  return 1+G.time*0.0035;
}

// each controller remembers its colour between sessions; duplicates resolve
// to the first free swatch
function colPref(padIndex){
  try{const v=localStorage.getItem('ph_col_'+padIndex);if(v!==null)return +v;}catch(e){}
  return null;
}
function freeCol(pref){
  const used=new Set(G.players.map(q=>q.col));
  if(pref!=null&&pref>=0&&pref<PCOLORS.length&&!used.has(pref))return pref;
  for(let i=0;i<PCOLORS.length;i++)if(!used.has(i))return i;
  return 0;
}
function makePlayer(idx,padIndex,x,y){
  return {
    idx, padIndex, x, y, r:5, col:freeCol(colPref(padIndex)),
    hp:100, maxhp:100, dead:false, reviveP:0,
    speed:85, speedMul:1, regen:0, dmgMul:1, magnet:34,

function joinPlayer(padIndex,joinBtn){
  if(G.players.length>=4)return null;
  if(G.players.some(p=>p.padIndex===padIndex))return null;
  unlockAudio();
  const idx=G.players.length;
  let x=0,y=0;
  if(G.players.length){
    const a=G.players.find(p=>!p.dead)||G.players[0];
    x=a.x+(Math.random()*40-20);y=a.y+(Math.random()*40-20);
  }
  const p=makePlayer(idx,padIndex,x,y);
  p.joinBtn=joinBtn>=0?joinBtn:0;
  G.players.push(p);
  if(G.mode==='classic'&&G.state==='play'&&G.level>2){
    p.maxhp=Math.min(280,100+15*(G.level-1));p.hp=p.maxhp;
    p.dmgMul=1+0.04*(G.level-1);p.speedMul=Math.min(1.5,1+0.012*(G.level-1));
    p.magnet+=Math.min(30,2*G.level);
    const wlv=clamp(Math.floor(G.level/5),1,4),extra=clamp(Math.floor(G.level/6),0,3);
    p.weapons.blaster.lv=wlv;
    const pool=WEAPON_IDS.filter(id=>id!=='blaster');
    for(let i=0;i<extra;i++){
      const id=pool.splice((Math.random()*pool.length)|0,1)[0];
      p.weapons[id]={lv:wlv,t:0,ang:Math.random()*TAU};
    }
    p.invuln=4;
    if(G.arena){p.x=G.arena.x;p.y=G.arena.y+G.arena.h*0.3;}
    flash('P'+(idx+1)+' JOINED — GEARED UP!');
  }else flash('P'+(idx+1)+' JOINED!');
  sfx('join');
  return p;
}

const ETYPES={
  chaser:{spr:chaserSprite,r:5,hp:18,sp:42,dmg:8,xp:1,from:0},
  swarm:{spr:swarmSprite,r:3.5,hp:8,sp:76,dmg:5,xp:1,from:40},

function pickClassicType(){
  const mix=waveDef(G.wave).mix;
  if(!mix)return 'chaser';
  const keys=Object.keys(mix);
  let sum=0;for(const k of keys)sum+=mix[k];
  let r=Math.random()*sum;
  for(const k of keys){r-=mix[k];if(r<=0)return k;}
  return 'chaser';
}
function pickEnemyType(){
  if(G.mode==='classic')return pickClassicType();
  const avail=Object.keys(ETYPES).filter(k=>G.time>=ETYPES[k].from);
  const weights=avail.map(k=>k==='chaser'?1:0.55+Math.min(0.9,(G.time-ETYPES[k].from)/240));
  let sum=weights.reduce((a,b)=>a+b,0),r=Math.random()*sum;
  for(let i=0;i<avail.length;i++){r-=weights[i];if(r<=0)return avail[i];}
  return 'chaser';
}
function spawnEnemy(type,x,y,eliteMul){
  const d=ETYPES[type];
  const hp=d.hp*hpScale();
  const e={
    type, spr:d.spr, x, y, r:d.r,
    hp, maxhp:hp, sp:d.sp*(0.9+Math.random()*0.2), dmg:d.dmg*dmgScale(), xp:d.xp,
    flash:0, fuse:-1, shootT:1+Math.random()*2, orbCd:{}, slow:1, boss:false,
    huntLv:0, hunted:false, life:-1
  };
  G.enemies.push(e);
  if(eliteMul&&eliteMul>1){
    e.elite=true;e.scale=1.25;e.dmg*=1.35;e.sp*=1.1;e.xp=Math.round(e.xp*3.5);
    e.hp*=eliteMul;e.maxhp=e.hp;
  }
  return e;
}
function spawnPoint(){
  const c=G.cam;
  const m=Math.max(40,c.w*0.08);
  for(let tries=0;tries<10;tries++){
    const side=(Math.random()*4)|0;
    let x,y;
    if(side===0){x=c.x-c.w/2-m;y=c.y+(Math.random()-0.5)*c.h;}
    else if(side===1){x=c.x+c.w/2+m;y=c.y+(Math.random()-0.5)*c.h;}
    else if(side===2){x=c.x+(Math.random()-0.5)*c.w;y=c.y-c.h/2-m;}
    else {x=c.x+(Math.random()-0.5)*c.w;y=c.y+c.h/2+m;}
    if(!solidAt(x,y))return {x,y};
  }
  return null;
}
function spawnPointArena(){
  const a=G.arena;if(!a)return spawnPoint();
  const alive=G.players.filter(p=>!p.dead);
  for(let i=0;i<24;i++){
    const x=a.x+(Math.random()-0.5)*(a.w-90),y=a.y+(Math.random()-0.5)*(a.h-80);
    if(solidAt(x,y))continue;
    let ok=true;
    for(const p of alive)if(dist2(x,y,p.x,p.y)<90*90){ok=false;break;}
    if(ok)return {x,y};
  }
  return {x:a.x,y:a.y-a.h*0.3};
}
function nearestPlayer(e,alive){
  let best=null,bd=1e9;
  for(const p of alive){const d=dist2(e.x,e.y,p.x,p.y);if(d<bd){bd=d;best=p;}}
  return best;
}


// ---------- spatial grid ----------
const GRID=48,MAXER=24; // MAXER = largest enemy radius, added to query ranges
let grid=new Map();
function gridKey(cx,cy){return cx*100000+cy;}
function rebuildGrid(){
  grid.clear();
  for(const e of G.enemies){
    if(e.dead)continue;
    const k=gridKey(Math.floor(e.x/GRID),Math.floor(e.y/GRID));
    let a=grid.get(k);
    if(!a){a=[];grid.set(k,a);}
    a.push(e);
  }
}
function queryEnemies(x,y,r,cb){
  const R=r+MAXER;
  const c0x=Math.floor((x-R)/GRID),c1x=Math.floor((x+R)/GRID);
  const c0y=Math.floor((y-R)/GRID),c1y=Math.floor((y+R)/GRID);
  for(let cy=c0y;cy<=c1y;cy++)for(let cx=c0x;cx<=c1x;cx++){
    const a=grid.get(gridKey(cx,cy));
    if(a)for(const e of a){if(!e.dead)cb(e);}
  }
}
function nearestEnemy(x,y,maxR){
  let best=null,bd=maxR*maxR;
  for(const e of G.enemies){
    if(e.dead)continue;
    const d=dist2(x,y,e.x,e.y)*(e.boss?0.36:1); // players can't aim: bias toward the boss
    if(d<bd){bd=d;best=e;}
  }
  return best;
}

// ---------- combat ----------
function addText(x,y,str,col){if(G.texts.length<160)G.texts.push({x,y,str,col,t:0.7,vy:-22});}
function addParticles(x,y,col,n,sp){
  if(G.particles.length>900)return;
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU,s=(0.3+Math.random()*0.7)*(sp||60);
    G.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0.25+Math.random()*0.3,col,size:1+(Math.random()<0.3?1:0)});
  }
}
// four-point star twinkles for magic: pickups, spells, enchanted things
function addSparkles(x,y,col,n,sp){
  if(G.particles.length>850)return;
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU,s=(0.2+Math.random()*0.8)*(sp||40);
    G.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-10,t:0.35+Math.random()*0.35,col,size:1,spark:true});
  }
}
function dropLoot(e){
  const gems=e.boss?14:(Math.random()<0.15?2:1);
  const per=Math.max(1,Math.round(e.xp/gems));
  for(let i=0;i<gems;i++){
    if(G.gems.length>350){G.gems[(Math.random()*G.gems.length)|0].v+=per;continue;}
    G.gems.push({x:e.x+(Math.random()*14-7),y:e.y+(Math.random()*14-7),v:per,t:0});
  }
  const types=['speed','regen','maxhp','damage','magnet'];
  if(e.boss){
    const n=G.mode==='classic'?Math.max(1,G.players.length):1;
    // charms buff the WHOLE party, so the drop count must not scale with the
    // roster — n players hoovering n-scaled drops is n² stat growth
    for(let i=0;i<(G.mode==='classic'?Math.min(3,1+n):3);i++)
      G.pickups.push({x:e.x+(Math.random()*56-28),y:e.y+(Math.random()*40-20),type:types[(Math.random()*5)|0],t:0});
    for(let i=0;i<(G.mode==='classic'?n:1);i++)
      G.pickups.push({x:e.x+(Math.random()*30-15),y:e.y+(Math.random()*24-12),type:'heart',t:0});
    if(G.mode==='classic'){G.xp+=xpNeed();G.pickups.push({x:e.x,y:e.y,type:'pod',t:0});}
  }else if(e.type==='tank'&&Math.random()<0.35)G.pickups.push({x:e.x,y:e.y,type:'heart',t:0});
  else if(Math.random()<0.02)G.pickups.push({x:e.x,y:e.y,type:'heart',t:0});
}
function damageEnemy(e,dmg,owner){
  if(e.dead)return;
  dmg*=(e.vulnMul||1);
  e.hp-=dmg;e.flash=0.08;
  addText(e.x,e.y-e.r-3,Math.round(dmg),'#ffd23e');
  sfx('hit');
  if(e.hp<=0){
    e.dead=true;
    if(owner)owner.kills++;
    G.kills++;
    addParticles(e.x,e.y,e.boss?(e.barCol||'#d84343'):'#d84343',e.boss?40:8,e.boss?140:70);
    dropLoot(e);
    if(e.boss){
      if(G.boss===e)G.boss=null;
      sfx('boom');G.shake=8;flash('BOSS DOWN!');
      if(G.mode==='classic'&&e.def){
        if(e.def.onDeath)e.def.onDeath(e);
        G.bossKills++;G.bossTimes.push(G.time);
        for(const o of G.enemies)if(o!==e&&!o.dead){o.dead=true;addParticles(o.x,o.y,'#d84343',6,60);}
        G.ebullets.length=0;G.fx=G.fx.filter(f=>!f.boss);
        G.waveState='clear';G.waveT=0;
      }
    }else sfx('die');
  }
}
function explode(x,y,radius,dmg,owner,hurtPlayers){
  addParticles(x,y,'#ffb62e',18,120);
  addParticles(x,y,'#ff5a3d',12,90);
  G.fx.push({kind:'boom',x,y,r:radius,t:0.25,dur:0.25});
  G.shake=Math.max(G.shake,3);
  sfx('boom');
  if(dmg>0&&owner!==undefined){
    queryEnemies(x,y,radius,e=>{if(dist2(x,y,e.x,e.y)<radius*radius)damageEnemy(e,dmg,owner);});
  }
  if(hurtPlayers){
    for(const p of G.players){
      if(p.dead||p.invuln>0)continue;
      if(dist2(x,y,p.x,p.y)<radius*radius)hurtPlayer(p,hurtPlayers);
    }
  }
  for(const c of G.crates)if(!c.dead&&dist2(x,y,c.x,c.y)<radius*radius)breakCrate(c);
}
// Every finished run leaves a full stat record: printed to the devtools
// console and kept (last 10) in localStorage under 'ph_runs', so balance
// arguments can be settled with data after the fact.
function recordRun(outcome){
  if(G.runLogged)return;
  G.runLogged=true;
  const sum={
    outcome,mode:G.mode,date:new Date().toISOString(),
    wave:G.wave,time:Math.round(G.time),level:G.level,
    kills:G.kills,deaths:G.deaths,bossKills:G.bossKills,
    bossTimes:G.bossTimes.map(t=>Math.round(t)),
    charms:G.buffTally,
    party:G.players.map(p=>({
      p:p.idx+1,maxhp:Math.round(p.maxhp),dmgMul:+p.dmgMul.toFixed(2),
      speedMul:+p.speedMul.toFixed(2),regen:+p.regen.toFixed(1),magnet:Math.round(p.magnet),
      kills:p.kills,revives:p.revives,
      weapons:Object.keys(p.weapons).map(id=>id+':'+p.weapons[id].lv).join(' ')
    }))
  };
  try{
    const runs=JSON.parse(localStorage.getItem('ph_runs')||'[]');
    runs.push(sum);
    while(runs.length>10)runs.shift();
    localStorage.setItem('ph_runs',JSON.stringify(runs));
  }catch(e){}
  try{console.log('PIXEL HORDE run:',JSON.stringify(sum,null,1));}catch(e){}
}
function killPlayer(p){
  if(p.dead)return;
  p.hp=0;p.dead=true;p.reviveP=0;p.mark=null;p.arrow=null;p.brandT=0;p.stillT=0;
  if(G.mode==='classic')G.deaths++;
  sfx('die');
  addParticles(p.x,p.y,PCOLORS[p.col],20,90);
  flash('P'+(p.idx+1)+' DOWN! STAND ON THEM!');
  if(G.players.every(q=>q.dead)){G.state='gameover';G.overSince=G.time;recordRun('wipe');}
}
function hurtPlayer(p,dmg){
  if(p.dead||p.invuln>0||p.hurtCd>0)return;
  p.hp-=dmg;p.hurtCd=0.5;p.flash=0.15;
  sfx('hurt');
  G.shake=Math.max(G.shake,2);
  if(p.hp<=0)killPlayer(p);
}
// scripted boss mechanics: damage as a fraction of maxhp, ignores the 0.5s hurt throttle
function bossHit(p,pct){
  if(p.dead||p.invuln>0)return;
  p.hp-=p.maxhp*pct;p.flash=0.15;sfx('hurt');
  G.shake=Math.max(G.shake,2);
  if(p.hp<=0)killPlayer(p);
}
function breakCrate(c){
  if(c.dead)return;
  c.dead=true;
  addParticles(c.x,c.y,'#96703c',8,80);
  addSparkles(c.x,c.y,'#ffd23e',5,60);
  sfx('crate');
  const r=Math.random();
  // more players break more crates, and each charm buffs everyone — keep the
  // charms-per-player-minute rate roughly flat across party sizes
  const bp=0.45/(0.7+0.3*Math.max(1,G.players.length));
  if(r<bp){
    const types=['speed','regen','maxhp','damage','magnet'];
    G.pickups.push({x:c.x,y:c.y,type:types[(Math.random()*types.length)|0],t:0});
  }else if(r<bp+0.2)G.pickups.push({x:c.x,y:c.y,type:'heart',t:0});
  else for(let i=0;i<4;i++)G.gems.push({x:c.x+(Math.random()*12-6),y:c.y+(Math.random()*12-6),v:2,t:0});
}

// ---------- weapon firing ----------
function fireWeapon(p,id,w,dt){
  w.t-=dt;
  const lv=w.lv,dm=p.dmgMul;
  switch(id){
    case 'blaster':{
      if(w.t>0)break;
      const tgt=nearestEnemy(p.x,p.y,340);
      if(!tgt)break;
      w.t=0.72*Math.pow(0.9,lv-1);
      const n=1+Math.floor((lv-1)/2);
      const ang=Math.atan2(tgt.y-p.y,tgt.x-p.x);
      for(let i=0;i<n;i++){
        const a=ang+(i-(n-1)/2)*0.12;
        G.bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*230,vy:Math.sin(a)*230,r:2,dmg:(10+lv*2)*dm,life:1.6,owner:p,col:'#ffe94a',trail:true,trailCol:'#ffe94a',sparkTrail:true});
      }
      sfx('shoot');break;}
    case 'spread':{
      if(w.t>0)break;
      w.t=1.5*Math.pow(0.93,lv-1);
      const n=4+lv;
      const base=Math.atan2(p.faceY,p.faceX);
      for(let i=0;i<n;i++){
        const a=base+(i-(n-1)/2)*(0.7/(n-1)+0.06);
        const sp=240+Math.random()*40;
        G.bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:2,dmg:(7+lv*1.5)*dm,life:0.38,owner:p,col:'#ff9040'});
      }
      sfx('spread');break;}
    case 'orbit':{
      w.ang=(w.ang||0)+dt*(2.4+lv*0.15);
      const n=1+lv,rad=30+lv*2;
      for(let i=0;i<n;i++){
        const a=w.ang+i*TAU/n;
        const ox=p.x+Math.cos(a)*rad,oy=p.y+Math.sin(a)*rad;
        if(Math.random()<dt*4)addSparkles(ox,oy,'#7fd8ff',1,18);
        queryEnemies(ox,oy,10,e=>{
          if(dist2(ox,oy,e.x,e.y)<(10+e.r)*(10+e.r)){
            const cd=e.orbCd[p.idx]||0;
            if(G.time>cd){e.orbCd[p.idx]=G.time+0.45;damageEnemy(e,(11+lv*3)*dm,p);}
          }
        });
      }
      break;}
    case 'tesla':{
      if(w.t>0)break;
      const first=nearestEnemy(p.x,p.y,180);
      if(!first)break;
      w.t=1.5*Math.pow(0.9,lv-1);
      let cur=first,px=p.x,py=p.y;
      const hitSet=new Set();
      const chains=2+lv;
      for(let i=0;i<chains&&cur;i++){
        G.fx.push({kind:'zap',x1:px,y1:py,x2:cur.x,y2:cur.y,t:0.12,dur:0.12});
        addSparkles(cur.x,cur.y,'#b06bff',2,45);
        damageEnemy(cur,(13+lv*3)*dm,p);
        hitSet.add(cur);
        px=cur.x;py=cur.y;
        let next=null,bd=110*110;
        queryEnemies(px,py,110,e=>{
          if(hitSet.has(e))return;
          const d=dist2(px,py,e.x,e.y);
          if(d<bd){bd=d;next=e;}
        });
        cur=next;
      }
      sfx('zap');break;}
    case 'flame':{
      if(w.t>0)break;
      w.t=0.45*Math.pow(0.94,lv-1);
      const rad=28+lv*5;
      queryEnemies(p.x,p.y,rad,e=>{
        if(dist2(p.x,p.y,e.x,e.y)<(rad+e.r)*(rad+e.r))damageEnemy(e,(6+lv*2)*dm,p);
      });
      for(let i=0;i<3;i++){
        const a=Math.random()*TAU;
        G.particles.push({x:p.x+Math.cos(a)*rad,y:p.y+Math.sin(a)*rad,vx:Math.cos(a)*10,vy:Math.sin(a)*10-15,t:0.3,col:Math.random()<0.5?'#ff5a3d':'#ffb62e',size:1});
      }
      break;}
    case 'rocket':{
      if(w.t>0)break;
      const tgt=nearestEnemy(p.x,p.y,320);
      if(!tgt)break;
      w.t=2.3*Math.pow(0.92,lv-1);
      const ang=Math.atan2(tgt.y-p.y,tgt.x-p.x);
      G.bullets.push({x:p.x,y:p.y,vx:Math.cos(ang)*150,vy:Math.sin(ang)*150,r:3,dmg:(20+lv*6)*dm,life:2.4,owner:p,col:'#57e86b',rocket:true,aoe:44+lv*4,trail:true,trailCol:'#8fe89b',sparkTrail:true});
      sfx('rocket');break;}
  }
}

// ---------- level up ----------
function buildOffers(p){
  const pool=[];
  for(const id of WEAPON_IDS){
    const w=p.weapons[id];
    if(w){if(w.lv<WEAPONS[id].max)pool.push({kind:'up',id});}
    else pool.push({kind:'new',id});
  }
  shuffle(pool);
  const offers=pool.slice(0,3);
  // a dead picker gets max-hp fillers instead of heals — healing a corpse is wasted
  while(offers.length<3)offers.push(offers.length%2&&!p.dead?{kind:'heal'}:{kind:'mhp'});
  return offers;
}
function startLevelup(){
  if(G.state!=='play')return;
  const living=G.players.filter(p=>!p.dead);
  if(!living.length){G.xp=Math.min(G.xp,xpNeed()-1);return;}
  // a boss kill levels the whole party, dead included: they're about to be
  // rallied back at the intermission and must not permanently miss their pick
  const bossKill=G.mode==='classic'&&G.waveState==='clear'&&isBossWave(G.wave);
  const pickers=bossKill?G.players:living;
  G.state='levelup';
  G.levelupT=0;
  G.levelupPicks=pickers.map(p=>({p,offers:buildOffers(p),sel:1,done:false}));
  sfx('levelup');
}
function applyOffer(p,o){
  if(o.kind==='new')p.weapons[o.id]={lv:1,t:0,ang:Math.random()*TAU};
  else if(o.kind==='up')p.weapons[o.id].lv++;
  else if(o.kind==='heal')p.hp=Math.min(p.maxhp,p.hp+60);
  else if(o.kind==='mhp'){p.maxhp+=25;p.hp+=25;}
}
function finishLevelup(){
  G.xp-=xpNeed();
  G.level++;
  G.levelupPicks=null;
  if(G.state==='levelup')G.state=G.players.every(p=>p.dead)?'gameover':'play';
}

// ---------- buffs ----------
// the five stat charms are party-wide: one pickup buffs every player (dead
// ones included — they keep pace for their revive), so nobody races for them.
// Hearts and the weapon pod stay personal.
const PARTY_BUFFS=new Set(['speed','regen','maxhp','damage','magnet']);
function applyBuff(p,type){
  switch(type){
    case 'speed':p.speedMul=Math.min(1.9,p.speedMul+0.09);addText(p.x,p.y-12,'+SPEED','#ffe94a');break;
    case 'regen':p.regen+=0.6;addText(p.x,p.y-12,'+REGEN','#57e86b');break;
    case 'maxhp':p.maxhp+=20;p.hp=Math.min(p.maxhp,p.hp+20);addText(p.x,p.y-12,'+MAX HP','#ff4d6d');break;
    case 'damage':p.dmgMul+=0.1;addText(p.x,p.y-12,'+DAMAGE','#ff8b3d');break;
    case 'magnet':p.magnet+=16;addText(p.x,p.y-12,'+MAGNET','#b06bff');break;
    case 'heart':p.hp=Math.min(p.maxhp,p.hp+35);addText(p.x,p.y-12,'+35 HP','#ff4d6d');sfx('heart');return;
    case 'pod':{
      const missing=WEAPON_IDS.filter(id=>!p.weapons[id]);
      if(Object.keys(p.weapons).length<4&&missing.length){
        const id=missing[(Math.random()*missing.length)|0];
        p.weapons[id]={lv:1,t:0,ang:Math.random()*TAU};
        addText(p.x,p.y-12,'+'+WEAPONS[id].name,WEAPONS[id].col);
      }else{
        const owned=Object.keys(p.weapons).filter(id=>p.weapons[id].lv<WEAPONS[id].max);
        if(owned.length){const id=owned[(Math.random()*owned.length)|0];p.weapons[id].lv++;addText(p.x,p.y-12,WEAPONS[id].name+' UP!',WEAPONS[id].col);}
        else{p.dmgMul+=0.15;addText(p.x,p.y-12,'+DAMAGE','#ff8b3d');}
      }
      sfx('levelup');return;}
  }
  sfx('pickup');
}
function ensureChunkEntities(cx,cy){
  const k=cx+','+cy;
  if(G.spawnedChunks.has(k))return;
  G.spawnedChunks.add(k);
  if(G.spawnedChunks.size>2000)G.spawnedChunks.clear();
  const rng=makeRng((cx*73856093)^(cy*19349663)^99);
  let crates=0,buffs=0;
  for(let ty=0;ty<CHUNK;ty++)for(let tx=0;tx<CHUNK;tx++){
    const wx=cx*CHUNK+tx,wy=cy*CHUNK+ty;
    if(wx*wx+wy*wy<100)continue;
    if(tileAt(wx,wy)!==T_GRASS)continue;
    const r=rng();
    // a bigger party sweeps the map faster (wider camera = more chunks/min),
    // and each loose charm buffs everyone — scale the odds down with roster
    // size like breakCrate does, so exploration charm income stays flat
    const bw=0.0035/(0.7+0.3*Math.max(1,G.players.length));
    if(r<0.010&&crates<3){crates++;G.crates.push({x:wx*TILE+8,y:wy*TILE+8,r:7,hp:12,dead:false});}
    else if(r<0.010+bw&&buffs<1){
      buffs++;
      const types=['speed','regen','maxhp','damage','magnet'];
      G.pickups.push({x:wx*TILE+8,y:wy*TILE+8,type:types[(rng()*types.length)|0],t:0});
    }
  }
}

// ---------- arena ----------
function openArena(){
  const alive=G.players.filter(p=>!p.dead),n=Math.max(1,G.players.length);
  let cx=0,cy=0;
  if(alive.length){for(const p of alive){cx+=p.x;cy+=p.y;}cx/=alive.length;cy/=alive.length;}
  else if(G.players.length){cx=G.players[0].x;cy=G.players[0].y;}
  const aspect=screenC.width/screenC.height||1.7;
  const w=clamp(700+40*n,640,900),h=w/aspect;
  G.arena={x:cx,y:cy,w,h,pillars:[]};
  carveArena();
}
function carveArena(){
  const a=G.arena,dirty=new Set();
  const set=(tx,ty,v)=>{
    if(tileAt(tx,ty)===v)return;
    G.tileOverride.set(tx+','+ty,v);
    dirty.add(Math.floor(tx/CHUNK)+','+Math.floor(ty/CHUNK));
  };
  const t0x=Math.floor((a.x-a.w/2)/TILE),t1x=Math.floor((a.x+a.w/2)/TILE);
  const t0y=Math.floor((a.y-a.h/2)/TILE),t1y=Math.floor((a.y+a.h/2)/TILE);
  for(let ty=t0y;ty<=t1y;ty++)for(let tx=t0x;tx<=t1x;tx++)set(tx,ty,T_GRASS);
  const cx=Math.floor(a.x/TILE),cy=Math.floor(a.y/TILE);
  const ox=Math.max(4,Math.round(a.w/TILE/5)),oy=Math.max(3,Math.round(a.h/TILE/5));
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(s=>{
    const px=cx+s[0]*ox,py=cy+s[1]*oy;
    for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++)set(px+dx,py+dy,T_ROCK);
    a.pillars.push({x:(px+1)*TILE,y:(py+1)*TILE,hw:TILE,hh:TILE});
  });
  for(const k of dirty)chunkCanvases.delete(k);
}
function closeArena(){
  G.arena=null;G.creep=null;
  G.tileOverride.clear();
  chunkCanvases.clear();
}
function holdArena(dt){
  const b=G.boss,a=G.arena;
  if(!b||b.dead||!a)return;
  b.x=clamp(b.x,a.x-a.w/2+26,a.x+a.w/2-26);
  b.y=clamp(b.y,a.y-a.h/2+26,a.y+a.h/2-26);
}

}
function pushTel(e,x,y,r,dur,pct,col,icon,pool){

}
function pushSafe(e,x,y,r,life,col,heal){
  G.fx.push({kind:'safe',ground:1,boss:e||null,x,y,r,t:life,dur:life,col:col||'#eaffff',heal:heal||0});
}
function pushRing(e,x,y,opt){

function pushMark(e,p,opt){

function pushMet(e,x,y,r,dur,pct,pool){

}
function pushShadow(e,dur,pct){
  G.fx.push({kind:'shadow',boss:e,dur,t:dur,active:0,tick:0,pct});
}
function ringVolley(e,n,col,spd,off){
  for(let i=0;i<n;i++){
    const a=(off||0)+i*TAU/n;
    G.ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:3,dmg:e.dmg*0.45,life:3.0,col:col||'#ffb62e',boss:1});
  }

function bossCast(e,key,name,dur){
  e.ai.cast=key;e.ai.castT=dur;e.ai.castLen=dur;e.castName=name;e.castP=0;e.frozen=1;sfx('telegraph');
}
function bossWalk(e,tx,ty,sp){
  const d=Math.hypot(tx-e.x,ty-e.y)||1;
  e.ovr=1;e.ovx=(tx-e.x)/d;e.ovy=(ty-e.y)/d;e.osp=sp;
}
function clearPools(x,y,r){
  let n=0;
  for(const f of G.fx){
    if((f.kind==='pool')&&dist2(f.x,f.y,x,y)<r*r){f.t=Math.min(f.t,0.15);n++;}
  }
  if(G.creep){
    const t0x=Math.floor((x-r)/TILE),t1x=Math.floor((x+r)/TILE);
    const t0y=Math.floor((y-r)/TILE),t1y=Math.floor((y+r)/TILE);
    for(let ty=t0y;ty<=t1y;ty++)for(let tx=t0x;tx<=t1x;tx++){
      const cx=tx*TILE+8,cy=ty*TILE+8;
      if(dist2(cx,cy,x,y)<r*r)G.creep.delete(tx+','+ty);
    }
  }
  return n;
}

// tick every boss telegraph/hazard; runs even while the boss is mid-transition or dead
function tickBossFx(dt,alive){
  for(const f of G.fx){
    if(f.t<=0)continue;
    switch(f.kind){
      case 'tel':
        f.t-=dt;
        if(f.t<=0){
          G.fx.push({kind:'boom',x:f.x,y:f.y,r:f.r,t:0.3,dur:0.3});
          G.shake=Math.max(G.shake,5);sfx('slam');
          for(const p of alive)if(dist2(p.x,p.y,f.x,f.y)<f.r*f.r)bossHit(p,f.pct);
          if(f.pool)pushPool(f.boss,f.x,f.y,f.pool.r,f.pool.life,f.pool.pct,f.pool.col||f.col,f.pool.shape);
        }
        break;
      case 'met':
        f.t-=dt;
        if(f.t<=0){
          G.fx.push({kind:'boom',x:f.x,y:f.y,r:f.r,t:0.25,dur:0.25});
          addParticles(f.x,f.y,'#ffb62e',10,90);sfx('emberpop');
          for(const p of alive)if(dist2(p.x,p.y,f.x,f.y)<f.r*f.r)bossHit(p,f.pct);
          if(f.pool)pushPool(f.boss,f.x,f.y,f.pool.r,f.pool.life,f.pool.pct,f.pool.col||'#ff7a1f',f.pool.shape);
        }
        break;
      case 'pool':
        f.t-=dt;f.tick-=dt;
        if(f.tick<=0){
          f.tick=0.35;
          for(const p of alive)if(dist2(p.x,p.y,f.x,f.y)<f.r*f.r)bossHit(p,f.pct);
        }
        break;
      case 'safe':
        f.t-=dt;f.tick=(f.tick||0)-dt;
        if(f.tick<=0){
          f.tick=0.3;
          if(f.heal){
            for(const p of alive)if(dist2(p.x,p.y,f.x,f.y)<f.r*f.r)p.hp=Math.min(p.maxhp,p.hp+f.heal*0.3);
          }
          clearPools(f.x,f.y,f.r);
        }
        break;
      case 'ring':{
        f.t-=dt;
        const trav=f.spd*(f.dur-f.t);
        f.r=f.dir<0?Math.max(0,f.rmax-trav):trav;
        for(const p of alive){
          if(p.invuln>0||f.hit.has(p.idx))continue;
          const dx=p.x-f.x,dy=p.y-f.y,d=Math.hypot(dx,dy);
          if(Math.abs(d-f.r)>f.w*0.5+p.r)continue;
          if(f.gaps>0){
            const seg=TAU/f.gaps;
            let an=Math.atan2(dy,dx)-f.gapA;
            an-=Math.round(an/seg)*seg;
            if(Math.abs(an)<f.gapW*0.5)continue;
          }
          f.hit.add(p.idx);bossHit(p,f.pct);
        }
        break;}
      case 'mark':{
        f.t-=dt;
        const p=f.p;
        if(!p||p.dead){f.t=Math.min(f.t,0);break;}
        if(f.mode==='spread'){
          if(!f.locked&&f.t<=f.lockAt){f.locked=true;f.x=p.x;f.y=p.y;sfx('brandlock');}
          if(!f.locked){f.x=p.x;f.y=p.y;}
        }else{f.x=p.x;f.y=p.y;}
        if(f.t<=0&&!f.resolved){
          f.resolved=true;
          if(f.onPop)f.onPop(f);
        }
        break;}
      case 'shadow':{
        f.t-=dt;f.tick-=dt;
        if(f.tick<=0){
          f.tick=0.3;
          const b=f.boss;
          if(b&&!b.dead){
            for(const p of alive){
              if(losClear(b.x,b.y,p.x,p.y)){
                bossHit(p,f.pct);
                G.fx.push({kind:'beam',x1:b.x,y1:b.y,x2:p.x,y2:p.y,t:0.16,dur:0.16,col:b.barCol||'#ff2d4d'});
              }else addParticles(p.x,p.y,'#ffffff',3,30);
            }
          }
        }
        break;}
      default: f.t-=dt;
    }
  }
}


// ============================================================
// THE FOUR RAID BOSSES
// All mechanic damage is a fraction of maxhp via bossHit().
// ============================================================
function spawnSlagPup(x,y){
  const e=spawnEnemy('swarm',x,y);
  e.spr=slagPupSprite;e.r=4;e.hp=16*hpScale();e.maxhp=e.hp;

}
// Slag offering (Ragnaros' Sons of Flame): crawls from the arena edge straight
// to the rooted furnace, ignoring players entirely — stand in its path and let
// your weapons intercept it, or it feeds the boss.
function spawnSlagOffering(){
  const A=G.arena;if(!A)return null;
  const side=(Math.random()*4)|0;
  let x,y;
  if(side===0){x=A.x-A.w/2+20;y=A.y+(Math.random()-0.5)*(A.h-80);}
  else if(side===1){x=A.x+A.w/2-20;y=A.y+(Math.random()-0.5)*(A.h-80);}
  else if(side===2){x=A.x+(Math.random()-0.5)*(A.w-80);y=A.y-A.h/2+20;}
  else{x=A.x+(Math.random()-0.5)*(A.w-80);y=A.y+A.h/2-20;}
  const e=spawnEnemy('swarm',x,y);

function gxMark(alive,castLen){
  const c=G.cam,reach=castLen*85*0.85,minD=Math.max(45,reach*0.55);
  let best=null,bestS=-1;
  for(let i=0;i<32;i++){
    const x=c.x+(Math.random()-0.5)*(c.w-140),y=c.y+(Math.random()-0.5)*(c.h-120);
    if(solidAt(x,y)||solidAt(x-24,y)||solidAt(x+24,y)||solidAt(x,y-24)||solidAt(x,y+24))continue;
    let far=0,ok=true;
    for(const p of alive){const d=Math.hypot(x-p.x,y-p.y);if(d>reach){ok=false;break;}if(d>far)far=d;}
    if(ok&&far>=minD&&far>bestS){bestS=far;best={x,y};}
  }
  return best||{x:c.x,y:c.y};
}

function nearPillar(x,y,d){
  const A=G.arena;
  if(!A)return false;
  for(const q of A.pillars)if(dist2(x,y,q.x,q.y)<d*d)return true;
  return false;
}
// A baited charge (Sludgefist) grinds a pillar to rubble: the rock tiles open
// up, so line-of-sight mechanics lose a hiding spot for the rest of the fight.
function shatterPillar(q){
  const A=G.arena;if(!A)return;
  const px=Math.round(q.x/TILE)-1,py=Math.round(q.y/TILE)-1;
  const dirty=new Set();
  for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++){
    G.tileOverride.set((px+dx)+','+(py+dy),T_GRASS);
    dirty.add(Math.floor((px+dx)/CHUNK)+','+Math.floor((py+dy)/CHUNK));
  }
  for(const k of dirty)chunkCanvases.delete(k);
  const i=A.pillars.indexOf(q);
  if(i>=0)A.pillars.splice(i,1);
  addParticles(q.x,q.y,'#8b929c',26,140);
  addParticles(q.x,q.y,'#ffd23e',12,100);
}

 resolve(e,k,alive){

     const tp=a.ripTarget;

     const cx=f?f.x:(tp?tp.x:e.x),cy=f?f.y:(tp?tp.y:e.y),R=60;

     sfx('stackpop');G.shake=Math.max(G.shake,5);
     a.ripTarget=null;
   }
   if(k==='gaze'){
     // the shadow fx is already ticking; nothing to resolve but the eye closing
