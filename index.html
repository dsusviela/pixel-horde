// ---------- helpers ----------
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const TAU=Math.PI*2;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=a[i];a[i]=a[j];a[j]=t;}return a;}

function h2(x,y,s){
  let n=(x|0)*374761393+(y|0)*668265263+(s|0)*974634551;
  n=(n^(n>>>13))*1274126177; n=(n^(n>>>16))>>>0;
  return n/4294967296;
}
function smooth(t){return t*t*(3-2*t);}
function vnoise(x,y,s){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const a=h2(xi,yi,s),b=h2(xi+1,yi,s),c=h2(xi,yi+1,s),d=h2(xi+1,yi+1,s);
  const u=smooth(xf),v=smooth(yf);
  return lerp(lerp(a,b,u),lerp(c,d,u),v);
}
function makeRng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}

function makeSprite(rows,pal){
  const w=rows[0].length,h=rows.length;
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<rows[y].length;x++){
    const ch=rows[y][x];
    if(ch==='.'||ch===' ')continue;
    g.fillStyle=pal[ch]||'#f0f';
    g.fillRect(x,y,1,1);
  }
  return c;
}

let AC=null,masterGain=null,comp=null;
const sfxLast={};
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    comp=AC.createDynamicsCompressor();
    comp.threshold.value=-18;comp.ratio.value=12;comp.attack.value=0.003;comp.release.value=0.25;
    masterGain=AC.createGain();masterGain.gain.value=0.32;
    masterGain.connect(comp);comp.connect(AC.destination);
  }catch(e){}
}
function unlockAudio(){initAudio();if(AC&&AC.state==='suspended')AC.resume();if(AC)musGo();}
// gamepad presses are NOT a user-activation gesture in Chrome — grab any real gesture too
addEventListener('pointerdown',unlockAudio);
addEventListener('pointerup',unlockAudio);
addEventListener('touchstart',unlockAudio);
addEventListener('keydown',unlockAudio);
addEventListener('click',unlockAudio);
function audioLive(){return !!AC&&AC.state==='running';}
let noiseBuf=null;
function getNoise(){
  if(!noiseBuf){
    noiseBuf=AC.createBuffer(1,Math.floor(AC.sampleRate*0.5),AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  return noiseBuf;
}
let voices=0;
function voiceOk(){return voices<26;}
function beep(freq,dur,type,slide,vol){
  if(!AC||!voiceOk())return;
  voices++;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';
  const t=AC.currentTime;
  o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),t+dur);
  g.gain.setValueAtTime(vol||0.15,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(masterGain);
  o.onended=()=>{voices--;};
  o.start(t);o.stop(t+dur+0.02);
}
function noiseHit(dur,vol,freq){
  if(!AC||!voiceOk())return;
  voices++;
  const s=AC.createBufferSource();s.buffer=getNoise();s.loop=true;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||900;
  const g=AC.createGain();const t=AC.currentTime;
  g.gain.setValueAtTime(vol||0.2,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(masterGain);
  s.onended=()=>{voices--;};
  s.start(t);s.stop(t+dur+0.02);
}
function seq(list,gap,dur,type,vol,slide){
  list.forEach((f,i)=>setTimeout(()=>beep(f,dur,type||'square',slide||0,vol||0.12),i*gap));
}

// ---------- music ----------
// A tiny lookahead sequencer, synthesized like the sfx — no audio files. A
// director reads game state every tick and picks the track: menu bells, one
// combat theme per classic act (drums drop to a breather between waves), an
// omen heartbeat in the intermission before a boss, a theme per raid boss
// that climbs with its phases, and an endless groove that gains tempo and
// layers as the run gets old. Stage changes are played up: tracks crossfade,
// boss themes slam in, and a phase gate fires a drum-fill break before the
// faster section restarts from the downbeat.
const MUS={timer:null,cur:'',gain:null,next:0,step:0,ph:0,att:0.5};
const MUS_RIFF=[0,0,3,0,5,3,2,0]; // worldeater phrygian riff, semitones above root
function musNote(freq,t,dur,type,vol,slide){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(MUS.gain);
  o.start(t);o.stop(t+dur+0.05);
}
function musThump(t,vol){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(150,t);
  o.frequency.exponentialRampToValueAtTime(42,t+0.14);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  o.connect(g);g.connect(MUS.gain);
  o.start(t);o.stop(t+0.2);
}
function musHiss(t,vol,hz){
  const s=AC.createBufferSource();s.buffer=getNoise();s.loop=true;
  const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hz||3000;
  const g=AC.createGain();
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
  s.connect(f);f.connect(g);g.connect(MUS.gain);
  s.start(t);s.stop(t+0.12);
}
// the volcano's textures: a low rumble (noise under a lowpass) and dry ash
// crackle (a bandpassed tick) — the two sounds waves 2-5 are built on
function musRumble(t,vol,dur,hz){
  const s=AC.createBufferSource();s.buffer=getNoise();s.loop=true;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=hz||160;f.Q.value=0.8;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+dur*0.35);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(MUS.gain);
  s.start(t);s.stop(t+dur+0.05);
}
function musCrackle(t,vol,hz){
  const s=AC.createBufferSource();s.buffer=getNoise();s.loop=true;
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=hz||1800;f.Q.value=6;
  const g=AC.createGain();
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.04);
  s.connect(f);f.connect(g);g.connect(MUS.gain);
  s.start(t);s.stop(t+0.06);
}
const semiF=(root,s)=>root*Math.pow(2,s/12);
// one identity per classic act: key, tempo and riff all darken as the
// crusade goes on. Holes in the patterns are rests.
const ACT_MUS=[
 {bpm:104,root:110,  kick:[0,8],      hat:[4,12],      // act 1: A minor march
  bass:[0,,0,,3,,,0,0,,5,,3,,2,],
  lead:[12,,15,,17,,15,12,10,,12,,15,,,]},
 {bpm:116,root:98,   kick:[0,6,8],    hat:[4,12],      // act 2: G dorian drive
  bass:[0,,0,3,0,,5,,0,,0,3,7,,5,3],
  lead:[12,,10,,12,15,,12,17,,15,,12,,10,]},
 {bpm:126,root:87.31,kick:[0,4,8,12], hat:[2,6,10,14], // act 3: F phrygian menace
  bass:[0,1,0,,0,1,3,,0,1,0,,5,,3,1],
  lead:[12,,13,,12,,10,,8,,7,,8,10,12,13]},
 {bpm:136,root:82.41,kick:[0,4,8,10,12],hat:[2,6,10,14], // act 4: E phrygian dominant
  bass:[0,,1,,4,,1,0,0,,1,,8,,7,4],
  lead:[12,13,16,,13,,12,,16,,17,16,13,12,,]}];
function actStep(t){
  const a=clamp(((G.wave-1)/5)|0,0,3),c=ACT_MUS[a];
  const w=clamp((G.wave-1)%5,0,3); // wave within the act = intensity 0..3
  const s=MUS.step%16,dur=60/c.bpm/4;
  if(G.waveState!=='fight'){
    // breather between waves: the act's lead becomes a slow soft arp
    if(s===0)musNote(c.root/2,t,dur*16,'sine',0.05);
    if(s%4===0){const n=c.lead[s];if(n!=null)musNote(semiF(c.root,n),t,dur*6,'triangle',0.03);}
    return dur;
  }
  if(c.kick.indexOf(s)>=0)musThump(t,s===0?0.30:0.22);
  if(w>=1&&c.hat.indexOf(s)>=0)musHiss(t,0.05,6000);
  const b=c.bass[s];
  if(b!=null){
    const f=semiF(c.root,b);
    musNote(f,t,dur*1.8,'sawtooth',0.05);
    if(w>=3)musNote(f*1.4983,t,dur*1.6,'sawtooth',0.024); // grim fifth
  }
  if(w>=2){const l=c.lead[s];if(l!=null)musNote(semiF(c.root*2,l),t,dur*1.9,'square',0.028);}
  if(s===0)musNote(c.root/2,t,dur*16,'sine',0.045); // sub drone, one per bar
  return dur;
}
// THE VOLCANO (classic: the descent, waves 2-4, and the breaks between).
// A phrygian, one stage per wave, and a crescendo inside every wave:
//   descent  — rumble, a sub drone, a lone ash crackle: the mountain breathes
//   wave 2   — a slow stomp on 1 and 3, the drone, crackle on the offbeats
//   wave 3   — the bass riff enters, the stomp gallops, hats come in late
//   wave 4   — the lead, an anvil on every half bar, the fifth under the bass
// Tempo climbs 92 → 104 → 118, and each wave's own heat (waveT/dur) opens
// the hats, the crackle density and the riff's second voice, so the arc
// rises stage by stage into the OMEN and the boss.
const VOLC_MUS={root:55,
  bass:[0,,0,,1,,0,,0,,3,,1,0,,],
  lead:[12,,13,,12,,15,,13,,12,,10,,12,13],
  lead2:[,,,,,,,,,,,,15,,17,]};
function volcanoStep(t){
  const c=VOLC_MUS,w=clamp(G.wave-1,0,3); // 1=wave2 .. 3=wave4 (0 = the descent)
  const fight=G.waveState==='fight';
  const def=waveDef(G.wave);
  const heat=fight?clamp(G.waveT/Math.max(1,def.dur||60),0,1):0;
  const bpm=[84,92,104,118][w]+(fight?8*heat:0);
  const s=MUS.step%16,bar=(MUS.step/16)|0,dur=60/bpm/4;
  // the mountain: rumble every bar, a sub drone, the ash
  if(s===0)musRumble(t,0.05+0.03*w+0.03*heat,dur*16,140+30*w);
  if(s===0)musNote(c.root/2,t,dur*16,'sine',0.05+0.01*w);
  if(s===8&&(w>=1||bar%2))musNote(semiF(c.root/2,1),t,dur*8,'sine',0.02+0.01*w); // the flatted second under it
  const crk=fight?(0.10+0.25*w+0.35*heat):0.06;
  if(Math.random()<crk&&s%2===1)musCrackle(t,0.05+0.03*heat,1400+Math.random()*1800);
  if(!fight||w===0){
    // breathers and the descent: the lead as a slow, far arp, nothing else
    if(s%4===0){const n=c.lead[s];if(n!=null)musNote(semiF(c.root*2,n),t,dur*6,'triangle',0.022);}
    if(G.waveState==='descent'&&s===12)musHiss(t,0.03,5000);
    return dur;
  }
  // stage 1+: the stomp
  const gallop=w>=2;
  if(s===0||s===8)musThump(t,s===0?0.30:0.24);
  if(gallop&&(s===6||s===14))musThump(t,0.16+0.06*heat);
  if((w>=3||heat>0.5)&&(s===4||s===12))musHiss(t,0.04+0.04*heat,6000);
  // stage 2+: the riff (and its fifth once the wave is hot or in wave 4)
  if(w>=2){
    const b=c.bass[s];
    if(b!=null){
      const f=semiF(c.root,b);
      musNote(f,t,dur*1.8,'sawtooth',0.05+0.01*heat);

// the intermission before a boss wave: a heartbeat that will not slow down,

function omenStep(t){

  if(s===8)musNote(semiF(55,1),t,dur*10,'sine',0.02+0.03*k);
  if(k>0.55&&s%2===1)musHiss(t,0.02+0.05*k,7000);

// Slagmaw: the foundry the volcano was building to — same key, same ash,
// and three stages: P1 the stomp and the powerchords; P2 the forge lights
// (gallop, the fifth, sparks); P3 the cauldron cracks (faster, the riff's
// high answer, rumble on every bar, crackle everywhere)
function slagmawStep(t){
  const ph=G.boss.phase,s=MUS.step%16,dur=60/[88,104,120][ph-1]/4,root=55;
  const hp=G.boss?clamp(1-G.boss.hp/G.boss.maxhp,0,1):0;
  if(s===0)musRumble(t,0.06+0.03*ph,dur*16,150+40*ph);
  if(s%4===0)musThump(t,s===0?0.34:0.26);
  if(ph>=2&&(s===2||s===10))musThump(t,0.18); // gallop once the forge lights
  if(ph>=3&&(s===6||s===14))musThump(t,0.16);
  if(s===4||s===12){musHiss(t,0.09,2400);musNote(1244,t,0.05,'square',0.03);} // anvil
  if(Math.random()<0.15+0.2*ph&&s%2===1)musCrackle(t,0.06,1200+Math.random()*2000); // ash
  const R=[0,,,,0,,3,,0,,,,2,,3,],n=R[s];
  if(n!=null){
    const f=semiF(root,n);
    musNote(f,t,dur*3.2,'sawtooth',0.06);
    musNote(f*2,t,dur*2.8,'sawtooth',0.025);
    if(ph>=2)musNote(f*1.4983,t,dur*3,'sawtooth',0.03);
    if(ph>=3&&(s===6||s===14))musNote(semiF(root*4,n+1),t,dur*1.6,'square',0.028); // the cauldron's answer
  }
  if(ph>=2&&s%8===6)musNote(semiF(root*4,3),t,dur*1.5,'square',0.03); // ember spark
  if(ph>=3&&hp>0.8&&s===0)musNote(semiF(root,1),t,dur*8,'sawtooth',0.04,-20); // the last fifth of its bar: a groan
  return dur;
}
// Geminox: twins — one melody sung by two detuned voices, the second always
// one step behind the first, tightening every phase
function geminoxStep(t){
  const ph=G.boss.phase,s=MUS.step%16,dur=60/[100,114,130][ph-1]/4,root=73.42;
  if(s===0||s===8||(ph>=2&&(s===6||s===14)))musThump(t,s===0?0.28:0.20);
  if(ph>=2&&s%2===1)musHiss(t,0.035,8000); // crystal shimmer
  const M=[0,2,3,7,8,7,3,2];
  if(s%2===0){
    const i=(s/2)%8;
    musNote(semiF(root*2,M[i]),t,dur*1.8,'sawtooth',0.038);
    musNote(semiF(root*2,M[(i+7)%8])*1.006,t,dur*1.8,'sawtooth',ph>=2?0.03:0.016);
  }
  if(ph>=3&&s%4===0)musNote(root,t,dur*3.5,'sawtooth',0.05); // bass joins for the split
  return dur;
}
// Pyraxis: fire — relentless tremolo 16ths with a flame lick climbing out of
// every other bar, gallop and a high ostinato as the tide rises
function pyraxisStep(t){
  const ph=G.boss.phase,s=MUS.step%16,dur=60/[112,130,148][ph-1]/4,root=65.41;
  if(s%4===0)musThump(t,s===0?0.30:0.22);
  if(ph>=2&&s%4===2)musThump(t,0.15);
  if(s%2===1)musHiss(t,ph===3?0.06:0.035,5000);
  const R=[0,0,1,1,0,0,3,3,0,0,1,1,5,5,3,3];
  musNote(semiF(root,R[s]),t,dur*0.9,'sawtooth',s%2?0.03:0.05);
  if(((MUS.step/16)|0)%2===1&&s>=12)musNote(semiF(root*2,[7,8,10,12][s-12]),t,dur*1.6,'square',0.035);
  if(ph>=3&&s%2===0)musNote(semiF(root*4,s%4===0?1:0),t,dur*0.8,'square',0.02);
  return dur;
}
// Worldeater: the original doom theme — 8th notes, each phase raises the
// tempo and adds a layer, the enrage doubles the drums
function worldeaterStep(t){
  const b=G.boss,ph=b.phase,enr=ph===4&&b.ai.enrageT<=10;
  const dur=60/(enr?164:[92,104,118,140][ph-1])/2,s=MUS.step%8;
  const root=ph===4?110:55;
  if(s===0||s===4||(ph>=3&&(s===2||s===6))||enr)musThump(t,s===0?0.30:0.22);
  if(ph>=2&&s===4)musHiss(t,0.10,1600);
  if(ph>=3&&s%2===1)musHiss(t,0.035,5000);
  const f0=semiF(root,MUS_RIFF[s]+(ph===4&&s===6?1:0));
  musNote(f0,t,dur*0.92,'sawtooth',0.055);
  if(ph>=2&&s===0)musNote(55,t,dur*8,'sine',0.06);
  if(ph>=3)musNote(f0*1.4983,t,dur*0.85,'sawtooth',0.028);
  if(ph===4&&s===6)musNote(semiF(root*2,1),t,dur*1.6,'square',0.04);
  return dur;
}
// endless: a groove over a cycling Am-Am-C-G progression; every 75 seconds
// survived buys another notch of tempo and one more layer
function endlessStep(t){
  const tier=Math.min(5,(G.time/75)|0);
  const dur=60/(106+7*tier)/4,s=MUS.step%16,bar=(MUS.step/16)|0;
  const root=semiF(110,[0,0,3,-2][bar%4]);
  if(s===0||s===8||(tier>=2&&(s===6||s===14)))musThump(t,s===0?0.28:0.20);
  if(tier>=1&&(s===4||s===12))musHiss(t,0.06,6000);
  if(tier>=3&&s%2===1)musHiss(t,0.03,8000);
  const R=[0,,0,,7,,5,,0,,3,,5,,7,],n=R[s];
  if(n!=null){
    const f=semiF(root,n);
    musNote(f,t,dur*1.8,'sawtooth',0.05);
    if(tier>=4)musNote(f*1.4983,t,dur*1.5,'sawtooth',0.022);
  }
  if(tier>=2){const L=[12,,10,,12,,15,,17,,15,,12,,10,],l=L[s];
    if(l!=null)musNote(semiF(root*2,l),t,dur*1.9,'square',0.026);}
  if(s===0)musNote(root/2,t,dur*16,'sine',0.045);
  return dur;
}
function menuStep(t){
  const s=MUS.step%16,dur=0.22;
  if(s===0)musNote(55,t,dur*16,'sine',0.05);
  if(s%2===0)musNote(semiF(220,[0,3,7,10,12,10,7,3][(s/2)%8]),t,dur*3.5,'triangle',0.022);
  if(s===0&&((MUS.step/16)|0)%4===2)musNote(110*1.4983,t,dur*12,'sine',0.03);
  return dur;
}
const MUS_TRACKS={menu:menuStep,omen:omenStep,act:actStep,endless:endlessStep,volcano:volcanoStep,
  slagmaw:slagmawStep,geminox:geminoxStep,pyraxis:pyraxisStep,worldeater:worldeaterStep};
const MUS_BOSS_IDS=['slagmaw','geminox','pyraxis','worldeater'];
function musDesired(){
  if(G.state==='title'||G.state==='modesel')return 'menu';
  if(G.state==='gameover'||G.state==='victory')return '';
  const b=G.boss;
  // the roster bosses borrow one of the four written themes via def.mus
  if(b&&!b.dead&&b.def){
    const id=b.def.mus||b.def.id;
    if(MUS_TRACKS[id])return id;
  }
  if(G.mode==='endless')return 'endless';
  if(G.wave>=waveCount())return ''; // the Worldeater has fallen — silence under the fanfare
  if((G.waveState==='inter'&&isBossWave(G.wave+1))||(G.waveState==='pre'&&isBossWave(G.wave)))return 'omen';
  // the Slagmaw arc: from the descent through wave 4 the mountain has its
  // own track; the ascent after the boss rides it out too
  if(G.mode==='classic'&&(G.waveState==='descent'||(G.wave>=2&&G.wave<=4)||(G.wave===1&&G.waveState==='inter')))return 'volcano';
  return 'act';
}
function musTick(){
  if(!audioLive())return;
  const want=musDesired();
  if(want!==MUS.cur){
    if(MUS.gain){
      const g=MUS.gain;
      g.gain.setTargetAtTime(0.0001,AC.currentTime,0.22);
      setTimeout(()=>{try{g.disconnect();}catch(e){}},1600);
      MUS.gain=null;
    }
    MUS.cur=want;
    if(want){
      MUS.gain=AC.createGain();
      MUS.gain.gain.setValueAtTime(0.0001,AC.currentTime);
      MUS.gain.connect(masterGain);
      MUS.next=AC.currentTime+0.12;MUS.step=0;
      MUS.ph=G.boss?G.boss.phase:0;
      // boss themes slam in, everything else breathes in
      MUS.att=MUS_BOSS_IDS.indexOf(want)>=0?0.15:(want==='menu'||want==='omen'||want==='volcano'?1.1:0.5);
    }
  }
  if(!MUS.cur||!MUS.gain)return;
  const duck=G.state==='paused'?0.22:G.state==='levelup'?0.5:1;
  MUS.gain.gain.setTargetAtTime(duck,AC.currentTime,duck<1?0.2:MUS.att);
  // phase gate drama: a drum-fill break and a riser, then the faster section
  // restarts from the downbeat
  const b=G.boss;
  if(MUS_BOSS_IDS.indexOf(MUS.cur)>=0&&b&&b.phase!==MUS.ph){
    MUS.ph=b.phase;
    const t0=Math.max(MUS.next,AC.currentTime+0.02);
    for(let i=0;i<4;i++){musHiss(t0+i*0.09,0.10+0.03*i,3000);musThump(t0+i*0.09,0.16+0.04*i);}
    musNote(55,t0,0.45,'sawtooth',0.07,440);
    MUS.next=t0+0.42;MUS.step=0;
  }
  const stepFn=MUS_TRACKS[MUS.cur];
  while(MUS.next<AC.currentTime+0.30){MUS.next+=stepFn(MUS.next);MUS.step++;}
}
function musGo(){if(!MUS.timer)MUS.timer=setInterval(musTick,80);}
function musStop(){ // hard cut — the Worldeater's fall owns the silence
  if(MUS.gain){
    const g=MUS.gain;
    g.gain.setTargetAtTime(0.0001,AC.currentTime,0.08);
    setTimeout(()=>{try{g.disconnect();}catch(e){}},800);
    MUS.gain=null;
  }
  MUS.cur='';
}

function tr(s){
  if(LANG!=='es')return s;
  if(!/[A-Za-z]/.test(s))return s;
  const hit=ES[s];
  if(hit!==undefined)return hit;
  for(const r of ES_RX){const m=r[0].exec(s);if(m)return r[1](m);}
  return s;
}

const padState={};
addEventListener('gamepaddisconnected',e=>{delete padState[e.gamepad.index];});
addEventListener('gamepadconnected',e=>{delete padState[e.gamepad.index];unlockAudio();});
// the keyboard pretends to be one more gamepad, so a solo player needs no
// controller — every screen that reads pads (join, menus, level-up, play)
// works with it unchanged
const KB_INDEX='kb';
const KB_MAP={
  KeyW:[12],ArrowUp:[12], KeyS:[13],ArrowDown:[13],
  KeyA:[14],ArrowLeft:[14], KeyD:[15],ArrowRight:[15],
  Space:[0],Enter:[0],
  Backspace:[1,8],
  Escape:[9],KeyP:[9],
  KeyQ:[4],KeyE:[5], // shoulder buttons: the starting-boss picker on mode select
  KeyL:[20] // synthetic button: language toggle on the title screen
};
const kbDown={};
addEventListener('keydown',e=>{
  if(!KB_MAP[e.code])return;
  kbDown[e.code]=true;
  e.preventDefault();
});
addEventListener('keyup',e=>{if(KB_MAP[e.code])delete kbDown[e.code];});
addEventListener('blur',()=>{for(const k in kbDown)delete kbDown[k];});
function keyboardPad(){
  const buttons=[];
  for(let i=0;i<21;i++)buttons.push({pressed:false});
  for(const code in kbDown)for(const b of KB_MAP[code])buttons[b].pressed=true;
  return {index:KB_INDEX,connected:true,buttons,axes:[0,0]};
}
function pollPads(){
  // some browsers throw a SecurityError here on insecure (plain-http) origins
  // instead of returning an empty list — never let that kill the game loop
  let pads=[];
  try{pads=navigator.getGamepads?navigator.getGamepads():[];}catch(e){}
  const out=[];
  for(const p of pads){if(p&&p.connected)out.push(p);}
  out.push(keyboardPad());
  // online guests appear as one virtual pad each (net.js; inert when NET is off)
  if(typeof NET!=='undefined'&&NET.virtualPads)for(const vp of NET.virtualPads())out.push(vp);
  return out;
}
function padPrev(i){return padState[i]||(padState[i]={buttons:[],ax:0,ay:0});}
function pressed(p,b){
  const prev=padPrev(p.index);
  const now=!!(p.buttons[b]&&p.buttons[b].pressed);
  return now&&!prev.buttons[b];
}
// joining must be forgiving: pads with a non-"standard" mapping can report the
// physical A anywhere, so any face button or START gets an unjoined pad in
// joining must be forgiving: off-brand pads (D-input mode, scrambled HID maps)
// can report the physical A at any index at all, so ANY button gets an
// unjoined pad in — except the d-pad (12-15, that's navigation), BACK (8, the
// title-screen language toggle) and the synthetic language key (20). Returns
// the button that joined so menus keep treating it as ACCEPT (on Switch-layout
// pads the physical A is button 1), or -1.
function joinPressed(p){
  for(let b=0;b<p.buttons.length;b++){
    if(b===8||(b>=12&&b<=15)||b===20)continue;
    if(pressed(p,b))return b;
  }
  return -1;
}
// single-action screens (level-up confirm) go further: ANY button confirms,
// except the d-pad (12-15, that's navigation) and START (9, pause muscle
// memory / Esc on the keyboard) — a scrambled pad can report the physical A
// anywhere at all, even where HOME usually lives
function confirmPressed(p){
  for(let b=0;b<p.buttons.length;b++){
    if((b>=12&&b<=15)||b===9)continue;
    if(pressed(p,b))return true;
  }
  return false;
}
function navX(p){
  const prev=padPrev(p.index);
  let x=0;
  if(p.buttons[14]&&p.buttons[14].pressed)x=-1;
  else if(p.buttons[15]&&p.buttons[15].pressed)x=1;
  else if(p.axes[0]<-0.5)x=-1;
  else if(p.axes[0]>0.5)x=1;
  return (x!==0&&x!==prev.ax)?x:0;
}
function navY(p){
  const prev=padPrev(p.index);
  let y=0;
  if(p.buttons[12]&&p.buttons[12].pressed)y=-1;
  else if(p.buttons[13]&&p.buttons[13].pressed)y=1;
  else if(p.axes[1]<-0.5)y=-1;
  else if(p.axes[1]>0.5)y=1;
  return (y!==0&&y!==prev.ay)?y:0;
}
function storePadStates(pads){
  for(const p of pads){
    const st=padPrev(p.index);
    st.buttons=p.buttons.map(b=>b.pressed);
    let x=0,y=0;
    if(p.buttons[14]&&p.buttons[14].pressed)x=-1;
    else if(p.buttons[15]&&p.buttons[15].pressed)x=1;
    else if(p.axes[0]<-0.5)x=-1;
    else if(p.axes[0]>0.5)x=1;
    if(p.buttons[12]&&p.buttons[12].pressed)y=-1;
    else if(p.buttons[13]&&p.buttons[13].pressed)y=1;
    else if(p.axes[1]<-0.5)y=-1;
    else if(p.axes[1]>0.5)y=1;
    st.ax=x;st.ay=y;
  }
}
function stick(p){
  let x=p.axes[0]||0,y=p.axes[1]||0;
  if(p.buttons[14]&&p.buttons[14].pressed)x=-1;
  if(p.buttons[15]&&p.buttons[15].pressed)x=1;
  if(p.buttons[12]&&p.buttons[12].pressed)y=-1;
  if(p.buttons[13]&&p.buttons[13].pressed)y=1;
  const m=Math.hypot(x,y);
  if(m<0.25)return {x:0,y:0};
  const s=Math.min(1,(m-0.25)/0.7)/m;
  return {x:x*s,y:y*s};
}

// ---------- terrain ----------
const TILE=16,CHUNK=16,CHPX=TILE*CHUNK;
const T_GRASS=0,T_ROCK=1,T_MUD=2,T_ACID=3,T_LAVA=4;
// world-wide terrain modes. 'pressure' (classic wave 4): noise-carved lava
// rivers across the WHOLE map — iso-bands of a value noise, so they wind
// like real rivers, never move, and are there wherever the party walks —
// with crossing gaps cut by a second, finer noise.
function setTerrain(mode){
  if(G.terrain===mode)return;
  G.terrain=mode;
  tileCache.clear();chunkCanvases.clear();
}
function lavaAt(tx,ty){
  const band=Math.abs(vnoise(tx*0.075,ty*0.075,44)-0.5);
  if(band>0.040)return false;
  if(vnoise(tx*0.45,ty*0.45,55)>0.78)return false; // a gap to step across
  return true;
}
// Flat green world by owner call (2026-08-26): no generated rock/mud/acid —
// the arena is the camera and the choreography is the mobs. T_ROCK still
// exists for boss-arena pillar OVERRIDES (LOS mechanics need them).
function tileType(tx,ty){
  if(G.terrain==='pressure'&&lavaAt(tx,ty))return T_LAVA;
  return T_GRASS;
}
const tileCache=new Map();
function tileAt(tx,ty){
  const k=tx+','+ty;
  const ov=G.tileOverride.get(k);
  if(ov!==undefined)return ov;
  let t=tileCache.get(k);
  if(t===undefined){t=tileType(tx,ty);tileCache.set(k,t);if(tileCache.size>60000)tileCache.clear();}
  return t;
}
function solidAt(x,y){return tileAt(Math.floor(x/TILE),Math.floor(y/TILE))===T_ROCK;}
function hazardAt(x,y){
  const tx=Math.floor(x/TILE),ty=Math.floor(y/TILE);
  if(G.creep&&G.creep.has(tx+','+ty))return 'mud';
  const t=tileAt(tx,ty);
  return t===T_MUD?'mud':(t===T_ACID?'acid':(t===T_LAVA?'lava':null));
}
const chunkCanvases=new Map();
// ground palettes: the surface meadow, and the volcano interior the party
// descends into after wave 1 (basalt dither, ember flecks, glowing cracks)
const BIOME_PAL={
  surface:{a:'#233a1e',b:'#27401f',c:'#2b4622',fleck:'#3a5628',tuft:'#4a6a34',clear:'#1c2618'},
  volcano:{a:'#1d1a1f',b:'#232026',c:'#2a2529',fleck:'#5a2a1e',tuft:'#ff5a2a',clear:'#141216'}
};
function setBiome(b){
  if(G.biome===b)return;
  G.biome=b;chunkCanvases.clear();
}
function chunkCanvas(cx,cy){
  const k=cx+','+cy;
  let c=chunkCanvases.get(k);
  if(c)return c;
  c=document.createElement('canvas');c.width=CHPX;c.height=CHPX;
  const g=c.getContext('2d');
  for(let ty=0;ty<CHUNK;ty++)for(let tx=0;tx<CHUNK;tx++){
    const wx=cx*CHUNK+tx,wy=cy*CHUNK+ty;
    const t=tileAt(wx,wy);
    const px=tx*TILE,py=ty*TILE;
    const h=h2(wx,wy,7);
    if(t===T_LAVA){
      // a molten river tile: red body, gold veins, a dark crust where it
      // meets ground so the edge reads
      g.fillStyle='#c62a2a';g.fillRect(px,py,TILE,TILE);
      g.fillStyle='#ff3c3c';g.fillRect(px+1,py+1,TILE-2,TILE-2);
      g.fillStyle='#ffd23e';
      if(h<0.5){g.fillRect(px+3,py+4,5,2);g.fillRect(px+9,py+10,4,2);}
      else{g.fillRect(px+8,py+3,4,2);g.fillRect(px+2,py+9,6,2);}
      if(h2(wx,wy,16)<0.3){g.fillStyle='#fff2c0';g.fillRect(px+5+((h*23)|0)%6,py+6+((h*41)|0)%6,1,1);}
      g.fillStyle='#3a0a0a';
      if(tileAt(wx,wy-1)!==T_LAVA)g.fillRect(px,py,TILE,2);
      if(tileAt(wx,wy+1)!==T_LAVA)g.fillRect(px,py+TILE-2,TILE,2);
      if(tileAt(wx-1,wy)!==T_LAVA)g.fillRect(px,py,2,TILE);
      if(tileAt(wx+1,wy)!==T_LAVA)g.fillRect(px+TILE-2,py,2,TILE);
      continue;
    }
    if(t===T_GRASS||t===T_ROCK){
      const PAL=BIOME_PAL[G.biome]||BIOME_PAL.surface;
      g.fillStyle=h<0.33?PAL.a:(h<0.66?PAL.b:PAL.c);
      g.fillRect(px,py,TILE,TILE);
      if(h2(wx,wy,8)<0.18){g.fillStyle=PAL.fleck;g.fillRect(px+((h*13)|0)%12+2,py+((h*29)|0)%12+2,2,1);}
      if(h2(wx,wy,9)<0.05){g.fillStyle=PAL.tuft;g.fillRect(px+7,py+8,1,2);g.fillRect(px+6,py+7,3,1);}
      // (flowers/mushrooms removed: ground decoration read as pickups/fx noise)
    }
    if(t===T_ROCK){
      g.fillStyle='#3a352b';g.fillRect(px+1,py+2,14,13);
      g.fillStyle='#5f584a';g.fillRect(px+2,py+1,12,12);
      g.fillStyle='#776f5e';g.fillRect(px+3,py+2,10,4);
      g.fillStyle='#2b2720';g.fillRect(px+3,py+12,10,2);
      if(h<0.5){g.fillStyle='#8a8272';g.fillRect(px+4,py+3,3,2);}
      if(h>0.62){g.fillStyle='#4a6a32';g.fillRect(px+3,py+2,4,1);g.fillRect(px+9,py+3,3,1);}
    }else if(t===T_MUD){
      g.fillStyle='#453626';g.fillRect(px,py,TILE,TILE);
      g.fillStyle='#52412c';g.fillRect(px+1,py+1,TILE-2,TILE-2);
      if(h<0.4){g.fillStyle='#382c1e';g.fillRect(px+3,py+4,4,3);}
      if(h>0.6){g.fillStyle='#382c1e';g.fillRect(px+9,py+9,4,3);}
    }else if(t===T_ACID){
      g.fillStyle='#241539';g.fillRect(px,py,TILE,TILE);
      g.fillStyle='#332052';g.fillRect(px+1,py+1,TILE-2,TILE-2);
      g.fillStyle='#8a5cff';
      if(h<0.5){g.fillRect(px+4,py+5,2,2);g.fillRect(px+10,py+9,2,2);}
      else {g.fillRect(px+8,py+3,2,2);g.fillRect(px+3,py+10,2,2);}
      if(h2(wx,wy,15)<0.25){g.fillStyle='#c9a4ff';g.fillRect(px+6+((h*19)|0)%6,py+6+((h*37)|0)%6,1,1);}
    }
  }
  chunkCanvases.set(k,c);
  if(chunkCanvases.size>140){
    const first=chunkCanvases.keys().next().value;
    if(first!==k)chunkCanvases.delete(first);
  }
  return c;
}
function moveCollide(o,dx,dy){
  const r=o.r;
  let nx=o.x+dx;
  if(dx!==0){
    const edge=nx+Math.sign(dx)*r;
    const tx=Math.floor(edge/TILE);
    const ty0=Math.floor((o.y-r*0.7)/TILE),ty1=Math.floor((o.y+r*0.7)/TILE);
    let blocked=false;
    for(let ty=ty0;ty<=ty1;ty++)if(tileAt(tx,ty)===T_ROCK){blocked=true;break;}
    if(blocked)nx=dx>0?tx*TILE-r-0.01:(tx+1)*TILE+r+0.01;
  }
  o.x=nx;
  let ny=o.y+dy;
  if(dy!==0){
    const edge=ny+Math.sign(dy)*r;
    const ty=Math.floor(edge/TILE);
    const tx0=Math.floor((o.x-r*0.7)/TILE),tx1=Math.floor((o.x+r*0.7)/TILE);
    let blocked=false;
    for(let tx=tx0;tx<=tx1;tx++)if(tileAt(tx,ty)===T_ROCK){blocked=true;break;}
    if(blocked)ny=dy>0?ty*TILE-r-0.01:(ty+1)*TILE+r+0.01;
  }
  o.y=ny;
}
// never leave an entity buried inside rock (the leash can shove them in)
function unstick(o){
  if(!solidAt(o.x,o.y))return;
  const bx=Math.floor(o.x/TILE),by=Math.floor(o.y/TILE);
  let bd=1e9,nx=o.x,ny=o.y;
  for(let ty=by-3;ty<=by+3;ty++)for(let tx=bx-3;tx<=bx+3;tx++){
    if(tileAt(tx,ty)===T_ROCK)continue;
    const cx=tx*TILE+TILE/2,cy=ty*TILE+TILE/2,d=dist2(o.x,o.y,cx,cy);
    if(d<bd){bd=d;nx=cx;ny=cy;}
  }
  o.x=nx;o.y=ny;
}
function losClear(x0,y0,x1,y1){
  const dx=x1-x0,dy=y1-y0,d=Math.hypot(dx,dy)||1,st=Math.ceil(d/6);
  for(let i=1;i<st;i++){const t=i/st;if(solidAt(x0+dx*t,y0+dy*t))return false;}
  return true;
}
function umbra(bx,by,q){
  const cs=[[q.x-q.hw,q.y-q.hh],[q.x+q.hw,q.y-q.hh],[q.x+q.hw,q.y+q.hh],[q.x-q.hw,q.y+q.hh]];
  const base=Math.atan2(q.y-by,q.x-bx);let lo=1e9,hi=-1e9,lc=cs[0],hc=cs[0];
  for(const c of cs){
    let d=Math.atan2(c[1]-by,c[0]-bx)-base;d=Math.atan2(Math.sin(d),Math.cos(d));
    if(d<lo){lo=d;lc=c;}
    if(d>hi){hi=d;hc=c;}
  }
  const L=900,a1=base+lo,a2=base+hi;
  return [lc,hc,[hc[0]+Math.cos(a2)*L,hc[1]+Math.sin(a2)*L],[lc[0]+Math.cos(a1)*L,lc[1]+Math.sin(a1)*L]];
}

function xpNeed(L){
  if(L==null)L=G.level;
  // 0.6+0.4n runs slightly ahead of the wave-quota slope (0.65+0.35n): big
  // parties also bank extra gems from crates, elites and boss levels, so the
  // need has to outpace the quota or 4p out-levels solo by wave 10.
  // The 0.35L² term exists because wave income is superlinear (quota ×
  // avg-xp × elite share all climb): against a linear need, levels came
  // FASTER as the run matured and the endgame blurred into constant pings.
  // Quadratic need holds late levels at ~1.3-1.6 farm waves apart, so each
  // spike is anticipated; weapon evolutions repay the ~2 picks this costs.
  const n=Math.max(1,G.players.length);
  if(isCampaign())return Math.floor((8+L*9+0.35*L*L)*(0.6+0.4*n));
  return Math.floor((6+L*4)*(0.6+0.4*n));
}
// CLASSIC banks its level-ups: xp keeps pooling during the fight and the
// drafts fire back-to-back in the wave break. This reports how many drafts
// the pool already affords, and progress toward one more.
function bankedLevels(){
  let lv=G.level,xp=G.xp,k=0,nd=xpNeed(lv);
  while(xp>=nd&&k<30){xp-=nd;k++;lv++;nd=xpNeed(lv);}
  return {banked:k,frac:clamp(xp/nd,0,1)};
}
function hpScale(){
  if(isCampaign())return 1+(effWave()-1)*0.55+(G.level-1)*0.10;
  return 1+G.time*0.012+(G.level-1)*0.06;
}
function dmgScale(){
  // campaign: quadratic, fitted by tools/balance-model.mjs so one chaser hit
  // climbs from ~9.5% of a player's max hp at wave 2 to ~16% by wave 18 —
  // party hp roughly doubles over a run (rallies, charms) and the old linear
  // 1+0.09w let late mobs fall to a smaller relative bite than wave-2 chaff.
  // endless: slope raised 0.0035 → 0.005; golden-boon max-hp growth was
  // outrunning the old curve from ~6 minutes on (balance-model endless probe).
  if(isCampaign()){const w=effWave();return 1+0.076*w+0.0048*w*w;}
  return 1+G.time*0.005;
}

const RUSH_EFF0=3,RUSH_EFF1=20;

// describes the opening draft. From boss 2 on, rushPace's max(1,...) floor is

// as much again. Measured over full headless runs (tools/test-rush.mjs, seeds

const GRID=48,MAXER=24; // MAXER = largest enemy radius, added to query ranges
let grid=new Map();
function gridKey(cx,cy){return cx*100000+cy;}
function rebuildGrid(){
  grid.clear();
  for(const e of G.enemies){
    if(e.dead)continue;
    const k=gridKey(Math.floor(e.x/GRID),Math.floor(e.y/GRID));
    let a=grid.get(k);
    if(!a){a=[];grid.set(k,a);}
    a.push(e);
  }

function queryEnemies(x,y,r,cb){
  const R=r+MAXER;

  const c0y=Math.floor((y-R)/GRID),c1y=Math.floor((y+R)/GRID);
  for(let cy=c0y;cy<=c1y;cy++)for(let cx=c0x;cx<=c1x;cx++){

    if(a)for(const e of a){if(!e.dead)cb(e);}
  }

    if(isCampaign())G.pickups.push({x:e.x,y:e.y,type:'pod',t:0});
  }else if(e.type==='tank'&&Math.random()<0.35)G.pickups.push({x:e.x,y:e.y,type:'heart',t:0});
  // the vacuum is a RARE find — at 0.6% it showed up most waves and
  // stopped feeling like a find at all
  else if(Math.random()<0.001)G.pickups.push({x:e.x,y:e.y,type:'vacuum',t:0});
  else if(Math.random()<0.02)G.pickups.push({x:e.x,y:e.y,type:'heart',t:0});
}
function damageEnemy(e,dmg,owner){
  if(e.dead)return;
  dmg*=(e.vulnMul??1); // ?? not ||: vulnMul 0 means shielded/airborne/burrowed, not "default to 1"
  // Bizarre Mirage: a dazed foe takes +30% from the WHOLE party — the
  // Illusion school's collaboration window
  if(e.stunT>0)dmg*=1.3;
  // the campaign prices the next boss off the party's measured output on this
  // one (overkill excluded, adds excluded — only the health bar that gates
  // the wave). Rush always did this; classic now uses the same reading.
  if(e.boss&&isCampaign())G.bossDmgAcc+=Math.min(dmg,Math.max(0,e.hp));
  // wave patterns price their density off this: the party's measured
  // mob-clearing output, per wave (same philosophy as boss floor-pricing).
  // Saturated frames only (≥8 targets up): with 3 mobs on screen the read
  // measures the spawner's throughput, not the party's capability.
  if(!e.boss&&!e.shed&&isCampaign()&&G.enemies.length>=8)G.mobDmgAcc+=Math.min(dmg,Math.max(0,e.hp));
  e.hp-=dmg;e.flash=0.08;
  if(e.shed){e.hp=e.maxhp;shedOnDamage(e,dmg);}
  if(e.shedChunk)chunkShed(e);
  addDmgText(e,dmg);
  // DEATH TOUCH: a hit thrown from inside a necromancer's ring may simply
  // end a non-boss. The kill stays credited to whoever threw the hit, so
  // CINDER RUSH / LEECHED GIFT / the soul wisp all pay out to THEM — the
  // aura is a gift to the party, not a second weapon for the necromancer.
  // Per-player timer (KNOWLEDGE AURA shortens it); elites only when already
  // below 35% so a full-health elite never just vanishes.
  if(e.hp>0&&!e.boss&&!e.shed&&e.vulnMul!==0&&owner&&owner.pas&&!owner.dead&&G.time>=owner.dtReady){
    const rank=dtRank(owner);
    if(rank&&Math.random()<DT_CHANCE&&(!e.elite||e.hp<e.maxhp*0.35)){
      owner.dtReady=G.time+PASSIVES.dtouch.vals[rank-1]*(1-kaHaste(owner));
      e.hp=0;
      addText(e.x,e.y-16,'DEATH TOUCH','#c04aff');
      addSparkles(e.x,e.y-e.r,'#c04aff',8,70);
      for(let i=0;i<4;i++)G.particles.push({x:e.x+(Math.random()*10-5),y:e.y,
        vx:(Math.random()*2-1)*10,vy:-30-Math.random()*20,t:0.7,col:'#8a5cff',size:2,drag:1.3});
      sfx('inflict');
    }
  }
  if(owner&&owner.dpsLog){owner.dpsAcc+=dmg;owner.dmgTotal+=dmg;}
  sfx('hit');
  // Leeched Gift: the caster and anyone standing close share a sip of the
  // damage — hard cap 8 hp/s so it rewards proximity, not immortality
  if(owner&&owner.pas&&owner.pas.leech&&!owner.dead){
    if(G.time>owner.leechWin){owner.leechWin=G.time+1;owner.leechAcc=0;}
    const heal=Math.min(dmg*PASSIVES.leech.vals[owner.pas.leech-1],8-owner.leechAcc);
    if(heal>0){
      owner.leechAcc+=heal;
      for(const q of G.players){
        if(q.dead)continue;
        if(q===owner||dist2(q.x,q.y,owner.x,owner.y)<90*90)q.hp=Math.min(q.maxhp,q.hp+heal);
      }
      if(Math.random()<0.25)addSparkles(owner.x,owner.y-6,'#8ef0a0',1,26);
    }
  }
  if(e.hp<=0){
    e.dead=true;
    if(owner)owner.kills++;
    if(!e.boss)G.killsWave++;
    // NECROMANCY takes something from every death: the soul leaves the body
    // and drifts back to the necromancer. It is pure decoration on its own,
    // but it is also the only visible sign LEECHED GIFT is paying out, so it
    // fires for the whole school and brightens when the passive is held.
    // one wisp per kill, two while LEECHED GIFT is paying out: this fires on
    // EVERY death, so it is the single hottest emitter in a necro run
    if(owner&&owner.school==='necro'&&G.particles.length<780){
      const n=owner.pas&&owner.pas.leech?2:1;
      for(let i=0;i<n;i++){
        const dx=owner.x-e.x,dy=owner.y-e.y-8,dd=Math.hypot(dx,dy)||1;
        G.particles.push({x:e.x+(Math.random()*10-5),y:e.y+(Math.random()*8-4),
          vx:dx/dd*(50+Math.random()*40),vy:dy/dd*(50+Math.random()*40)-14,
          t:0.7+Math.random()*0.4,drag:0.7,size:1,spark:true,
          col:Math.random()<0.6?'#8ef0a0':'#c9a4ff'});
      }
    }
    // Cinder Rush: a kill hands back the spell you were waiting on — the
    // longest-cooling spell casts instantly. Does nothing on a bossless lull.
    if(owner&&owner.pas&&owner.pas.cr&&G.time>=owner.crReady&&!e.boss){
      owner.crReady=G.time+PASSIVES.cr.vals[owner.pas.cr-1];
      let best=null;
      for(const id in owner.weapons){
        const w=owner.weapons[id];
        if((WEAPONS[id].sp||id==='blaster')&&w.t>0.3&&(!best||w.t>best.t))best=w;
      }
      if(best){
        best.t=0;
        addText(owner.x,owner.y-14,'CINDER RUSH!','#ff7a1a');
        addSparkles(owner.x,owner.y-4,'#ff7a1a',10,70);
        sfx('emberpop');
      }
    }
    // Plague: the infected burst on death and pass the sickness on — the
    // chain reaction is the whole point of the spell
    if(e.plagued){
      const pl=e.plagued;
      addParticles(e.x,e.y,'#b6d94a',12,110);
      addSparkles(e.x,e.y,'#6fe84a',5,60);
      G.fx.push({kind:'boom',col:'#b6d94a',x:e.x,y:e.y,r:pl.r,t:0.3,dur:0.3});
      G.fx.push({kind:'rot',ground:1,x:e.x,y:e.y,r:pl.r*0.5,t:1.8,dur:1.8});
      // the body comes apart: pale shards thrown clear of the burst
      for(let i=0;i<4;i++){
        const a=Math.random()*TAU,s=60+Math.random()*70;
        G.particles.push({x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,
          t:0.6+Math.random()*0.4,col:Math.random()<0.5?'#d8e8b0':'#8a9a6a',
          size:2,drag:1.8});
      }
      G.shake=Math.max(G.shake,2);
      sfx('slag');
      queryEnemies(e.x,e.y,pl.r,o=>{
        if(o===e||o.dead)return;
        damageEnemy(o,pl.dmg,pl.owner);
        if(!o.dead&&!o.plagued&&!o.boss)o.plagued=pl;
      });
    }
    G.kills++;
    addParticles(e.x,e.y,e.boss?(e.barCol||'#d84343'):'#d84343',e.boss?40:8,e.boss?140:70);
    // volcano fauna: a smasher dies mid-cast → its telegraph fizzles; a
    // burster dies ANY way → it pops
    if(e.sm){if(e.sm.tel){e.sm.tel.t=0;e.sm.tel=null;}if(e.sm.st==='cast')G.smCasting=Math.max(0,G.smCasting-1);}
    if(e.type==='burster')bursterPop(e);
    if(e.behemoth){e.behemoth.st='dead';behemothDie(e);}
    dropLoot(e);
    if(e.boss){
      if(G.boss===e)G.boss=null;
      sfx('boom');G.shake=8;flash('BOSS DOWN!');
      // endless bosses have no def and never counted — the schools' ultimate
      // gate needs every mode's boss kills on the same ledger
      if(!isCampaign())G.bossKills++;
      // classic and rush increment bossKills further down (def bosses) — at
      // this line their first kill still reads 0; endless just counted to 1
      if(schoolsOn()&&G.bossKills===(G.mode==='endless'?1:0))
        after(1.4,()=>{flash('ULTIMATE SPELLS UNLOCKED');subFlash('they will appear in your next drafts',3);sfx('levelup');});
      if(isCampaign()&&e.def){
        if(e.def.onDeath)e.def.onDeath(e);
        G.bossKills++;G.bossTimes.push(G.time);
        // dps over time the boss could actually be hurt: shield/burrow/flight
        // windows don't count, so a mechanic-heavy fight doesn't read as a
        // weak party and soften the next boss. Read in both campaign modes —
        // classic bosses 2-4 now floor their hp on it like rush always has.
        G.lastBossDPS=G.bossDmgAcc/Math.max(15,G.bossVulnT);
        if(G.mode==='rush'){
          // only the four raid-tier capstones leave their signature behind —
          // a relic per kill compounded party dps ~1.4x a boss and boss hp
          // had to balloon to keep up
          if(MUS_BOSS_IDS.indexOf(e.def.id)>=0)grantRelic(e.def.id);
          rushPace(G.wave+1);
        }
        for(const o of G.enemies)if(o!==e&&!o.dead){o.dead=true;addParticles(o.x,o.y,'#d84343',6,60);}
        G.ebullets.length=0;G.fx=G.fx.filter(f=>!f.boss);
        G.waveState='clear';G.waveT=0;
      }
    }else sfx('die');
  }
}
// the BURSTER (wave 2): a gold blast with a shove on any death — rehearses
// the knockback Slagmaw's slam carries, before the lava makes it matter
function bursterPop(e){
  const x=e.x,y=e.y;
  explode(x,y,46,0,undefined,14*dmgScale());
  addParticles(x,y,VOLC.burst,22,140);addSparkles(x,y-4,'#fff8d0',10,90);
  // a gold shockwave ring (pct 0: the explode() already dealt the hit) and a
  // second, wider bloom a beat later so the pop reads as a POP
  pushRing(null,x,y,{rmax:90,spd:260,dir:1,gaps:0,gapW:0,pct:0,w:8,dur:90/260,t:90/260,col:VOLC.burst});
  after(0.12,()=>{G.fx.push({kind:'boom',x,y,r:64,t:0.3,dur:0.3});});
  G.shake=Math.max(G.shake,4);
  // the shove reaches well past the blast (72px vs 46): you feel the gold
  // pop from a step away, which is the whole lesson for the boss's slam
  for(const p of G.players){
    if(p.dead||p.shoveT>0)continue;
    const d=Math.hypot(p.x-x,p.y-y);
    if(d<72){
      shovePlayer(p,Math.atan2(p.y-y,p.x-x),Math.round(64*(1-d/120))); // grace via shoveT: no chain-shoves
    }
  }
}
function explode(x,y,radius,dmg,owner,hurtPlayers){
  addParticles(x,y,'#ffb62e',18,120);
  addParticles(x,y,'#ff5a3d',12,90);
  G.fx.push({kind:'boom',x,y,r:radius,t:0.25,dur:0.25});
  G.shake=Math.max(G.shake,3);
  sfx('boom');
  if(dmg>0&&owner!==undefined){
    queryEnemies(x,y,radius,e=>{if(dist2(x,y,e.x,e.y)<radius*radius)damageEnemy(e,dmg,owner);});
  }
  if(hurtPlayers){
    for(const p of G.players){
      if(p.dead||p.invuln>0)continue;
      if(dist2(x,y,p.x,p.y)<radius*radius)hurtPlayer(p,hurtPlayers);
    }
  }
  for(const c of G.crates)if(!c.dead&&dist2(x,y,c.x,c.y)<radius*radius)breakCrate(c);
}
// Every finished run leaves a full stat record: printed to the devtools
// console and kept (last 10) in localStorage under 'ph_runs', so balance
// arguments can be settled with data after the fact.
function recordRun(outcome){
  if(G.runLogged)return;
  G.runLogged=true;
  const sum={
    outcome,mode:G.mode,date:new Date().toISOString(),
    wave:G.wave,time:Math.round(G.time),level:G.level,
    kills:G.kills,deaths:G.deaths,bossKills:G.bossKills,
    bossTimes:G.bossTimes.map(t=>Math.round(t)),
    charms:G.buffTally,
    party:G.players.map(p=>({
      p:p.idx+1,maxhp:Math.round(p.maxhp),dmgMul:+p.dmgMul.toFixed(2),
      speedMul:+p.speedMul.toFixed(2),regen:+p.regen.toFixed(1),magnet:Math.round(p.magnet),
      kills:p.kills,revives:p.revives,
      school:p.school||undefined,
      passives:Object.keys(p.pas).length?Object.keys(p.pas).map(id=>id+':'+p.pas[id]).join(' '):undefined,
      weapons:Object.keys(p.weapons).map(id=>id+':'+p.weapons[id].lv+(p.weapons[id].evo?'*':'')).join(' ')
    }))
  };
  try{
    const runs=JSON.parse(localStorage.getItem('ph_runs')||'[]');
    runs.push(sum);
    while(runs.length>10)runs.shift();
    localStorage.setItem('ph_runs',JSON.stringify(runs));
  }catch(e){}
  try{console.log('PIXEL HORDE run:',JSON.stringify(sum,null,1));}catch(e){}
}
function killPlayer(p){
  if(p.dead)return;
  p.hp=0;p.dead=true;p.reviveP=0;p.mark=null;p.arrow=null;p.brandT=0;p.stillT=0;p.pole=0;
  if(p.prison){p.prison.dead=true;p.prison=null;}
  if(isCampaign())G.deaths++;
  sfx('die');
  addParticles(p.x,p.y,PCOLORS[p.col],20,90);
  flash('P'+(p.idx+1)+' DOWN! STAND ON THEM!');
  if(G.players.every(q=>q.dead)){G.state='gameover';G.overSince=G.time;recordRun('wipe');}
}
function hurtPlayer(p,dmg){
  if(p.dead||p.invuln>0||p.hurtCd>0)return;
  p.hp-=dmg;p.hurtCd=0.5;p.flash=0.15;
  sfx('hurt');
  G.shake=Math.max(G.shake,2);
  if(p.hp<=0)killPlayer(p);
}
// boss adds speak the same percentage language as their masters: base reads as
// % of the party's average max hp, so a grubling stays a threat at boss 20.
// Endless bosses keep the old flat curve — their fights stay short by design.
function addDmg(base){
  if(!isCampaign())return base*dmgScale();
  const n=Math.max(1,G.players.length);
  return (base/100)*(G.players.reduce((s,p)=>s+p.maxhp,0)/n);
}
// one lever for how hard bosses hit, applied at every consumption point
// (mechanics, touch, bullets) so nothing double-scales. Owner call
// 2026-08-05: a slight bump, not a lot.
const BOSS_DMG_MUL=1.1;
// a boss can carry a fury stack (Slagmaw P3: every fused shard is +damage)
function bossFury(){const b=G.boss;return b&&!b.dead&&b.fury?1+b.fury:1;}
// scripted boss mechanics: damage as a fraction of maxhp, ignores the 0.5s hurt throttle
function bossHit(p,pct){
  // pct 0 telegraphs (armSlam/armLeap let the boss resolve the hit itself)
  // must not fire the hurt flash/sfx as a phantom hit
  if(pct<=0||p.dead||p.invuln>0)return;
  p.hp-=p.maxhp*pct*BOSS_DMG_MUL*bossFury();p.flash=0.15;sfx('hurt');
  G.shake=Math.max(G.shake,2);
  if(p.hp<=0)killPlayer(p);
}
function breakCrate(c){
  if(c.dead)return;
  c.dead=true;
  addParticles(c.x,c.y,'#96703c',8,80);
  addSparkles(c.x,c.y,'#ffd23e',5,60);
  sfx('crate');
  const r=Math.random();
  // more players break more crates, and each charm buffs everyone — keep the
  // charms-per-player-minute rate roughly flat across party sizes
  const bp=0.45/(0.7+0.3*Math.max(1,G.players.length));
  if(r<bp){
    const types=['speed','regen','maxhp','damage','magnet'];
    G.pickups.push({x:c.x,y:c.y,type:types[(Math.random()*types.length)|0],t:0});
  }else if(r<bp+0.012)G.pickups.push({x:c.x,y:c.y,type:'vacuum',t:0}); // rare
  else if(r<bp+0.27)G.pickups.push({x:c.x,y:c.y,type:'heart',t:0});
  else for(let i=0;i<4;i++)G.gems.push({x:c.x+(Math.random()*12-6),y:c.y+(Math.random()*12-6),v:2,t:0});
}

// ---------- weapon firing ----------
function fireWeapon(p,id,w,dt){
  // school spells cast through their own data-driven path; Magic Missile
  // joins them in school modes so the passives (crits, burns, mirrors,
  // haste) reach the one spell everyone shares
  if(WEAPONS[id].sp||(schoolsOn()&&id==='blaster'))return fireSpell(p,id,w,dt);
  w.t-=dt;
  const lv=wlv(w),dm=p.dmgMul;
  switch(id){
    case 'blaster':{
      if(w.t>0)break;
      const tgt=nearestEnemy(p.x,p.y,340+(w.evo?80:0));
      if(!tgt)break;
      w.t=0.72*Math.pow(0.9,lv-1);
      const n=1+Math.floor((lv-1)/2);
      const ang=Math.atan2(tgt.y-p.y,tgt.x-p.x);
      for(let i=0;i<n;i++){
        const a=ang+(i-(n-1)/2)*0.12;
        G.bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*230,vy:Math.sin(a)*230,r:w.evo?3:2,dmg:(10+lv*2)*dm,life:1.6,owner:p,col:'#ffe94a',trail:true,trailCol:'#ffe94a',sparkTrail:true});
      }
      sfx('shoot');break;}
    case 'spread':{
      if(w.t>0)break;
      w.t=1.5*Math.pow(0.93,lv-1);
      const n=4+lv;
      const base=Math.atan2(p.faceY,p.faceX);
      for(let i=0;i<n;i++){
        const a=base+(i-(n-1)/2)*((w.evo?1.15:0.7)/(n-1)+0.06);
        const sp=240+Math.random()*40;
        G.bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:2,dmg:(7+lv*1.5)*dm,life:0.38,owner:p,col:'#ff9040'});
      }
      sfx('spread');break;}
    case 'orbit':{
      w.ang=(w.ang||0)+dt*(2.4+lv*0.15);
      const g=orbitGeom(w),n=g.n,rad=g.rad;
      for(let i=0;i<n;i++){
        const a=w.ang+i*TAU/n;
        const ox=p.x+Math.cos(a)*rad,oy=p.y+Math.sin(a)*rad;
        if(Math.random()<dt*4)addSparkles(ox,oy,'#7fd8ff',1,18);
        queryEnemies(ox,oy,10,e=>{
          if(dist2(ox,oy,e.x,e.y)<(10+e.r)*(10+e.r)){
            const cd=e.orbCd[p.idx]||0;
            if(G.time>cd){e.orbCd[p.idx]=G.time+0.45;damageEnemy(e,(11+lv*3)*dm,p);}
          }
        });
      }
      break;}
    case 'tesla':{
      if(w.t>0)break;
      const first=nearestEnemy(p.x,p.y,w.evo?240:180);
      if(!first)break;
      w.t=1.5*Math.pow(0.9,lv-1);
      let cur=first,px=p.x,py=p.y;
      const hitSet=new Set();
      const chains=2+lv,jr=w.evo?150:110;
      for(let i=0;i<chains&&cur;i++){
        G.fx.push({kind:'zap',x1:px,y1:py,x2:cur.x,y2:cur.y,t:0.12,dur:0.12});
        addSparkles(cur.x,cur.y,'#b06bff',2,45);
        damageEnemy(cur,(13+lv*3)*dm,p);
        hitSet.add(cur);
        px=cur.x;py=cur.y;
        let next=null,bd=jr*jr;
        queryEnemies(px,py,jr,e=>{
          if(hitSet.has(e)||e.vulnMul===0)return;
          const d=dist2(px,py,e.x,e.y);
          if(d<bd){bd=d;next=e;}
        });
        cur=next;
      }
      sfx('zap');break;}
    case 'flame':{
      if(w.t>0)break;
      w.t=0.45*Math.pow(0.94,lv-1);
      const rad=flameRad(w);
      queryEnemies(p.x,p.y,rad,e=>{
        if(dist2(p.x,p.y,e.x,e.y)<(rad+e.r)*(rad+e.r))damageEnemy(e,(6+lv*2)*dm,p);
      });
      for(let i=0;i<3;i++){
        const a=Math.random()*TAU;
        G.particles.push({x:p.x+Math.cos(a)*rad,y:p.y+Math.sin(a)*rad,vx:Math.cos(a)*10,vy:Math.sin(a)*10-15,t:0.3,col:Math.random()<0.5?'#ff5a3d':'#ffb62e',size:1});
      }
      break;}
    case 'rocket':{
      if(w.t>0)break;
      const tgt=nearestEnemy(p.x,p.y,320);
      if(!tgt)break;
      w.t=2.3*Math.pow(0.92,lv-1)*(w.evo?0.55:1);
      const ang=Math.atan2(tgt.y-p.y,tgt.x-p.x);
      G.bullets.push({x:p.x,y:p.y,vx:Math.cos(ang)*150,vy:Math.sin(ang)*150,r:3,dmg:(20+lv*6)*dm,life:2.4,owner:p,col:'#57e86b',rocket:true,aoe:44+lv*4+(w.evo?16:0),trail:true,trailCol:'#8fe89b',sparkTrail:true});
      sfx('rocket');break;}
  }
}

// ---------- school spellcasting ----------
// One data-driven caster for all sixteen school spells (Magic Missile
// included in school modes). castSpell() does the actual throw so a Mirror
// Friend can echo any cast from the clone's spot at reduced power.
const BLASTER_SP={a:10,b:2,c:0.72,r:0.90,h:1,hp:0.5,fx:'seek'};
const spellDef=id=>id==='blaster'?BLASTER_SP:WEAPONS[id].sp;
// Knowledge Aura: the best ring covering you wins — deliberately no stacking
function kaHaste(p){
  let best=0;
  for(const q of G.players){
    if(q.dead||!q.pas.ka)continue;
    if(q===p||dist2(p.x,p.y,q.x,q.y)<KA_RADIUS*KA_RADIUS)
      best=Math.max(best,PASSIVES.ka.vals[Math.min(q.pas.ka,2)-1]);
  }
  return best;
}
function spellHits(id,lv){const d=spellDef(id);return d.h+Math.floor((d.hp||0)*(lv-1));}
// One formula for the two body auras, shared by the hitbox and the ring the
// player sees. v0.1 started at 24/30px, which is inside the player's own
// sprite — the spell did nothing at all until level 4 or so. It now covers
// contact range from the first cast and grows to FLAME SIGIL's reach.
function auraRad(id,lv){return (id==='decay'?36:32)+lv*5;}
// CONSTANT FLAME's fan: reach and spread both climb, so the card goes from a
// short defensive puff to a wide torrent that clears a lane in front of you.
// `len` is the distance the sparks live for, `half` the half-angle of the fan.
function coneGeom(lv){return {len:66+lv*11,half:0.40+lv*0.035};}
// METEOR SHOWER's landing: shake, smoke, embers, and a scorch mark that
// outlives the impact so the ground remembers. Lives here (not at the cast
// site) because the stone detonates wherever its flight actually ends —
// on a body it met en route, not only at the mark it was thrown at.
function metImpact(mx,my,r){
  G.shake=Math.max(G.shake,3.5);
  if(fxRoom())G.fx.push({kind:'scorch',ground:1,x:mx,y:my,r,seed:mx,t:1.6,dur:1.6});
  addParticles(mx,my,'#ff9040',8,110);
  addParticles(mx,my,'#fff6c8',3,70);
  for(let s=0;s<5;s++){
    const a=Math.random()*TAU;
    G.particles.push({x:mx,y:my,vx:Math.cos(a)*(40+Math.random()*70),
      vy:Math.sin(a)*(40+Math.random()*70)-50,t:0.5+Math.random()*0.5,
      col:Math.random()<0.3?'#fff6c8':(Math.random()<0.5?'#ff5a3d':'#ffb62e'),
      size:1+(Math.random()<0.4?1:0),drag:2.4});
  }
  for(let s=0;s<3;s++)G.particles.push({x:mx+(Math.random()*20-10),y:my+(Math.random()*12-6),
    vx:(Math.random()*2-1)*12,vy:-22-Math.random()*24,t:0.8+Math.random()*0.5,
    col:Math.random()<0.5?'#6b5a4a':'#3a3028',size:2,drag:1.3});
}
function spellDmg(p,id,lv,mul){
  const d=spellDef(id);
  let dmg=(d.a+d.b*lv)*p.dmgMul*mul;
  if(p.pas.ba)dmg*=PASSIVES.ba.vals[p.pas.ba-1];
  let crit=false;
  if(p.pas.hh&&Math.random()<PASSIVES.hh.vals[p.pas.hh-1]){dmg*=2;crit=true;}
  return {dmg,crit};
}
function fireSpell(p,id,w,dt){
  w.t-=dt;
  if(w.t>0)return;
  const cap=WEAPONS[id]?WEAPONS[id].max:6;
  const lv=Math.min(w.lv,cap)+(w.evo?2:0);
  const d=spellDef(id);
  let cd=d.c*Math.pow(d.r,lv-1)*(w.evo?0.8:1);
  cd*=1-kaHaste(p);
  if(!castSpell(p,id,lv,p.x,p.y,1,false)){w.t=0.22;return;} // nothing in reach — re-check soon, keep the cooldown
  w.t=cd;
  // the mirror learned the spell, not your mastery: clones echo the
  // UN-evolved version — the rule that keeps clone x evolution bounded
  const mr=p.pas.mirror;
  if(mr){
    const base=Math.min(w.lv,cap);
    const m1=PASSIVES.mirror.vals[Math.min(mr,3)-1];
    after(0.13,()=>{if(!p.dead)castSpell(p,id,base,p.x-13,p.y-5,m1,true);});
    if(mr>=4)after(0.26,()=>{if(!p.dead)castSpell(p,id,base,p.x+13,p.y-5,m1*0.5,true);});
  }
}
// Returns false when a spell that needs a target found none (the cooldown is
// then held). ox/oy is the cast origin — the player, or their mirror.
function castSpell(p,id,lv,ox,oy,mul,echo){
  const d=spellDef(id),col=id==='blaster'?'#ffe94a':WEAPONS[id].col;
  const {dmg,crit}=spellDmg(p,id,lv,mul);
  const crText=(x,y)=>{if(crit&&!echo)addText(x,y-12,'CRIT!','#ffd23e');};
  switch(d.fx){
    case 'seek':{ // magic missile / shadow bullets
      const tgt=nearestEnemy(ox,oy,340);
      if(!tgt)return false;
      const n=spellHits(id,lv);
      const ang=Math.atan2(tgt.y-oy,tgt.x-ox);
      // MAGIC MISSILE stays a dumb straight fan on purpose — it is the shared
      // baseline every school starts from, and the school starters only feel
      // like an upgrade because this one does not steer. SHADOW BULLETS get a
      // slow, heavy drift toward their mark: grave-cold, not eager.
      const dark=id==='shadowb';
      for(let i=0;i<n;i++){
        const a=ang+(i-(n-1)/2)*(dark?0.24:0.13);
        G.bullets.push({x:ox,y:oy,vx:Math.cos(a)*(dark?185:230),vy:Math.sin(a)*(dark?185:230),
          r:crit?3:(dark?3:2),dmg,life:dark?2.2:1.6,owner:p,col,trail:true,trailCol:col,
          sparkTrail:true,home:dark?3.0:0,homeR:dark?300:0,tgt:null});
      }
      if(dark){
        addSparkles(ox,oy,col,5,50);
        for(let i=0;i<4;i++)G.particles.push({x:ox+(Math.random()*10-5),y:oy+(Math.random()*8-4),
          vx:(Math.random()*2-1)*14,vy:-14-Math.random()*18,t:0.5+Math.random()*0.3,
          col:Math.random()<0.5?'#8a5cff':'#3a2456',size:2,drag:1.6});
      }
      sfx(id==='blaster'?'shoot':'shadowbolt');
      crText(ox,oy);
      break;}
    case 'star':{ // arcane missile: a volley of seeking stars
      // v0.1 shipped this as a literal recolour of MAGIC MISSILE — same
      // cooldown curve, same bolt count, same straight fan, same code path —
      // while its own card promised "seeking bolts of pure starlight". It is
      // now the thing on the card: the bolts leave the hand on a WIDE arc
      // (some of them backwards) and then bank onto their mark, so the curve
      // is the spectacle. Each one holds its target until that target dies,
      // then re-acquires, so a volley sweeps a crowd instead of dogpiling.
      const tgt=nearestEnemy(ox,oy,340);
      if(!tgt)return false;
      const n=spellHits(id,lv);
      const ang=Math.atan2(tgt.y-oy,tgt.x-ox);
      // the volley blooms open: bolts alternate sides and widen with the index,
      // so the fan leaves the hand almost sideways and the bank back onto the
      // target is the thing you watch. The first bolt is instant — a cast that
      // shows nothing on its own frame reads as input lag.
      const throwStar=i=>{
        if(p.dead)return;
        const off=(i%2?1:-1)*(0.45+0.38*Math.floor(i/2))*(1+Math.random()*0.2);
        const a=ang+clamp(off,-1.9,1.9);
        G.bullets.push({x:ox,y:oy,vx:Math.cos(a)*215,vy:Math.sin(a)*215,
          r:crit?3:2,dmg,life:2.8,owner:p,col,
          home:6.5,homeR:340,tgt:null,ghost:1,starHit:1,
          trail:true,trailCol:col,starTrail:true,star:1,wake:[],
          glow:true,prism:1+((Math.random()*PRISM.length)|0)});
        addStars(ox+Math.cos(a)*8,oy+Math.sin(a)*8,'#ffffff',1,70,true);
      };
      throwStar(0);
      for(let i=1;i<n;i++)after(i*0.05,()=>throwStar(i));
      starRing(ox,oy,14,3,'#ffffff',true);
      sfx('arcbolt');
      crText(ox,oy);
      break;}
    case 'lance':{ // lava ray: a molten line through the rank
      const near=nearestEnemy(ox,oy,360);
      if(!near)return false;
      // aim is the whole card: a thin lance fired at the NEAREST foe whiffed
      // the pack behind it and read as random. Score the nearest handful of
      // candidates by how many foes their line spears (boss counts triple —
      // players can't aim) and shoot the fullest column. The ray's length
      // and width below are unchanged; only where it points.
      const cands=[];
      for(const e of G.enemies){
        if(e.dead||e.vulnMul===0)continue;
        const d=dist2(ox,oy,e.x,e.y);
        if(d<360*360)cands.push({e,d});
      }
      cands.sort((u,v)=>u.d-v.d);
      const lenS=180+spellHits(id,lv)*42,WS=4+lv*1.1;
      let tgt=near,bestScore=-1;
      for(const c of cands.slice(0,8)){
        const ca=Math.atan2(c.e.y-oy,c.e.x-ox),cx=Math.cos(ca),cy=Math.sin(ca);
        let score=0;
        for(const o of cands){
          const t=(o.e.x-ox)*cx+(o.e.y-oy)*cy;
          if(t<0||t>lenS)continue;
          const px=ox+cx*t,py=oy+cy*t,w=WS+o.e.r;
          if(dist2(o.e.x,o.e.y,px,py)<w*w)score+=o.e.boss?3:1;
        }
        if(score>bestScore){bestScore=score;tgt=c.e;}
      }
      const a=Math.atan2(tgt.y-oy,tgt.x-ox);
      // the card is a LANCE: its answer to a crowd is REACH, not girth. It
      // should spear a whole column front to back, not mow a swathe — so the
      // extra targets come from the line running further, and the beam itself
      // stays a thin molten thread.
      const len=180+spellHits(id,lv)*42;
      const ex=ox+Math.cos(a)*len,ey=oy+Math.sin(a)*len;
      // Narrow on purpose, and narrowest at rank 1. Widening this to a flat 22
      // did fix the card's numbers, but it bought them the wrong way — a fat
      // beam reads as a flamethrower and stops being a lance. Reach is where
      // the targets come from; the width is what GROWS, so the card starts as
      // a hairline that spears one file and ends as a bar that takes a rank
      // with it. lv1 5px -> lv6 11px -> 13px evolved.
      const W=4+lv*1.1;
      // the art is driven off the real hitbox so the beam can never look wider
      // than it hits — the old draw bloomed to 26px over a 16px box
      G.fx.push({kind:'lance',w:W,x1:ox,y1:oy,x2:ex,y2:ey,col:'#ff5a3d',col2:'#ffb62e',t:0.3,dur:0.3});
      queryEnemies((ox+ex)/2,(oy+ey)/2,len/2+40,e=>{
        const dx=ex-ox,dy=ey-oy,L2=dx*dx+dy*dy||1;
        let t=((e.x-ox)*dx+(e.y-oy)*dy)/L2;t=clamp(t,0,1);
        const px=ox+dx*t,py=oy+dy*t;
        if(dist2(e.x,e.y,px,py)<(W+e.r)*(W+e.r)){
          damageEnemy(e,dmg,p);
          addParticles(e.x,e.y,Math.random()<0.5?'#ff5a3d':'#ffb62e',5,80);
          addSparkles(e.x,e.y-4,'#fff6c8',2,50);
        }
      });
      // molten spatter along the whole beam, hottest at the muzzle, with the
      // embers dragging so the ray leaves a hanging wall of heat behind it
      for(let i=0;i<10;i++){
        const t=i/10,hx=ox+(ex-ox)*t,hy=oy+(ey-oy)*t;
        G.particles.push({x:hx+(Math.random()*10-5),y:hy+(Math.random()*10-5),
          vx:(Math.random()*2-1)*40,vy:-24-Math.random()*50,t:0.4+Math.random()*0.5,
          col:Math.random()<0.4?'#fff6c8':(Math.random()<0.5?'#ff5a3d':'#ffb62e'),
          size:1+(Math.random()<0.3?1:0),drag:1.9});
      }
      // smoke rising off the scar
      for(let i=0;i<3;i++){
        const t=Math.random(),hx=ox+(ex-ox)*t,hy=oy+(ey-oy)*t;
        G.particles.push({x:hx,y:hy,vx:(Math.random()*2-1)*10,vy:-18-Math.random()*20,
          t:0.7+Math.random()*0.5,col:'#4a3a30',size:2,drag:1.2});
      }
      addParticles(ox+Math.cos(a)*14,oy+Math.sin(a)*14,'#fff6c8',7,90);
      G.shake=Math.max(G.shake,3);
      sfx('lavaray');crText(tgt.x,tgt.y);
      break;}
    case 'meteor':{ // meteor shower: stones hurled by the caster
      const tgt=nearestEnemy(ox,oy,320);
      if(!tgt)return false;
      const n=spellHits(id,lv);
      sfx('cinder');
      // launched FROM the wizard, not called from the sky: the old version
      // dropped ground-ring markers drawn with the same sprite and telegraph
      // as boss meteors, and players dodged their own spell. A stone that
      // visibly flies out of the caster can't be mistaken for incoming fire.
      for(let i=0;i<n;i++)after(i*0.12,()=>{
        if(p.dead)return;
        const tg=nearestEnemy(tgt.x,tgt.y,130)||tgt;
        const mx=tg.x+(Math.random()*2-1)*46,my=tg.y+(Math.random()*2-1)*46;
        // life is EXACTLY the flight time to the mark — any slack and a
        // close-range stone sails past its target before bursting
        const dx=mx-p.x,dy=my-p.y,dd=Math.hypot(dx,dy)||1,spd=340;
        G.bullets.push({x:p.x,y:p.y,vx:dx/dd*spd,vy:dy/dd*spd,r:4,dmg,
          life:dd/spd,tx:mx,ty:my,owner:p,col,rocket:true,aoe:26+lv*2.5,
          ghost:1,met:1,trail:true,trailCol:i%2?'#ffb62e':'#ff5a3d',sparkTrail:true});
      });
      crText(tgt.x,tgt.y);
      break;}
    case 'cone':{ // constant flame: a fan of burning sparks, EMBER FAN's shape
      // The translucent wedge this used to draw was the only smooth-shaded
      // hitbox in a game made of pixels — it read as another game's effect.
      // It is now the vanilla fan: real sparks with real hitboxes, thrown a
      // little faster than EMBER FAN throws them, and AIMED — the fan turns
      // onto the nearest foe instead of following the stick, so the card can
      // be held while you kite.
      const g=coneGeom(lv);
      const tgt=nearestEnemy(ox,oy,g.len+40);
      if(!tgt)return false;
      const a=Math.atan2(tgt.y-oy,tgt.x-ox);
      const n=spellHits(id,lv);
      // reach is coneGeom's len: pick the life from the speed so the sparks
      // burn out exactly where the old wedge ended
      const spd=250;
      for(let i=0;i<n;i++){
        const sa=a+(i-(n-1)/2)*(2*g.half/Math.max(1,n-1));
        const s=spd+Math.random()*40;
        G.bullets.push({x:ox,y:oy,vx:Math.cos(sa)*s,vy:Math.sin(sa)*s,
          r:crit?3:2,dmg,life:g.len/spd,owner:p,col,
          trail:true,trailCol:Math.random()<0.4?'#ff5a3d':col});
      }
      // muzzle embers, hottest at the mouth
      for(let i=0;i<3;i++){
        const sa=a+(Math.random()*2-1)*g.half,s=90+Math.random()*90;
        G.particles.push({x:ox+Math.cos(a)*6,y:oy+Math.sin(a)*6,
          vx:Math.cos(sa)*s,vy:Math.sin(sa)*s-16,t:0.24+Math.random()*0.22,
          col:Math.random()<0.3?'#fff6c8':(Math.random()<0.5?'#ff5a3d':'#ffb62e'),
          size:1+(Math.random()<0.25?1:0),drag:2.6});
      }
      sfx('spread');
      crText(ox,oy);
      break;}
    case 'aura':{ // decaying presence: the caster IS the weapon
      const rad=auraRad(id,lv);
      queryEnemies(ox,oy,rad,e=>{
        if(dist2(ox,oy,e.x,e.y)<(rad+e.r)*(rad+e.r))damageEnemy(e,dmg,p);
      });
      // a field you stand inside has to look occupied, not outlined: fill the
      // whole disc, not just the rim, and pay for a couple of bright motes.
      // These auras cast several times a second, so the per-cast count has to
      // stay LOW — the density comes from the rate, and three per cast was
      // already a wall of pixels with two players standing in each other.
      for(let i=0;i<2;i++){
        const a=Math.random()*TAU;
        if(id==='decay'){ // rot wisps drift UP out of the ground
          const rr=rad*Math.sqrt(Math.random());
          G.particles.push({x:ox+Math.cos(a)*rr,y:oy+Math.sin(a)*rr,
            vx:(Math.random()*2-1)*8,vy:-16-Math.random()*16,
            t:0.6+Math.random()*0.5,
            col:Math.random()<0.5?'#9fe84a':(Math.random()<0.5?'#5a7a3a':'#c04aff'),
            size:1+(Math.random()<0.35?1:0),drag:1.2});
        }else{ // embers spit outward and rise, hottest at the rim
          const rr=rad*(0.5+Math.random()*0.5);
          G.particles.push({x:ox+Math.cos(a)*rr,y:oy+Math.sin(a)*rr,
            vx:Math.cos(a)*22,vy:Math.sin(a)*22-34,t:0.4+Math.random()*0.35,
            col:Math.random()<0.25?'#fff6c8':(Math.random()<0.5?'#ff5a3d':'#ffb62e'),
            size:1+(Math.random()<0.25?1:0),drag:2.2});
        }
      }
      // one grave-violet soul / white-hot cinder per few casts, to give the
      // field a highlight the eye can land on
      if(Math.random()<0.35){
        const a=Math.random()*TAU;
        if(id==='decay')addSparkles(ox+Math.cos(a)*rad*0.7,oy+Math.sin(a)*rad*0.7,'#c9a4ff',1,26);
        else addSparkles(ox+Math.cos(a)*rad*0.8,oy+Math.sin(a)*rad*0.8,'#fff6c8',1,30);
      }
      // rot leaves a stain: a slow violet-green decal under DECAYING PRESENCE
      if(id==='decay'&&Math.random()<0.05)
        G.fx.push({kind:'rot',ground:1,x:ox+(Math.random()*rad-rad/2),y:oy+(Math.random()*rad-rad/2),
          r:8+Math.random()*10,t:2.2,dur:2.2});
      break;}
    case 'blast':{ // energy blast: starbursts blooming across the crowd
      const tgt=nearestEnemy(ox,oy,300);
      if(!tgt)return false;
      // v0.1 declared h/hp on this card and then never read them, so the spell
      // stayed a single small pop at every level. It is now what the data always
      // said it was: `h + hp*(lv-1)` blooms walking the knot, and with that it
      // is Illusion's answer to FLAME SIGIL.
      const R=28+lv*4,n=spellHits(id,lv);
      sfx('ablast');
      // the blooms are joined into a constellation once the last one lands, so
      // a big cast leaves a shape on the screen instead of n unrelated pops
      const marks=[];
      for(let i=0;i<n;i++)after(i*0.08,()=>{
        if(p.dead)return;
        // each bloom re-picks: the burst chases the crowd instead of stacking
        const t2=i?(nearestEnemy(tgt.x,tgt.y,150)||tgt):tgt;
        const bx=t2.x+(i?(Math.random()*2-1)*26:0),by=t2.y+(i?(Math.random()*2-1)*26:0);
        if(fxRoom())G.fx.push({kind:'sbloom',x:bx,y:by,r:R,pts:10,seed:i*1.3,t:0.4,dur:0.4});
        starRing(bx,by,R*0.5,4,'#ffffff',true);
        addStars(bx,by,'#ffffff',2,110,true);
        marks.push(bx,by);
        queryEnemies(bx,by,R,e=>{
          if(dist2(bx,by,e.x,e.y)<(R+e.r)*(R+e.r)){damageEnemy(e,dmg,p);starHit(e.x,e.y,1);}
        });
        if(marks.length>=4&&i===n-1&&fxRoom())
          G.fx.push({kind:'constel',line:marks.slice(),x:bx,y:by,t:0.45,dur:0.45});
      });
      crText(tgt.x,tgt.y);
      break;}
    case 'chain':{ // shocking current: prismatic lightning, foe to foe
      const first=nearestEnemy(ox,oy,220);
      if(!first)return false;
      let cur=first,px=ox,py=oy;
      const hitSet=new Set(),jumps=spellHits(id,lv),jr=160;
      const link=[ox,oy];
      for(let i=0;i<jumps&&cur;i++){
        // white-hot core under a coloured arc, each link a step further round
        // the ramp — the current visibly refracts as it travels
        G.fx.push({kind:'zap',col:prismCol(i+2),glow:1,x1:px,y1:py,x2:cur.x,y2:cur.y,t:0.22,dur:0.22});
        addStars(cur.x,cur.y,'#ffffff',3,55,true);
        starHit(cur.x,cur.y,2);
        damageEnemy(cur,dmg,p);
        link.push(cur.x,cur.y);
        hitSet.add(cur);px=cur.x;py=cur.y;
        let next=null,bd=jr*jr;
        queryEnemies(px,py,jr,e=>{
          if(hitSet.has(e)||e.dead||e.vulnMul===0)return;
          const dd2=dist2(px,py,e.x,e.y);
          if(dd2<bd){bd=dd2;next=e;}
        });
        cur=next;
      }
      // the path the current took, held on screen for a beat as a constellation
      if(link.length>=6&&fxRoom())G.fx.push({kind:'constel',line:link,x:px,y:py,t:0.45,dur:0.45});
      sfx('zap');crText(first.x,first.y);
      break;}
    case 'mirage':{ // bizarre mirage: a dream that dazes AND devours
      // v0.1 was a pure control card: it set stunT, opened the +30% window
      // (damageEnemy: `if(e.stunT>0)dmg*=1.3`) and dealt almost nothing itself.
      // It benched at 22/59/8 dps — a whole card in a four-card school
      // contributing a rounding error, which is what "the school feels weak"
      // meant. The daze and the window are still the identity; the dream now
      // LINGERS on the ground, ticking for as long as the daze it bought and
      // re-dazing anything that wanders into it.
      const tgt=nearestEnemy(ox,oy,300);
      if(!tgt)return false;
      const R=44+lv*4,stunDur=lv>6?2.0:1.5;
      // the dream opens as a wide prismatic dome and then stays on the ground
      // for as long as the daze lasts, so you can see the window you bought
      if(fxRoom()){
        G.fx.push({kind:'sbloom',x:tgt.x,y:tgt.y,r:R*1.25,pts:16,t:0.55,dur:0.55});
        G.fx.push({kind:'sbloom',x:tgt.x,y:tgt.y,r:R*0.6,pts:10,seed:2.1,t:0.4,dur:0.4});
        G.fx.push({kind:'sring',x:tgt.x,y:tgt.y,r:R,ground:1,seed:1.7,t:stunDur,dur:stunDur});
      }
      G.fx.push({kind:'mzone',ground:1,own:p,x:tgt.x,y:tgt.y,r:R,dps:dmg,
        stun:stunDur,tick:0,t:stunDur,dur:stunDur,col});
      starRing(tgt.x,tgt.y,R*0.6,14,'#ffffff',true);
      addStars(tgt.x,tgt.y,'#ffffff',10,130,true);
      pflash(0.32);
      let n=0;
      queryEnemies(tgt.x,tgt.y,R,e=>{
        if(dist2(tgt.x,tgt.y,e.x,e.y)>=(R+e.r)*(R+e.r))return;
        damageEnemy(e,dmg,p);

        e.stunT=Math.max(e.stunT||0,e.boss?0.4:stunDur);n++;
        starHit(e.x,e.y-e.r,3);
      });

    case 'phantom':{ // phantasmal assassin: a stolen silhouette hunting its own kind

    case 'pain':{ // inflict pain: one lance of agony for the biggest thing alive
      const tgt=relicTarget(p,340);

      // Necromancy does not fire beams — it runs a nerve between two bodies.

      }

      for(let i=0;i<4;i++)G.particles.push({x:tgt.x+(Math.random()*14-7),y:tgt.y,
        vx:(Math.random()*2-1)*10,vy:-30-Math.random()*20,t:0.7,col:'#8a5cff',size:2,drag:1.3});

      G.bullets.push({x:ox,y:oy,vx:Math.cos(a)*210,vy:Math.sin(a)*210,r:3,dmg,

    case 'trail':{ // infernal evocation: rivers of lava behind your steps
      // a boss-kill ultimate that laid a 30px thread for 4s read as a minor

      G.fx.push({kind:'strail',own:p,gap:0,t:5,dur:5,dps:dmg,col:'#ff3c1e'});

          t:0.7+Math.random()*0.5,col:Math.random()<0.5?'#ff3c1e':'#ffb62e',size:2,drag:1.6});

    case 'soulvoid':{ // vacuuming souls: the maw pulls, eats, and feeds the party
      const tgt=relicTarget(p,300);
      if(!tgt)return false;
      G.fx.push({kind:'soulvoid',ground:1,own:p,x:tgt.x,y:tgt.y,r:86,dps:dmg,
        pull:120,healed:0,tick:0,t:3.5,dur:3.5,col:'#8ef0a0',burst:dmg*1.1});

      addSparkles(tgt.x,tgt.y,'#c9a4ff',14,90);
